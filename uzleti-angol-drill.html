<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<style>html{color-scheme:light dark}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Üzleti angol drill</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F5F9; --surface-3:#ECEEF5;
  --ink:#141A22; --ink-2:#4A5462; --ink-3:#858D9A;
  --line:#E6E8EF; --line-2:#D3D7E0;
  --accent:#2B46C8; --accent-soft:#E7EAFA; --accent-ink:#1E349B; --on-accent:#FFFFFF;
  --ok:#0F7A4C; --ok-soft:#E2F2E9;
  --bad:#BE3A2B; --bad-soft:#FAE8E5;
  --t1:#B0713A; --t2:#2E6E8E; --t3:#6A57A6; --t4:#A34A5E; --t5:#2A7D8C;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --ui:"Karla","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  --shadow:0 1px 2px rgba(20,26,34,.05), 0 10px 28px -20px rgba(20,26,34,.4);
  --shadow-sm:0 1px 2px rgba(20,26,34,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1319; --surface:#171C24; --surface-2:#1C222B; --surface-3:#232A35;
    --ink:#E9EAED; --ink-2:#AEB6C2; --ink-3:#7E8794;
    --line:#262D38; --line-2:#3A424F;
    --accent:#8DA2FF; --accent-soft:#232B45; --accent-ink:#B9C6FF; --on-accent:#0E1220;
    --ok:#5BC08C; --ok-soft:#182A22;
    --bad:#EF8272; --bad-soft:#2C1C1A;
    --t1:#D79A5F; --t2:#6BA8C6; --t3:#A08FDC; --t4:#D98195; --t5:#63B4C2;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1319; --surface:#171C24; --surface-2:#1C222B; --surface-3:#232A35;
  --ink:#E9EAED; --ink-2:#AEB6C2; --ink-3:#7E8794;
  --line:#262D38; --line-2:#3A424F;
  --accent:#8DA2FF; --accent-soft:#232B45; --accent-ink:#B9C6FF; --on-accent:#0E1220;
  --ok:#5BC08C; --ok-soft:#182A22;
  --bad:#EF8272; --bad-soft:#2C1C1A;
  --t1:#D79A5F; --t2:#6BA8C6; --t3:#A08FDC; --t4:#D98195; --t5:#63B4C2;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topband{position:fixed;inset:0 0 auto 0;height:3px;z-index:60;
  background:linear-gradient(90deg,var(--t1),var(--t2) 27%,var(--t3) 50%,var(--t4) 73%,var(--t5))}
.wrap{max-width:none;margin:0;padding:24px 26px 72px;display:grid;grid-template-columns:266px minmax(0,1fr);gap:28px;align-items:start}
@media (min-width:1600px){.wrap{grid-template-columns:300px minmax(0,1fr);gap:36px;padding:26px 36px 72px}}
@media (max-width:900px){
  .wrap{display:flex;flex-direction:column;gap:16px;padding:16px 14px 48px}
  .brand{order:1} .nav{order:2} main{order:3} #topicsPanel{order:4} #setup{order:5}
}

/* ---------- rail ---------- */
.rail{position:sticky;top:22px;display:flex;flex-direction:column;gap:20px}
@media (max-width:900px){.rail{position:static;display:contents}}
.brand{display:grid;grid-template-columns:auto 1fr;gap:0 11px;align-items:center}
.brand .mark{grid-row:span 2;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:19px;color:var(--on-accent);background:var(--accent);
  box-shadow:0 4px 12px -6px var(--accent)}
.brand h1{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.015em;line-height:1.15}
.brand p{margin:6px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);line-height:1.5}
.nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){.nav{flex-direction:row;gap:6px;overflow-x:auto}}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:8px 10px;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.nav button[aria-current="true"] .n{color:var(--accent-ink)}

.panel{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:14px}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;display:block}
.topics{display:flex;flex-direction:column;gap:1px}
.topics label{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.topics label:hover{background:var(--surface)}
.topics input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.topics .dot{width:8px;height:8px;border-radius:50%;flex:none}
.topics .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topics .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface-3)}
.seg button{flex:1;background:none;border:0;padding:6px 4px;font-size:12.5px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.field+.field{margin-top:12px}
.hint{font-size:12px;color:var(--ink-3);margin:7px 0 0}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);padding:9px 15px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);padding:9px 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- quiz ---------- */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.track{flex:1;height:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
.count{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tally{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tally .g{color:var(--ok)} .tally .r{color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--topic,var(--accent));border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px}
.card .meta{margin:-24px -26px 18px;padding:12px 26px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:0 var(--r) 0 0}
@media (max-width:640px){.card .meta{margin:-18px -16px 14px;padding:10px 16px}}
@media (max-width:640px){.card{padding:18px 16px}}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3)}
.tag.topic{color:var(--topic);border-color:color-mix(in srgb,var(--topic) 45%,transparent)}
.tag.kind{background:var(--surface-2)}
.qlead{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.stem{font-family:var(--display);font-size:22px;line-height:1.5;font-weight:400;max-width:70ch}
@media (max-width:640px){.stem{font-size:19px}}
.stem .blank{display:inline-block;min-width:90px;border-bottom:2.5px solid var(--accent);vertical-align:baseline;margin:0 3px}
.stem .fill{font-weight:700;color:var(--ok);border-bottom:2px solid var(--ok)}
.stem .fill.no{color:var(--bad);border-bottom-color:var(--bad)}
.stem .fill.skip{color:var(--accent-ink);border-bottom-color:var(--accent)}
.stem em{font-style:italic;color:var(--ink-2)}

.opts{display:grid;gap:8px;margin-top:22px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:12px 14px;cursor:pointer;font-size:15.5px;line-height:1.35;box-shadow:var(--shadow-sm);transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none;width:15px}
.opt .v{font-family:var(--display);font-weight:600}
.opt.skip{border-color:var(--accent);background:var(--accent-soft)}
.opt.skip .k,.opt.skip .v{color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k,.opt.right .v{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k,.opt.wrong .v{color:var(--bad)}

.answer{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.answer input{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:11px 13px;font-family:var(--display);font-size:17px;font-weight:600}
.answer input::placeholder{font-family:var(--ui);font-weight:400;font-size:15px;color:var(--ink-3)}
.answer input:disabled{opacity:.75}

.ibtn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);border-radius:99px;padding:3px 11px 3px 4px;cursor:pointer}
.ibtn i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px}
.ibtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.ibtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.gapinfo{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:12px}
.hintbox{margin-top:16px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);padding:13px 15px;display:grid;gap:5px}
.hintbox .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.hintbox .hu{font-weight:700;font-size:16.5px;color:var(--accent-ink)}
.hintbox .d{color:var(--ink-2);font-size:14.5px;max-width:68ch}
.entry .hdef{font-size:14.5px;max-width:68ch}
.entry .def{color:var(--ink-3);font-size:13.5px;max-width:68ch}
.vdefhu{font-size:14.5px;max-width:74ch}
.vdef{color:var(--ink-3);font-size:13.5px;max-width:74ch}
.fb{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.verdict.skip{color:var(--accent-ink)}
.verdict .mark{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:currentColor;flex:none}
.verdict .mark span{color:var(--surface);line-height:1}
.entry{display:grid;gap:7px;background:var(--surface-2);border-radius:var(--r);padding:14px 16px}
.entry .hw{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.entry .ipa{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.entry .pos{font-style:italic;color:var(--ink-3);font-size:13px}
.entry .hu{font-size:15.5px;font-weight:700;color:var(--accent-ink)}
.entry .sense{font-size:15px;color:var(--ink);max-width:70ch}
.entry .sense b{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-right:4px}
.entry .line{font-size:14px;color:var(--ink-2);max-width:74ch}
.entry .line .lab{font-family:var(--mono);font-size:11.5px;color:var(--topic);margin-right:5px}
.entry .line.ex{font-family:var(--display);font-style:italic;font-size:14.5px}
.entry .line.ex .lab{font-family:var(--mono);font-style:normal}
.entry .line.ex b{font-style:normal;color:var(--ink)}
.entry .hublock{border-top:1px solid var(--line);padding-top:9px;margin-top:2px;display:grid;gap:4px}
.entry .ex{font-family:var(--display);font-style:italic;color:var(--ink-2);font-size:15px;max-width:68ch}
.entry .ex b{font-style:normal;font-weight:700;color:var(--ink)}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.col{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

/* ---------- results ---------- */
.score{display:flex;align-items:baseline;gap:12px;font-family:var(--display)}
.score .big{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .of{font-size:18px;color:var(--ink-3)}
.misses{display:grid;gap:1px;margin-top:6px}
.miss{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.miss:last-child{border-bottom:0}
.miss b{font-family:var(--display);font-weight:700}
.miss span{color:var(--ink-2);text-align:right}

/* ---------- word list ---------- */
.wlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm)}
.wrow{display:grid;grid-template-columns:minmax(200px,1fr) minmax(200px,1.15fr);gap:18px;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 16px;cursor:pointer}
.wrow:last-child{border-bottom:0}
.wrow:nth-child(even){background:var(--surface-2)}
.wrow:hover{background:var(--accent-soft)}
.wrow .en{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.wrow .en i{width:7px;height:7px;border-radius:50%;background:var(--topic);flex:none;position:relative;top:-2px}
.wrow .hu{color:var(--ink-2);font-size:14.5px}
.wrow .pos{font-style:italic;font-size:12px;color:var(--ink-3);margin-left:4px}
.whead{display:grid;grid-template-columns:minmax(200px,1fr) minmax(200px,1.15fr);gap:18px;padding:8px 16px;
  background:var(--surface-3);border-bottom:1px solid var(--line-2)}
.whead span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.wgroup{padding:11px 16px 7px;background:var(--surface-3);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--topic)}
@media (max-width:560px){
  .wrow,.whead{grid-template-columns:1fr;gap:2px}
  .whead span:last-child{display:none}
}

/* ---------- i-popover ---------- */
.ih{position:relative;display:inline-flex;vertical-align:middle}
.ih>button{width:19px;height:19px;padding:0;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center}
.ih>button:hover{border-color:var(--accent);background:var(--accent-soft)}
.ih .pop{font-style:normal;font-weight:400;color:var(--ink);position:absolute;left:-6px;top:calc(100% + 7px);z-index:30;width:min(360px,78vw);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:none;text-align:left;white-space:normal}
.ih:hover .pop,.ih:focus-within .pop,.ih.open .pop{display:block}
.ih .pop .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.ih .pop .hu{display:block;font-family:var(--ui);font-weight:700;color:var(--accent-ink);font-size:15.5px;line-height:1.35}
.ih .pop .d+.d{margin-top:2px}
.ih .pop .d{display:block;font-family:var(--ui);font-weight:400;color:var(--ink-2);font-size:13.5px;line-height:1.5;margin-top:5px}

/* line-anchored popovers stay inside the card */
.vline,.entry .line{position:relative}
.vline>.ih,.entry .line>.ih{position:static}
.vline>.ih .pop,.entry .line>.ih .pop{left:0;right:auto;top:calc(100% + 6px);width:min(430px,100%)}

/* ---------- vocab ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:10px 13px;font-size:15px}
.vcount{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.list{display:grid;gap:10px}
.vrow{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--topic);border-radius:var(--r);padding:14px 17px;display:grid;gap:6px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,border-color .15s ease}
.vrow:hover{box-shadow:var(--shadow)}
.vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px}
.vhead .hw{font-family:var(--display);font-size:18.5px;font-weight:700;letter-spacing:-.01em}
.vhead .ipa{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.vhead .pos{font-style:italic;font-size:12.5px;color:var(--ink-3)}
.vhead .ih{margin-left:2px}
.vsense{font-size:15px;color:var(--ink);max-width:74ch}
.vsense b{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-right:4px}
.vline{font-size:14px;color:var(--ink-2);max-width:78ch}
.vline .lab{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--topic);margin-right:5px}
.vline.ex{font-family:var(--display);font-style:italic;font-size:14.5px}
.vline.ex .lab{font-family:var(--mono);font-style:normal}
.vline.ex b{font-style:normal;color:var(--ink)}
.vhead .sc{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vhu{font-weight:700;color:var(--accent-ink);font-size:15.5px}
.vex{font-family:var(--display);font-style:italic;color:var(--ink-2);font-size:14.5px;max-width:74ch}
.vex b{font-style:normal;color:var(--ink)}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--ink-3);padding:30px 0;text-align:center;font-size:15px}

/* ---------- notes ---------- */
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ttab{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.ttab i{width:8px;height:8px;border-radius:50%;background:var(--topic);font-style:normal}
.ttab[aria-pressed="true"]{border-color:var(--topic);color:var(--ink);font-weight:700;background:var(--surface-2)}
.toc{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--topic);border-radius:var(--r);padding:14px 17px;margin-bottom:16px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:230px;overflow:auto}
.toc button{background:none;border:0;padding:3px 2px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:13.5px;width:100%}
.toc button:hover{color:var(--accent-ink);text-decoration:underline}
.toc .l2{padding-left:16px;font-size:13px;color:var(--ink-3)}
.toc .l3{padding-left:32px;font-size:12.5px;color:var(--ink-3)}
.notes{display:grid;gap:14px}
.nh{font-family:var(--display);letter-spacing:-.01em;scroll-margin-top:16px;margin-top:10px}
.nh.l1{font-size:24px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--topic)}
.nh.l2{font-size:18.5px;font-weight:600}
.nh.l3{font-size:16px;font-weight:600;color:var(--ink-2)}
.np{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow-sm)}
.np p{margin:0;font-size:15.5px;line-height:1.72;color:var(--ink);max-width:92ch}
.np.call{background:var(--surface-2);border-left:3px solid var(--topic)}
.np .clab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--topic);display:block;margin-bottom:7px}
.nfoot{display:flex;justify-content:flex-end;margin-top:9px}
.nbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;background:none;border:1px solid var(--line-2);color:var(--ink-3);border-radius:99px;padding:3px 11px 3px 4px;cursor:pointer}
.nbtn i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px}
.nbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.nhu{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:12px}
.nhu p{color:var(--ink-2);font-size:15px;line-height:1.7}
.nhu .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}

/* ---------- matching cards ---------- */
.cardsbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.board{display:grid;grid-template-columns:minmax(150px,0.8fr) minmax(0,1.4fr);gap:10px;align-items:start}
@media (max-width:620px){.board{grid-template-columns:1fr}}
.col-cards{display:grid;gap:8px}
.mcard{text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:11px 13px;cursor:pointer;font-size:14.5px;line-height:1.4;color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .12s ease, background .12s ease, transform .12s ease}
.mcard:hover:not(:disabled){transform:translateY(-1px)}
.mcard.term{font-family:var(--display);font-weight:700;font-size:16px}
.mcard:hover:not(:disabled){border-color:var(--accent)}
.mcard.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mcard.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default;opacity:.65}
.mcard.miss{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cardsdone{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}

/* ---------- progress ---------- */
.stats{display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow-sm)}
.tile:nth-child(1){border-top:3px solid var(--t1)} .tile:nth-child(2){border-top:3px solid var(--t2)}
.tile:nth-child(3){border-top:3px solid var(--t5)} .tile:nth-child(4){border-top:3px solid var(--t4)}
.tile .v{font-family:var(--display);font-size:29px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.brows{display:grid;gap:11px}
.brow{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center}
.brow .nm{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
.brow .nm i{width:8px;height:8px;border-radius:50%;background:var(--topic);flex:none}
.brow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .meter{grid-column:1/-1;height:7px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);overflow:hidden}
.brow .meter i{display:block;height:100%;background:var(--topic)}
.brow .pc{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hard{display:flex;flex-wrap:wrap;gap:7px}
.hard button{font-family:var(--display);font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-sm);border-radius:99px;padding:5px 12px;cursor:pointer}
.hard button:hover{border-color:var(--bad);color:var(--bad)}
.hard button i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--bad);margin-left:6px}
h2.sec{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:10px}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);line-height:1.6}
</style>

ɜːr","hu":"cserekereskedelem, barter","hud":"Olyan csere, amelyben árut vagy szolgáltatást pénz nélkül, közvetlenül cserélnek egymásra; illetve maga a cserélés.","def":"a system of exchange in which goods or services are traded directly without using money; to exchange in this way","col":["barter economy","barter goods","barter for food"],"ex":"During hyperinflation, some people returned to barter because the currency had lost value.","exhu":"A hiperinfláció idején néhányan visszatértek a cserekereskedelemhez, mert a pénz elvesztette az értékét.","colhu":["barter gazdaság","cserearuk","élelmiszerre cserél"],"gap":"During hyperinflation, some people returned to ____ because the currency had lost value.","sf":"barter","ans":["barter"]},{"id":3,"topic":1,"term":"barter system","pos":"noun phrase","ipa":"bˈɑːrtɜːr sˈɪstʌm","hu":"cserekereskedelmi rendszer","hud":"Olyan rendszer, amelyben pénz helyett közvetlenül árut vagy szolgáltatást cserélnek más áruért vagy szolgáltatásért.","def":"a system in which goods or services are exchanged directly for other goods or services instead of money","col":["use a barter system","return to a barter system","informal barter system"],"ex":"When normal trade broke down, local communities sometimes relied on a barter system.","exhu":"Amikor a szokásos kereskedelem összeomlott, a helyi közösségek néha cserekereskedelemre támaszkodtak.","colhu":["cserekereskedelmi rendszert használ","visszatér a cserekereskedelemhez","informális cserekereskedelmi rendszer"],"gap":"When normal trade broke down, local communities sometimes relied on a ____.","sf":"barter system","ans":["barter system"]},{"id":4,"topic":1,"term":"basket of goods and services","pos":"noun phrase","ipa":"bˈæskʌt ˈʌv ɡˈʊdz ʌnd sˈɜːrvʌsʌz","hu":"fogyasztói kosár (áruk és szolgáltatások kosara)","hud":"Rögzített termék- és szolgáltatáslista, amellyel a megélhetési költségek időbeli változását mérik.","def":"a fixed selection of products and services used to measure changes in the cost of living over time","col":["cost of a basket of goods and services","typical basket of goods and services","price of the basket"],"ex":"The Consumer Price Index tracks how the cost of a basket of goods and services changes over time.","exhu":"A fogyasztói árindex azt követi, hogyan változik idővel egy áru- és szolgáltatáskosár költsége.","colhu":["a fogyasztói kosár költsége","tipikus fogyasztói kosár","a kosár ára"],"gap":"The Consumer Price Index tracks how the cost of a ____ changes over time.","sf":"basket of goods and services","ans":["basket of goods and services"]},{"id":5,"topic":1,"term":"central bank","pos":"noun phrase","ipa":"sˈentrʌl bˈæŋk","hu":"központi bank, jegybank","hud":"Az az intézmény, amely az ország monetáris politikáját irányítja, és befolyásolja a kamatokat és a pénzmennyiséget.","def":"the institution responsible for managing a country's monetary policy and influencing interest rates and the money supply","col":["central bank policy","central bank interest rate","central bank decision"],"ex":"The central bank raised interest rates to slow inflation.","exhu":"A központi bank kamatot emelt, hogy lassítsa az inflációt.","colhu":["jegybanki politika","jegybanki alapkamat","jegybanki döntés"],"gap":"The ____ raised interest rates to slow inflation.","sf":"central bank","ans":["central bank"]},{"id":6,"topic":1,"term":"charge","pos":"verb","ipa":"tʃˈɑːrdʒ","hu":"felszámít, kér (bizonyos árat)","hud":"Meghatározott árat vagy összeget kér egy termékért vagy szolgáltatásért.","def":"to ask a particular price or amount of money for a product or service","col":["charge a price","charge more","charge customers"],"ex":"The bakery had to charge more after its production costs increased.","exhu":"A pékségnek magasabb árat kellett kérnie, miután megnőttek a termelési költségei.","colhu":["árat kér","többet kér","árat számít fel a vevőknek"],"gap":"The bakery had to ____ more after its production costs increased.","sf":"charge","ans":["charge"]},{"id":7,"topic":1,"term":"consumer","pos":"noun","ipa":"kʌnsˈuːmɜːr","hu":"fogyasztó","hud":"Az a személy, aki árut vagy szolgáltatást vásárol, illetve használ.","def":"a person who buys or uses goods and services","col":["consumer demand","consumer spending","consumer confidence"],"ex":"The average consumer loses purchasing power when prices rise faster than income.","exhu":"Az átlagos fogyasztó vásárlóerőt veszít, ha az árak gyorsabban nőnek, mint a jövedelem.","colhu":["fogyasztói kereslet","fogyasztói költés","fogyasztói bizalom"],"gap":"The average ____ loses purchasing power when prices rise faster than income.","sf":"consumer","ans":["consumer"]},{"id":8,"topic":1,"term":"Consumer Price Index (CPI)","pos":"noun phrase","ipa":"kənˈsuːmər praɪs ˈɪndeks","hu":"fogyasztói árindex (KSH-s árindex)","hud":"Index, amely azt méri, hogyan változik egy tipikus fogyasztói kosár ára az idő múlásával.","def":"an index that measures how the cost of a typical basket of goods and services changes over time","col":["CPI inflation","CPI data","calculate the CPI"],"ex":"The Consumer Price Index showed that household costs had increased over the year.","exhu":"A fogyasztói árindex azt mutatta, hogy a háztartások kiadásai nőttek az év során.","colhu":["CPI-infláció","CPI-adatok","kiszámítja a CPI-t"],"gap":"The ____ showed that household costs had increased over the year.","sf":"Consumer Price Index","ans":["Consumer Price Index (CPI)","Consumer Price Index","CPI"]},{"id":9,"topic":1,"term":"consumption","pos":"noun","ipa":"kʌnsˈʌmpʃʌn","hu":"fogyasztás","hud":"Áruk és szolgáltatások felhasználása vagy megvásárlása a háztartások és más gazdasági szereplők részéről.","def":"the use or purchase of goods and services by households and other economic agents","col":["household consumption","consumer consumption","consumption spending"],"ex":"Lower interest rates can encourage borrowing, investment, and consumption.","exhu":"Az alacsonyabb kamatok ösztönözhetik a hitelfelvételt, a beruházást és a fogyasztást.","colhu":["háztartási fogyasztás","lakossági fogyasztás","fogyasztási kiadás"],"gap":"Lower interest rates can encourage borrowing, investment, and ____.","sf":"consumption","ans":["consumption"]},{"id":10,"topic":1,"term":"core inflation","pos":"noun phrase","ipa":"kˈɔːr ˌɪnflˈeɪʃʌn","hu":"maginfláció","hud":"Olyan inflációs mutató, amely kihagyja a nagyon ingadozó árú tételeket (például élelmiszer, üzemanyag), hogy a mögöttes ártrend látszódjon.","def":"a measure of inflation that excludes items with highly volatile prices, such as food and fuel, to show the underlying price trend","col":["core inflation rate","underlying core inflation","measure core inflation"],"ex":"Policymakers watched core inflation to see whether price pressures were becoming persistent.","exhu":"A döntéshozók a maginflációt figyelték, hogy lássák, tartóssá válik-e az árnyomás.","colhu":["maginflációs ráta","mögöttes maginfláció","maginflációt mér"],"gap":"Policymakers watched ____ to see whether price pressures were becoming persistent.","sf":"core inflation","ans":["core inflation"]},{"id":11,"topic":1,"term":"cost-push inflation","pos":"noun phrase","ipa":"ˈkɔːst pʊʃ ɪnˈfleɪʃən","hu":"költséginfláció (kínálati oldali infláció)","hud":"Infláció, amelyet az emelkedő termelési költségek okoznak: a cégek ezért emelik az eladási áraikat.","def":"inflation caused by rising production costs that lead businesses to increase their selling prices","col":["cost-push inflation pressures","cause cost-push inflation","control cost-push inflation"],"ex":"A sharp increase in energy prices can create cost-push inflation across many industries.","exhu":"Az energiaárak hirtelen emelkedése sok iparágban okozhat költséginflációt.","colhu":["költséginflációs nyomás","költséginflációt okoz","költséginflációt kezel"],"gap":"A sharp increase in energy prices can create ____ across many industries.","sf":"cost-push inflation","ans":["cost-push inflation"]},{"id":12,"topic":1,"term":"cover its ent or public institutions, who make decisions about economic or public policy","col":["economic policymakers","policymakers respond","policymakers decide"],"ex":"Policymakers may lower interest rates during a recession to support recovery.","exhu":"A döntéshozók recesszió idején kamatot csökkenthetnek a kilábalás támogatására.","colhu":["gazdaságpolitikai döntéshozók","a döntéshozók reagálnak","a döntéshozók döntenek"],"gap":"____ may lower interest rates during a recession to support recovery.","sf":"Policymakers","ans":["policymakers"]},{"id":46,"topic":1,"term":"production costs","pos":"plural noun","ipa":"prʌdˈʌkʃʌn kˈɑːsts","hu":"termelési költségek","hud":"A termeléskor felmerülő költségek, például a bér, az energia és az alapanyag.","def":"the expenses a business faces when producing goods or services, such as wages, energy, and raw materials","col":["higher production costs","reduce production costs","rising production costs"],"ex":"Rising fuel prices increased production costs for transport companies.","exhu":"Az emelkedő üzemanyagárak megnövelték a fuvarozó cégek termelési költségeit.","colhu":["magasabb termelési költségek","csökkenti a termelési költségeket","emelkedő termelési költségek"],"gap":"Rising fuel prices increased ____ for transport companies.","sf":"production costs","ans":["production costs"]},{"id":47,"topic":1,"term":"profit margins","pos":"plural noun","ipa":"prˈɑːfʌt mˈɑːrdʒʌnz","hu":"haszonkulcs, árrés","hud":"A vállalat bevétele és költségei közötti különbség, általában a bevétel arányában kifejezve.","def":"the difference between a firm's revenue and its costs, usually expressed as a proportion of revenue","col":["higher profit margins","increase profit margins","narrow profit margins"],"ex":"Critics of greedflation argue that rising profit margins can contribute to price increases.","exhu":"A mohóságinfláció kritikusai szerint az emelkedő haszonkulcs is hozzájárulhat az áremelkedéshez.","colhu":["magasabb haszonkulcs","növeli a hasz at.","colhu":["gazdasági fellendülés","erős fellendülés","megindul a fellendülés"],"gap":"Consumer spending increased during the ____ after pandemic restrictions were lifted.","sf":"recovery","ans":["recovery"]},{"id":53,"topic":1,"term":"remittances","pos":"plural noun","ipa":"riːmˈɪtʌnsɪz","hu":"hazautalások (külföldről küldött pénz)","hud":"A külföldön élő és dolgozó emberek által hazaküldött pénz, jellemzően a család támogatására.","def":"money sent home by people who are living and working abroad, usually to support family members","col":["worker remittances","receive remittances","remittance inflows"],"ex":"Remittances from overseas workers can raise a country's GNI above its GDP.","exhu":"A külföldön dolgozók hazautalásai a GDP fölé emelhetik egy ország GNI-jét.","colhu":["munkavállalói hazautalások","hazautalást kap","beáramló hazautalások"],"gap":"____ from overseas workers can raise a country's GNI above its GDP.","sf":"Remittances","ans":["remittances"]},{"id":54,"topic":1,"term":"reparations","pos":"plural noun","ipa":"rˌepɜːrˈeɪʃʌnz","hu":"jóvátétel, háborús kártérítés","hud":"Egy országra kirótt fizetés a háború okozta károk vagy veszteségek megtérítésére.","def":"payments imposed on a country to compensate for damage or losses caused by war","col":["war reparations","pay reparations","reparations payments"],"ex":"Large war reparations added to Hungary's financial pressures after the Second World War.","exhu":"A nagy összegű háborús jóvátétel tovább növelte Magyarország pénzügyi terheit a második világháború után.","colhu":["háborús jóvátétel","jóvátételt fizet","jóvátételi kifizetések"],"gap":"Large war ____ added to Hungary's financial pressures after the Second World War.","sf":"reparations","ans":["reparations"]},{"id":55,"topic":1,"term":"resources","pos":"plural noun","ipa":"rˈiːsɔːrsɪz","hu":"erőforrások","hud":"Korlátozott erőforrások – pénz, munka, föld, anyag, idő –, amelyeket termelésre vagy célok elérésére használnak.","def":"limited inputs s","col":["strengthen bilateral relations","bilateral cooperation","bilateral talks"],"ex":"The two governments agreed to strengthen bilateral relations.","exhu":"A két kormány megállapodott a kétoldalú kapcsolatok erősítéséről.","colhu":["erősíti a kétoldalú kapcsolatokat","kétoldalú együttműködés","kétoldalú tárgyalások"],"gap":"The two governments agreed to strengthen ____.","sf":"bilateral relations","ans":["bilateral relations"]},{"id":204,"topic":4,"term":"bill","pos":"noun","ipa":"bˈɪl","hu":"törvényjavaslat","hud":"Törvényjavaslat, amelyet benyújtottak a törvényhozáshoz, de még nem fogadtak el véglegesen.","def":"a proposed law that has been introduced into a legislature but has not yet been finally enacted","col":["introduce a bill","pass a bill","amend a bill"],"ex":"The government introduced a bill to change election law.","exhu":"A kormány törvényjavaslatot nyújtott be a választójogi szabályok módosítására.","colhu":["törvényjavaslatot nyújt be","elfogad egy törvényjavaslatot","módosít egy javaslatot"],"gap":"The government introduced a ____ to change election law.","sf":"bill","ans":["bill"]},{"id":205,"topic":4,"term":"cabinet","pos":"noun","ipa":"kˈæbʌnʌt","hu":"kabinet, a miniszterek testülete","hud":"A nagy minisztériumokat vezető miniszterek testülete, amely közösen irányítja a kormány politikáját.","def":"the group of senior ministers who lead major government departments and collectively direct government policy","col":["cabinet minister","cabinet meeting","form a cabinet"],"ex":"The prime minister appointed a new cabinet after taking office.","exhu":"A miniszterelnök hivatalba lépése után új kabinetet nevezett ki.","colhu":["kabinetminiszter","kabinetülés","kormányt alakít"],"gap":"The prime minister appointed a new ____ after taking office.","sf":"cabinet","ans":["cabinet"]},{"id":206,"topic":4,"term":"campaign promise","pos":"noun phrase","ipa":"kæmpˈeɪn prˈɑːmʌs","hu":"kampányígéret","hud":"Jelölt vagy párt ígérete arról, mit fog tenni, ha me ":"ceasefire","ans":["ceasefire"]},{"id":209,"topic":4,"term":"checks and balances","pos":"plural noun","ipa":"tʃˈeks ʌnd bˈælʌnsʌz","hu":"fékek és ellensúlyok","hud":"Mechanizmusok, amelyekkel a politikai intézmények korlátozhatják, felülvizsgálhatják vagy ellenőrizhetik egymást.","def":"mechanisms through which political institutions can limit, review, or constrain one another","col":["system of checks and balances","constitutional checks and balances","provide a check on power"],"ex":"Checks and balances help prevent one branch of government from dominating the others.","exhu":"A fékek és ellensúlyok segítenek megakadályozni, hogy az egyik hatalmi ág uralja a többit.","colhu":["fékek és ellensúlyok rendszere","alkotmányos fékek és ellensúlyok","korlátot állít a hatalomnak"],"gap":"____ help prevent one branch of government from dominating the others.","sf":"Checks and balances","ans":["checks and balances"]},{"id":210,"topic":4,"term":"citizen","pos":"noun","ipa":"sˈɪtʌzʌn","hu":"állampolgár","hud":"A politikai közösség jogilag elismert tagja, akinek jogai és kötelezettségei vannak.","def":"a legally recognised member of a political community who has rights and duties","col":["citizen participation","citizen rights","ordinary citizens"],"ex":"Citizens can influence politics by voting and participating in public debate.","exhu":"Az állampolgárok szavazással és a közéleti vitában való részvétellel hathatnak a politikára.","colhu":["állampolgári részvétel","állampolgári jogok","hétköznapi emberek"],"gap":"____ can influence politics by voting and participating in public debate.","sf":"Citizens","ans":["citizen","Citizens"]},{"id":211,"topic":4,"term":"civil liberties","pos":"plural noun","ipa":"sˈɪvʌl lˈɪbɜːrtˌiːz","hu":"polgári szabadságjogok","hud":"Alapvető szabadságjogok, amelyeket védeni kell az állam indokolatlan beavatkozásától, például a szólás- és gyülekezési szabadság.","def":"fundamental freedoms protected from unjustified interference by government, such as freedom of speech or assembly","col":["protect civil liberties","civil-liberties protections","restrict civil liberties"],"ex":"Courts can play an important role in protecting civil liberties.","exhu":"A bíróságok fontos szerepet játszhatnak a polgári szabadságjogok védelmében.","colhu":["védi a szabadságjogokat","a szabadságjogok védelme","korlátozza a szabadságjogokat"],"gap":"Courts can play an important role in protecting ____.","sf":"civil liberties","ans":["civil liberties"]},{"id":212,"topic":4,"term":"civil service","pos":"noun phrase","ipa":"sˈɪvʌl sˈɜːrvʌs","hu":"közszolgálat, közigazgatás","hud":"A hivatásos köztisztviselők köre, amely a kormányzati igazgatást végzi, és általában a politikai vezetés cseréjekor is a helyén marad.","def":"the body of professional public officials who administer government and usually remain in post when political leaders change","col":["career civil service","civil servant","civil-service reform"],"ex":"The civil service provides administrative continuity after elections.","exhu":"A közszolgálat biztosítja az igazgatás folytonosságát a választások után.","colhu":["hivatásos közszolgálat","köztisztviselő","közszolgálati reform"],"gap":"The ____ provides administrative continuity after elections.","sf":"civil service","ans":["civil service"]},{"id":213,"topic":4,"term":"coalition","pos":"noun","ipa":"kˌoʊʌlˈɪʃʌn","hu":"koalíció","hud":"Politikai pártok vagy csoportok szövetsége, amelyek együttműködnek, jellemzően kormányalakítás céljából.","def":"an alliance of political parties or groups that cooperate, especially to form a government","col":["form a coalition","coalition partner","coalition negotiations"],"ex":"Three parties entered coalition negotiations after the election.","exhu":"A választás után három párt kezdett koalíciós tárgyalásokba.","colhu":["koalíciót alakít","koalíciós partner","koalíciós tárgyalások"],"gap":"Three parties entered ____ negotiations after the election.","sf":"coalition","ans":["coalition"]} ng into violence.","exhu":"A diplomácia segíthet megelőzni, hogy egy politikai konfliktus erőszakba torkolljon.","colhu":["fegyveres konfliktus","politikai konfliktus","konfliktust old meg"],"gap":"Diplomacy can help prevent a political ____ from escalating into violence.","sf":"conflict","ans":["conflict"]},{"id":217,"topic":4,"term":"constituency","pos":"noun","ipa":"kʌnstˈɪtʃuːʌnsiː","hu":"választókerület","hud":"Földrajzi választási terület, amelyet egy vagy több megválasztott politikus képvisel.","def":"a geographical electoral area represented by one or more elected politicians","col":["parliamentary constituency","constituency boundary","marginal constituency"],"ex":"Each constituency elects a representative to parliament.","exhu":"Minden választókerület egy képviselőt küld a parlamentbe.","colhu":["parlamenti választókerület","választókerületi határ","kiélezett választókerület"],"gap":"Each ____ elects a representative to parliament.","sf":"constituency","ans":["constituency"]},{"id":218,"topic":4,"term":"Constitutional Court","pos":"proper noun","ipa":"kˌɑːnstʌtˈuːʃʌnʌl kˈɔːrt","hu":"Alkotmánybíróság","hud":"Bíróság, amely az alkotmányt és a törvények alkotmányosságát érintő kérdésekre szakosodott.","def":"a court specialising in questions concerning the constitution and the constitutional validity of laws","col":["Constitutional Court decision","constitutional review","Constitutional Court judge"],"ex":"The Constitutional Court reviewed whether the legislation complied with the constitution.","exhu":"Az Alkotmánybíróság megvizsgálta, hogy a jogszabály megfelel-e az alkotmánynak.","colhu":["alkotmánybírósági döntés","alkotmányossági felülvizsgálat","alkotmánybíró"],"gap":"The ____ reviewed whether the legislation complied with the constitution.","sf":"Constitutional Court","ans":["Constitutional Court"]},{"id":219,"topic":4,"term":"constitutional monarchy","pos":"noun phrase","ipa":"kˌɑːnstʌtˈuːʃʌnʌl mˈɑːnɑːrkiː","hu":"alkotmányos monarchia","hud":"Monarchi ts and citizens have little realistic opportunity to replace them","col":["military dictatorship","one-party dictatorship","overthrow a dictatorship"],"ex":"In a dictatorship, political leaders cannot normally be removed through genuinely competitive elections.","exhu":"A diktatúrában a politikai vezetőket rendszerint nem lehet valóban versengő választással leváltani.","colhu":["katonai diktatúra","egypárti diktatúra","megdönt egy diktatúrát"],"gap":"In a ____, political leaders cannot normally be removed through genuinely competitive elections.","sf":"dictatorship","ans":["dictatorship"]},{"id":222,"topic":4,"term":"diplomacy","pos":"noun","ipa":"dɪplˈoʊmʌsiː","hu":"diplomácia","hud":"Az államok közötti kapcsolatok kezelése kommunikáció, képviselet és tárgyalás útján.","def":"the practice of managing relations between states through communication, representation, and negotiation","col":["international diplomacy","diplomatic negotiations","practice diplomacy"],"ex":"Diplomacy can keep communication open even during serious political disputes.","exhu":"A diplomácia még súlyos politikai viták idején is nyitva tarthatja a kommunikációt.","colhu":["nemzetközi diplomácia","diplomáciai tárgyalások","diplomáciát folytat"],"gap":"____ can keep communication open even during serious political disputes.","sf":"Diplomacy","ans":["diplomacy"]},{"id":223,"topic":4,"term":"diplomat","pos":"noun","ipa":"dˈɪplʌmˌæt","hu":"diplomata","hud":"Hivatásos tisztviselő, aki külföldön képviseli az államot, vagy a külkapcsolatok alakításában dolgozik.","def":"a professional official who represents a state abroad or works in the conduct of foreign relations","col":["career diplomat","senior diplomat","diplomatic service"],"ex":"The diplomat took part in negotiations on a new trade agreement.","exhu":"A diplomata részt vett egy új kereskedelmi megállapodásról szóló tárgyaláson.","colhu":["hivatásos diplomata","magas rangú diplomata","külügyi szolgálat"],"gap":"The ____ took part in negotiation értékajánlat","értékajánlatot dolgoz ki","értéket kommunikál"],"gap":"The ____ focused on saving small businesses time and reducing administrative work.","sf":"value proposition","ans":["value proposition"]},{"id":476,"topic":5,"term":"visibility","pos":"noun","ipa":"vˌɪzʌbˈɪlɪtiː","hu":"láthatóság, megtalálhatóság","hud":"Mennyire látható vagy megtalálható a márka, a termék vagy az üzenet a szándékolt közönség számára.","def":"the extent to which a brand, product, or message can be seen or found by its intended audience","col":["increase visibility","brand visibility","online visibility"],"ex":"SEO improved the company's visibility in unpaid search results.","exhu":"A keresőoptimalizálás javította a cég láthatóságát a nem fizetett találatok között.","colhu":["növeli a láthatóságot","márkaláthatóság","online láthatóság"],"gap":"SEO improved the company's ____ in unpaid search results.","sf":"visibility","ans":["visibility"]},{"id":477,"topic":5,"term":"word-of-mouth (WOM)","pos":"noun phrase","ipa":"ˌwɜːrd əv ˈmaʊθ","hu":"szájreklám, szájhagyomány útján terjedő ajánlás","hud":"Informális kommunikáció, amelyben az emberek egymásnak ajánlanak, megvitatnak vagy megosztanak véleményeket termékekről és márkákról.","def":"informal communication in which people recommend, discuss, or share opinions about products and brands with others","col":["positive word-of-mouth","generate WOM","word-of-mouth recommendation"],"ex":"Excellent service generated positive word-of-mouth among existing customers.","exhu":"A kiváló kiszolgálás pozitív szájreklámot hozott a meglévő vevők körében.","colhu":["pozitív szájreklám","szájreklámot generál","szájról szájra terjedő ajánlás"],"gap":"Excellent service generated positive ____ among existing customers.","sf":"word-of-mouth","ans":["word-of-mouth (WOM)","word-of-mouth","WOM"]},{"id":478,"topic":5,"term":"zero-party data","pos":"noun phrase","ipa":"zˈɪroʊ pˈɑːrtiː dˈeɪtʌ","hu":"önként megadott ügyféladat (zero-party data)","hud":"Információ, amelyet a vevők szándékosan és önként adnak meg közvetlenül a cégnek: preferenciák, érdeklődés vagy visszajelzés.","def":"information that customers intentionally and voluntarily provide directly to a company, such as preferences, interests, or feedback","col":["collect zero-party data","customer-provided data","zero-party data strategy"],"ex":"The retailer collected zero-party data by asking customers to select their preferred product categories.","exhu":"A kiskereskedő úgy gyűjtött önként megadott adatot, hogy megkérte a vevőket, válasszák ki a kedvenc termékkategóriáikat.","colhu":["önként megadott adatot gyűjt","ügyfél által megadott adat","zero-party adatstratégia"],"gap":"The retailer collected ____ by asking customers to select their preferred product categories.","sf":"zero-party data","ans":["zero-party data"]}],"notes":{"1":[{"k":"h","t":"1. Introduction","hu":"1. Bevezetés"},{"k":"p","t":"Economics is the study of how people, businesses, and governments make choices when resources are limited. Every day, decisions are made about what to produce, how much to spend, and where to invest. These choices shape both individual lives and the future of entire countries. Understanding economics helps us answer important questions such as: Why do some nations grow rich while others remain poor? What causes prices to rise? Why does unemployment rise during recessions?","hu":"A közgazdaságtan azt vizsgálja, hogyan döntenek az emberek, a vállalkozások és a kormányok, amikor az erőforrások korlátozottak. Nap mint nap születnek döntések arról, mit termeljünk, mennyit költsünk és hová fektessünk be. Ezek a döntések egyéni életeket és egész országok jövőjét is alakítják. A közgazdaságtan megértése segít megválaszolni olyan fontos kérdéseket, mint: Miért gazdagodnak meg egyes nemzetek, míg mások szegények maradnak? Mi okozza az árak emelkedését? Miért nő a munkanélküliség a recessziók idején?"},{"k":"c","t":"Economics is the study of how people, businesses, and governments make choices when resources are limited.","hu":"A közgazdaságtan azt vizsgálja, hogyan döntenek az emberek, a vállalkozások és a kormányok, amikor az erőforrások korlátozottak.","lab":"DEFINITION"},{"k":"h","t":"2. Microeconomics and macroeconomics","hu":"2. Mikroökonómia és makroökonómia"},{"k":"p","t":"To make sense of these complex issues, economists divide the subject into two main areas: microeconomics and macroeconomics.","hu":"Hogy ezeket az összetett kérdéseket értelmezni tudják, a közgazdászok két fő területre osztják a tudományt: mikroökonómiára és makroökonómiára."},{"k":"h","t":"2.1 Microeconomics vs. macroeconomics","hu":"2.1 Mikroökonómia és makroökonómia szembeállítva"},{"k":"p","t":"Microeconomics focuses on the smaller picture, that is, individual economic agents (i.e. the people and organisations that make economic decisions). It examines the choices made by individuals, households, and companies or even how families decide what to spend their income on, or how a business sets its prices. Macroeconomics, on the other hand, looks at the bigger picture: complex economic systems in their entirety. Instead of studying single markets or companies, it examines the overall performance of entire economies. This includes how governments make decisions, how countries grow, and how factors like inflation and unemployment affect millions of people at once.","hu":"A mikroökonómia a kisebb képre összpontosít, vagyis az egyes gazdasági szereplőkre (azokra az emberekre és szervezetekre, akik gazdasági döntéseket hoznak). Azt vizsgálja, milyen döntéseket hoznak az egyének, a háztartások és a vállalatok: például hogyan dönti el egy család, mire költse a jövedelmét, vagy hogyan alakítja ki egy cég az árait. A makroökonómia ezzel szemben a nagy képet nézi: az összetett gazdasági rendszerek egészét. Nem egyes piacokat vagy cégeket vizsgál, hanem teljes gazdaságok összteljesítményét. Ide tartozik az is, hogyan hoznak döntéseket a kormányok, hogyan nőnek az országok, és hogyan hatnak egyszerre emberek millióira az olyan tényezők, mint az infláció és a munkanélküliség."},{"k":"c","t":"Microeconomics: focuses on individual economic agents, households, companies, and single markets. Macroeconomics: examines the overall performance of entire economies.","hu":"Mikroökonómia: az egyes gazdasági szereplőkre, a háztartásokra, a vállalatokra és az egyes piacokra összpontosít. Makroökonómia: teljes gazdaságok összteljesítményét vizsgálja.","lab":"KEY DISTINCTION"},{"k":"h","t":"2.2 Macroeconomic indicators","hu":"2.2 Makrogazdasági mutatók"},{"k":"p","t":"Macroeconomic indicators are like a health check-up for a country's economy. They show whether the economy is growing, shrinking, or facing challenges such as high inflation or unemployment. These indicators cover key areas such as economic growth, prices, jobs, and trade, giving us a clear picture of how well an economy is performing. By monitoring and analysing macroeconomic indicators such as GDP, inflation rate, and unemployment rate, governments can adjust policy tools such as interest rates to stabilize the economy, stimulate growth, or control inflation. Businesses and investors also rely on these numbers. Companies use them to plan future production and investment, while investors use them to predict market trends and make smarter financial decisions. In short, macroeconomic indicators help everyone from governments to businesses to individuals prepare for the future and support long-term economic stability.","hu":"A makrogazdasági mutatók olyanok, mint egy egészségügyi szűrővizsgálat az ország gazdasága számára. Megmutatják, hogy a gazdaság növekszik, zsugorodik, vagy olyan gondokkal küzd, mint a magas infláció vagy munkanélküliség. Ezek a mutatók olyan kulcsterületeket fognak át, mint a gazdasági növekedés, az árak, a munkahelyek és a kereskedelem, így tiszta képet adnak arról, mennyire jól teljesít egy gazdaság. Az olyan makrogazdasági mutatók figyelésével és elemzésével, mint a GDP, az inflációs ráta és a munkanélküliségi ráta, a kormányok olyan eszközöket igazíthatnak, mint a kamatszint, hogy stabilizálják a gazdaságot, élénkítsék a növekedést vagy megfékezzék az inflációt. A vállalkozások és a befektetők is támaszkodnak ezekre a számokra. A cégek ezek alapján tervezik a jövőbeli termelést és beruházást, a befektetők pedig a piaci trendeket jósolják meg belőlük, és okosabb pénzügyi döntéseket hoznak. Röviden: a makrogazdasági mutatók mindenkinek – kormányoknak, cégeknek és magánszemélyeknek – segítenek felkészülni a jövőre, és támogatják a hosszú távú gazdasági stabilitást."},{"k":"c","t":"Macroeconomic indicators show whether an economy is growing, shrinking, or facing challenges. Examples in this topic include GDP, inflation, unemployment, and interest rates.","hu":"A makrogazdasági mutatók megmutatják, hogy egy gazdaság növekszik, zsugorodik vagy nehézségekkel küzd. Ebben a témakörben ilyen például a GDP, az infláció, a munkanélküliség és a kamatszint.","lab":"AT A GLANCE"},{"k":"h","t":"3. Gross Domestic Product (GDP)","hu":"3. Bruttó hazai termék (GDP)"},{"k":"p","t":"Gross Domestic Product, usually shortened to GDP, is one of the most widely used indicators in economics. It measures the total market value of all final goods and services produced within a country over a certain period of time (usually a year or a quarter). Put simply, GDP shows how much a country produces. If a nation builds cars, grows wheat, makes clothes, develops software, and provides services like healthcare or education, all of these are added together at their market p rices to calculate GDP. By summing up everything produced, GDP gives us one number that reflects the size and strength of an economy.","hu":"A bruttó hazai termék – rövidítve GDP – a közgazdaságtan egyik legszélesebb körben használt mutatója. Azt méri, mekkora az országon belül egy adott időszak alatt (általában egy év vagy egy negyedév alatt) megtermelt összes végső termék és szolgáltatás piaci értéke. Egyszerűen fogalmazva: a GDP megmutatja, mennyit termel egy ország. Ha egy nemzet autót gyárt, búzát termeszt, ruhát készít, szoftvert fejleszt, és olyan szolgáltatásokat nyújt, mint az egészségügy vagy az oktatás, akkor mindezt piaci áron összeadva kapjuk meg a GDP-t. Azzal, hogy mindent összegez, amit megtermeltek, a GDP egyetlen számban tükrözi a gazdaság méretét és erejét."},{"k":"c","t":"GDP measures the total market value of all final goods and services produced within a country over a certain period of time.","hu":"A GDP azt méri, mekkora az országon belül egy adott időszak alatt megtermelt összes végső termék és szolgáltatás piaci értéke.","lab":"DEFINITION"},{"k":"h","t":"3.1 Why GDP matters","hu":"3.1 Miért fontos a GDP?"},{"k":"p","t":"Economists and policymakers watch GDP very closely because it acts like a report card for the economy. If GDP is growing, it usually means that businesses are producing more, people are earning and spending more, and the overall economy is healthy. Growth is often linked to rising living standards and job creation. If GDP is shrinking, it suggests the economy is slowing down. Companies may cut back production, unemployment may rise, and households may spend less. Prolonged declines in GDP are a sign of recession. In this way, GDP helps governments, businesses, and investors understand whether the economy is moving in the right direction or facing difficulties.","hu":"A közgazdászok és a döntéshozók nagyon szorosan figyelik a GDP-t, mert olyan, mint a gazdaság bizonyítványa. Ha a GDP nő, az rendszerint azt jelenti, hogy a cégek többet termelnek, az emberek többet keresnek és költenek, és a gazdaság egésze egészséges. A növekedés gyakran együtt jár az életszínvonal emelkedésével és új munkahelyekkel. Ha a GDP csökken, az a gazdaság lassulására utal. A cégek visszafoghatják a termelést, nőhet a munkanélküliség, és a háztartások kevesebbet költenek. A GDP tartós csökkenése a recesszió jele. A GDP így segít a kormányoknak, a cégeknek és a befektetőknek megérteni, hogy a gazdaság jó irányba halad-e, vagy nehézségekkel néz szembe."},{"k":"h","t":"3.2 A simple example of GDP","hu":"3.2 Egyszerű példa a GDP-re"},{"k":"p","t":"Imagine a very small country that produces only three goods in one year: • 1 million loaves of bread, sold at $2 each → $2 million • 500,000 shirts, sold at $20 each → $10 million • 100,000 smartphones, sold at $300 each → $30 million If we add these together, the GDP of this country is $42 million. Of course, real economies are much more complex, but the principle is the same: GDP is the sum of the value of everything produced.","hu":"Képzeljünk el egy nagyon kicsi országot, amely egy év alatt mindössze három terméket állít elő: • 1 millió kenyeret, darabját 2 dollárért → 2 millió dollár • 500 000 inget, darabját 20 dollárért → 10 millió dollár • 100 000 okostelefont, darabját 300 dollárért → 30 millió dollár Ha ezeket összeadjuk, az ország GDP-je 42 millió dollár. A valódi gazdaságok persze sokkal összetettebbek, de az elv ugyanez: a GDP a megtermelt dolgok értékének összege."},{"k":"c","t":"GDP is the sum of the value of everything produced. In the example above, GDP = $42 million.","hu":"A GDP a megtermelt dolgok értékének összege. A fenti példában a GDP = 42 millió dollár.","lab":"QUICK RECAP"},{"k":"h","t":"3.3 Real-world examples of GDP in action","hu":"3.3 Valós példák a GDP működésére"},{"k":"p","t":"China's rapid growth In the early 2000s, China became a classic example of high GDP growth. For several years, its GDP grew by more than 10% annually. This extraordinary growth was driven by industrialization and exports. China became the \"factory of the world,\" producing everything from clothes to electronics. Millions of people moved from rural farming communities into cities, where they worked in new factories. This transformation not only made China one of the fastest-growing economies in the world but also lifted hundreds of millions of people out of poverty.","hu":"Kína gyors növekedése – A 2000-es évek elején Kína a magas GDP-növekedés klasszikus példája lett. Több éven át évi 10%-nál nagyobb ütemben nőtt a GDP-je. Ezt a rendkívüli növekedést az iparosodás és az export hajtotta. Kína a „világ gyárává” vált: a ruháktól az elektronikáig mindent gyártott. Emberek milliói költöztek a vidéki mezőgazdasági közösségekből a városokba, ahol az új gyárakban dolgoztak. Ez az átalakulás nemcsak a világ egyik leggyorsabban növekvő gazdaságává tette Kínát, hanem emberek százmillióit emelte ki a szegénységből."},{"k":"p","t":"Post-COVID-19 recovery When the COVID-19 pandemic hit in 2020, global GDP fell sharply because factories shut down, shops closed, and international trade slowed. However, once restrictions eased, many countries experienced a sharp rebound. For example, after the lockdowns ended, consumer spending increased, businesses reopened, and international trade picked up again. GDP growth rates in several countries spiked in 2021 as economies \"caught up\" from the slowdown. This shows how GDP can quickly respond to major events.","hu":"A COVID-19 utáni fellendülés – Amikor 2020-ban lecsapott a COVID-19-járvány, a globális GDP meredeken esett, mert gyárak álltak le, boltok zártak be, és lelassult a nemzetközi kereskedelem. A korlátozások enyhítése után azonban sok ország erős visszapattanást élt át. A lezárások végeztével nőtt a fogyasztói költés, a vállalkozások újranyitottak, és a nemzetközi kereskedelem is beindult. Több országban megugrott a GDP növekedési üteme 2021-ben, ahogy a gazdaságok „behozták” a lemaradást. Ez jól mutatja, milyen gyorsan reagál a GDP a nagy eseményekre."},{"k":"h","t":"3.4 Limits of GDP","hu":"3.4 A GDP korlátai"},{"k":"p","t":"While GDP is extremely useful, it is not perfect. It tells us how much is produced, but not everything about people's well-being. For instance, a country may have a high GDP but also high inequality, meaning wealth is not shared evenly. GDP does not measure unpaid work, like housework or volunteering, even though these activities are valuable. Environmental costs (like pollution) are not subtracted from GDP, even though they reduce long-term well-being. That is why economists often use GDP per capita (GDP divided by the population) or other indicators alongside GDP to get a fuller picture of economic health.","hu":"Bár a GDP rendkívül hasznos, nem tökéletes. Megmutatja, mennyit termelnek, de nem mond el mindent az emberek jólétéről. Egy országnak lehet magas a GDP-je úgy is, hogy közben nagy az egyenlőtlenség, vagyis a jólét nem oszlik el egyenletesen. A GDP nem méri a fizetetlen munkát, például a háztartási munkát vagy az önkéntességet, pedig ezek értékes tevékenységek. A környezeti károkat (például a szennyezést) sem vonják le a GDP-ből, pedig azok rontják a hosszú távú jólétet. Ezért a közgazdászok a GDP mellett gyakran használják az egy főre jutó GDP-t (a GDP osztva a népességgel) vagy más mutatókat, hogy teljesebb képet kapjanak a gazdaság állapotáról."},{"k":"c","t":"GDP shows how much is produced, but it does not capture everything about well-being, inequality, unpaid work, or environmental costs.","hu":"A GDP azt mutatja, mennyit termelnek, de nem ragad meg mindent: a jólétet, az egyenlőtlenséget, a fizetetlen munkát és a környezeti költségeket nem.","lab":"WATCH OUT"},{"k":"h","t":"3.5 GDP Per Capita","hu":"3.5 Egy főre jutó GDP"},{"k":"p","t":"While GDP tells us the total size of a country's economy, it does not show how that wealth is shared among the population. That is where GDP per capita comes in and it is calculated by dividing a country's total GDP by the number of people living there. In simple terms, it tells us the average economic output or income per person. Economists use it as a rough measure of living standards in different countries.","hu":"Míg a GDP az ország gazdaságának teljes méretét mutatja meg, azt nem árulja el, hogyan oszlik meg ez a jólét a lakosság között. Itt jön be az egy főre jutó GDP, amelyet úgy kapunk meg, hogy az ország teljes GDP-jét elosztjuk az ott élők számával. Egyszerűen szólva megmutatja az egy főre jutó átlagos gazdasági kibocsátást vagy jövedelmet. A közgazdászok az országok életszínvonalának durva mérésére használják."},{"k":"c","t":"GDP per capita = total GDP ÷ population It gives the average economic output or income per person.","hu":"Egy főre jutó GDP = teljes GDP ÷ népesség. Az egy főre jutó átlagos gazdasági kibocsátást vagy jövedelmet adja meg.","lab":"FORMULA"},{"k":"h","t":"3.6 Why GDP per capita matters","hu":"3.6 Miért fontos az egy főre jutó GDP?"},{"k":"p","t":"A country can have a large GDP simply because it has a big population. But if that wealth is spread across hundreds of millions of people, individuals may not actually be very wealthy. On the other hand, a country with a smaller GDP but also a small population can end up with a much higher GDP per capita, meaning its citizens enjoy higher average incomes and living standards. In this way, GDP per capita helps us compare countries more fairly. Instead of only asking \"Which economy is bigger?\", it asks \"How wealthy is the average person?\"","hu":"Egy országnak pusztán azért is lehet nagy a GDP-je, mert nagy a népessége. De ha ez a jólét több százmillió ember között oszlik meg, az egyes emberek valójában nem feltétlenül gazdagok. Ezzel szemben egy kisebb GDP-jű, de kis népességű országban sokkal magasabb lehet az egy főre jutó GDP, vagyis a polgárok magasabb átlagjövedelmet és életszínvonalat élveznek. Az egy főre jutó GDP így tisztességesebb összehasonlítást tesz lehetővé. Nem csak azt kérdezi, „melyik gazdaság a nagyobb?”, hanem azt is: „mennyire gazdag az átlagember?”"},{"k":"h","t":"3.7 A simple example of GDP per capita","hu":"3.7 Egyszerű példa az egy főre jutó GDP-re"},{"k":"p","t":"Let us compare two countries: o Country A has a GDP of $1 trillion and a population of 100 million. GDP per capita = $1,000,000,000,000 ÷ 100,000,000 = $10,000 per person o Country B has a GDP of $500 billion and a population of 10 million. GDP per capita = $500,000,000,000 ÷ 10,000,000 = $50,000 per person Even though Country A has a larger economy overall, the average person in Country B is five times wealthier. This is why GDP per capita often tells us more about living standards than total GDP alone.","hu":"Hasonlítsunk össze két országot: o „A” ország GDP-je 1 billió dollár, népessége 100 millió. Egy főre jutó GDP = 1 000 000 000 000 ÷ 100 000 000 = 10 000 dollár fejenként. o „B” ország GDP-je 500 milliárd dollár, népessége 10 millió. Egy főre jutó GDP = 500 000 000 000 ÷ 10 000 000 = 50 000 dollár fejenként. Bár „A” ország gazdasága összességében nagyobb, „B” országban az átlagember ötször gazdagabb. Ezért árul el az egy főre jutó GDP gyakran többet az életszínvonalról, mint önmagában a teljes GDP."},{"k":"h","t":"3.8 Real-world examples of GDP per capita","hu":"3.8 Valós példák az egy főre jutó GDP-re"},{"k":"p","t":"High GDP per capita: Luxembourg and Qatar Luxembourg, a small European country, consistently reports one of the highest GDP per capita figures in the world (around $141,000 in 2025). This is due to its small population, strong banking and financial sector, and high levels of foreign investment. Similarly, Qatar benefits from enormous revenues from natural gas exports. Although its total GDP is much smaller than larger economies like the US or China, its tiny population means that, on average, citizens are extremely wealthy.","hu":"Magas egy főre jutó GDP: Luxemburg és Katar – Luxemburg, ez a kicsi európai ország, rendre a világ legmagasabb egy főre jutó GDP-értékei közt szerepel (2025-ben mintegy 141 000 dollár). Ennek oka a kis népesség, az erős bank- és pénzügyi szektor, valamint a magas szintű külföldi befektetés. Hasonlóan Katar is hatalmas bevételt élvez a földgázexportból. Bár a teljes GDP-je jóval kisebb, mint a nagy gazdaságoké, például az Egyesült Államoké vagy Kínáé, a pici népesség miatt a polgárok átlagosan rendkívül gazdagok."},{"k":"p","t":"Low GDP per capita: Burundi and South Sudan In contrast, countries such as Burundi and South Sudan often record GDP per capita below $1,000. These figures reflect widespread poverty, weak infrastructure, and political instability. Even if their total GDP grows, rapid population growth and structural economic challenges often keep average incomes very low.","hu":"Alacsony egy főre jutó GDP: Burundi és Dél-Szudán – Ezzel szemben olyan országokban, mint Burundi és Dél-Szudán, az egy főre jutó GDP gyakran 1000 dollár alatt marad. Ezek a számok széles körű szegénységet, gyenge infrastruktúrát és politikai instabilitást tükröznek. Még ha a teljes GDP nő is, a gyors népességnövekedés és a szerkezeti gazdasági gondok miatt az átlagjövedelmek jellemzően nagyon alacsonyak maradnak."},{"k":"h","t":"3.9 Real GDP","hu":"3.9 Reál-GDP"},{"k":"p","t":"When we measure a country's GDP, we usually start with nominal GDP, which is the total value of goods and services produced, measured at current prices. The problem is that prices change over time because of inflation (i.e., general rise in prices). If we only look at nominal GDP, it might seem like an economy is growing, when in reality prices are just increasing. This is why economists use real GDP. Real GDP adjusts for inflation, giving us a clearer picture of how much the economy is actually producing. By removing the effect of rising prices, Real GDP shows whether there has been true growth in output, not just higher prices.","hu":"Amikor egy ország GDP-jét mérjük, rendszerint a nominális GDP-ből indulunk ki, vagyis a megtermelt javak és szolgáltatások folyó áron mért összértékéből. A gond az, hogy az árak idővel változnak az infláció (vagyis az árak általános emelkedése) miatt. Ha csak a nominális GDP-t nézzük, úgy tűnhet, hogy a gazdaság növekszik, holott valójában csak az árak emelkednek. Ezért használják a közgazdászok a reál-GDP-t. A reál-GDP kiszűri az inflációt, így tisztább képet ad arról, mennyit termel valójában a gazdaság. Az áremelkedés hatásának eltávolításával a reál-GDP megmutatja, volt-e valódi növekedés a kibocsátásban, nem csak magasabbak lettek-e az árak."},{"k":"c","t":"Nominal GDP is measured at current prices. Real GDP adjusts for inflation and shows whether output has actually grown.","hu":"A nominális GDP folyó áron mért. A reál-GDP kiszűri az inflációt, és megmutatja, valóban nőtt-e a kibocsátás.","lab":"KEY DISTINCTION"},{"k":"h","t":"3.9.1 Why Real GDP matters","hu":"3.9.1 Miért fontos a reál-GDP?"},{"k":"p","t":"Nominal GDP can be misleading. If prices rise by 10% but the amount of goods produced stays the same, nominal GDP will also rise by 10%. It looks like the economy grew, but in reality, people can only buy the same amount as before and nothing has really improved. real GDP solves this problem by using constant prices from a base year. This way, we can compare economic performance across different years without the distorting effect of inflation. Think of it like this: if your salary increases by 5%, but prices also rise by 5%, you do not actually feel richer. Real GDP works the same way, and it tells us what has really changed in terms of production and purchasing power.","hu":"A nominális GDP félrevezető lehet. Ha az árak 10%-kal emelkednek, de a megtermelt mennyiség változatlan, a nominális GDP is 10%-kal nő. Úgy tűnik, mintha a gazdaság nőtt volna, valójában azonban az emberek ugyanannyit tudnak vásárolni, mint korábban, és semmi nem javult. A reál-GDP úgy oldja meg ezt, hogy egy bázisév változatlan árait használja. Így összehasonlíthatjuk a gazdasági teljesítményt a különböző évek között az infláció torzító hatása nélkül. Gondoljunk rá így: ha a fizetésünk 5%-kal nő, de az árak is 5%-kal emelkednek, valójában nem érezzük magunkat gazdagabbnak. A reál-GDP ugyanígy működik: megmutatja, mi változott valójában a termelésben és a vásárlóerőben."},{"k":"h","t":"3.9.2 A simple example of real GDP","hu":"3.9.2 Egyszerű példa a reál-GDP-re"},{"k":"p","t":"Suppose a country produces 100 loaves of bread in Year 1 at $1 each. GDP = $100. In Year 2, the country still produces 100 loaves, but the price rises to $2. Nominal GDP = $200. At first glance, it looks like GDP doubled. But in reality, no extra bread was produced, the only change was higher prices. When adjusted for inflation, Real GDP shows no growth, because output stayed the same.","hu":"Tegyük fel, hogy egy ország az 1. évben 100 kenyeret állít elő, darabját 1 dollárért. A GDP = 100 dollár. A 2. évben ugyanúgy 100 kenyeret termel, de az ár 2 dollárra emelkedik. A nominális GDP = 200 dollár. Első ránézésre úgy tűnik, a GDP megkétszereződött. Valójában azonban egy szem kenyérrel sem termeltek többet: csak az árak lettek magasabbak. Az inflációval korrigálva a reál-GDP nem mutat növekedést, mert a kibocsátás változatlan maradt."},{"k":"h","t":"3.9.3 The importance of real GDP","hu":"3.9.3 A reál-GDP jelentősége"},{"k":"p","t":"Because it adjusts for inflation, Real GDP is the best way to measure long-term growth. It tells us whether a country is truly producing more goods and services, not just charging higher prices. Governments, investors, and businesses rely on it to understand economic performance over time and to make meaningful comparisons between different periods.","hu":"Mivel kiszűri az inflációt, a reál-GDP a legjobb mód a hosszú távú növekedés mérésére. Megmutatja, hogy egy ország valóban több terméket és szolgáltatást állít-e elő, vagy csak magasabb árat kér. A kormányok, a befektetők és a vállalkozások erre támaszkodnak, hogy megértsék a gazdasági teljesítmény időbeli alakulását, és érdemi összehasonlításokat tudjanak tenni az egyes időszakok között."},{"k":"h","t":"4. Gross National Income (GNI)","hu":"4. Bruttó nemzeti jövedelem (GNI)"},{"k":"p","t":"While GDP measures everything produced within a country's borders, it does not tell the whole story of a nation's income. For that, economists often look at Gross National Income (GNI). GNI is the total income earned by a country's residents and businesses, no matter where in the world that income comes from. It includes all the goods and services produced at home (GDP) plus the income citizens and companies earn abroad, minus the income foreigners earn within the country that is sent back to their own nations.","hu":"Míg a GDP mindent mér, amit az ország határain belül megtermelnek, a nemzet jövedelmének teljes történetét nem mondja el. Ehhez a közgazdászok gyakran a bruttó nemzeti jövedelmet (GNI) nézik. A GNI az ország lakosai és vállalkozásai által megszerzett összes jövedelem, függetlenül attól, hogy a világ melyik pontjáról származik. Magában foglalja a belföldön megtermelt javakat és szolgáltatásokat (a GDP-t), plusz a polgárok és a cégek külföldön szerzett jövedelmét, mínusz azt a jövedelmet, amelyet külföldiek szereznek az országban, és a saját hazájukba küldenek haza."},{"k":"c","t":"GNI = GDP + Net Income from Abroad","hu":"GNI = GDP + külföldről származó nettó jövedelem","lab":"FORMULA"},{"k":"h","t":"4.1 Why GNI matters","hu":"4.1 Miért fontos a GNI?"},{"k":"p","t":"To understand why Gross National Income (GNI) is important, it helps to compare it with Gross Domestic Product (GDP). The key difference lies in location versus ownership. For instance, a Toyota factory in Kentucky contributes to US GDP but profits sent to Japan boost Japan's GNI. GDP measures all the goods and services produced inside a country's borders, no matter who earns the profits. GNI, by contrast, looks at the income that actually stays with the nation's residents and businesses, regardless of where in the world it is earned. This makes GNI particularly valuable for countries that are deeply connected to the global economy. For instance, in nations with large numbers of migrant workers, GNI captures the wages they send home, which often play a vital role in supporting families and boosting local consumption. Similarly, for countries with lots of foreign investment, GNI helps show how much of the income generated within their borders really belongs to local residents, rather than flowing back overseas. In short, while GDP gives a picture of what is being produced, GNI shows how much income truly remains in the hands of a country's people.","hu":"Ahhoz, hogy megértsük, miért fontos a bruttó nemzeti jövedelem (GNI), érdemes összevetni a bruttó hazai termékkel (GDP). A fő különbség a helyszín és a tulajdonlás között van. Egy kentucky-i Toyota-gyár például az amerikai GDP-hez járul hozzá, de a Japánba küldött nyereség Japán GNI-jét növeli. A GDP mindent mér, amit az ország határain belül megtermelnek, függetlenül attól, ki keresi rajta a hasznot. A GNI ezzel szemben azt a jövedelmet nézi, amely valóban az ország lakosainál és vállalkozásainál marad, bárhol is keresték meg a világon. Ezért a GNI különösen értékes a világgazdaságba mélyen beágyazott országok esetében. Azokban az országokban például, ahonnan sokan mennek külföldre dolgozni, a GNI megragadja a hazaküldött béreket, amelyek gyakran létfontosságúak a családok megélhetésében és a helyi fogyasztás élénkítésében. Hasonlóképpen a sok külföldi befektetést fogadó országoknál a GNI megmutatja, hogy a határaikon belül képződő jövedelemből mennyi marad valóban a helyi lakosoknál, és mennyi áramlik vissza külföldre. Röviden: míg a GDP arról ad képet, mit termelnek, a GNI azt mutatja meg, mennyi jövedelem marad valóban az ország lakóinak kezében."},{"k":"c","t":"GDP focuses on location: what is produced inside a country's borders. GNI focuses on ownership/income: what the country's residents and businesses earn.","hu":"A GDP a helyszínre összpontosít: mit termelnek az ország határain belül. A GNI a tulajdonlásra és a jövedelemre: mennyit keresnek az ország lakosai és vállalkozásai.","lab":"KEY DISTINCTION"},{"k":"h","t":"4.2 Components of GNI","hu":"4.2 A GNI összetevői"},{"k":"p","t":"GNI is made up of three main components, which together provide a fuller pi
