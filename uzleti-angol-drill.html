cture of national income: 1. Domestic production (GDP): This is the starting point, the total value of all goods and services produced within a country. 2. Income received from abroad: This includes money earned by residents outside the country, such as wages sent home by citizens working overseas, profits from domestic companies investing abroad, or interest and dividends earned from foreign assets. These inflows add to national income. 3. Payments sent abroad: Not all the money generated inside a country stays there. Foreign- owned companies often send their profits back to their home countries, and some financial flows move outward. These outflows are subtracted from the total. By combining these three elements, GNI gives a clearer picture of the income that truly belongs to a nation's residents. It answers the question: after counting all the money coming in and going out, how much wealth actually stays within the country's economy?","hu":"A GNI három fő összetevőből áll, amelyek együtt teljesebb képet adnak a nemzeti jövedelemről: 1. Belföldi termelés (GDP): ez a kiindulópont, vagyis az országon belül megtermelt összes termék és szolgáltatás értéke. 2. Külföldről kapott jövedelem: ide tartozik az a pénz, amelyet a lakosok az országon kívül keresnek – például a külföldön dolgozó állampolgárok hazaküldött bére, a belföldi cégek külföldi befektetéseinek nyeresége, vagy a külföldi eszközök után kapott kamat és osztalék. Ezek a beáramlások növelik a nemzeti jövedelmet. 3. Külföldre küldött kifizetések: nem marad az országban minden itt képződő pénz. A külföldi tulajdonú cégek gyakran hazaküldik a nyereségüket, és más pénzáramlások is kifelé mozognak. Ezeket a kiáramlásokat levonjuk az összegből. E három elem együtt pontosabb képet ad arról a jövedelemről, amely valóban az ország lakosaié. Arra a kérdésre válaszol: az összes be- és kiáramlást figyelembe véve mennyi vagyon marad valójában az ország gazdaságában?"},{"k":"c","t":"GNI combines domestic production, income received from abroad, and payments sent abroad.","hu":"A GNI a belföldi termelést, a külföldről kapott jövedelmet és a külföldre küldött kifizetéseket vonja össze.","lab":"AT A GLANCE"},{"k":"h","t":"4.3 A simple example of GNI","hu":"4.3 Egyszerű példa a GNI-re"},{"k":"p","t":"Imagine a country with: • GDP = $500 billion • Income from citizens working abroad = $50 billion • Profits sent home by foreign companies = $30 billion GNI = $500 billion + $50 billion − $30 billion = $520 billion This tells us that while the country produced $500 billion worth of goods and services, the actual income available to its residents was higher, thanks to money earned abroad.","hu":"Képzeljünk el egy országot, ahol: • GDP = 500 milliárd dollár • a külföldön dolgozó állampolgárok jövedelme = 50 milliárd dollár • a külföldi cégek által hazaküldött nyereség = 30 milliárd dollár. GNI = 500 milliárd + 50 milliárd − 30 milliárd = 520 milliárd dollár. Ez azt mutatja, hogy bár az ország 500 milliárd dollár értékben termelt javakat és szolgáltatásokat, a lakosai számára ténylegesen elérhető jövedelem ennél magasabb volt, a külföldön szerzett pénznek köszönhetően."},{"k":"h","t":"4.4 Real-world examples of GNI vs. GDP","hu":"4.4 Valós példák a GNI és a GDP eltérésére"},{"k":"p","t":"Take Ireland as an example. Its GDP is extremely high because many multinational corporations, especially major technology companies, have their European headquarters there. These firms produce and sell large amounts of goods and services within Ireland, which boosts the country's GDP figures. However, much of the profit they earn does not stay in Ireland. Instead, it is sent back to the companies' home countries, such as the United States. This means that Ireland's GNI, which measures the income that actually remains with Irish residents, is significantly lower than its GDP. In this way, GNI gives a more accurate picture of the resources truly available to the Irish people. On the other hand, consider countries with large numbers of citizens working abroad, such as the Philippines, Nepal, or Mexico. These countries may have modest GDP figures, since much of their production happens within small domestic economies. However, millions of their workers live overseas and send money home to support their families. These remittances represent a huge inflow of income that raises GNI above GDP. In the Philippines, for instance, remittances from overseas workers make up nearly ten percent of national income. This money improves household living standards and strengthens the local economy, even though it is earned outside the country.","hu":"Vegyük példának Írországot. A GDP-je rendkívül magas, mert sok multinacionális vállalat – különösen nagy technológiai cégek – ott tartja az európai központját. Ezek a cégek nagy mennyiségű terméket és szolgáltatást állítanak elő és adnak el Írországon belül, ami feltornássza az ország GDP-adatait. A megkeresett nyereség nagy része azonban nem marad Írországban, hanem visszakerül a cégek anyaországába, például az Egyesült Államokba. Ez azt jelenti, hogy Írország GNI-je – amely az ír lakosoknál ténylegesen maradó jövedelmet méri – jelentősen alacsonyabb a GDP-jénél. A GNI így pontosabb képet ad arról, milyen források állnak valójában az írek rendelkezésére. Ezzel szemben nézzük azokat az országokat, ahonnan sokan járnak külföldre dolgozni, például a Fülöp-szigeteket, Nepált vagy Mexikót. Ezekben az országokban a GDP szerény lehet, mert a termelés nagy része kis belső gazdaságokban zajlik. Munkavállalóik milliói azonban külföldön élnek, és pénzt küldenek haza a családjuknak. Ezek a hazautalások hatalmas jövedelembeáramlást jelentenek, amely a GDP fölé emeli a GNI-t. A Fülöp-szigeteken például a külföldön dolgozók hazautalásai a nemzeti jövedelem közel tíz százalékát teszik ki. Ez a pénz javítja a háztartások életszínvonalát és erősíti a helyi gazdaságot, még ha az országon kívül keresték is meg."},{"k":"h","t":"4.5 The importance of GNI","hu":"4.5 A GNI jelentősége"},{"k":"p","t":"GNI is especially important when comparing countries, because it shows the difference between where wealth is produced and who actually benefits from it. In small, open economies with strong international connections, GNI can look very different from GDP. In short, the two measures answer different questions: • GDP asks: How much is produced inside the country? • GNI asks: How much income do the country's people actually get to keep? Together, these measures provide a fuller understanding of a nation's economic well-being, but in cases where global trade, foreign investment, or remittances play a major role, GNI often gives the more realistic picture of what resources are available to residents.","hu":"A GNI különösen fontos az országok összehasonlításakor, mert megmutatja a különbséget aközött, hol termelődik a jólét, és ki élvezi valójában. A kicsi, nyitott, erős nemzetközi kapcsolatokkal rendelkező gazdaságokban a GNI nagyon másként festhet, mint a GDP. Röviden: a két mutató különböző kérdésekre válaszol. • A GDP azt kérdezi: mennyit termelnek az országon belül? • A GNI azt kérdezi: mennyi jövedelem marad valójában az ország lakóinál? A kettő együtt teljesebb képet ad egy nemzet gazdasági jólétéről, de ahol a világkereskedelem, a külföldi befektetés vagy a hazautalások komoly szerepet játszanak, ott a GNI gyakran valósághűbben mutatja, milyen források állnak a lakosság rendelkezésére."},{"k":"h","t":"5. Inflation","hu":"5. Infláció"},{"k":"p","t":"Inflation is the general increase in prices across an economy over time. It does not mean that every single price rises, but on average, most goods and services become more expensive from one year to the next. When inflation occurs, the purchasing power of money decreases. In other words, the same amount of money buys fewer items than before. This is why economists often describe inflation as \"the value of money falling.\"","hu":"Az infláció az árak általános emelkedése a gazdaságban az idő múlásával. Ez nem azt jelenti, hogy minden egyes ár emelkedik, hanem azt, hogy átlagosan a legtöbb termék és szolgáltatás drágább lesz évről évre. Amikor infláció van, a pénz vásárlóereje csökken. Más szóval ugyanakkora összegből kevesebbet lehet venni, mint korábban. Ezért írják le a közgazdászok az inflációt gyakran így: „a pénz értéke esik”."},{"k":"c","t":"Inflation is the general increase in prices across an economy over time. When inflation occurs, the purchasing power of money decreases.","hu":"Az infláció az árak általános emelkedése a gazdaságban az idő múlásával. Amikor infláció van, a pénz vásárlóereje csökken.","lab":"DEFINITION"},{"k":"h","t":"5.1 Why inflation matters","hu":"5.1 Miért fontos az infláció?"},{"k":"p","t":"Inflation is one of the most important indicators because it directly affects everyone. First, consumers (households) because if prices rise faster than wages, people can afford less. Their standard of living may fall. Second, businesses because higher costs make it harder for companies to plan for the future. They may raise prices, cut jobs, or reduce investment. Third, governments because too much inflation leads to economic instability. Too little (or deflation) can be just as harmful, leading to reduced economic activity. Central banks (like the Federal Reserve in the US or the European Central Bank) use tools such as interest rates to try to keep inflation at a stable, moderate level (around 2% per year in many countries).","hu":"Az infláció az egyik legfontosabb mutató, mert mindenkit közvetlenül érint. Először is a fogyasztókat (háztartásokat): ha az árak gyorsabban emelkednek, mint a bérek, az emberek kevesebbet engedhetnek meg maguknak, és csökkenhet az életszínvonaluk. Másodszor a vállalkozásokat: a magasabb költségek megnehezítik a jövő tervezését. A cégek árat emelhetnek, létszámot csökkenthetnek vagy visszafoghatják a beruházásokat. Harmadszor a kormányokat: a túl magas infláció gazdasági instabilitáshoz vezet. A túl alacsony (vagy a defláció) épp ilyen káros lehet, mert visszafogja a gazdasági aktivitást. A központi bankok (mint az amerikai Federal Reserve vagy az Európai Központi Bank) olyan eszközöket használnak, mint a kamatszint, hogy az inflációt stabil, mérsékelt szinten tartsák (sok országban évi 2% körül)."},{"k":"h","t":"5.2 How economists measure inflation","hu":"5.2 Hogyan mérik a közgazdászok az inflációt?"},{"k":"p","t":"The most widely used tool for measuring inflation is the Consumer Price Index (CPI). The idea is simple: economists look at how the cost of everyday life changes for the average household over time. To do this, they create what is called a \"basket of goods and services.\" This basket represents the typical things people spend money on, such as food, clothing, rent, transport, healthcare, education, and leisure activities. The basket does not change much from year to year, which allows economists to compare its cost at different points in time. For example, imagine the basket of goods and services costs $1,000 this year. If the same basket costs $1,050 next year, we can calculate the inflation rate as 5%. This means that prices have risen, on average, by 5%. In other words, households would need to spend 5% more money just to buy the same goods and services as the year before. Economists also use a measure called core inflation, which excludes items with highly unstable prices, like food and fuel. These prices often fluctuate due to short-term shocks such as extreme weather or geopolitical events. By removing these volatile elements, core inflation provides a clearer picture of the underlying, long-term trend in price changes.","hu":"Az infláció mérésének legelterjedtebb eszköze a fogyasztói árindex (CPI). Az ötlet egyszerű: a közgazdászok azt figyelik, hogyan változik az átlagos háztartás mindennapi megélhetésének költsége az idő múlásával. Ehhez létrehoznak egy úgynevezett „áru- és szolgáltatáskosarat”. Ez a kosár azokat a tipikus dolgokat tartalmazza, amelyekre az emberek költenek: élelmiszert, ruhát, lakbért, közlekedést, egészségügyet, oktatást és szabadidős tevékenységeket. A kosár évről évre alig változik, így a közgazdászok össze tudják hasonlítani a költségét különböző időpontokban. Tegyük fel például, hogy a kosár idén 1000 dollárba kerül. Ha ugyanez a kosár jövőre 1050 dollár, akkor az inflációs ráta 5%. Ez azt jelenti, hogy az árak átlagosan 5%-kal emelkedtek. Más szóval a háztartásoknak 5%-kal többet kellene költeniük ugyanazokért a termékekért és szolgáltatásokért, mint egy évvel korábban. A közgazdászok használják a maginfláció nevű mutatót is, amely kihagyja a nagyon ingadozó árú tételeket, például az élelmiszert és az üzemanyagot. Ezek az árak gyakran mozognak rövid távú sokkok, például szélsőséges időjárás vagy geopolitikai események miatt. Az ingadozó elemek kiszűrésével a maginfláció tisztább képet ad az árváltozások mögöttes, hosszú távú trendjéről."},{"k":"c","t":"Consumer Price Index (CPI): measures how the cost of a typical basket of goods and services changes over time. Core inflation: excludes highly unstable items such as food and fuel to show the underlying trend.","hu":"Fogyasztói árindex (CPI): azt méri, hogyan változik egy tipikus fogyasztói kosár ára az idő múlásával. Maginfláció: kihagyja a nagyon ingadozó tételeket, például az élelmiszert és az üzemanyagot, hogy a mögöttes trend látsszon.","lab":"KEY TERMS"},{"k":"h","t":"5.3 Main types of inflation","hu":"5.3 Az infláció fő típusai"},{"k":"p","t":"Inflation does not always have the same cause. Economists usually distinguish between two main types: demand-pull inflation, and cost-push inflation. Understanding these types helps us see why prices rise and how governments might respond.","hu":"Az infláció oka nem mindig ugyanaz. A közgazdászok rendszerint két fő típust különböztetnek meg: a keresleti inflációt és a költséginflációt. E típusok megértése segít látni, miért emelkednek az árak, és hogyan reagálhatnak a kormányok."},{"k":"c","t":"Demand-pull inflation: demand grows faster than the economy's ability to produce. Cost-push inflation: production costs rise and businesses pass those higher costs on to consumers.","hu":"Keresleti infláció: a kereslet gyorsabban nő, mint a gazdaság termelőképessége. Költséginfláció: a termelési költségek emelkednek, és a cégek ezt a többletköltséget áthárítják a fogyasztókra.","lab":"KEY DISTINCTION"},{"k":"h","t":"5.3.1 Demand-pull inflation","hu":"5.3.1 Keresleti infláció"},{"k":"p","t":"One of the main causes of inflation is something called demand-pull inflation. This happens when demand for goods and services grows faster than the economy's ability to produce them. In simple terms, there are too many buyers chasing too few goods. When this imbalance occurs, sellers can raise their prices, knowing that customers are still eager to buy. Let us think about the housing market. If thousands of people all want to buy homes at the same time but there aren't enough houses available, prices will naturally climb. Sellers can increase prices because buyers are competing with each other. The same logic applies to cars, electronics, or even food during shortages when demand outstrips supply, prices rise.","hu":"Az infláció egyik fő oka az úgynevezett keresleti infláció. Akkor keletkezik, amikor a termékek és szolgáltatások iránti kereslet gyorsabban nő, mint amennyit a gazdaság elő tud állítani. Egyszerűen szólva: túl sok vevő verseng túl kevés áruért. Ilyen egyensúlytalanság esetén az eladók emelhetik az áraikat, hiszen a vásárlók továbbra is vevők. Gondoljunk a lakáspiacra. Ha egyszerre több ezren akarnak lakást venni, de nincs elég elérhető ingatlan, az árak természetes módon emelkednek. Az eladók emelhetnek, mert a vevők versengenek egymással. Ugyanez a logika érvényes az autókra, az elektronikára, sőt hiány idején az élelmiszerekre is: ha a kereslet meghaladja a kínálatot, az árak emelkednek."},{"k":"c","t":"Demand rises faster than supply → too many buyers chase too few goods → sellers raise prices.","hu":"A kereslet gyorsabban nő, mint a kínálat → túl sok vevő verseng túl kevés áruért → az eladók árat emelnek.","lab":"CAUSE & EFFECT"},{"k":"h","t":"5.3.1.1 A step-by-step example","hu":"5.3.1.1 Lépésről lépésre bemutatott példa"},{"k":"p","t":"Imagine a smartphone factory that produces 1,000 phones per month. Normally, this supply matches consumer demand. But suddenly, demand jumps to 1,200 phones per month. The factory cannot instantly increase production as it does not have enough workers, machines, or materials to produce the extra 200 phones right away. Faced with more buyers than products, the company raises the price of each phone.","hu":"Képzeljünk el egy okostelefongyárat, amely havi 1000 telefont készít. Ez a kínálat rendes körülmények között fedezi a fogyasztói keresletet. Hirtelen azonban a kereslet havi 1200 darabra ugrik. A gyár nem tudja azonnal növelni a termelést, mert nincs elég munkása, gépe és alapanyaga a plusz 200 telefon gyors előállításához. Mivel több a vevő, mint a termék, a cég megemeli az egyes telefonok árát."},{"k":"h","t":"5.3.1.2 Real-world examples","hu":"5.3.1.2 Valós példák"},{"k":"p","t":"• Post-COVID recovery (2021–2022): After lockdowns ended, millions of people worldwide rushed to spend on houses, cars, furniture, and electronics. At the same time, global supply chains were still disrupted. The sudden wave of demand collided with limited supply, driving prices sharply higher. • United States in the 1960s: Strong government spending on social programs combined with heavy military spending during the Vietnam War boosted overall demand in the economy. With so much money circulating and demand rising, prices were pushed upward, contributing to inflation.","hu":"• A COVID utáni fellendülés (2021–2022): a lezárások végeztével emberek milliói kezdtek világszerte lakásra, autóra, bútorra és elektronikára költeni. Ezzel egy időben a globális ellátási láncok még mindig akadoztak. A hirtelen keresleti hullám szűkös kínálattal találkozott, és meredeken emelte az árakat. • Az Egyesült Államok az 1960-as években: a szociális programokra fordított erős állami költés és a vietnámi háború alatti jelentős katonai kiadás megnövelte a gazdaság összkeresletét. A rengeteg forgalomban lévő pénz és a növekvő kereslet felfelé nyomta az árakat, ami hozzájárult az inflációhoz."},{"k":"h","t":"5.3.1.3 Why demand-pull inflation matters","hu":"5.3.1.3 Miért fontos a keresleti infláció?"},{"k":"p","t":"Demand-pull inflation usually occurs during periods of economic growth, when people feel confident about the future, have jobs, and are willing to spend more. In small doses, this kind of inflation can be healthy as it reflects rising demand, strong business activity, and consumer confidence. But if demand grows too quickly and supply cannot keep up, prices can rise too fast. This can lead to overheating in the economy, where inflation spirals out of control. To prevent this, central banks often step in by raising interest rates, making borrowing more expensive and cooling down spending.","hu":"A keresleti infláció jellemzően gazdasági növekedés idején jelentkezik, amikor az emberek bizakodnak a jövőben, van munkájuk, és hajlandók többet költeni. Kis mértékben az ilyen infláció egészséges is lehet, mert növekvő keresletet, élénk üzleti tevékenységet és fogyasztói bizalmat tükröz. Ha azonban a kereslet túl gyorsan nő, és a kínálat nem tud lépést tartani, az árak túl gyorsan emelkedhetnek. Ez a gazdaság túlfűtöttségéhez vezethet, ahol az infláció elszabadul. Ennek megelőzésére a központi bankok gyakran kamatemeléssel avatkoznak be, drágábbá téve a hitelt és lehűtve a költekezést."},{"k":"h","t":"5.3.2 Cost-push inflation","hu":"5.3.2 Költséginfláció"},{"k":"p","t":"Another major cause of inflation is called cost-push inflation. This happens when the cost of producing goods and services increases, and businesses raise their prices to cover those higher costs. In this case, it is not strong demand that pushes prices upward, but rather the rising expenses faced by producers. For example, if wages rise significantly, companies must pay their workers more. If the prices of raw materials such as oil, metals, or wheat increase, production becomes more expensive. To maintain profitability, businesses often have no choice but to p ass these costs on to consumers in the form of higher prices. Let us think about a bakery. If the price of flour or wheat doubles, the bakery suddenly faces much higher production costs. To stay in business, it raises the price of bread, even if customers are not buying more than before. This is the essence of cost-push inflation: when costs increase, prices follow.","hu":"Az infláció másik fő oka az úgynevezett költséginfláció. Akkor keletkezik, amikor a termékek és szolgáltatások előállításának költsége nő, és a cégek árat emelnek, hogy fedezzék a magasabb költségeket. Itt tehát nem az erős kereslet nyomja felfelé az árakat, hanem a termelők növekvő kiadásai. Ha például a bérek jelentősen emelkednek, a cégeknek többet kell fizetniük a dolgozóiknak. Ha az olaj, a fémek vagy a búza ára nő, a termelés drágább lesz. A nyereségesség megőrzése érdekében a vállalkozásoknak gyakran nincs más választásuk, mint magasabb árak formájában áthárítani ezeket a költségeket a fogyasztókra. Gondoljunk egy pékségre. Ha a liszt vagy a búza ára megkétszereződik, a pékség hirtelen sokkal magasabb termelési költséggel néz szembe. Hogy működni tudjon, megemeli a kenyér árát, még akkor is, ha a vevők nem vesznek többet, mint korábban. Ez a költséginfláció lényege: ha nőnek a költségek, követik őket az árak."},{"k":"c","t":"Production costs rise → businesses face higher expenses → selling prices increase.","hu":"A termelési költségek emelkednek → a cégek kiadásai nőnek → az eladási árak emelkednek.","lab":"CAUSE & EFFECT"},{"k":"h","t":"5.3.2.1 A step-by-step example","hu":"5.3.2.1 Lépésről lépésre bemutatott példa"},{"k":"p","t":"Imagine a bakery that spends $1 to produce a loaf of bread and sells it for $2. Everything is stable until the cost of wheat suddenly doubles. Now, it costs $1.50 to make the same loaf. To cover this increase and still earn a profit, the bakery raises the selling price to $2.50. Nothing has changed about consumer demand, and people are not suddenly eating more bread. Instead, the rise in costs forces the bakery to charge more.","hu":"Képzeljünk el egy pékséget, amely 1 dollárból állít elő egy kenyeret, és 2 dollárért adja el. Minden stabil, amíg a búza ára hirtelen meg nem duplázódik. Ekkor már 1,50 dollárba kerül ugyanaz a kenyér. Hogy fedezze a drágulást, és nyereséges maradjon, a pékség 2,50 dollárra emeli az eladási árat. A fogyasztói keresletben semmi nem változott: az emberek nem esznek hirtelen több kenyeret. A költségek emelkedése kényszeríti a pékséget magasabb árra."},{"k":"h","t":"5.3.2.2 Real-world examples","hu":"5.3.2.2 Valós példák"},{"k":"p","t":"• 1970s oil crisis: Political conflicts in the Middle East caused oil prices to quadruple. As oil was essential for transport, energy, and manufacturing, the increase made nearly everything more expensive. This led to stagflation (a mix of high inflation, high unemployment, and weak growth). • 2022 energy crisis: Following the war in Ukraine, gas and electricity prices surged across Europe and beyond. Transport, heating, and manufacturing costs all rose sharply, leading to higher prices for consumers around the world.","hu":"• Az 1970-es évek olajválsága: a közel-keleti politikai konfliktusok négyszeresére emelték az olajárakat. Mivel az olaj nélkülözhetetlen volt a közlekedésben, az energiaellátásban és a gyártásban, a drágulás szinte mindent megdrágított. Ez stagflációhoz vezetett (magas infláció, magas munkanélküliség és gyenge növekedés együttese). • A 2022-es energiaválság: az ukrajnai háború után a gáz és az áram ára megugrott Európában és azon túl is. A közlekedési, fűtési és gyártási költségek meredeken emelkedtek, ami világszerte magasabb fogyasztói árakat hozott."},{"k":"h","t":"5.3.2.3 Why cost-push inflation matters","hu":"5.3.2.3 Miért fontos a költséginfláció?"},{"k":"p","t":"Cost-push inflation is more difficult to control than demand-pull inflation. Central banks can raise interest rates to reduce demand when inflation is driven by consumer spending, but higher interest rates do little to solve problems like expensive oil or raw materials. For this reason, governments often need to step in with different measures, such as subsidizing energy costs, negotiating wage agreements, or investing in alternative energy sources.","hu":"A költséginflációt nehezebb kezelni, mint a keresletit. A központi bankok kamatemeléssel csökkenthetik a keresletet, ha az inflációt a fogyasztói költés hajtja, a magasabb kamat azonban keveset segít olyan gondokon, mint a drága olaj vagy alapanyag. Ezért a kormányoknak gyakran más eszközökkel kell beavatkozniuk: például az energiaköltségek támogatásával, bérmegállapodásokkal vagy alternatív energiaforrásokba való beruházással."},{"k":"h","t":"5.4 Greedflation","hu":"5.4 Mohóságinfláció (greedflation)"},{"k":"p","t":"Greedflation, sometimes also referred to as profit-driven inflation, describes inflation that is partly driven by companies increasing prices more than necessary to cover their rising costs. In other words, instead of raising prices only to offset higher wages, raw material costs, or energy prices, firms raise them even higher in order to increase their profit margins. The idea behind greedflation is that businesses may use an environment of general inflation (when prices are already rising across the economy) as an opportunity to push prices up even further because consumers are expecting price increases anyway.","hu":"A mohóságinfláció – amelyet olykor profitvezérelt inflációnak is neveznek – olyan inflációt jelent, amelyet részben az hajt, hogy a cégek a növekvő költségeik fedezéséhez szükségesnél jobban emelnek árat. Más szóval nem csak annyival emelnek, amennyi a magasabb béreket, alapanyagárakat vagy energiaköltségeket ellensúlyozza, hanem többel, hogy növeljék a haszonkulcsukat. A jelenség mögötti gondolat az, hogy a vállalkozások az általános inflációs környezetet (amikor az árak amúgy is emelkednek a gazdaságban) alkalomként használhatják további áremelésre, hiszen a fogyasztók úgyis áremelkedésre számítanak."},{"k":"c","t":"Greedflation (profit-driven inflation) describes inflation partly driven by companies increasing prices more than necessary to cover rising costs.","hu":"A mohóságinfláció (profitvezérelt infláció) olyan inflációt jelent, amelyet részben az hajt, hogy a cégek a növekvő költségek fedezéséhez szükségesnél jobban emelnek árat.","lab":"DEFINITION"},{"k":"h","t":"5.4.1 How does greedflation work?","hu":"5.4.1 Hogyan működik a mohóságinfláció?"},{"k":"p","t":"Greedflation usually begins with a shock that increases production costs. This could be something like a sudden rise in oil prices, a disruption in global supply chains, or a shortage of raw materials. In such cases, it is perfectly normal for companies to raise their prices in order to cover th ese higher expenses. However, greedflation goes a step further. Instead of raising prices only as much as necessary, some firms increase them beyond what their costs justify. Even when costs later return to normal, these companies often keep prices high, arguing that inflation is still widespread. The result is that businesses make much larger profits, while consumers are left paying far more than before. In this way, greedflation turns a temporary cost shock into a longer-lasting wave of price increases, worsening the overall inflation rate.","hu":"A mohóságinfláció rendszerint egy olyan sokkal kezdődik, amely megnöveli a termelési költségeket. Ilyen lehet az olajárak hirtelen emelkedése, a globális ellátási láncok fennakadása vagy az alapanyaghiány. Ilyenkor teljesen természetes, hogy a cégek árat emelnek a magasabb kiadások fedezésére. A mohóságinfláció azonban egy lépéssel tovább megy. Egyes cégek nem csak a szükséges mértékben emelnek, hanem a költségeik által indokoltnál jobban. Sőt, amikor a költségek később visszatérnek a normális szintre, ezek a cégek gyakran magasan tartják az árakat arra hivatkozva, hogy az infláció még mindig általános. Az eredmény, hogy a vállalkozások sokkal nagyobb nyereséget érnek el, a fogyasztók pedig sokkal többet fizetnek, mint korábban. A mohóságinfláció így egy átmeneti költségsokkot tartósabb áremelkedési hullámmá alakít, rontva az általános inflációs rátát."},{"k":"h","t":"5.4.2 A step-by-step example","hu":"5.4.2 Lépésről lépésre bemutatott példa"},{"k":"p","t":"Consider a bakery. At first, it costs $1.00 to make a loaf of bread, and the bakery sells it for $2.00. When wheat prices suddenly rise, the cost of production increases to $1.20. The bakery reacts by raising the price of bread to $2.50, which is understandable as it needs to cover costs and keep its business running. Later, however, wheat prices return to normal and it once again costs only $1.00 to produce a loaf. Instead of lowering the price back toward $2.00, the bakery keeps the bread at $2.50 or perhaps raises it even higher. Consumers are now paying much more than before, even though the bakery's costs have fallen. The bakery enjoys record profits, while households face a heavier burden every time they shop.","hu":"Nézzünk egy pékséget. Kezdetben 1,00 dollárba kerül egy kenyér előállítása, és 2,00 dollárért adják. Amikor a búza ára hirtelen emelkedik, a termelési költség 1,20 dollárra nő. A pékség erre 2,50 dollárra emeli a kenyér árát, ami érthető, hiszen fedeznie kell a költségeit, és működnie kell tovább. Később azonban a búza ára visszatér a normális szintre, és újra csak 1,00 dollárba kerül egy kenyér előállítása. A pékség ahelyett, hogy 2,00 dollár felé csökkentené az árat, 2,50 dolláron tartja, vagy akár tovább emeli. A fogyasztók így sokkal többet fizetnek, mint korábban, pedig a pékség költségei csökkentek. A pékség rekordnyereséget könyvel el, a háztartások pedig minden vásárlásnál nagyobb terhet viselnek."},{"k":"h","t":"5.4.3 Real-world debates about greedflation","hu":"5.4.3 Valós viták a mohóságinflációról"},{"k":"p","t":"Economists and policymakers debate whether greedflation is a real phenomenon or simply a convenient explanation for rising prices. The debate became especially heated during the COVID-19 recovery between 2021 and 2023, when many countries experienced unusually high inflation. At the same time, some of the world's largest corporations particularly in the energy, food, and retail sectors announced record-breaking profits. This overlap led some analysts and politicians to argue that companies were taking advantage of the situation, using the general atmosphere of inflation as a cover to raise prices more than necessary. Evidence also came from central banks themselves. Bot h in the United States and Europe, policymakers noticed that a significant portion of inflation during 2022 was not explained by rising wages or shortages, but by higher profit margins. For example, the European Central Bank pointed out that many firms were increasing prices well beyond their actual costs, which suggested that profit-taking played a larger role in inflation than usual.","hu":"A közgazdászok és a döntéshozók vitatkoznak arról, hogy a mohóságinfláció valós jelenség-e, vagy csak kényelmes magyarázat az áremelkedésre. A vita különösen élessé vált a COVID-19 utáni fellendülés idején, 2021 és 2023 között, amikor sok országban szokatlanul magas volt az infláció. Ugyanekkor a világ legnagyobb vállalatai közül többen – főként az energia-, az élelmiszer- és a kiskereskedelmi szektorban – rekordnyereségről számoltak be. Ez az egybeesés arra késztetett egyes elemzőket és politikusokat, hogy azzal érveljenek: a cégek kihasználták a helyzetet, és az általános inflációs hangulatot fedezékként használva a szükségesnél jobban emeltek árat. Bizonyíték maguktól a központi bankoktól is érkezett. Az Egyesült Államokban és Európában is azt vették észre a döntéshozók, hogy a 2022-es infláció jelentős részét nem a béremelkedés vagy a hiány magyarázta, hanem a magasabb haszonkulcsok. Az Európai Központi Bank például rámutatott, hogy sok cég a tényleges költségeit jóval meghaladó mértékben emelt árat, ami arra utalt, hogy a haszonszerzés a szokásosnál nagyobb szerepet játszott az inflációban."},{"k":"h","t":"5.4.4 Why is greedflation controversial?","hu":"5.4.4 Miért vitatott a mohóságinfláció?"},{"k":"p","t":"Despite these observations, greedflation remains highly controversial. Supporters of the concept believe it explains why inflation stayed high even after some of the original causes such as supply chain disruptions or spikes in raw material costs had already improved. According to this view, companies kept prices elevated simply because they could, sustaining inflation long after the shocks had faded. Critics, however, argue that blaming inflation on \"greed\" is too simplistic. They stress that inflation is almost always the result of multiple factors working together such as energy crises, geopolitical conflicts, shortages, and strong consumer demand. From this perspective, higher profits are only one piece of a much larger puzzle. Some economists even avoid the word \"greedflation\" altogether. Instead, they use the more neutral term \"profit-driven inflation\", which highlights the role of rising corporate profits without implying that it is purely a question of morality or bad behaviour.","hu":"E megfigyelések ellenére a mohóságinfláció erősen vitatott fogalom. Hívei szerint azt magyarázza meg, miért maradt magas az infláció akkor is, amikor az eredeti okok egy része – például az ellátásilánc-fennakadás vagy az alapanyagárak megugrása – már javult. E nézet szerint a cégek pusztán azért tartották magasan az árakat, mert megtehették, így a sokkok elmúlta után is fenntartották az inflációt. A kritikusok viszont azzal érvelnek, hogy az inflációt a „mohóságra” fogni túlzott leegyszerűsítés. Hangsúlyozzák, hogy az infláció szinte mindig több tényező együttes eredménye: energiaválságoké, geopolitikai konfliktusoké, hiányoké és erős fogyasztói keresleté. Ebből a nézőpontból a magasabb nyereség csak egy darabja egy sokkal nagyobb kirakósnak. Egyes közgazdászok egyenesen kerülik a „mohóságinfláció” szót, és helyette a semlegesebb „profitvezérelt infláció” kifejezést használják, amely kiemeli a növekvő vállalati nyereség szerepét anélkül, hogy pusztán erkölcsi kérdéssé vagy rossz szándékká tenné."},{"k":"h","t":"5.4.5 Why it matters","hu":"5.4.5 Miért fontos ez?"},{"k":"p","t":"The debate over greedflation raises important questions about fairness in the economy. Should companies be allowed to raise prices as much as they want, even if it places a heavy burden on consumers? Or should governments step in during crises to regulate prices, impose special windfall taxes on excessive profits, or limit corporate behaviour in certain industries? It also creates challenges for central banks. Traditional tools such as raising interest rates are designed to reduce inflation caused by high demand, but they may be less effective if inflation is being driven by profit margins instead. Policymakers are left to consider whether new approaches are needed when corporate behaviour itself is contributing to price rises.","hu":"A mohóságinflációról szóló vita fontos kérdéseket vet fel a gazdaság méltányosságáról. Emelhetnek-e a cégek annyi árat, amennyit csak akarnak, még ha az súlyos terhet ró is a fogyasztókra? Vagy a kormányoknak válság idején be kell avatkozniuk: szabályozni az árakat, különadót kivetni a túlzott nyereségre, vagy korlátozni a vállalati magatartást bizonyos ágazatokban? Ez a központi bankok számára is kihívást jelent. A hagyományos eszközök, például a kamatemelés, a magas kereslet okozta infláció csökkentésére valók, de kevésbé hatékonyak, ha az inflációt a haszonkulcsok hajtják. A döntéshozóknak mérlegelniük kell, hogy új megközelítésekre van-e szükség, amikor maga a vállalati magatartás járul hozzá az áremelkedéshez."},{"k":"h","t":"5.5 Hyperinflation: Extreme cases of inflation","hu":"5.5 Hiperinfláció: az infláció szélsőséges esetei"},{"k":"p","t":"Hyperinflation is the most extreme and destructive form of inflation. It occurs when prices rise at such an incredible speed that money loses almost all of its value within a very short period of time. In most stable economies, normal inflation is modest, usually between 2 and 5 percent per year. Hyperinflation, by contrast, can mean monthly inflation rates of 50 percent or even higher. In such conditions, daily life becomes chaotic. A cup of coffee might cost one unit of currency in the morning but two units by the afternoon. Workers often demand to be paid every day, or even several times a day, because their wages lose value within hours. Ordinary people quickly lose confidence in the national currency and may abandon it altogether, turning instead to stronger foreign currencies or even to simple barter, trading goods directly for other goods.","hu":"A hiperinfláció az infláció legszélsőségesebb és legpusztítóbb formája. Akkor következik be, amikor az árak olyan hihetetlen sebességgel emelkednek, hogy a pénz nagyon rövid idő alatt szinte teljesen elveszíti az értékét. A stabil gazdaságokban a normális infláció mérsékelt, általában évi 2–5 százalék. A hiperinfláció ezzel szemben havi 50 százalékos vagy annál is magasabb inflációt jelenthet. Ilyen körülmények között a mindennapi élet kaotikussá válik. Egy csésze kávé reggel egy pénzegységbe kerülhet, délutánra viszont kettőbe. A dolgozók gyakran napi, sőt naponta többszöri bérfizetést kérnek, mert a bérük órák alatt veszít az értékéből. Az emberek gyorsan elvesztik a bizalmukat a nemzeti valutában, és akár teljesen el is fordulnak tőle: erősebb külföldi valutákhoz vagy egyszerű cserekereskedelemhez folyamodnak, közvetlenül árut cserélve áruért."},{"k":"c","t":"Hyperinflation is the most extreme and destructive form of inflation, with prices rising so quickly that money loses almost all of its value.","hu":"A hiperinfláció az infláció legszélsőségesebb és legpusztítóbb formája: az árak olyan gyorsan emelkednek, hogy a pénz szinte minden értékét elveszíti.","lab":"DEFINITION"},{"k":"h","t":"5.5.1 Causes of hyperinflation","hu":"5.5.1 A hiperinfláció okai"},{"k":"p","t":"Hyperinflation almost always emerges during periods of deep crisis. It does not happen in normal times but is usually triggered by a combination of political instability, economic mismanagement, and external shocks. One of the most common causes is excessive money printing. Governments that face large debts or war expenses sometimes resort to printing enormous amounts of money to cover their costs. This floods the economy with cash that quickly becomes worthless. Another cause is the collapse of trust in the currency. Once people believe that money will not hold its value, they rush to spend it before it loses even more purchasing power. This panic spending accelerates price increases and sets off a vicious cycle. A third factor is weak production. Wars, political instability, or natural disasters can destroy factories, farmland, and infrastructure. With fewer goods available, even basic necessities become scarce, which pushes prices upward. Finally, foreign debt and reparations can also drive hyperinflation. In some historical cases, countries printed massive amounts of money in order to pay off debts owed abroad. While this may provide temporary relief, it undermines confidence in the currency at home and abroad, often leading to runaway inflation.","hu":"A hiperinfláció szinte mindig mély válság idején jelenik meg. Nem normális időkben fordul elő: rendszerint politikai instabilitás, gazdasági hibás kormányzás és külső sokkok együttese váltja ki. Az egyik leggyakoribb ok a túlzott pénznyomtatás. A nagy adósságokkal vagy háborús kiadásokkal szembesülő kormányok néha hatalmas mennyiségű pénzt nyomtatnak a költségeik fedezésére. Ez elárasztja a gazdaságot olyan készpénzzel, amely gyorsan értéktelenné válik. Egy másik ok a valutába vetett bizalom összeomlása. Ha az emberek egyszer elhiszik, hogy a pénz nem tartja meg az értékét, sietnek elkölteni, mielőtt még többet veszítene a vásárlóerejéből. Ez a pánikszerű költekezés felgyorsítja az áremelkedést, és ördögi kört indít el. A harmadik tényező a gyenge termelés. A háború, a politikai instabilitás vagy a természeti katasztrófa gyárakat, termőföldeket és infrastruktúrát pusztíthat el. Kevesebb áru mellett még az alapvető szükségleti cikkek is szűkössé válnak, ami felfelé nyomja az árakat. Végül a külföldi adósság és a jóvátétel is hiperinflációhoz vezethet. Néhány történelmi esetben az országok azért nyomtattak óriási mennyiségű pénzt, hogy a külföldi tartozásaikat kifizessék. Ez ideiglenes enyhülést hozhat, de aláássa a valutába vetett bizalmat itthon és külföldön egyaránt, és gyakran elszabaduló inflációhoz vezet."},{"k":"c","t":"Common causes discussed here: excessive money printing, collapse of trust in the currency, weak production, and foreign debt or reparations.","hu":"Az itt tárgyalt leggyakoribb okok: túlzott pénznyomtatás, a valutába vetett bizalom összeomlása, gyenge termelés, valamint külföldi adósság vagy jóvátétel.","lab":"AT A GLANCE"},{"k":"h","t":"5.5.2. Examples of hyperinflation","hu":"5.5.2 Példák a hiperinflációra"},{"k":"p","t":"Ecuador (2000) Ecuador faced a different, but still severe, monetary crisis during the 1990s. Years of high inflation and financial instability eroded confidence in the national currency, the sucre. By the year 2000, the sucre had lost so much of its value that the government made a dramatic decision: it officially abandoned the currency and replaced it with the US dollar. This process, known as dollarization, brought more stability to Ecuador's economy because the government could no longer print money at will. Inflation fell, and financial markets regained some confidence. However, the move also came with a major drawback. By giving up its national currency, Ecuador lost control over its own monetary policy. It could no longer set its own interest rates or adjust money supply in response to local conditions, becoming dependent on US monetary policy instead.","hu":"Ecuador (2000) – Ecuador más jellegű, de szintén súlyos monetáris válsággal nézett szembe az 1990-es években. Az évekig tartó magas infláció és pénzügyi instabilitás aláásta a bizalmat a nemzeti valutában, a sucre-ben. 2000-re a sucre annyit veszített az értékéből, hogy a kormány drámai döntést hozott: hivatalosan feladta a valutáját, és az amerikai dollárral váltotta fel. Ez a dollarizációnak nevezett folyamat több stabilitást hozott Ecuador gazdaságába, mert a kormány már nem nyomtathatott kedve szerint pénzt. Az infláció csökkent, és a pénzpiacok visszanyerték némi bizalmukat. A lépésnek azonban komoly hátulütője is volt. A nemzeti valuta feladásával Ecuador elvesztette az irányítást a saját monetáris politikája felett. Nem határozhatta meg többé a saját kamatait, és nem igazíthatta a pénzmennyiséget a helyi viszonyokhoz: az amerikai monetáris politikától vált függővé."},{"k":"p","t":"Zimbabwe (2008) Zimbabwe experienced one of the worst modern examples of hyperinflation. By November 2008, prices were rising so quickly that inflation reached an unimaginable 79.6 billion percent (7.96 × 10¹⁰%). To cope with this, the government printed banknotes of absurd denominations, including the now infamous 100 trillion Zimbabwean dollar note. Everyday life became chaotic. People needed entire bags of cash just to buy basic goods such as bread. Shops often stopped accepting the local currency because its value fell too quickly, sometimes within the same day. As a result, many citizens turned to barter, exchanging goods directly, or relied on stronger foreign currencies such as the US dollar or the South African rand. This collapse of the national currency created immense hardship and serves as one of the clearest warnings of the destructive power of hyperinflation.","hu":"Zimbabwe (2008) – Zimbabwe a modern kori hiperinfláció egyik legsúlyosabb példáját élte át. 2008 novemberére az árak olyan gyorsan emelkedtek, hogy az infláció elképzelhetetlen, 79,6 milliárd százalékos (7,96 × 10¹⁰%) szintet ért el. A kormány abszurd címletű bankjegyeket nyomtatott, köztük a hírhedt 100 billió zimbabwei dolláros bankjegyet. A mindennapi élet kaotikussá vált. Az embereknek egész zsáknyi készpénz kellett olyan alapvető dolgokhoz, mint a kenyér. A boltok gyakran már nem fogadták el a helyi valutát, mert az túl gyorsan – néha egyetlen napon belül – vesztett az értékéből. Emiatt sok polgár a cserekereskedelemhez fordult, közvetlenül árut cserélve, vagy erősebb külföldi valutákat használt, például az amerikai dollárt vagy a dél-afrikai randot. A nemzeti valuta összeomlása óriási nehézséget okozott, és a hiperinfláció pusztító erejének egyik legvilágosabb figyelmeztetése."},{"k":"p","t":"Hungary (1945–1946): The worst hyperinflation in history Hungary's experience after the Second World War is still regarded as the most extreme case of hyperinflation ever recorded. The war had devastated the country. Its economy, infrastructure, and farmland lay in ruins, and on top of this destruction, Hungary was required to pay huge war reparations to the Soviet Union. In an effort to cover its expenses, the government printed vast amounts of money, which quickly led to the complete collapse of the national currency, the pengő. The scale of this collapse was astonishing. In 1944, the highest-value banknote in circulation was just 1,000 pengő. By the end of 1945, the largest note had already reached 10 million pengő. Within only a few more months, by mid-1946, Hungary was issuing a note worth 100 quintillion pengő (10²⁰ pengő). Everyday life became almost impossible to manage. Prices doubled roughly every 15 hours, meaning that a meal could cost more at lunchtime than it had at breakfast. Workers demanded to be paid multiple times a day because their wages lost value so quickly. Shops often closed early, not because they had no goods, but because it was impossible to keep up with the constant need to change prices. In a final attempt to restore some stability, the government introduced a new note on 11 July 1946, the 100 million b.-pengő (billió pengő, equal to 10¹⁸ pengő). Yet even this extraordinary denomination became worthless within weeks. The only real solution was to abandon the pengő altogether. On 1 August 1946, Hungary introduced a new currency, the forint (HUF), which remains in use today. The conversion rate was staggering: 1 forint = 400 quadrillion pengő (4 × 10¹⁶). This episode remains the worst case of hyperinflation in human history, even more severe than Zimbabwe in 2008 or Germany's Weimar Republic in the 1920s. It stands as a dramatic reminder of how quickly a currency can collapse when confidence is lost and governments resort to uncontrolled money printing.","hu":"Magyarország (1945–1946): a történelem legsúlyosabb hiperinflációja – Magyarország második világháború utáni tapasztalatát máig a valaha feljegyzett legszélsőségesebb hiperinflációnak tartják. A háború feldúlta az országot: a gazdaság, az infrastruktúra és a termőföld romokban hevert, ráadásul Magyarországnak hatalmas háborús jóvátételt kellett fizetnie a Szovjetuniónak. A kiadásai fedezésére a kormány óriási mennyiségű pénzt nyomtatott, ami gyorsan a nemzeti valuta, a pengő teljes összeomlásához vezetett. Az összeomlás mértéke döbbenetes volt. 1944-ben a forgalomban lévő legnagyobb címlet mindössze 1000 pengő volt. 1945 végére a legnagyobb bankjegy már elérte a 10 milliót. Alig néhány hónappal később, 1946 közepén Magyarország már 100 trillió pengős (10²⁰ pengő) címletet bocsátott ki. A mindennapi életet szinte lehetetlen volt kezelni. Az árak nagyjából 15 óránként megkétszereződtek, vagyis egy ebéd többe kerülhetett, mint ugyanaznap reggel a reggeli. A dolgozók naponta többszöri bérfizetést kértek, mert a bérük olyan gyorsan veszített az értékéből. A boltok gyakran korán bezártak, nem azért, mert nem volt áru, hanem mert lehetetlen volt lépést tartani az árak folyamatos átírásával. A stabilitás helyreállításának utolsó kísérleteként a kormány 1946. július 11-én új bankjegyet vezetett be: a 100 millió b.-pengőt (billió pengő, azaz 10¹⁸ pengő). Még ez a rendkívüli címlet is hetek alatt értéktelenné vált. Az egyetlen valódi megoldás a pengő teljes feladása volt. 1946. augusztus 1-jén Magyarország új valutát vezetett be, a forintot (HUF), amely ma is használatban van. Az átváltási arány elképesztő volt: 1 forint = 400 kvadrillió pengő (4 × 10¹⁶). Ez az epizód máig az emberiség történetének legsúlyosabb hiperinflációja, még a 2008-as zimbabwei vagy az 1920-as évekbeli weimari németországi esetnél is szélsőségesebb. Drámai emlékeztető arra, milyen gyorsan összeomolhat egy valuta, ha elvész a bizalom, és a kormány ellenőrizetlen pénznyomtatáshoz folyamodik."},{"k":"c","t":"Ecuador (2000): dollarization followed a severe monetary crisis. Zimbabwe (2008): one of the worst modern hyperinflations. Hungary (1945–1946): the most extreme hyperinflation ever recorded.","hu":"Ecuador (2000): súlyos monetáris válság után dollarizáció. Zimbabwe (2008): a modern kor egyik legsúlyosabb hiperinflációja. Magyarország (1945–1946): a valaha feljegyzett legszélsőségesebb hiperinfláció.","lab":"REAL-WORLD EXAMPLES"},{"k":"h","t":"5.5.3 Consequences of hyperinflation","hu":"5.5.3 A hiperinfláció következményei"},{"k":"p","t":"Hyperinflation does not just destroy the value of money. It also undermines the entire social and economic fabric of a country. The most immediate consequence is that savings vanish. People who have worked for years to build up a financial cushion suddenly find their life savings reduced to nothing. Money that could once buy a house may no longer be enough to purchase even a loaf of bread. As the value of money collapses, normal trade breaks down. Businesses cannot operate effectively when prices change from hour to hour. Shops often close their doors simply because it is impossible to update price lists quickly enough. For ordinary citizens, even planning a trip to the market becomes stressful, since the cost of basic goods may rise between the time they leave home and the time they arrive at the store. This chaos also erodes trust in government and institutions. When people see that their leaders are unable to control inflation, confidence in both the political system and the national currency collapses. Social unrest, protests, and even political upheaval often follow.","hu":"A hiperinfláció nem csupán a pénz értékét rombolja le, hanem egy ország egész társadalmi és gazdasági szövetét aláássa. A legközvetlenebb következmény, hogy eltűnnek a megtakarítások. Akik éveken át dolgoztak, hogy tartalékot képezzenek, hirtelen azt látják, hogy egy élet megtakarítása semmivé vált. Az a pénz, amiből egykor házat lehetett volna venni, már egy kenyérre sem elég. Ahogy a pénz értéke összeomlik, a normális kereskedelem is megbénul. A vállalkozások nem tudnak hatékonyan működni, ha az árak óránként változnak. A boltok gyakran bezárnak, egyszerűen azért, mert lehetetlen elég gyorsan frissíteni az árlistákat. A hétköznapi embereknek még a piacra indulás is stresszes, mert az alapvető javak ára emelkedhet, amíg otthonról a boltig érnek. Ez a káosz az államba és az intézményekbe vetett bizalmat is szétrombolja. Amikor az emberek azt látják, hogy a vezetőik képtelenek kezelni az inflációt, a politikai rendszerbe és a nemzeti valutába vetett bizalom is összeomlik. Gyakran társadalmi elégedetlenség, tüntetések, sőt politikai felfordulás követi."},{"k":"p","t":"In such desperate conditions, people search for alternatives. Barter systems reappear, with goods exchanged directly for other goods, such as bread traded for clothes or fuel. Many citizens also turn to stronger foreign currencies, like the US dollar or the euro, which provide stability when the local currency can no longer function as money.","hu":"Ilyen kétségbeejtő helyzetben az emberek alternatívákat keresnek. Újra megjelenik a cserekereskedelem: árut cserélnek közvetlenül árura, például kenyeret ruhára vagy üzemanyagra. Sokan erősebb külföldi valutákhoz, például az amerikai dollárhoz vagy az euróhoz fordulnak, amelyek stabilitást adnak akkor, amikor a helyi valuta már nem tud pénzként működni."},{"k":"h","t":"5.6 Deflation: The opposite of inflation","hu":"5.6 Defláció: az infláció ellentéte"},{"k":"p","t":"Deflation is the opposite of inflation. It refers to a general decline in the overall level of prices across an economy over time. Put simply, money gains value: each coin or note can buy more goods and services than before. At first, this may sound like a positive development. After all, who would not want cheaper food, electronics, or housing? But in reality, prolonged deflation can be very damaging. When prices fall steadily, people and businesses often delay spending and investment, waiting for even lower prices in the future. This reduces demand, slows economic growth, and often increases unemployment.","hu":"A defláció az infláció ellentéte. Az árszínvonal általános, időbeli csökkenését jelenti a gazdaságban. Egyszerűen szólva a pénz értéke nő: ugyanazzal az érmével vagy bankjeggyel több terméket és szolgáltatást lehet venni, mint korábban. Ez első hallásra jó fejleménynek tűnhet. Ki ne akarna olcsóbb élelmiszert, elektronikát vagy lakhatást? A valóságban azonban a tartós defláció nagyon káros lehet. Amikor az árak folyamatosan esnek, az emberek és a cégek gyakran elhalasztják a költést és a beruházást, mert még alacsonyabb árakra várnak. Ez csökkenti a keresletet, lassítja a gazdasági növekedést, és gyakran növeli a munkanélküliséget."},{"k":"c","t":"Inflation: a general rise in prices; purchasing power falls. Deflation: a general fall in prices; money gains value, but prolonged deflation can weaken demand and growth.","hu":"Infláció: az árak általános emelkedése, a vásárlóerő csökken. Defláció: az árak általános csökkenése, a pénz értéke nő, de a tartós defláció gyengítheti a keresletet és a növekedést.","lab":"KEY DISTINCTION"},{"k":"h","t":"5.6.1 How deflation works","hu":"5.6.1 Hogyan működik a defláció?"},{"k":"p","t":"Imagine you are planning to buy a new laptop. Today it costs $1,000, but you believe that in six months the same model will fall to $900. Rather than buying now, you decide to wait. If thousands of other consumers behave the same way, sales collapse. For businesses, falling sales mean they cannot sell enough products. In response, they cut production, reduce wages, or even lay off workers. As more people lose income, demand falls further, which causes prices to dr op even more. This creates a deflationary spiral, like a snowball rolling downhill, gathering destructive momentum: falling prices lead to falling demand, which leads to job losses, which lead to even weaker demand, and so on. Escaping such a spiral is one of the most difficult challenges for policymake rs.","hu":"Képzeljük el, hogy új laptopot tervezünk venni. Ma 1000 dollárba kerül, de azt gondoljuk, hogy fél év múlva ugyanez a modell 900 dollárra esik. Ahelyett, hogy most vennénk meg, várunk. Ha több ezer másik fogyasztó is így tesz, összeomlanak az eladások. A cégek számára a visszaeső eladás azt jelenti, hogy nem tudnak elég terméket értékesíteni. Válaszul visszafogják a termelést, csökkentik a béreket, vagy elbocsátanak. Ahogy egyre többen veszítenek jövedelmet, a kereslet tovább esik, ami még jobban lenyomja az árakat. Így alakul ki a deflációs spirál, mint egy lejtőn guruló hógolyó, amely pusztító lendületet gyűjt: az eső árak csökkenő keresletet hoznak, ez munkahelyek elvesztését, az pedig még gyengébb keresletet, és így tovább. Az ilyen spirálból való kilábalás a döntéshozók egyik legnehezebb feladata."},{"k":"c","t":"Falling prices → consumers delay purchases → sales fall → firms cut production/wages/jobs → demand weakens further → prices fall again.","hu":"Esnek az árak → a fogyasztók elhalasztják a vásárlást → csökkennek az eladások → a cégek visszafogják a termelést, a béreket és a létszámot → tovább gyengül a kereslet → az árak újra esnek.","lab":"PROCESS"},{"k":"h","t":"5.6.2 Causes of deflation","hu":"5.6.2 A defláció okai"},{"k":"p","t":"Deflation usually appears during periods of economic weakness, but it can also be linked to longer - term structural changes in the economy. Economists generally identify four main causes. The first is falling demand, often called demand-side deflation. When economies enter a recession or depression, consumer confidence collapses. People become cautious, choosing to save rather than spend, while businesses cut back on investment. With fewer buyers in the market, compa nies must reduce prices to attract customers, and this widespread fall in demand pulls overall prices downward. The second cause is overproduction, sometimes referred to as supply-side deflation. If businesses produce more goods than consumers are willing or able to buy, they are forced to cut prices in order to clear excess stock. This problem is especially common in industries where capacity can expand quickly, such as manufacturing, leading to supply running far ahead of demand. A third cause is linked to debt and financial crises. When households or companies are under financial pressure, they often prioritise paying off debts instead of spending or investing. This reduction in demand causes sales to fall, discourages new investment, and pushes prices lower. In severe cases, a cyc le of debt repayment and falling demand can deepen a downturn. Finally, deflation can also result from technological progress. In many industries, innovation reduces costs and makes production more efficient. For example, the cost of computers and consumer electronics has steadily fallen for decades, even as the technology has become more powerful. This kind of price decline is generally healthy, because it reflects improvements in productivity. However, if such efficiency gains spread across the entire economy, they can contribute to broad-based deflationary pressures.","hu":"A defláció rendszerint gazdasági gyengeség idején jelenik meg, de hosszabb távú szerkezeti változásokhoz is kapcsolódhat. A közgazdászok általában négy fő okot azonosítanak. Az első a csökkenő kereslet, amelyet keresleti oldali deflációnak is neveznek. Amikor a gazdaság recesszióba vagy depresszióba kerül, összeomlik a fogyasztói bizalom. Az emberek óvatossá válnak, és inkább megtakarítanak, mint költenek, a cégek pedig visszafogják a beruházást. Kevesebb vevővel a piacon a cégeknek árat kell csökkenteniük, hogy vásárlókat vonzzanak, és ez a széles körű keresletcsökkenés lefelé húzza az árszínvonalat. A második ok a túltermelés, amelyet olykor kínálati oldali deflációnak hívnak. Ha a cégek több árut állítanak elő, mint amennyit a fogyasztók meg akarnak vagy meg tudnak venni, kénytelenek árat csökkenteni, hogy kiürítsék a felesleges készletet. Ez a gond különösen gyakori azokban az iparágakban, ahol a kapacitás gyorsan bővíthető, például a feldolgozóiparban, így a kínálat messze a kereslet elé szalad. A harmadik ok az eladósodáshoz és a pénzügyi válságokhoz kötődik. Amikor a háztartások vagy a cégek pénzügyi nyomás alatt állnak, gyakran a tartozások törlesztését helyezik előtérbe a költés vagy a beruházás helyett. Ez a keresletcsökkenés visszaveti az eladásokat, elriasztja az új beruházásokat, és lefelé nyomja az árakat. Súlyos esetben az adósságtörlesztés és a csökkenő kereslet köre elmélyítheti a visszaesést. Végül a defláció a technológiai haladásból is fakadhat. Sok iparágban az innováció csökkenti a költségeket, és hatékonyabbá teszi a termelést. A számítógépek és a szórakoztató elektronika ára például évtizedek óta folyamatosan csökken, miközben a technológia egyre erősebb. Az ilyen árcsökkenés általában egészséges, mert a termelékenység javulását tükrözi. Ha azonban az ilyen hatékonyságnövekedés az egész gazdaságra kiterjed, széles körű deflációs nyomáshoz járulhat hozzá."},{"k":"c","t":"Four causes discussed: falling demand, overproduction, debt and financial crises, and technological progress.","hu":"Az itt tárgyalt négy ok: csökkenő kereslet, túltermelés, eladósodás és pénzügyi válságok, valamint technológiai haladás.","lab":"AT A GLANCE"},{"k":"h","t":"5.6.3 A simple example with numbers","hu":"5.6.3 Egyszerű számpélda"},{"k":"p","t":"To see how deflation works in practice, imagine a simple shopping basket that costs $100 this year. If prices fall by 2 percent next year, the same basket costs only $98. At first, this looks like good news for consumers, because their money stretches further. But for businesses, it tells a different story. They now earn less for selling the same products. If this process continues year after year, companies face shrinking revenues. To cope, they may cut wages, delay or cancel investments, and in many cases reduce their workforce. As jobs disappear and unemployment rises, consumer demand falls even further. What seemed like a small price drop at the beginning can quickly g row into a dangerous cycle of falling prices and falling incomes.","hu":"Hogy lássuk, hogyan működik a defláció a gyakorlatban, képzeljünk el egy egyszerű bevásárlókosarat, amely idén 100 dollárba kerül. Ha jövőre 2 százalékkal esnek az árak, ugyanaz a kosár már csak 98 dollár. Ez elsőre jó hír a fogyasztóknak, mert a pénzük többre elég. A cégek számára azonban más a történet: ugyanazokért a termékekért kevesebbet kapnak. Ha ez a folyamat évről évre folytatódik, a cégek bevétele zsugorodik. Emiatt béreket csökkenthetnek, beruházásokat halaszthatnak vagy mondhatnak le, és sok esetben létszámot is csökkentenek. Ahogy fogynak a munkahelyek és nő a munkanélküliség, a fogyasztói kereslet tovább esik. Ami eleinte kis árcsökkenésnek tűnt, gyorsan az eső árak és eső jövedelmek veszélyes körévé nőhet."},{"k":"h","t":"5.6.4 Real-world example: Japan's \"Lost Decades\"","hu":"5.6.4 Valós példa: Japán „elveszett évtizedei”"},{"k":"p","t":"Perhaps the best-known case of prolonged deflation is Japan's \"Lost Decades\", which began in the early 1990s. During the 1980s, Japan's economy grew rapidly, fuelled by a booming property market and soaring stock prices. But when this financial bubble burst around 1990, the economy collapsed. From that point onward, prices either fell or stayed flat for many years. Consumers began to hold back on spending, expecting that goods would be cheaper in the future. Businesses, facing weak demand and lower profits, cut investment, and banks were left struggling with large amounts of bad debt. The result was a long period of extremely slow growth and stagnation that stretched across multiple decades. Even today, Japan still battles the effects of that era. An ageing population and cautious consumer spending make it difficult to maintain steady inflation, and policymakers remain wary of falling back into deflation.","hu":"A tartós defláció talán legismertebb esete Japán „elveszett évtizedei”, amelyek az 1990-es évek elején kezdődtek. Az 1980-as években Japán gazdasága gyorsan nőtt, amit a szárnyaló ingatlanpiac és a szökkenő részvényárak hajtottak. Amikor azonban ez a pénzügyi buborék 1990 körül kipukkadt, a gazdaság összeomlott. Ettől kezdve az árak évekig estek vagy stagnáltak. A fogyasztók visszafogták a költést, mert arra számítottak, hogy a termékek a jövőben olcsóbbak lesznek. A gyenge kereslettel és alacsonyabb nyereséggel szembesülő cégek csökkentették a beruházásokat, a bankok pedig hatalmas rossz hitelállománnyal küzdöttek. Az eredmény egy rendkívül lassú növekedéssel és stagnálással jellemezhető, több évtizeden átnyúló időszak lett. Japán még ma is küzd ennek a korszaknak a hatásaival. Az elöregedő népesség és az óvatos fogyasztói költés megnehezíti a kiegyensúlyozott infláció fenntartását, a döntéshozók pedig továbbra is tartanak a deflációba való visszacsúszástól."},{"k":"h","t":"5.6.5 Why is deflation a problem?","hu":"5.6.5 Miért probléma a defláció?"},{"k":"p","t":"Deflation is harmful because it sets off a chain reaction that weakens the entire economy. It discourages spending, since people postpone purchases while waiting for lower prices. It hurts businesses, because companies earn less revenue and are often forced to cut jobs or wages. It also increases the burden of debt. If wages and prices fall but debts remain fixed, households and firms find it harder to repay loans, which increases financial stress. Ultimately, deflation creates a risk of economic stagnation. Growth slows, unemployment rises, and recovery becomes extremely difficult. For this reason, economists and central banks usually see moderate inflation as healthier than deflation, since a small rise in prices encourages spending, investment, and economic activity.","hu":"A defláció azért káros, mert láncreakciót indít el, amely az egész gazdaságot gyengíti. Visszafogja a költést, hiszen az emberek elhalasztják a vásárlást, alacsonyabb árakra várva. Árt a vállalkozásoknak, mert kevesebb bevételt szereznek, és gyakran kénytelenek munkahelyeket vagy béreket csökkenteni. Növeli az adósságterhet is: ha a bérek és az árak esnek, de a tartozások összege fix marad, a háztartásoknak és a cégeknek nehezebb törleszteniük, ami fokozza a pénzügyi feszültséget. Végső soron a defláció a gazdasági stagnálás kockázatát hordozza. A növekedés lassul, a munkanélküliség nő, a kilábalás pedig rendkívül nehézzé válik. Ezért a közgazdászok és a központi bankok általában egészségesebbnek tartják a mérsékelt inflációt a deflációnál, mert a kis mértékű áremelkedés ösztönzi a költést, a beruházást és a gazdasági aktivitást."},{"k":"h","t":"5.6.6 Deflation vs. healthy price falls","hu":"5.6.6 Defláció és egészséges árcsökkenés"},{"k":"p","t":"It is important to recognise that not every drop in prices is harmful. In fact, some falling prices are a sign of progress. When technology improves or production becomes more efficient, goods often get cheaper while their quality increases. For example, smartphones, televisions, and computers have become both more powerful and less expensive over time. These kinds of price declines are healthy because they reflect innovation, productivity growth, and better value for consumers. Deflation, however, is very different. It becomes dangerous when falling prices are broad, long-lasting, and connected to weak demand and high unemployment. In this situation, cheaper goods are not the result of efficiency or progress, but of an economy struggling to grow. Instead of signalling advancement, falling prices under deflation reflect economic weakness, reduced spending, and a cycle that can trap a country in stagnation.","hu":"Fontos felismerni, hogy nem minden árcsökkenés káros. Sőt, egyes árcsökkenések a haladás jelei. Amikor a technológia fejlődik, vagy a termelés hatékonyabb lesz, a termékek gyakran olcsóbbak lesznek úgy, hogy közben a minőségük javul. Az okostelefonok, a televíziók és a számítógépek például egyszerre lettek erősebbek és olcsóbbak az idők során. Az ilyen árcsökkenés egészséges, mert innovációt, termelékenységnövekedést és a fogyasztók számára jobb értéket tükröz. A defláció azonban egészen más. Akkor válik veszélyessé, ha az árcsökkenés széles körű, tartós, és gyenge kereslettel, valamint magas munkanélküliséggel jár együtt. Ilyenkor az olcsóbb áruk nem a hatékonyság vagy a haladás eredményei, hanem egy növekedésért küzdő gazdaságé. A defláció alatti árcsökkenés nem előrelépést jelez, hanem gazdasági gyengeséget, visszafogott költést és olyan kört, amely stagnálásba szoríthat egy országot."},{"k":"h","t":"6. Unemployment","hu":"6. Munkanélküliség"},{"k":"p","t":"Unemployment refers to the share of people in the labour force who are both willing and able to work but cannot find a job despite actively looking for one (that is, submitting job applications and attending interviews). It is usually measured as a percentage called the unemployment rate. To understand this better, it is important to know who counts as part of the labour force. The labour force includes people of working age who are physically and mentally able to work and who are either already employed or actively searching for employment. It does not include full-time students, retirees, or people who are not seeking work, such as those who have given up looking for jobs altogether. In other words, unemployment measures the gap between people who want to work and the opportunities available to them.","hu":"A munkanélküliség azoknak az arányát jelenti a munkaerőn belül, akik akarnának és tudnának is dolgozni, de aktív keresés (vagyis jelentkezések beadása és állásinterjúkon való részvétel) ellenére sem találnak munkát. Általában százalékos formában, munkanélküliségi rátaként mérik. Ahhoz, hogy ezt jobban megértsük, tudnunk kell, ki számít a munkaerő részének. A munkaerőbe azok a munkaképes korúak tartoznak, akik fizikailag és szellemileg képesek dolgozni, és vagy már dolgoznak, vagy aktívan állást keresnek. Nem tartoznak ide a nappali tagozatos diákok, a nyugdíjasok és azok, akik nem keresnek munkát, például akik már feladták a keresést. Más szóval a munkanélküliség azt a rést méri, amely a dolgozni akarók és a számukra elérhető lehetőségek között van."},{"k":"c","t":"Unemployment is the share of people in the labour force who are willing and able to work but cannot find a job despite actively looking for one.","hu":"A munkanélküliség azoknak az aránya a munkaerőn belül, akik akarnának és tudnának dolgozni, de aktív keresés ellenére sem találnak munkát.","lab":"DEFINITION"},{"k":"h","t":"6.1 Why unemployment matters","hu":"6.1 Miért fontos a munkanélküliség?"},{"k":"p","t":"Unemployment is one of the most important macroeconomic indicators because it reflects both the health of the economy and the well-being of society. When unemployment is high, it usually signals serious economic difficulties. Many people lose their jobs, household incomes fall, and consumer spending declines. Businesses then struggle to sell their products, which can lead to further job losses, creating a vicious cycle. High unemployment also often increases poverty and social tension, as people struggle to meet basic needs. By contrast, low unemployment suggests that the economy is performing well. Businesses are hiring, people have incomes to spend, and consumer demand remains strong. A healthy labour market is therefore central to both economic growth and social stability. Because of its importance, governments and central banks closely monitor unemployment. They often respond to rising unemployment with fiscal or monetary policies, such as stimulus spending, tax cuts, or reductions in interest rates, all aimed at supporting businesses and creating more job opportunities.","hu":"A munkanélküliség az egyik legfontosabb makrogazdasági mutató, mert egyszerre tükrözi a gazdaság állapotát és a társadalom jóllétét. A magas munkanélküliség rendszerint komoly gazdasági nehézségeket jelez. Sokan elveszítik a munkájukat, csökken a háztartások jövedelme, és visszaesik a fogyasztói költés. A cégeknek ezután nehezebb eladni a termékeiket, ami további elbocsátásokhoz vezethet, ördögi kört teremtve. A magas munkanélküliség gyakran növeli a szegénységet és a társadalmi feszültséget is, ahogy az emberek küzdenek az alapvető szükségleteik kielégítéséért. Ezzel szemben az alacsony munkanélküliség arra utal, hogy a gazdaság jól teljesít: a cégek felvesznek, az embereknek van jövedelmük, amit elkölthetnek, és a fogyasztói kereslet erős marad. Az egészséges munkaerőpiac ezért központi jelentőségű a gazdasági növekedés és a társadalmi stabilitás szempontjából is. Fontossága miatt a kormányok és a központi bankok szorosan figyelik a munkanélküliséget. A növekvő munkanélküliségre gyakran fiskális vagy monetáris politikával válaszolnak: élénkítő kiadásokkal, adócsökkentéssel vagy kamatcsökkentéssel, mind azzal a céllal, hogy támogassák a vállalkozásokat, és több munkalehetőséget teremtsenek."},{"k":"h","t":"6.2 Historical example: The Great Depression","hu":"6.2 Történelmi példa: a nagy gazdasági világválság"},{"k":"p","t":"One of the clearest historical examples of extreme unemployment occurred during the Great Depression of the 1930s. In the United States, the unemployment rate reached about 25 percent, leaving one in four workers without a job. Banks collapsed, businesses closed, and consumer demand fell to historic lows. This massive wave of unemployment not only deepened the economic crisis but also left lasting scars on society. Families lost homes and savings, millions endured poverty, and social unrest grew. The experience of the Great Depression had such a powerful impact that it reshaped modern economic policy. Many of today's approaches to managing recessions such as government stimulus programs and stronger banking regulations were developed to prevent such extreme unemployment from happening again.","hu":"A szélsőséges munkanélküliség egyik legvilágosabb történelmi példája az 1930-as évek nagy gazdasági világválsága idején fordult elő. Az Egyesült Államokban a munkanélküliségi ráta elérte a 25 százalékot, vagyis minden negyedik munkavállaló állás nélkül maradt. Bankok omlottak össze, cégek zártak be, és a fogyasztói kereslet történelmi mélypontra esett. Ez a hatalmas munkanélküliségi hullám nemcsak elmélyítette a gazdasági válságot, hanem maradandó nyomokat is hagyott a társadalomban. Családok veszítették el az otthonukat és a megtakarításaikat, milliók éltek szegénységben, és nőtt a társadalmi elégedetlenség. A világválság tapasztalata olyan erős hatást gyakorolt, hogy átalakította a modern gazdaságpolitikát. A recessziók kezelésének sok mai eszköze – például az állami élénkítő programok és a szigorúbb bankszabályozás – azért született meg, hogy megelőzze az ilyen szélsőséges munkanélküliség megismétlődését."},{"k":"h","t":"6.3 Types of unemployment","hu":"6.3 A munkanélküliség típusai"},{"k":"p","t":"Economists classify unemployment into several different types, depending on its causes and how long it lasts. Understanding these categories helps us see why unemployment happens and what solutions might work in each case.","hu":"A közgazdászok a munkanélküliséget több típusba sorolják aszerint, hogy mi okozza, és meddig tart. E kategóriák megértése segít látni, miért alakul ki a munkanélküliség, és melyik esetben milyen megoldás működhet."},{"k":"c","t":"Frictional: temporary movement between jobs or entry into the workforce. Cyclical: caused by economic downturns and recessions. Structural: workers' skills no longer match available jobs. Seasonal: jobs are tied to particular times of the year.","hu":"Súrlódásos: átmeneti állásváltás vagy a munkaerőpiacra való belépés. Ciklikus: gazdasági visszaesések és recessziók okozzák. Strukturális: a dolgozók képzettsége már nem illik az elérhető munkákhoz. Szezonális: az állás az év adott szakaszához kötődik.","lab":"AT A GLANCE"},{"k":"h","t":"6.3.1 Frictional unemployment","hu":"6.3.1 Súrlódásos munkanélküliség"},{"k":"p","t":"Frictional unemployment is a natural and temporary part of any healthy economy. It occurs when people are between jobs or just entering the workforce for the first time. For example, a university graduate searching for their first job is unemployed for a short while, but only because they are transitioning into the labour market. Similarly, someone who resigns from their current job in order to find a better opportunity may be unemployed for a few weeks or months before securing new work. Frictional unemployment is usually short-term, often voluntary, and it signals flexibility in the labour market, since workers are free to change jobs and seek better matches for their skills.","hu":"A súrlódásos munkanélküliség minden egészséges gazdaság természetes és átmeneti velejárója. Akkor áll elő, amikor valaki két állás között van, vagy most lép be először a munkaerőpiacra. Egy frissen végzett egyetemista például, aki az első állását keresi, rövid ideig munkanélküli, de csak azért, mert éppen belép a munkaerőpiacra. Hasonlóan az is, aki felmond a jelenlegi munkahelyén, hogy jobb lehetőséget találjon, néhány hétig vagy hónapig munka nélkül lehet, míg új állást szerez. A súrlódásos munkanélküliség általában rövid távú, gyakran önkéntes, és a munkaerőpiac rugalmasságát jelzi, hiszen a dolgozók szabadon válthatnak állást, és kereshetnek a képességeikhez jobban illő munkát."},{"k":"h","t":"6.3.2 Cyclical unemployment","hu":"6.3.2 Ciklikus munkanélküliség"},{"k":"p","t":"Cyclical unemployment is more serious because it reflects the ups and downs of the overall economy. When economies slow down or enter a recession, demand for goods and services falls. Businesses make fewer sales, and to cut costs, they lay off workers. This kind of unemployment rises during downturns and falls when economies recover. Two major recent examples are the global financial crisis of 2008, which caused mass layoffs across many industries, and the COVID-19 pandemic in 2020, when lockdowns forced millions of workers in retail, tourism, and hospitality out of their jobs. Cyclical unemployment is considered the most damaging form, because it shows that the economy as a whole is struggling.","hu":"A ciklikus munkanélküliség súlyosabb, mert a gazdaság egészének hullámzását tükrözi. Amikor a gazdaság lassul vagy recesszióba kerül, csökken a termékek és szolgáltatások iránti kereslet. A cégek kevesebbet adnak el, és a költségek csökkentése érdekében elbocsátanak. Ez a fajta munkanélküliség visszaesések idején nő, a kilábaláskor pedig csökken. Két jelentős friss példa a 2008-as globális pénzügyi válság, amely sok iparágban tömeges elbocsátásokat okozott, valamint a 2020-as COVID-19-járvány, amikor a lezárások miatt a kiskereskedelemben, a turizmusban és a vendéglátásban dolgozók milliói veszítették el az állásukat. A ciklikus munkanélküliséget tartják a legkárosabb formának, mert azt jelzi, hogy az egész gazdaság küzd."},{"k":"h","t":"6.3.3 Structural unemployment","hu":"6.3.3 Strukturális munkanélküliség"},{"k":"p","t":"Structural unemployment happens when workers' skills no longer match the jobs available. Unlike frictional unemployment, which is short-term, structural unemployment can last for years and requires workers to adapt. It often happens because of long-term economic changes, such as industries declining or technology advancing. For example, coal miners may lose their jobs as economies shift to renewable energy, or factory workers may be replaced by machines and automation. In the past, typists and telephone switchboard operators became unemployed when computers and mobile technology made their jobs obsolete. People facing structural unemployment often need retraining, new qualifications, or even relocation to find new opportunities. Because it reflects deep chan ges in the structure of the economy, this type of unemployment is particularly challenging for both workers and policymakers.","hu":"A strukturális munkanélküliség akkor alakul ki, amikor a dolgozók képzettsége már nem illik az elérhető állásokhoz. A rövid távú súrlódásos munkanélküliséggel ellentétben a strukturális évekig eltarthat, és alkalmazkodást kíván a munkavállalóktól. Gyakran hosszú távú gazdasági változások okozzák, például iparágak hanyatlása vagy a technológia fejlődése. A szénbányászok például elveszíthetik a munkájukat, ahogy a gazdaság a megújuló energiára vált át, vagy a gyári dolgozókat gépek és automatizálás válthatja ki. A múltban a gépírók és a telefonközpontosok váltak munkanélkülivé, amikor a számítógép és a mobiltechnológia elavulttá tette a munkájukat. A strukturális munkanélküliséggel szembesülőknek gyakran átképzésre, új képesítésre vagy akár költözésre van szükségük az új lehetőségekhez. Mivel
