vertisement. Effective marketing begins with understanding what people or organizations need, continues with designing an appropriate offer, and includes decisions about how that offer will be priced, distributed, communicated, and improved over time. In this sense, marketing connects a company with the people it wants to serve and helps the company build relationships that can create value for both sides.","hu":"A marketing az érték megteremtésének, kommunikálásának és a vevőkhöz való eljuttatásának folyamata. Sokkal tágabb annál, mint eladni egy terméket vagy elkészíteni egy hirdetést. A hatékony marketing azzal kezdődik, hogy megértjük, mire van szüksége az embereknek vagy a szervezeteknek, majd megfelelő ajánlatot tervezünk, és döntünk arról, hogyan árazzuk, juttatjuk el, kommunikáljuk és fejlesztjük idővel ezt az ajánlatot. Ebben az értelemben a marketing köti össze a céget azokkal az emberekkel, akiket ki akar szolgálni, és segít olyan kapcsolatokat építeni, amelyek mindkét fél számára értéket teremtenek."},{"k":"c","t":"Marketing = the process of creating, communicating, and delivering value to customers. It is broader than selling or advertising alone.","hu":"Marketing = az érték megteremtésének, kommunikálásának és a vevőkhöz való eljuttatásának folyamata. Tágabb, mint önmagában az eladás vagy a reklám.","lab":"DEFINITION"},{"k":"p","t":"A market is made up of people or organizations that have needs and the ability to buy products or services. Depending on the company, marketing may focus on B2C (Business to Consumer) relationships, where products are sold directly to individual consumers, or on B2B (Business to Business) relationships, where one company sells to another. These two contexts often require different messages and decision-making processes. A household choosing a new phone may make a relatively quick decision, while a company purchasing new software may compare several suppliers, involve multiple decision-makers, and negotiate before buying.","hu":"A piacot olyan emberek vagy szervezetek alkotják, akiknek szükségletük és vásárlóképességük is van. A cégtől függően a marketing összpontosíthat B2C (vállalat–fogyasztó) kapcsolatokra, ahol a terméket közvetlenül az egyéni fogyasztóknak adják el, vagy B2B (vállalatok közötti) kapcsolatokra, ahol az egyik cég a másiknak értékesít. E két helyzet gyakran eltérő üzenetet és döntési folyamatot kíván. Egy új telefont választó háztartás viszonylag gyorsan dönthet, míg egy új szoftvert vásárló cég több beszállítót hasonlít össze, több döntéshozót von be, és tárgyal a vásárlás előtt."},{"k":"c","t":"B2C: a business sells directly to individual consumers. B2B: one company sells to another company.","hu":"B2C: a cég közvetlenül az egyéni fogyasztóknak értékesít. B2B: az egyik cég a másik cégnek értékesít.","lab":"KEY DISTINCTION"},{"k":"p","t":"A marketing strategy is the long-term plan that guides how a company reaches its marketing goals. It brings together knowledge about customers, competitors, products, channels, and performance. A successful strategy therefore requires more than creativity: it also depends on r esearch, clear objectives, careful choices, and continuous measurement. The following sections move from understanding the market and the customer to building brands, designing the marketing mix, managing the customer journey, using digital channels, and evaluating results.","hu":"A marketingstratégia az a hosszú távú terv, amely megszabja, hogyan éri el a cég a marketingcéljait. Összefogja a vevőkről, a versenytársakról, a termékekről, a csatornákról és a teljesítményről szóló tudást. A sikeres stratégia ezért többet kíván a kreativitásnál: kutatásra, világos célokra, átgondolt döntésekre és folyamatos mérésre is szükség van. A következő részek a piac és a vevő megértésétől a márkaépítésen, a marketingmix kialakításán, a vásárlói út kezelésén és a digitális csatornákon át az eredmények értékeléséig vezetnek."},{"k":"h","t":"2. Understanding the market and the customer","hu":"2. A piac és a vevő megértése"},{"k":"p","t":"Before a company decides what to sell or how to promote it, it needs to understand the people it hopes to reach. Customers do not all want the same things, behave in the same way, or respond to the same message. Marketing therefore starts with information: who the customers are, what problems they are trying to solve, what influences their decisions, and what alternatives they have.","hu":"Mielőtt egy cég eldönti, mit ad el, vagy hogyan népszerűsíti, meg kell értenie azokat az embereket, akiket el szeretne érni. A vevők nem mind ugyanazt akarják, nem egyformán viselkednek, és nem ugyanarra az üzenetre reagálnak. A marketing ezért információval kezdődik: kik a vevők, milyen problémát próbálnak megoldani, mi hat a döntéseikre, és milyen alternatíváik vannak."},{"k":"h","t":"2.1 Market research and consumer insight","hu":"2.1 Piackutatás és fogyasztói insight"},{"k":"p","t":"Market research is the systematic collection of information about markets and customers. It can help a company estimate demand, understand attitudes, test ideas, and identify changes in customer expectations. Two common research tools are the survey, which collects answers from a larger group through a structured set of questions, and the focus group, where a smaller group discusses its perceptions, experiences, or reactions in greater depth. Neither method is automatically better; the choice depends on what the company needs to know.","hu":"A piackutatás a piacokról és a vevőkről szóló információk rendszeres gyűjtése. Segíthet a cégnek felmérni a keresletet, megérteni az attitűdöket, ötleteket tesztelni és azonosítani a vevői elvárások változásait. Két gyakori kutatási eszköz a kérdőíves felmérés, amely strukturált kérdéssorral gyűjt válaszokat nagyobb csoporttól, és a fókuszcsoport, ahol egy kisebb csoport mélyebben beszéli meg a benyomásait, tapasztalatait vagy reakcióit. Egyik módszer sem eleve jobb: a választás attól függ, mit kell megtudnia a cégnek."},{"k":"c","t":"Market research = the systematic collection of information about markets and customers. A consumer insight explains why people behave in a particular way.","hu":"Piackutatás = a piacokról és a vevőkről szóló információk rendszeres gyűjtése. A fogyasztói insight azt magyarázza meg, miért viselkednek az emberek adott módon.","lab":"DEFINITION"},{"k":"p","t":"Collecting information is only the first step. Data analysis or analytics is used to interpret the information and identify patterns. A useful outcome of this process is a consumer insight: a deeper understanding of why people behave in a particular way or what motivates them. For example, an online grocery company may discover that customers are not mainly concerned about price but about saving time after work. This insight can shape the company's message, service design, and choice of delivery options. Good research also helps marketers distinguish between what customers say and what they actually do. This is important because consumer behaviour refers to how and why people choose, buy, use, and respond to products. A decision may be influenced by practical needs, habits, emotions, social expectations, previous experiences, or the recommendations of other people. Understanding these influences allows companies to make more relevant decisions instead of relying only on assumptions.","hu":"Az információgyűjtés csak az első lépés. Az adatelemzés (analitika) az információk értelmezésére és a mintázatok azonosítására szolgál. Ennek hasznos eredménye a fogyasztói insight: mélyebb megértés arról, miért viselkednek az emberek adott módon, vagy mi motiválja őket. Egy online élelmiszerbolt például felfedezheti, hogy a vevőket nem elsősorban az ár érdekli, hanem az, hogy munka után időt spóroljanak. Ez a felismerés alakíthatja a cég üzenetét, a szolgáltatás felépítését és a szállítási lehetőségeket. A jó kutatás abban is segít, hogy a marketingesek megkülönböztessék, mit mondanak a vevők, és mit tesznek valójában. Ez azért fontos, mert a fogyasztói magatartás azt jelenti, hogyan és miért választanak, vásárolnak, használnak és reagálnak az emberek a termékekre. A döntést befolyásolhatják gyakorlati szükségletek, szokások, érzelmek, társadalmi elvárások, korábbi tapasztalatok vagy mások ajánlásai. E hatások megértése révén a cégek relevánsabb döntéseket hozhatnak, ahelyett hogy csak feltételezésekre támaszkodnának."},{"k":"h","t":"2.2 Segmentation and targeting","hu":"2.2 Szegmentálás és célzás"},{"k":"p","t":"Because a market usually contains many different types of customers, companies often use segmentation or market segmentation to divide it into smaller groups with shared characteristics. A segment may be based on age, income, location, interests, buying behaviour, lifestyle, or a combination of several factors. The purpose of segmentation is not to create labels for their own sake, but to identify groups whose needs are similar enough for a company to serve them with a more focused offer. Two widely used bases for segmentation are demographics and psychographics. Demographic information describes measurable population characteristics such as age, gender, income, occupation, or education. Psychographic information focuses more on attitudes, values, interests, opinions, and lifestyles. A sportswear company, for example, might identify one segment through age and income, but psychographic information may reveal which consumers are highly performance - oriented, which value sustainability, and which mainly view sportswear as fashion. After dividing the market, the company chooses which group or groups it wants to serve. This process is called targeting, and the chosen group is the target market or target audience. A company does not need to serve everyone. In fact, many firms succeed by focusing on a niche market, a small and specialized part of a larger market. A narrow target can make it easier to design a clear message and a product that solves a specific problem particularly well.","hu":"Mivel egy piacon rendszerint sokféle vevő van, a cégek gyakran alkalmaznak szegmentálást (piacszegmentációt), hogy kisebb, közös jellemzőkkel bíró csoportokra bontsák. Egy szegmens alapulhat életkoron, jövedelmen, lakóhelyen, érdeklődésen, vásárlási szokásokon, életstíluson vagy ezek kombinációján. A szegmentálás célja nem az, hogy önmagáért címkéket gyártson, hanem hogy olyan csoportokat azonosítson, amelyek igényei elég hasonlóak ahhoz, hogy a cég célzottabb ajánlattal szolgálja ki őket. A szegmentálás két széles körben használt alapja a demográfia és a pszichográfia. A demográfiai információ mérhető népességjellemzőket ír le: életkort, nemet, jövedelmet, foglalkozást vagy iskolázottságot. A pszichográfiai információ inkább az attitűdökre, értékekre, érdeklődésre, véleményekre és életstílusra összpontosít. Egy sportruházati cég például életkor és jövedelem alapján is azonosíthat egy szegmenst, de a pszichográfiai adatokból derülhet ki, mely fogyasztók erősen teljesítményorientáltak, kik értékelik a fenntarthatóságot, és kik tekintenek a sportruházatra elsősorban divatként. A piac felosztása után a cég eldönti, melyik csoportot vagy csoportokat akarja kiszolgálni. Ezt a folyamatot célzásnak hívják, a kiválasztott csoport pedig a célpiac vagy a célközönség. Egy cégnek nem kell mindenkit kiszolgálnia. Sok vállalkozás épp azzal lesz sikeres, hogy egy réspiacra, vagyis egy nagyobb piac kicsi, szakosodott részére összpontosít. A szűk célcsoport megkönnyítheti a világos üzenet és egy adott problémát különösen jól megoldó termék megtervezését."},{"k":"c","t":"Segmentation divides the market into smaller groups with shared characteristics. Targeting means choosing which group or groups the company wants to serve.","hu":"A szegmentálás kisebb, közös jellemzőkkel bíró csoportokra osztja a piacot. A célzás azt jelenti, hogy a cég kiválasztja, melyik csoportot vagy csoportokat akarja kiszolgálni.","lab":"QUICK RECAP"},{"k":"h","t":"2.3 Buyer personas, needs, and customer experience","hu":"2.3 Vásárlói personák, szükségletek és ügyfélélmény"},{"k":"p","t":"Marketers often make target groups easier to understand by creating a buyer persona or customer persona. This is a fictional but data-informed profile representing an ideal customer. A useful persona may include typical goals, frustrations, media habits, purchase criteria, and preferred channels. It is not meant to describe every customer exactly; rather, it helps teams imagine the kind of person they are designing a product, message, or service for. One particularly useful concept is the customer pain point, meaning a specific problem the customer needs to solve. A pain point may be practical, such as a slow delivery process, or psychological, such as uncertainty about whether a product can be trusted. The more clearly a company understands these problems, the more effectively it can design value around them. Customer understanding should also continue after the purchase. Customer experience (CX) describes the customer's overall perception of interactions with a brand. This perception is created through many small moments: seeing an advertisement, using a website, contacting customer service, receiving a product, or making a complaint. A strong customer experience can reinforce trust and loyalty, while a poor one can undermine even a strong product.","hu":"A marketingesek gyakran vásárlói persona létrehozásával teszik érthetőbbé a célcsoportokat. Ez egy kitalált, de adatokra épülő profil, amely az ideális vevőt jeleníti meg. Egy jó persona tartalmazhat tipikus célokat, bosszúságokat, médiafogyasztási szokásokat, vásárlási szempontokat és preferált csatornákat. Nem az a célja, hogy minden vevőt pontosan leírjon, hanem hogy segítsen a csapatnak elképzelni, milyen ember számára tervez terméket, üzenetet vagy szolgáltatást. Különösen hasznos fogalom a vevői fájdalompont, vagyis az a konkrét probléma, amelyet a vevő meg akar oldani. A fájdalompont lehet gyakorlati, például a lassú szállítás, vagy lélektani, például a bizonytalanság abban, hogy megbízható-e a termék. Minél világosabban érti a cég ezeket a problémákat, annál hatékonyabban tud köréjük értéket tervezni. A vevő megértésének a vásárlás után is folytatódnia kell. Az ügyfélélmény (CX) azt írja le, ahogyan a vevő összességében érzékeli a márkával való kapcsolatát. Ez a benyomás sok apró pillanatból áll össze: egy hirdetés megpillantásából, egy weboldal használatából, az ügyfélszolgálattal való kapcsolatból, a termék átvételéből vagy egy panasz bejelentéséből. Az erős ügyfélélmény erősítheti a bizalmat és a hűséget, a rossz élmény viszont egy jó terméket is alááshat."},{"k":"c","t":"Customer experience (CX) = the overall perception of interactions with a brand. A pain point is a specific problem the customer needs to solve.","hu":"Ügyfélélmény (CX) = a márkával való érintkezések összbenyomása. A fájdalompont az a konkrét probléma, amelyet a vevő meg akar oldani.","lab":"DEFINITION"},{"k":"p","t":"A company can also combine quantitative and qualitative research. A survey may reveal that a large percentage of customers are dissatisfied with delivery speed, while a focus group can help explain why the problem matters and what customers would consider an acceptable solution. When the findings are interpreted through data analysis or analytics, managers can move from isolated comments to a more systematic consumer insight. This is especially important when the market changes quickly, because assumptions that were accurate a year ago may no longer describe present behaviour. Research may also reveal that a broad market contains a smaller niche market with needs that are not fully served by mainstream competitors. A niche is not simply a small group; it is a specific group with a relatively distinct problem, preference, or identity. For a smaller company, serving a niche can be more realistic than trying to compete for the entire market. A carefully designed segmentation strategy can therefore help a firm decide which differences between customers are commercially meaningful and which differences do not justify separate marketing activity. The difference between a consumer and a customer can also matter. The customer is the person or organization that buys the product, while the consumer is the person who uses it. In many situations they are the same person, but not always. Parents may buy products for children, companies may purchase software for employees, and hospitals may buy equipment used by medical staff. Marketing decisions become more accurate when the company understands both the buyer's decision criteria and the user's actual experience. This distinction also connects customer experience (CX) with user experience (UX). CX concerns the customer's overall perception of the relationship with the brand, including advertising, ordering, payment, support, delivery, and after-sales contact. UX focuses more closely on the experience of using a product, service, website, or digital interface. A customer can admire a brand but struggle with a badly designed app, or enjoy an excellent product but become frustrated by poor service. Effective marketing therefore treats experience as a sequence of connected interactions rather than as a single purchase event.","hu":"A cég mennyiségi és minőségi kutatást is kombinálhat. Egy kérdőívből kiderülhet, hogy a vevők nagy része elégedetlen a szállítási sebességgel, a fókuszcsoport pedig segíthet megérteni, miért fontos ez a probléma, és mit tartanának elfogadható megoldásnak. Ha az eredményeket adatelemzéssel értelmezik, a vezetők az elszigetelt megjegyzésektől eljuthatnak egy rendszerezettebb fogyasztói insightig. Ez különösen fontos gyorsan változó piacokon, mert a tavaly még pontos feltételezések ma már nem feltétlenül írják le a viselkedést. A kutatásból az is kiderülhet, hogy egy széles piacon belül van egy kisebb réspiac, amelynek igényeit a fő versenytársak nem szolgálják ki teljesen. A rés nem egyszerűen kis csoport: olyan csoport, amelynek viszonylag jól elkülönülő problémája, preferenciája vagy identitása van. Egy kisebb cég számára reálisabb lehet egy rést kiszolgálni, mint az egész piacért versengeni. Egy gondosan felépített szegmentációs stratégia tehát segíthet eldönteni, mely vevők közötti különbségek üzletileg értelmesek, és melyek nem indokolnak külön marketingtevékenységet. A fogyasztó és a vásárló közötti különbség is számíthat. A vásárló az a személy vagy szervezet, amely megveszi a terméket, a fogyasztó pedig az, aki használja. Sok esetben ugyanaz a személy, de nem mindig. A szülők a gyerekeiknek vásárolnak, a cégek a dolgozóiknak vesznek szoftvert, a kórházak pedig olyan eszközöket, amelyeket az orvosok használnak. A marketingdöntések pontosabbak lesznek, ha a cég a vásárló döntési szempontjait és a használó tényleges élményét is érti. Ez a különbségtétel köti össze az ügyfélélményt (CX) a felhasználói élménnyel (UX). A CX a vevő összbenyomása a márkával való kapcsolatról: a hirdetésről, a rendelésről, a fizetésről, a támogatásról, a szállításról és az értékesítés utáni kapcsolattartásról. Az UX szorosabban a termék, a szolgáltatás, a weboldal vagy a digitális felület használatának élményére összpontosít. Egy vevő csodálhat egy márkát, de küzdhet egy rosszul megtervezett alkalmazással, vagy élvezhet egy kiváló terméket, miközben a gyenge kiszolgálás bosszantja. A jó marketing ezért az élményt összekapcsolódó érintkezések sorozataként kezeli, nem egyetlen vásárlási eseményként."},{"k":"h","t":"3. Building a strong brand","hu":"3. Erős márka építése"},{"k":"p","t":"Products can often be copied, but the meanings and associations connected to a company are more difficult to reproduce. This is why brands are central to marketing. A strong brand helps customers recognize an offer, understand what it stands for, and distinguish it from alternatives.","hu":"A termékeket gyakran le lehet másolni, de a céghez kapcsolódó jelentéseket és képzettársításokat nehezebb reprodukálni. Ezért állnak a márkák a marketing középpontjában. Az erős márka segít a vevőknek felismerni az ajánlatot, megérteni, mit képvisel, és megkülönböztetni az alternatíváktól."},{"k":"h","t":"3.1 Brand identity, awareness, and reputation","hu":"3.1 Márkaidentitás, ismertség és hírnév"},{"k":"p","t":"A brand is the identity of a company or product, including its name, image, reputation, and the associations customers connect with it. Branding is the process of building and managing those perceptions. One visible part of branding is brand identity, which includes the visual and verbal elements used to represent the brand. A logo gives the brand a recognizable symbol, while a slogan can summarize its personality or promise in a short, memorable form.","hu":"A márka a cég vagy a termék identitása: a neve, a megjelenése, a hírneve és a vevőkben élő képzettársítások. A márkaépítés e benyomások felépítésének és kezelésének folyamata. A márkaépítés egyik látható eleme a márkaidentitás, amely a márkát megjelenítő vizuális és szöveges elemeket foglalja magában. A logó felismerhető jelképet ad a márkának, a szlogen pedig rövid, emlékezetes formában foglalhatja össze a személyiségét vagy az ígéretét."},{"k":"c","t":"A brand includes a company or product name, image, reputation, and associations. Branding is the process of building and managing those perceptions.","hu":"A márka magában foglalja a cég vagy termék nevét, megjelenését, hírnevét és a hozzá kapcsolódó képzettársításokat. A márkaépítés e benyomások felépítésének és kezelésének folyamata.","lab":"DEFINITION"},{"k":"p","t":"Recognition is captured by brand awareness, which describes how familiar consumers are with a brand and how easily they can recognize or recall it. Related to this is visibility, or how easily the brand can be seen or found. At a more advanced level, brand salience refers to how easily and frequently a brand comes to mind in buying situations. A company can therefore be visible without necessarily being the first brand customers think of when they are ready to purchase. Awareness alone is not enough. Brand reputation concerns how the public views the brand, while trust reflects customers' confidence that the company will deliver what it promises. Reputation is influenced by direct experience but also by word-of-mouth (WOM), reviews, media coverage, and social proof. Social proof is evidence that other people approve of, use, or recommend a product. This is why a strong review score, customer testimonial, or visible user community can influence a buyer who has no previous experience with the brand.","hu":"A felismerhetőséget a márkaismertség ragadja meg, amely azt írja le, mennyire ismerik a fogyasztók a márkát, és milyen könnyen ismerik fel vagy idézik fel. Ehhez kapcsolódik a láthatóság, vagyis hogy milyen könnyen lehet a márkát meglátni vagy megtalálni. Egy szinttel tovább a márka kiugrósága (salience) azt jelenti, milyen könnyen és gyakran jut eszünkbe a márka vásárlási helyzetben. Egy cég tehát lehet látható anélkül, hogy az lenne az első márka, amely a vevőnek eszébe jut, amikor vásárolni készül. Az ismertség önmagában nem elég. A márka hírneve azzal foglalkozik, hogyan látja a nyilvánosság a márkát, a bizalom pedig azt tükrözi, mennyire hiszik a vevők, hogy a cég teljesíti, amit ígér. A hírnevet a közvetlen tapasztalat mellett a szájreklám (WOM), az értékelések, a médiamegjelenés és a társas bizonyíték is alakítja. A társas bizonyíték olyan jelzés, hogy mások helyeslik, használják vagy ajánlják a terméket. Ezért hathat egy jó értékelés, egy vásárlói vélemény vagy egy látható felhasználói közösség arra a vevőre, akinek nincs korábbi tapasztalata a márkával."},{"k":"h","t":"3.2 Brand equity, loyalty, and long-term value","hu":"3.2 Márkaérték, hűség és hosszú távú érték"},{"k":"p","t":"When positive perceptions add value beyond the functional product itself, the company has brand equity. Two products may perform similarly, yet customers may be willing to choose or pay more for the one associated with a trusted brand. Brand equity develops over time through consistent experiences, recognizable identity, positive reputation, and a clear place in the customer's mind. A related concept is brand loyalty or customer loyalty, which describes a customer's preference for one brand over alternatives. Loyal customers may make repeat purchases, recommend the brand, and be less likely to switch when competitors offer similar products. Loyalty should not be treated as automatic: it needs to be supported by continued value and a positive customer experience.","hu":"Amikor a pozitív benyomások a termék funkcionális értékén túl is értéket adnak, a cég márkaértékkel rendelkezik. Két termék teljesíthet hasonlóan, a vevők mégis azt választhatják, vagy többet fizethetnek azért, amelyik egy megbízható márkához kötődik. A márkaérték idővel épül fel az egyenletes élményekből, a felismerhető identitásból, a jó hírnévből és a vevő fejében elfoglalt világos helyből. Ehhez kapcsolódó fogalom a márkahűség vagy vásárlói hűség, amely a vevő egy márka iránti tartós ragaszkodását jelenti az alternatívákkal szemben. A hűséges vevők ismételten vásárolhatnak, ajánlhatják a márkát, és kevésbé valószínű, hogy váltanak, ha a versenytársak hasonló terméket kínálnak. A hűséget nem szabad magától értetődőnek venni: folyamatos értékkel és pozitív ügyfélélménnyel kell fenntartani."},{"k":"c","t":"Brand equity = extra value created by positive brand perceptions. Brand loyalty = a customer's preference for one brand over alternatives.","hu":"Márkaérték = a pozitív márkaészlelésekből származó többletérték. Márkahűség = a vevő ragaszkodása egy márkához az alternatívákkal szemben.","lab":"QUICK RECAP"},{"k":"h","t":"3.3 Positioning and competitive advantage","hu":"3.3 Pozicionálás és versenyelőny"},{"k":"p","t":"Positioning describes how a brand wants to be perceived in comparison with competitors. Good positioning answers a simple question: what should customers think of when they think of this brand? A positioning statement expresses this idea clearly and can guide internal decisions about products, messages, and target groups. Positioning is closely linked to a value proposition, a statement of the benefits a customer receives from a product or service. A strong value proposition focuses on the customer rather than simply listing technical characteristics. Within that proposition, a unique selling proposition (USP) or unique selling point identifies the distinctive factor that separates the offer from competitors. The difference between a product feature and a customer benefit is important here: a feature describes what a product has, while a benefit explains the positive outcome the customer receives from it.","hu":"A pozicionálás azt írja le, hogyan szeretné a márka, hogy lássák a versenytársakhoz képest. A jó pozicionálás egy egyszerű kérdésre válaszol: mire gondoljanak a vevők, amikor erre a márkára gondolnak? A pozicionálási nyilatkozat világosan fogalmazza meg ezt a gondolatot, és irányt adhat a termékekről, az üzenetekről és a célcsoportokról szóló belső döntéseknek. A pozicionálás szorosan összefügg az értékajánlattal, vagyis annak megfogalmazásával, milyen előnyöket kap a vevő a terméktől vagy szolgáltatástól. Az erős értékajánlat a vevőre összpontosít, nem pusztán műszaki jellemzőket sorol. Ezen belül az egyedi értékajánlat (USP) azonosítja azt a megkülönböztető tényezőt, amely elválasztja az ajánlatot a versenytársakétól. Fontos a termékjellemző és a vevői előny közötti különbség: a jellemző azt írja le, mije van a terméknek, az előny pedig azt, milyen pozitív eredményt kap ebből a vevő."},{"k":"c","t":"Value proposition = the benefits a customer receives from a product or service. USP = the distinctive factor that separates the offer from competitors. Feature = what a product has; benefit = the positive outcome for the customer.","hu":"Értékajánlat = milyen előnyöket kap a vevő a terméktől vagy szolgáltatástól. USP = a megkülönböztető tényező, amely elválasztja az ajánlatot a versenytársakétól. Jellemző = mije van a terméknek; előny = milyen pozitív eredményt kap a vevő.","lab":"KEY TERMS"},{"k":"p","t":"A company gains a competitive advantage when it has an edge that competitors find difficult to match. This advantage may come from price, quality, convenience, technology, service, brand strength, or a particularly good understanding of a target segment. Marketing therefore requires continuous awareness of competition and each major competitor, because positioning only makes sense in relation to the alternatives available to customers.","hu":"Egy cég akkor szerez versenyelőnyt, ha olyan előnye van, amelyet a versenytársak nehezen tudnak utánozni. Ez fakadhat árból, minőségből, kényelemből, technológiából, kiszolgálásból, márkaerőből vagy a célszegmens különösen jó ismeretéből. A marketing ezért folyamatos figyelmet kíván a versenyre és minden jelentős versenytársra, mert a pozicionálás csak a vevők számára elérhető alternatívákhoz képest értelmezhető."},{"k":"h","t":"3.4 Brand proposition, salience, and authority","hu":"3.4 Márkaígéret, kiugróság és szakmai tekintély"},{"k":"p","t":"A brand proposition is the distinctive promise that a brand makes to its audience. It brings together what the company offers, why that offer matters, and what customers should expect from the relationship. It is broader than an individual advertising message and should remai n recognizable across products and channels. A strong brand proposition supports the positioning statement, the concise explanation of how the brand wants to be understood in relation to a particular target market and its competitors. For a brand to influence choice, it must also come to mind at the right moment. Brand salience describes how easily and frequently a brand is remembered in buying situations. This is related to brand awareness, but the emphasis is slightly different: awareness indicates familiarity, while salience concerns whether the brand is mentally available when the customer is deciding what to buy. Repeated exposure, distinctive brand elements, consistent messaging, and positive previous experiences can all strengthen this mental availability. Brands can also develop authority, meaning credibility and recognized expertise in a field. Authority is especially important when customers face uncertainty or need reliable information before deciding. Educational content, specialist knowledge, transparent communication, strong reviews, and credible feedback can all contribute to authority. These signals often operate as social proof: evidence that other people trust, use, or recommend the product. Social proof reduces perceived risk because customers are not evaluating the offer in isolation; they can see how others have responded to it. Over time, the interaction between salience, authority, reputation, and trust contributes to brand equity. This explains why branding is not a separate decorative activity but a strategic asset. A familiar and trusted name can make customer acquisition easier, support a premium price, encourage brand loyalty, and make extensions into new product categories more credible. At the same time, strong brand equity can be damaged quickly if the company's behaviour contradicts its brand proposition, so consistency between communication and actual customer experience remains essential.","hu":"A márkaígéret az a megkülönböztető ígéret, amelyet a márka a közönségének tesz. Összefogja, mit kínál a cég, miért fontos ez, és mire számíthat a vevő a kapcsolattól. Tágabb, mint egy-egy reklámüzenet, és felismerhetőnek kell maradnia a termékeken és a csatornákon át. Az erős márkaígéret támogatja a pozicionálási nyilatkozatot, vagyis azt a tömör magyarázatot, hogyan akarja a márka, hogy értsék egy adott célpiachoz és a versenytársakhoz képest. Ahhoz, hogy a márka hasson a döntésre, a megfelelő pillanatban eszébe is kell jutnia a vevőnek. A márka kiugrósága azt írja le, milyen könnyen és gyakran jut eszünkbe a márka vásárlási helyzetben. Ez összefügg a márkaismertséggel, de a hangsúly kissé más: az ismertség az ismerősséget jelzi, a kiugróság pedig azt, hogy a márka gondolatilag elérhető-e, amikor a vevő épp dönt. Az ismételt megjelenés, a jellegzetes márkaelemek, a következetes üzenet és a korábbi jó tapasztalatok mind erősíthetik ezt a gondolati elérhetőséget. A márkák szakmai tekintélyt is szerezhetnek, vagyis hitelességet és elismert szakértelmet egy területen. A tekintély különösen fontos, amikor a vevők bizonytalanok, vagy megbízható információra van szükségük a döntés előtt. Az oktató tartalom, a szakértelem, az átlátható kommunikáció, a jó értékelések és a hiteles visszajelzés mind hozzájárulhat. Ezek a jelzések gyakran társas bizonyítékként működnek: bizonyítják, hogy mások megbíznak a termékben, használják vagy ajánlják. A társas bizonyíték csökkenti az észlelt kockázatot, mert a vevők nem elszigetelten értékelik az ajánlatot: látják, mások hogyan reagáltak rá. Idővel a kiugróság, a tekintély, a hírnév és a bizalom kölcsönhatása márkaértéket teremt. Ez magyarázza, miért nem különálló díszítőtevékenység a márkaépítés, hanem stratégiai vagyon. Egy ismerős és megbízható név megkönnyítheti az ügyfélszerzést, alátámaszthat prémium árat, erősítheti a márkahűséget, és hitelesebbé teheti az új termékkategóriákba való belépést. Ugyanakkor az erős márkaérték gyorsan sérülhet, ha a cég viselkedése ellentmond a márkaígéretének, ezért a kommunikáció és a tényleges ügyfélélmény közötti összhang elengedhetetlen."},{"k":"c","t":"Brand salience means the brand comes to mind easily in buying situations. Authority means credibility and recognized expertise.","hu":"A márka kiugrósága azt jelenti, hogy a márka könnyen eszünkbe jut vásárlási helyzetben. A szakmai tekintély hitelességet és elismert szakértelmet jelent.","lab":"DEFINITION"},{"k":"h","t":"4. The marketing mix","hu":"4. A marketingmix"},{"k":"p","t":"Once a company understands its market and desired position, it must translate strategy into concrete decisions. The traditional Marketing Mix (4 Ps) provides a simple framework for doing this. The four elements are Product, Price, Place, and Promotion. They are called controllable tools because a company can adjust them in response to its goals, target market, and competitive environment. The four decisions are interconnected: a premium product, for example, is unlikely to succeed if its price, distribution, and communication all suggest a low-cost position.","hu":"Amint a cég megértette a piacát és a kívánt pozícióját, a stratégiát konkrét döntésekre kell fordítania. A hagyományos marketingmix (4P) egyszerű keretet ad ehhez. A négy elem: termék (Product), ár (Price), értékesítési hely (Place) és promóció (Promotion). Azért hívják őket befolyásolható eszközöknek, mert a cég a céljaihoz, a célpiacához és a versenykörnyezetéhez igazíthatja őket. A négy döntés összefügg: egy prémium termék például aligha lehet sikeres, ha az ára, az értékesítési helye és a kommunikációja egyaránt olcsó pozíciót sugall."},{"k":"c","t":"Product – what the company offers Price – what the customer pays Place – where and how the product is distributed Promotion – how the company communicates with the market","hu":"Termék – mit kínál a cég. Ár – mit fizet a vevő. Értékesítési hely – hol és hogyan jut el a termék. Promóció – hogyan kommunikál a cég a piaccal.","lab":"AT A GLANCE"},{"k":"h","t":"4.1 Product: what the company offers","hu":"4.1 Termék: mit kínál a cég"},{"k":"p","t":"A product is a good or service offered to customers. Marketing decisions about the product include what problem it solves, what features it offers, how it is designed, how reliable it is, and how it fits the needs of the target market. A product can also be understood as an offer: a proposal that combines the core product with additional benefits, service, conditions, or incentives. The importance of product decisions can be seen clearly in FMCG (Fast-Moving Consumer Goods), such as snacks, drinks, or detergents. These are relatively low-cost products that are purchased frequently, so packaging, convenience, availability, and brand recognition can strongly influence choice. In other categories, such as software or professional services, the decision may depend more on functionality, support, and the long-term value offered to the customer.","hu":"A termék a vevőknek kínált áru vagy szolgáltatás. A termékkel kapcsolatos marketingdöntések közé tartozik, milyen problémát old meg, milyen jellemzői vannak, hogyan tervezték, mennyire megbízható, és mennyire illik a célpiac igényeihez. A termék ajánlatként is értelmezhető: olyan javaslatként, amely az alaptermék mellé további előnyöket, szolgáltatást, feltételeket vagy ösztönzőket kapcsol. A termékdöntések fontossága jól látszik a gyorsan forgó fogyasztási cikkeknél (FMCG), mint a nassolnivaló, az ital vagy a mosószer. Ezek viszonylag olcsó termékek, amelyeket gyakran vásárolnak, ezért a csomagolás, a kényelem, az elérhetőség és a márkaismertség erősen befolyásolhatja a választást. Más kategóriákban, például a szoftvereknél vagy a szakmai szolgáltatásoknál, a döntés inkább a funkcionalitáson, a támogatáson és a hosszú távú értéken múlhat."},{"k":"h","t":"4.2 Price: what the customer gives up","hu":"4.2 Ár: mit ad fel a vevő"},{"k":"p","t":"Price is the amount a customer pays for a product or service. It is the only element of the marketing mix that directly produces revenue, so pricing decisions must balance customer value, competitive pressure, and business objectives. A very low price may increase demand but weaken perceptions of quality or reduce profitability; a high price may support a premium position but reduce the number of potential buyers. Companies also use temporary price incentives such as a discount, promotion, or sale to encourage purchase. These can be effective when launching a product, clearing inventory, rewarding loyal customers, or creating urgency. However, if discounts are used too frequently, customers may learn to wait for lower prices rather than buy at the normal price.","hu":"Az ár az az összeg, amelyet a vevő fizet a termékért vagy szolgáltatásért. Ez a marketingmix egyetlen eleme, amely közvetlenül bevételt termel, ezért az árazási döntéseknek egyensúlyt kell teremteniük a vevői érték, a versenynyomás és az üzleti célok között. A nagyon alacsony ár növelheti a keresletet, de ronthatja a minőségről alkotott képet, vagy csökkentheti a jövedelmezőséget; a magas ár alátámaszthat prémium pozíciót, de csökkentheti a lehetséges vevők számát. A cégek ideiglenes árösztönzőket is használnak, például kedvezményt, promóciót vagy akciót a vásárlás ösztönzésére. Ezek hatékonyak lehetnek termékbevezetéskor, készletkisöprésnél, a hűséges vevők jutalmazásánál vagy a sürgetés megteremtésénél. Ha azonban túl gyakran adnak kedvezményt, a vevők megtanulhatnak várni az alacsonyabb árra ahelyett, hogy normál áron vásárolnának."},{"k":"h","t":"4.3 Place: making the product available","hu":"4.3 Értékesítési hely: a termék elérhetővé tétele"},{"k":"p","t":"Place refers to where and how a product is distributed to customers. A company must decide whether customers will buy in physical stores, through distributors, directly from the company, or online. The right choice depends on customer habits, the product itself, and the level of control the company wants over the buying experience. The growth of e-commerce has made place decisions increasingly digital. An online store can reach customers far beyond the company's physical location, but it also creates new expectations around website usability, delivery, returns, and customer support. As a result, distribution is closely connected to customer experience and digital marketing.","hu":"Az értékesítési hely (place) arra utal, hol és hogyan jut el a termék a vevőkhöz. A cégnek el kell döntenie, hogy a vevők fizikai boltban, forgalmazókon keresztül, közvetlenül a cégtől vagy online vásárolnak-e. A helyes választás a vevői szokásoktól, magától a terméktől és attól függ, mennyire akarja a cég kézben tartani a vásárlási élményt. Az e-kereskedelem növekedése egyre inkább digitálissá tette ezeket a döntéseket. Egy webáruház a cég fizikai helyétől messze is elérheti a vevőket, de új elvárásokat is teremt a weboldal használhatósága, a szállítás, a visszaküldés és az ügyfélszolgálat terén. Az elosztás így szorosan összekapcsolódik az ügyfélélménnyel és a digitális marketinggel."},{"k":"h","t":"4.4 Promotion: communicating with the market","hu":"4.4 Promóció: kommunikáció a piaccal"},{"k":"p","t":"Promotion includes the activities used to communicate with and persuade customers. A campaign is a coordinated set of marketing activities designed around a specific goal, such as introducing a new product, increasing awareness, or generating sales. The start of such activity may be described as a campaign launch or simply a launch. One important promotional tool is advertising, which uses paid messages to promote a product, service, or brand. An individual piece of paid communication is an advertisement, advert, or ad. Promotion, however, is broader than advertising. It can also include content, email, social media, public relations, events, referrals, and other forms of communication. Digital channels have made this promotional environment much more measurable and interactive, which is why they deserve separate attention.","hu":"A promóció azokat a tevékenységeket foglalja magában, amelyekkel a cég kommunikál a vevőkkel, és meggyőzi őket. A kampány összehangolt marketingtevékenységek sora egy konkrét cél köré szervezve: például új termék bevezetésére, az ismertség növelésére vagy eladások generálására. Az ilyen tevékenység kezdetét kampányindításnak vagy egyszerűen indításnak nevezhetjük. Egy fontos promóciós eszköz a reklám, amely fizetett üzenetekkel népszerűsít egy terméket, szolgáltatást vagy márkát. Egy-egy fizetett kommunikációs egység a hirdetés (advertisement, advert, ad). A promóció azonban tágabb a reklámnál. Magában foglalhat tartalmat, e-mailt, közösségi médiát, PR-t, rendezvényeket, ajánlói programokat és más kommunikációs formákat is. A digitális csatornák sokkal mérhetőbbé és interaktívabbá tették ezt a promóciós környezetet, ezért külön figyelmet érdemelnek."},{"k":"h","t":"4.5 Integrating the marketing mix","hu":"4.5 A marketingmix összehangolása"},{"k":"p","t":"The four elements of the Marketing Mix should not be planned independently. A company that promises convenience must design a product that is easy to use, choose a price that customers consider acceptable, make the product available through an appropriate place, and communicate the same convenience through promotion. If these elements send conflicting signals, customers may find the offer confusing. For example, premium advertising combined with poor packaging, constant discounting, or unreliable distribution can weaken the intended position. The specific commercial offer is where several marketing-mix decisions meet. An offer may include the product itself, a particular price, extra benefits, delivery conditions, a guarantee, or a limited-time incentive. The way it is presented also matters. Copywriting is the writing of persuasive marketing text, while a headline is the main attention-grabbing line that encourages the audience to continue reading. The call to action (CTA) then tells the customer what to do next. Strong promotional communication therefore moves from attention to value and finally to a clear action rather than simply listing product features.","hu":"A marketingmix négy elemét nem szabad egymástól függetlenül tervezni. Az a cég, amely kényelmet ígér, könnyen használható terméket kell tervezzen, olyan árat válasszon, amelyet a vevők elfogadhatónak tartanak, megfelelő csatornán tegye elérhetővé a terméket, és ugyanezt a kényelmet kommunikálja a promócióban is. Ha ezek az elemek ellentmondó jelzéseket küldenek, a vevők számára zavaros lesz az ajánlat. A prémium reklám például gyenge csomagolással, állandó akciózással vagy megbízhatatlan kiszállítással párosulva gyengítheti a szándékolt pozíciót. A konkrét kereskedelmi ajánlat az a pont, ahol több marketingmix-döntés találkozik. Az ajánlat tartalmazhatja magát a terméket, egy adott árat, extra előnyöket, szállítási feltételeket, garanciát vagy időszakos ösztönzőt. Az is számít, hogyan mutatják be. A szövegírás (copywriting) a meggyőző marketingszöveg megalkotása, a címsor (headline) pedig az a fő, figyelemfelkeltő sor, amely továbbolvasásra ösztönöz. A cselekvésre ösztönzés (CTA) ezután megmondja a vevőnek, mi legyen a következő lépés. Az erős promóciós kommunikáció tehát a figyelemtől az értéken át a világos cselekvésig vezet, nem pedig egyszerűen termékjellemzőket sorol."},{"k":"c","t":"Copywriting = the writing of persuasive marketing text. Headline = the main attention-grabbing line. CTA = the instruction telling the customer what to do next.","hu":"Szövegírás = meggyőző marketingszöveg megalkotása. Címsor = a fő, figyelemfelkeltő sor. CTA = az az utasítás, amely megmondja a vevőnek, mi legyen a következő lépés.","lab":"KEY TERMS"},{"k":"p","t":"The same principle applies to a campaign launch or product launch. Before activity begins, marketers need to coordinate the target audience, channel, message, budget, timing, and desired response. A campaign aimed at increasing brand awareness may use broad-reach media and memorable creative content, while a campaign aimed at direct sales may use a more specific offer, a stronger CTA, and a carefully designed landing page. The campaign objective should therefore determine the combination of marketing tools rather than the other way around.","hu":"Ugyanez az elv érvényes a kampány- vagy termékbevezetésre. A tevékenység megkezdése előtt a marketingeseknek össze kell hangolniuk a célközönséget, a csatornát, az üzenetet, a költségkeretet, az időzítést és a kívánt reakciót. Egy márkaismertség növelésére irányuló kampány széles elérésű médiát és emlékezetes kreatív tartalmat használhat, míg egy közvetlen értékesítésre irányuló kampány konkrétabb ajánlatot, erősebb CTA-t és gondosan megtervezett céloldalt. A kampánycélnak kell tehát meghatároznia a marketingeszközök kombinációját, nem fordítva."},{"k":"h","t":"5. The customer journey and the marketing funnel","hu":"5. A vásárlói út és a marketingtölcsér"},{"k":"p","t":"Marketing does not end when a person first notices a brand. Customers move through a sequence of interactions before and after purchase. The customer journey describes these stages, while a customer touchpoint or touchpoint is any individual interaction between the customer and the brand. A social media post, search result, website visit, sales call, delivery email, and support conversation can all be touchpoints. A related model is the marketing funnel or sales funnel, which describes customer progression from awareness toward purchase. The funnel metaphor suggests that many people may become aware of a brand, fewer will show serious interest, and an even smaller number will finally buy. Modern marketing also recognizes that the process continues after purchase, because retention, repeat business, and recommendation are essential to long-term value.","hu":"A marketing nem ér véget azzal, hogy valaki először felfigyel egy márkára. A vevők érintkezések sorozatán mennek végig a vásárlás előtt és után. A vásárlói út ezeket a szakaszokat írja le, az érintkezési pont (touchpoint) pedig bármely egyedi érintkezés a vevő és a márka között. Egy közösségimédia-poszt, egy keresőtalálat, egy weboldal-látogatás, egy értékesítési hívás, egy szállítási e-mail és egy ügyfélszolgálati beszélgetés mind érintkezési pont lehet. Kapcsolódó modell a marketing- vagy értékesítési tölcsér, amely a vevő útját írja le a figyelemfelkeltéstől a vásárlásig. A tölcsér képe azt sugallja, hogy sokan szereznek tudomást a márkáról, kevesebben mutatnak komoly érdeklődést, és még kevesebben vásárolnak végül. A mai marketing azt is elismeri, hogy a folyamat a vásárlás után is folytatódik, mert a megtartás, az ismételt vásárlás és az ajánlás elengedhetetlen a hosszú távú értékhez."},{"k":"c","t":"Customer journey = the sequence of interactions before and after purchase. Touchpoint = any individual interaction between the customer and the brand. Marketing funnel = customer progression from awareness toward purchase.","hu":"Vásárlói út = az érintkezések sorozata a vásárlás előtt és után. Érintkezési pont = bármely egyedi érintkezés a vevő és a márka között. Marketingtölcsér = a vevő útja a figyelemfelkeltéstől a vásárlásig.","lab":"DEFINITION"},{"k":"h","t":"5.1 Awareness, acquisition, and lead generation","hu":"5.1 Figyelemfelkeltés, ügyfélszerzés és érdeklődőszerzés"},{"k":"p","t":"At the top of the funnel, the company needs to attract attention and bring potential customers into contact with the brand. Acquisition is the process of attracting new customers or users. In many business contexts, this begins with a lead, meaning a potential customer who has shown some level of interest. Lead generation is the process of attracting these potential customers. A company may use useful content, webinars, product demonstrations, search advertising, events, or a lead magnet, which is a free offer such as an e-book, checklist, trial, or guide provided in exchange for contact information. Not every lead is equally valuable. A marketing qualified lead (MQL) is a lead that has shown interest and meets criteria that suggest it is worth nurturing further. Some companies also use lead scoring to rank leads according to their likelihood of converting.","hu":"A tölcsér tetején a cégnek figyelmet kell keltenie, és kapcsolatba kell hoznia a lehetséges vevőket a márkával. Az ügyfélszerzés az új vevők vagy felhasználók bevonzásának folyamata. Sok üzleti helyzetben ez egy érdeklődővel (lead) kezdődik, vagyis olyan lehetséges vevővel, aki valamilyen szintű érdeklődést mutatott. Az érdeklődőszerzés (leadgenerálás) e lehetséges vevők bevonzásának folyamata. A cég használhat hasznos tartalmat, webináriumot, termékbemutatót, keresőhirdetést, rendezvényt vagy csalogató ajánlatot (lead magnetet), például e-könyvet, ellenőrzőlistát, próbaverziót vagy útmutatót, amelyet elérhetőségért cserébe ad. Nem minden érdeklődő egyformán értékes. A marketing szempontból minősített érdeklődő (MQL) olyan lead, amely érdeklődést mutatott, és megfelel azoknak a feltételeknek, amelyek alapján érdemes tovább foglalkozni vele. Egyes cégek leadpontozást is használnak, hogy a konverzió valószínűsége szerint rangsorolják az érdeklődőket."},{"k":"c","t":"Lead = a potential customer who has shown interest. Lead generation = the process of attracting potential customers. MQL = a marketing qualified lead worth nurturing further.","hu":"Lead = lehetséges vevő, aki érdeklődést mutatott. Leadgenerálás = a lehetséges vevők bevonzásának folyamata. MQL = marketing szempontból minősített érdeklődő, akivel érdemes tovább foglalkozni.","lab":"QUICK RECAP"},{"k":"h","t":"5.2 Conversion: turning interest into action","hu":"5.2 Konverzió: az érdeklődésből cselekvés"},{"k":"p","t":"A conversion occurs when a user takes the desired action, such as making a purchase, registering for an account, downloading a resource, or requesting a quotation. The conversion rate is the percentage of users who complete that action. Because conversion can mean different things in different campaigns, marketers need to define the desired action clearly before measuring success. Digital campaigns often direct users to a landing page, a webpage designed around a specific conversion goal. A strong landing page usually contains a clear call to action (CTA), such as \"Buy now,\" \"Book a demo,\" or \"Sign up.\" The number of visitors arriving at a website or page is called traffic, but high traffic does not automatically mean strong performance. A page can attract many visitors and still fail if very few of them convert. For this reason, companies use conversion rate optimization (CRO) to improve websites and campaigns so that a greater share of users completes the intended action. One common technique is A/B testing, where two versions of a marketing element are compared to see which performs better. A company might test two headlines, two buttons, or two page layouts and then use the stronger version based on observed results.","hu":"Konverzióról akkor beszélünk, ha a felhasználó elvégzi a kívánt műveletet: vásárol, fiókot regisztrál, letölt valamit vagy árajánlatot kér. A konverziós arány azoknak a felhasználóknak a százaléka, akik ezt a műveletet teljesítik. Mivel a konverzió kampányonként mást jelenthet, a marketingeseknek a siker mérése előtt világosan meg kell határozniuk a kívánt műveletet. A digitális kampányok gyakran céloldalra irányítják a felhasználókat, vagyis olyan weboldalra, amelyet egy konkrét konverziós cél köré terveztek. Egy jó céloldalon rendszerint világos cselekvésre ösztönzés (CTA) szerepel, például „Vásárolj most”, „Kérj bemutatót” vagy „Iratkozz fel”. A weboldalra vagy oldalra érkező látogatók számát forgalomnak hívjuk, de a nagy forgalom önmagában nem jelent jó teljesítményt. Egy oldal sok látogatót vonzhat, és mégis eredménytelen lehet, ha közülük nagyon kevesen konvertálnak. Ezért használnak a cégek konverzióoptimalizálást (CRO), hogy a weboldal és a kampány javításával a felhasználók nagyobb hányada végezze el a kívánt műveletet. Egy elterjedt módszer az A/B tesztelés, amelyben egy marketingelem két változatát hasonlítják össze, hogy melyik teljesít jobban. Egy cég tesztelhet két címsort, két gombot vagy két oldalelrendezést, majd a mért eredmények alapján használja az erősebb változatot."},{"k":"c","t":"Conversion = the desired action taken by the user. CRO = improving websites and campaigns so that more users convert. A/B testing compares two versions to see which performs better.","hu":"Konverzió = a felhasználó által elvégzett kívánt művelet. CRO = a weboldal és a kampány javítása, hogy több felhasználó konvertáljon. Az A/B tesztelés két változatot hasonlít össze, hogy melyik teljesít jobban.","lab":"DEFINITION"},{"k":"h","t":"5.3 Retention, loyalty, and customer value","hu":"5.3 Megtartás, hűség és ügyfélérték"},{"k":"p","t":"Winning a new customer is only one part of marketing. Customer retention means keeping existing customers over time, while a repeat purchase shows that a customer has returned to buy again. Strong retention can result from a good product, reliable service, personalization, convenience, or loyalty to the brand. The opposite of retention is churn, and the churn rate is the percentage of customers lost during a given period. Churn is especially important in subscription businesses, where a company may acquire many users but still struggle if too many leave quickly. Looking only at new customer numbers can therefore hide a serious problem in the customer relationship. A useful long-term measure is customer lifetime value (CLV/LTV), the projected net profit from a customer over the entire relationship. This encourages marketers to think beyond one transaction. Companies may increase customer value through upselling, where a customer is encouraged to buy a higher-priced option, or cross-selling, where related products are offered. Another useful idea is share of wallet (SOW), the portion of a customer's total spending in a category captured by one brand.","hu":"Az új vevő megszerzése a marketingnek csak az egyik része. Az ügyfélmegtartás a meglévő vevők hosszú távú megtartását jelenti, az ismételt vásárlás pedig azt mutatja, hogy a vevő visszatért újra vásárolni. Az erős megtartás fakadhat jó termékből, megbízható kiszolgálásból, személyre szabásból, kényelemből vagy márkahűségből. A megtartás ellentéte a lemorzsolódás, a lemorzsolódási arány pedig az adott időszakban elvesztett vevők százaléka. A lemorzsolódás különösen fontos az előfizetéses vállalkozásokban, ahol egy cég sok felhasználót szerezhet, mégis küzdhet, ha túl sokan távoznak gyorsan. Ha csak az új vevők számát nézzük, az elrejthet egy súlyos problémát az ügyfélkapcsolatban. Hasznos hosszú távú mutató az ügyfélérték (CLV/LTV), vagyis a vevőtől a teljes kapcsolat alatt várható nettó nyereség. Ez arra ösztönzi a marketingest, hogy egyetlen tranzakción túl gondolkodjon. A cégek növelhetik a vevő értékét felfelé értékesítéssel, ahol a vevőt drágább változat választására ösztönzik, vagy keresztértékesítéssel, ahol kapcsolódó termékeket ajánlanak. Egy másik hasznos fogalom a pénztárcarészesedés (SOW), vagyis a vevő adott kategóriára fordított teljes költésének az a hányada, amelyet egy márka szerez meg."},{"k":"c","t":"Retention = keeping existing customers over time. Churn rate = the percentage of customers lost during a period. CLV/LTV = the projected net profit from a customer over the whole relationship.","hu":"Megtartás = a meglévő vevők hosszú távú megtartása. Lemorzsolódási arány = az adott időszakban elvesztett vevők százaléka. CLV/LTV = a vevőtől a teljes kapcsolat alatt várható nettó nyereség.","lab":"KEY METRICS"},{"k":"p","t":"Not every lead has the same value or readiness to buy. A marketing qualified lead (MQL) is a lead that has shown meaningful interest and also meets criteria that make future conversion more likely. Companies can use lead scoring to rank leads according to signals such as website activity, downloads, company size, or expressed interest. This allows marketing teams to focus where it is most useful instead of treating every visitor as if they were at the same stage of the funnel. The customer journey is also shaped by brief moments of high intention. These moments are important because the customer may be especially receptive to useful information. A search result, map listing, review, short video, or well-designed product page can become the decisive touchpoint if it answers the customer's need quickly enough.","hu":"Nem minden érdeklődő egyformán értékes vagy vásárlásra kész. A marketing szempontból minősített érdeklődő (MQL) olyan lead, amely érdemi érdeklődést mutatott, és megfelel azoknak a feltételeknek is, amelyek valószínűbbé teszik a későbbi konverziót. A cégek leadpontozással rangsorolhatják az érdeklődőket olyan jelek alapján, mint a weboldalon végzett tevékenység, a letöltések, a cégméret vagy a kifejezett érdeklődés. Így a marketingcsapat oda összpontosíthat, ahol a leghasznosabb, ahelyett hogy minden látogatót úgy kezelne, mintha a tölcsér ugyanazon pontján lenne. A vásárlói utat rövid, erős szándékú pillanatok is alakítják. Ezek azért fontosak, mert a vevő ilyenkor különösen fogékony a hasznos információra. Egy keresőtalálat, egy térképes találat, egy értékelés, egy rövid videó vagy egy jól megtervezett termékoldal döntő érintkezési ponttá válhat, ha elég gyorsan válaszol a vevő igényére."},{"k":"h","t":"5.4 Growing value after the first purchase","hu":"5.4 Az érték növelése az első vásárlás után"},{"k":"p","t":"After conversion, marketers can increase the value of the customer relationship through upselling and cross-selling. Upselling encourages a customer to choose a higher-priced or more advanced version of a product, while cross-selling recommends related products that complement the original purchase. These techniques work best when they genuinely improve the customer's solution. An irrelevant recommendation may increase short-term pressure but damage trust, whereas a well-timed complementary offer can make the customer experience easier and more useful. A related concept is share of wallet (SOW), the proportion of a customer's total spending in a category that goes to one brand. A customer may be loyal enough to buy repeatedly from a company but still divide spending among several competitors. Increasing share of wallet can therefore be a different objective from simply increasing the number of customers. It may involve broader product choice, better personalization, loyalty benefits, or more effective cross-selling. This perspective reinforces the idea that marketing performance should be evaluated across the whole relationship rather than only at the first transaction.","hu":"A konverzió után a marketingesek felfelé értékesítéssel és keresztértékesítéssel növelhetik az ügyfélkapcsolat értékét. A felfelé értékesítés drágább vagy fejlettebb változat választására ösztönzi a vevőt, míg a keresztértékesítés olyan kapcsolódó termékeket ajánl, amelyek kiegészítik az eredeti vásárlást. Ezek a technikák akkor működnek a legjobban, ha valóban javítják a vevő megoldását. Egy irreleváns ajánlás rövid távon nyomást gyakorolhat, de rombolja a bizalmat, míg egy jól időzített kiegészítő ajánlat könnyebbé és hasznosabbá teheti az ügyfélélményt. Kapcsolódó fogalom a pénztárcarészesedés (SOW), vagyis a vevő adott kategóriára fordított teljes költésének az a hányada, amely egy márkához kerül. Egy vevő lehet elég hűséges ahhoz, hogy ismételten vásároljon egy cégtől, de közben több versenytárs között oszthatja meg a költését. A pénztárcarészesedés növelése ezért más cél lehet, mint egyszerűen a vevők számának növelése. Járhat szélesebb termékválasztékkal, jobb személyre szabással, hűségelőnyökkel vagy hatékonyabb keresztértékesítéssel. Ez a nézőpont megerősíti, hogy a marketingteljesítményt a teljes kapcsolat mentén kell értékelni, nem csak az első tranzakciónál."},{"k":"c","t":"Upselling encourages a customer to choose a higher-priced option. Cross-selling recommends related products. Share of wallet (SOW) = the portion of category spending captured by one brand.","hu":"A felfelé értékesítés drágább változat választására ösztönöz. A keresztértékesítés kapcsolódó termékeket ajánl. Pénztárcarészesedés (SOW) = a kategóriára fordított költés egy márkához kerülő hányada.","lab":"DEFINITION"},{"k":"p","t":"The relationship between customer lifetime value (CLV/LTV), retention, and churn is particularly important in subscription and service businesses. A company with strong acquisition but high churn rate may appear successful at first because many new users are joining, yet long-term value remains weak if those users leave quickly. By contrast, modest acquisition combined with strong customer retention, repeated purchases, and increasing share of wallet can create a more stable customer base. This is why funnel management must continue beyond conversion.","hu":"Az ügyfélérték (CLV/LTV), a megtartás és a lemorzsolódás viszonya különösen fontos az előfizetéses és szolgáltató vállalkozásokban. Egy erős ügyfélszerzésű, de magas lemorzsolódású cég elsőre sikeresnek tűnhet, mert sok új felhasználó érkezik, a hosszú távú érték mégis gyenge marad, ha ezek gyorsan távoznak. Ezzel szemben a szerényebb ügyfélszerzés erős megtartással, ismételt vásárlásokkal és növekvő pénztárcarészesedéssel stabilabb vevőkört hozhat létre. Ezért kell a tölcsér kezelésének a konverzión túl is folytatódnia."},{"k":"h","t":"6. Digital marketing channels","hu":"6. Digitális marketingcsatornák"},{"k":"p","t":"Digital marketing or online marketing refers to marketing carried out through digital channels, allowing companies to reach audiences quickly, personalize communication, collect performance data, and interact directly with customers. It is not a single tool; it includes content, social media, search, email, online advertising, influencers, partner programs, and integrated channel strategies.","hu":"A digitális (online) marketing digitális csatornákon végzett marketinget jelent, amely lehetővé teszi, hogy a cégek gyorsan érjenek el közönséget, személyre szabják a kommunikációt, teljesítményadatot gyűjtsenek, és közvetlenül lépjenek kapcsolatba a vevőkkel. Nem egyetlen eszköz: magában foglalja a tartalmat, a közösségi médiát, a keresőt, az e-mailt, az online hirdetést, az influenszereket, a partnerprogramokat és az összehangolt csatornastratégiákat."},{"k":"c","t":"Digital marketing = marketing carried out through digital channels. Its strengths include speed, personalization, data collection, and interactivity.","hu":"Digitális marketing = digitális csatornákon végzett marketing. Erősségei közé tartozik a gyorsaság, a személyre szabás, az adatgyűjtés és az interaktivitás.","lab":"DEFINITION"},{"k":"h","t":"6.1 Content and social media marketing","hu":"6.1 Tartalom- és közösségimédia-marketing"},{"k":"p","t":"Content marketing involves creating and distributing valuable content in order to attract and retain an audience. The content may be educational, entertaining, inspirational, or practical, depending on the brand and target market. A content strategy determines what content should be created, for whom, through which channels, and for what purpose, while content creation is the actual production of materials such as video, text, images, articles, or podcasts. Common forms of online content include a blog, a post, and other materials published on digital platforms. On social networks, customers may react with a like, write a comment, or share content with others. These interactions contribute to engagement, which reflects how actively audiences interact with content rather than simply seeing it. Social media marketing uses social networks to reach and interact with customers. Brands can publish their own content, respond to communities, run paid campaigns, and work with an influencer, a person whose online presence can affect the purchasing decisions of followers. Influencer marketing can be effective because the message is delivered through a recognizable person rather than only through the brand itself. Another important form of content is user-generated content (UGC), which is created by customers rather than by the brand. Reviews, photos, videos, and personal recommendations can make communication feel more credible because they show real users interacting with the product. UGC can also strengthen social proof and word-of-mouth.","hu":"A tartalommarketing értékes tartalom készítését és terjesztését jelenti azzal a céllal, hogy közönséget vonzzon és megtartson. A tartalom lehet oktató, szórakoztató, inspiráló vagy gyakorlatias, a márkától és a célpiactól függően. A tartalomstratégia meghatározza, milyen tartalom készüljön, kinek, milyen csatornákon és milyen céllal, míg a tartalomkészítés maga az anyagok – videó, szöveg, kép, cikk vagy podcast – előállítása. Az online tartalom gyakori formái a blog, a poszt és a digitális platformokon közzétett egyéb anyagok. A közösségi hálózatokon a vevők lájkkal reagálhatnak, kommentet írhatnak vagy megoszthatják a tartalmat másokkal. Ezek az interakciók adják a bevonódást, amely azt tükrözi, milyen aktívan lép kapcsolatba a közönség a tartalommal, nem csupán látja azt. A közösségimédia-marketing a közösségi hálózatokat használja a vevők elérésére és a velük való kapcsolattartásra. A márkák közzétehetik a saját tartalmaikat, válaszolhatnak a közösségeknek, fizetett kampányokat futtathatnak, és dolgozhatnak influenszerrel, vagyis olyan személlyel, akinek az online jelenléte hatni tud a követői vásárlási döntéseire. Az influenszer-marketing azért lehet hatékony, mert az üzenetet egy felismerhető személy közvetíti, nem csak maga a márka. Egy másik fontos tartalomforma a felhasználók által készített tartalom (UGC), amelyet a vevők, nem pedig a márka állít elő. Az értékelések, fotók, videók és személyes ajánlások hitelesebbé tehetik a kommunikációt, mert valódi felhasználókat mutatnak a termékkel. Az UGC erősítheti a társas bizonyítékot és a szájreklámot is."},{"k":"c","t":"Content marketing creates valuable content to attract and retain an audience. Engagement shows how actively audiences interact with content. UGC = user-generated content created by customers.","hu":"A tartalommarketing értékes tartalommal vonz és tart meg közönséget. A bevonódás azt mutatja, milyen aktívan lép kapcsolatba a közönség a tartalommal. UGC = a vevők által készített tartalom.","lab":"KEY TERMS"},{"k":"h","t":"6.2 Search and paid digital advertising","hu":"6.2 Kereső és fizetett digitális hirdetés"},{"k":"p","t":"Search engines are a major point of contact between customer needs and company offers. Search engine optimization (SEO) focuses on improving a website so that it can appear more prominently in unpaid search results. Search engine marketing (SEM) refers to paid marketing on search engines, often using Pay-per-click (PPC) advertising, where the advertiser pays when a user clicks the ad. Online advertising also includes display ads or banner ads, which appear visually on websites and apps. Different formats can serve different goals: some are better for visibility and awareness, while others are designed to generate traffic or conversions. Companies can also use remarketing or retargeting to show ads to users who previously visited a website or app. This keeps the brand visible after the initial visit and gives the company another opportunity to encourage action. Retargeting is especially useful when the customer journey is longer and people rarely buy on their first visit.","hu":"A keresők a vevői igények és a céges ajánlatok egyik fő találkozási pontjai. A keresőoptimalizálás (SEO) a weboldal fejlesztésére összpontosít, hogy előkelőbb helyen jelenjen meg a nem fizetett találatok között. A keresőmarketing (SEM) a keresőkben végzett fizetett marketinget jelenti, gyakran kattintásalapú (PPC) hirdetéssel, ahol a hirdető akkor fizet, ha a felhasználó rákattint a hirdetésre. Az online hirdetéshez tartoznak a display vagy banner hirdetések is, amelyek vizuálisan jelennek meg weboldalakon és alkalmazásokban. A különböző formátumok más-más célt szolgálhatnak: egyesek a láthatóságot és az ismertséget segítik, mások forgalom vagy konverzió generálására készülnek. A cégek remarketinget vagy retargetinget is használhatnak, hogy azoknak mutassanak hirdetést, akik korábban jártak a weboldalon vagy az alkalmazásban. Ez az első látogatás után is szem előtt tartja a márkát, és újabb lehetőséget ad a cselekvésre ösztönzésre. A retargeting különösen hasznos, ha a vásárlói út hosszabb, és az emberek ritkán vásárolnak az első látogatáskor."},{"k":"c","t":"SEO improves visibility in unpaid search results. SEM usually refers to paid search marketing. PPC means the advertiser pays when a user clicks the ad. Retargeting shows ads again to users who previously visited.","hu":"A SEO a nem fizetett találatok közötti láthatóságot javítja. A SEM rendszerint fizetett keresőmarketinget jelent. A PPC azt jelenti, hogy a hirdető akkor fizet, ha a felhasználó rákattint. A retargeting újra hirdetést mutat azoknak, akik korábban jártak az oldalon.","lab":"TOOLS & TECHNIQUES"},{"k":"h","t":"6.3 Email, referrals, and partner-based promotion","hu":"6.3 E-mail, ajánlás és partneralapú promóció"},{"k":"p","t":"Email marketing uses email to communicate directly with customers or leads supporting acquisition, conversion, retention, and customer service. A more automated approach is drip marketing, where a sequence of scheduled messages is sent over time. For example, a new subscriber might receive a welcome email, a product guide several days later, and a special offer after that. In affiliate marketing, external partners promote a company's products and receive a commission when their activity produces a sale or another agreed result. A referral program works differently by encouraging existing customers to recommend the product, often in exchange for a reward. These approaches use external networks to extend reach beyond the company's own channels. Marketing can also benefit from earned media, meaning publicity gained through public relations, customer advocacy, or other unpaid attention. Earned media can be valuable because it is not purchased directly by the brand, although the company has less control over exactly how it appears.","hu":"Az e-mail marketing e-mailen keresztül tart közvetlen kapcsolatot a vevőkkel vagy az érdeklődőkkel, támogatva az ügyfélszerzést, a konverziót, a megtartást és az ügyfélszolgálatot. Automatizáltabb megközelítés a csepegtetett (drip) marketing, amelyben ütemezett üzenetsorozatot küldenek ki idővel elosztva. Egy új feliratkozó például kaphat üdvözlő e-mailt, néhány nappal később termékútmutatót, majd egy különleges ajánlatot. Az affiliate marketingben külső partnerek népszerűsítik a cég termékeit, és jutalékot kapnak, ha a tevékenységük eladást vagy más megállapodott eredményt hoz. Az ajánlói program másként működik: a meglévő vevőket ösztönzi a termék ajánlására, gyakran jutalom fejében. Ezek a megoldások külső hálózatokkal terjesztik ki az elérést a cég saját csatornáin túl. A marketing a megszerzett (earned) médiából is profitálhat, vagyis abból a nyilvánosságból, amelyet PR, vevői szószólás vagy más nem fizetett figyelem hoz. A megszerzett média értékes lehet, mert a márka nem közvetlenül vásárolja meg, ugyanakkor a cég kevésbé tudja befolyásolni, pontosan hogyan jelenik meg."},{"k":"c","t":"Drip marketing = a scheduled sequence of messages over time. Affiliate marketing uses partners who earn commission for results. Earned media is unpaid attention gained through PR or advocacy.","hu":"Csepegtetett marketing = ütemezett üzenetsorozat idővel elosztva. Az affiliate marketing eredményért jutalékot kapó partnereket használ. A megszerzett média PR vagy szószólás révén szerzett, nem fizetett figyelem.","lab":"TOOLS & TECHNIQUES"},{"k":"h","t":"6.4 Multichannel and omnichannel marketing","hu":"6.4 Többcsatornás és omnichannel marketing"},{"k":"p","t":"Customers often move between several platforms before making a decision. Multichannel marketing means using multiple channels to interact with consumers, such as social media, email, websites, physical stores, and advertising. The channels may all be active, but not necessarily fully connected. Omnichannel marketing goes further by coordinating these channels to create a seamless and consistent customer experience. A customer might discover a product on social media, compare it on a website, ask a question in a chat, and finally purchase it in a store. In an omnichann el system, these interactions should feel like parts of one relationship rather than separate experiences. The effectiveness of social media also depends on the difference between audience size and audience activity. A follower or subscriber has chosen to receive updates, but that does not guarantee active attention. Marketers therefore monitor whether users react, comment, save, or share content. High engagement can indicate that content is relevant to the audience, although the meaning of engagement still depends on the objective. A humorous post may generate many reactions but contribute little to conversion, while a highly specific product demonstration may rea ch fewer people but attract stronger purchase intent. Digital communication can also generate word-of-mouth (WOM), where customers recommend products to other people. WOM may occur publicly through reviews and social media or privately through messages and conversations. Private sharing is sometimes described as dark social because the original source of the recommendation can be difficult for analytics systems to trace. This makes attribution more complicated: a person may click a direct link and appear to have arrived independently even though the real influence was a recommendation received in a private message. Partnership-based communication can extend a brand's reach without relying only on traditional advertising. Affinity marketing involves cooperation between complementary brands that share compatible audiences or values. A travel company and a luggage brand, for example, may create a joint offer because their products solve related customer needs. The partnership can strengthen credibility and expose both companies to relevant new customers, but it works best when the connection between the brands feels natural rather than artificial. The distinction between multichannel marketing and omnichannel marketing is crucial as the number of digital and physical touchpoints grows. A multichannel company may be active on email, social media, and in stores, but each channel can still operate separately. In an omnichannel system, information and experience are coordinated so that the customer can move between channels without unnecessary repetition or contradiction. This may include consistent prices, synchronized customer data, and communication that recognizes what the customer has already done elsewhere.","hu":"A vevők gyakran több platform között mozognak, mielőtt döntenek. A többcsatornás marketing több csatorna használatát jelenti a fogyasztókkal való kapcsolattartásra: közösségi médiát, e-mailt, weboldalt, fizikai boltot és hirdetést. A csatornák mind aktívak lehetnek, de nem feltétlenül kapcsolódnak össze teljesen. Az omnichannel marketing továbbmegy: összehangolja ezeket a csatornákat, hogy zökkenőmentes és egységes ügyfélélményt teremtsen. Egy vevő felfedezhet egy terméket a közösségi médiában, összehasonlíthatja egy weboldalon, kérdezhet egy chatben, és végül megveheti egy boltban. Az omnichannel rendszerben ezeknek az érintkezéseknek egyetlen kapcsolat részeiként kell hatniuk, nem különálló élményekként. A közösségi média hatékonysága a közönség mérete és aktivitása közötti különbségen is múlik. Egy követő vagy feliratkozó úgy döntött, hogy értesüléseket kap, de ez nem garantálja az aktív figyelmet. A marketingesek ezért figyelik, hogy a felhasználók reagálnak-e, kommentelnek-e, mentenek-e vagy megosztanak-e tartalmat. A magas bevonódás jelezheti, hogy a tartalom releváns a közönségnek, bár a bevonódás jelentése a céltól is függ. Egy vicces poszt sok reakciót hozhat, de keveset a konverzióhoz, míg egy nagyon konkrét termékbemutató kevesebb emberhez juthat el, mégis erősebb vásárlási szándékot kelthet. A digitális kommunikáció szájreklámot (WOM) is generálhat, amikor a vevők másoknak ajánlják a terméket. A szájreklám történhet nyilvánosan, értékelésekben és a közösségi médiában, vagy privátban, üzenetekben és beszélgetésekben. A privát megosztást olykor „dark social”-nak nevezik, mert az ajánlás eredeti forrását az elemzőrendszerek nehezen tudják visszakövetni. Ettől bonyolultabb a hozzárendelés: valaki rákattinthat egy közvetlen linkre, és úgy tűnhet, magától érkezett, holott valójában egy privát üzenetben kapott ajánlás hatott rá. A partnerségi kommunikáció a hagyományos hirdetésen túl is kiterjesztheti a márka elérését. Az affinitásmarketing olyan kiegészítő márkák együttműködése, amelyek közönsége vagy értékrendje összeillik. Egy utazási iroda és egy bőröndmárka például közös ajánlatot hozhat létre, mert a termékeik kapcsolódó vevői igényeket elégítenek ki. Az együttműködés erősítheti a hitelességet, és mindkét céget új, releváns vevőknek mutathatja meg, de akkor működik a legjobban, ha a márkák közötti kapcsolat természetesnek hat, nem erőltetettnek. A többcsatornás és az omnichannel marketing közötti különbség egyre fontosabb, ahogy nő a digitális és fizikai érintkezési pontok száma. Egy többcsatornás cég aktív lehet e-mailben, a közösségi médiában és a boltjaiban, de minden csatorna külön működhet. Az omnichannel rendszerben az információ és az élmény össze van hangolva, így a vevő felesleges ismétlés vagy ellentmondás nélkül mozoghat a csatornák között. Ez jelenthet egységes árakat, szinkronizált ügyféladatokat és olyan kommunikációt, amely tudja, mit tett a vevő máshol."},{"k":"c","t":"Multichannel = the brand uses several channels. Omnichannel = those channels are coordinated into one seamless customer experience.","hu":"Többcsatornás = a márka több csatornát használ. Omnichannel = ezek a csatornák egyetlen, zökkenőmentes ügyfélélménnyé vannak összehangolva.","lab":"KEY DISTINCTION"},{"k":"h","t":"7. Measuring marketing performance","hu":"7. A marketingteljesítmény mérése"},{"k":"p","t":"Modern marketing is increasingly measurable. Companies can track whether campaigns reach the int
