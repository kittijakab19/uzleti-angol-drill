zens elect representatives who make laws and govern on their behalf. This is the basic model used in countries such as Germany, Hungary, Canada, Australia, and the United Kingdom. Elections alone, however, are not sufficient. Democratic systems also depend on political freedom, civil liberties, legal competition between political parties, access to information, and institutions that can limit government power. Direct democracy gives citizens a more immediate role in deciding specific political questions, most commonly through a referendum. Switzerland is the best-known example because national, cantonal, and local referendums are a regular part of political life, and citizens vote several times in many years on constitutional amendments, laws, and popular initiatives. Ireland also makes im portant use of referendums, particularly because constitutional amendments must be approved by voters; major examples include votes on marriage equality in 2015 and abortion law in 2018. Elements of direct democracy also appear below national level in countries such as the United States, where some states use ballot initiatives and referendums to decide issues directly. Authoritarianism describes systems in which political competition, participation, and civil liberties are substantially restricted and political power is concentrated in the hands of a leader or a small group. A dictatorship is an extreme form in which rulers face few effective institutional constraints and citizens have little realistic possibility of replacing them through competitive elections. The contrast with democracy is therefore not simply whether voting occurs, because some authoritarian systems also hold elections. The more important questions are whether opposition can compete freely, whether the media can operate independently, whether civil liberties are protected, and whether political leaders can genuinely lose power through established procedures.","hu":"A demokrácia olyan politikai rendszer, amelyben a politikai hatalom végső forrása a nép, és a vezetők érdemi politikai részvétel révén számon kérhetők. A legtöbb mai demokrácia képviseleti demokrácia: az állampolgárok képviselőket választanak, akik helyettük hoznak törvényt és kormányoznak. Ez az alapmodell működik például Németországban, Magyarországon, Kanadában, Ausztráliában és az Egyesült Királyságban. Önmagában azonban a választás nem elég. A demokratikus rendszerek a politikai szabadságon, a szabadságjogokon, a pártok közötti jogszerű versenyen, az információhoz való hozzáférésen és a kormányzati hatalmat korlátozni képes intézményeken is nyugszanak. A közvetlen demokrácia közvetlenebb szerepet ad az állampolgároknak konkrét politikai kérdések eldöntésében, leggyakrabban népszavazás formájában. Svájc a legismertebb példa, mert a szövetségi, kantoni és helyi népszavazás a politikai élet rendszeres része, és az emberek sok évben többször is szavaznak alkotmánymódosításokról, törvényekről és népi kezdeményezésekről. Írország is jelentősen él a népszavazással, különösen mert az alkotmánymódosításokat a választóknak jóvá kell hagyniuk; fontos példák a 2015-ös házassági egyenlőségről és a 2018-as abortuszszabályozásról szóló szavazások. A közvetlen demokrácia elemei országos szint alatt is megjelennek, például az Egyesült Államokban, ahol egyes tagállamok népi kezdeményezéssel és népszavazással döntenek kérdésekről. A tekintélyelvűség olyan rendszereket ír le, amelyekben a politikai verseny, a részvétel és a szabadságjogok jelentősen korlátozottak, a politikai hatalom pedig egyetlen vezető vagy egy szűk csoport kezében összpontosul. A diktatúra ennek szélsőséges formája, amelyben a vezetőket alig korlátozzák intézmények, és az állampolgároknak nincs reális esélyük versengő választáson leváltani őket. A demokráciával való szembenállás tehát nem pusztán azon múlik, tartanak-e szavazást, hiszen egyes tekintélyelvű rendszerekben is vannak választások. A fontosabb kérdések: szabadon versenghet-e az ellenzék, működhet-e függetlenül a média, védettek-e a szabadságjogok, és valóban elveszíthetik-e a vezetők a hatalmat a bevett eljárások útján."},{"k":"c","t":"Democracy: leaders can be held accountable through meaningful political participation, political freedom, civil liberties, and genuine competition. Authoritarianism: political competition, participation, and civil liberties are substantially restricted and power is concentrated.","hu":"Demokrácia: a vezetők érdemi politikai részvétel, politikai szabadság, szabadságjogok és valódi verseny révén számon kérhetők. Tekintélyelvűség: a politikai verseny, a részvétel és a szabadságjogok jelentősen korlátozottak, a hatalom pedig összpontosul.","lab":"KEY DISTINCTION"},{"k":"h","t":"2.2 Republics and monarchies","hu":"2.2 Köztársaságok és monarchiák"},{"k":"p","t":"A republic is a state in which the head of state is not a hereditary monarch. In many republics the president serves as head of state, although the political importance of that office varies greatly. The president of the United States is both head of state and head of government, while in parliamentary republics such as Germany, Italy, or Hungary the president performs mainly constitutional and representative functions and the prime minister leads the government. A monarchy has a hereditary monarch, such as a king or queen, as head of state. In a constitutional monarchy, the monarch's powers are limited by constitutional rules and elected institutions. The United Kingdom, Sweden, Spain, the Netherlands, Norway, Denmark, and Japan are familiar examples. In these systems, the monarch performs ceremonial and symbolic duties, while political leadership belongs to an elected head of government, normally a prime minister. This shows why head of state and head of government should not be treated as synonyms: they may be the same person in some systems but completely different offices in others.","hu":"A köztársaság olyan állam, amelynek államfője nem örökletes uralkodó. Sok köztársaságban az elnök tölti be az államfői tisztet, bár e tisztség politikai súlya nagyon eltérő. Az Egyesült Államok elnöke egyszerre államfő és kormányfő, míg a parlamentáris köztársaságokban – például Németországban, Olaszországban vagy Magyarországon – az elnök főként alkotmányos és reprezentatív feladatokat lát el, a kormányt pedig a miniszterelnök vezeti. A monarchiában örökletes uralkodó, például király vagy királynő az államfő. Az alkotmányos monarchiában az uralkodó hatalmát alkotmányos szabályok és választott intézmények korlátozzák. Ismert példák az Egyesült Királyság, Svédország, Spanyolország, Hollandia, Norvégia, Dánia és Japán. Ezekben a rendszerekben az uralkodó ceremoniális és jelképes feladatokat lát el, a politikai vezetés pedig a választott kormányfőt, rendszerint a miniszterelnököt illeti. Ez mutatja, miért nem szabad az államfőt és a kormányfőt szinonimaként kezelni: egyes rendszerekben ugyanaz a személy tölti be mindkettőt, másokban teljesen különálló tisztségekről van szó."},{"k":"c","t":"Republic: the head of state is not a hereditary monarch. Monarchy: a hereditary monarch is head of state. Head of state and head of government may be the same person or two different offices.","hu":"Köztársaság: az államfő nem örökletes uralkodó. Monarchia: örökletes uralkodó az államfő. Az államfő és a kormányfő lehet ugyanaz a személy, de lehet két különböző tisztség is.","lab":"KEY DISTINCTION"},{"k":"h","t":"2.3 Parliamentary and presidential systems","hu":"2.3 Parlamentáris és elnöki rendszerek"},{"k":"p","t":"In a parliamentary system, the government depends on the confidence of parliament. The prime minister is normally the central political leader, and the cabinet is formed from the governing party or parties. The United Kingdom, Germany, Hungary, Sweden, and the Netherlands all use parliamentary systems, although their electoral rules and constitutional traditions differ. Coalition government is especially common where proportional electoral systems produce several significant parties; Germany and the Netherlands frequently have governments formed by two or more parties that negotiate a common programme. In a presidential system, the president is separately elected from the legislature and normally serves a fixed term. The United States, Brazil, and Mexico provide well-known examples. Because the president and legislature have separate democratic mandates, they can be controlled by different parties, creating stronger institutional separation but also the possibility of political deadlock. Some countries combine elements of both systems. France, for example, has both a directly elected president and a prime minister responsible to parliament, which is why it is usually described as semi-presidential. Comparing these arrangements helps explain why the same title can imply different powers in different countries.","hu":"A parlamentáris rendszerben a kormány a parlament bizalmától függ. A miniszterelnök rendszerint a központi politikai vezető, a kabinet pedig a kormányzó pártból vagy pártokból alakul. Az Egyesült Királyság, Németország, Magyarország, Svédország és Hollandia mind parlamentáris rendszert használ, bár a választási szabályaik és alkotmányos hagyományaik eltérnek. A koalíciós kormányzás különösen gyakori ott, ahol az arányos választási rendszer több jelentős pártot eredményez; Németországban és Hollandiában gyakran két vagy több párt alakít kormányt, amelyek közös programban állapodnak meg. Az elnöki rendszerben az elnököt a törvényhozástól külön választják, és rendszerint fix ideig marad hivatalban. Jól ismert példa az Egyesült Államok, Brazília és Mexikó. Mivel az elnöknek és a törvényhozásnak külön demokratikus felhatalmazása van, más-más párt is uralhatja őket, ami erősebb intézményi elválasztást, de politikai patthelyzetet is eredményezhet. Egyes országok a két rendszer elemeit kombinálják. Franciaországban például közvetlenül választott elnök és a parlamentnek felelős miniszterelnök is van, ezért szokás félelnöki rendszerként leírni. E megoldások összevetése segít megérteni, miért járhat ugyanaz a cím eltérő hatalommal a különböző országokban."},{"k":"c","t":"Parliamentary system: the government depends on the confidence of parliament. Presidential system: the president is separately elected from the legislature and normally serves a fixed term. Semi-presidential system: combines a directly elected president with a prime minister responsible to parliament.","hu":"Parlamentáris rendszer: a kormány a parlament bizalmától függ. Elnöki rendszer: az elnököt a törvényhozástól külön választják, és rendszerint fix ideig marad hivatalban. Félelnöki rendszer: közvetlenül választott elnököt és a parlamentnek felelős miniszterelnököt kombinál.","lab":"AT A GLANCE"},{"k":"h","t":"3. Political institutions and the separation of powers","hu":"3. Politikai intézmények és a hatalmi ágak szétválasztása"},{"k":"p","t":"Political institutions convert general constitutional principles into practical decision-making. Democracies normally distribute important functions among different bodies so that no single office controls every part of the political process. The classic framework distinguishes the legislature, the executive, and the judiciary. The exact balance differs by country, but the underlying idea is to make public power both effective and accountable.","hu":"A politikai intézmények váltják át az általános alkotmányos elveket gyakorlati döntéshozatallá. A demokráciák rendszerint úgy osztják el a fontos feladatokat a különböző testületek között, hogy egyetlen tisztség se ellenőrizze a politikai folyamat minden részét. A klasszikus keret a törvényhozó, a végrehajtó és a bírói hatalmat különbözteti meg. A pontos egyensúly országonként eltér, de az alapgondolat az, hogy a közhatalom egyszerre legyen hatékony és elszámoltatható."},{"k":"h","t":"3.1 The three branches of government","hu":"3.1 A három hatalmi ág"},{"k":"p","t":"The legislative branch makes, debates, and approves laws; the executive branch implements laws and directs public administration; and the judicial branch interprets laws and settles legal disputes. The principle of separation of powers aims to prevent an excessive concentration of authority. It is particularly visible in the United States, where Congress, the president, and the federal courts have distinct constitutional powers. Parliamentary systems such as the United Kingdom or Germany have a closer connection between the executive and legislature because the government emerges from parliament, but they still maintain institutional limits through courts, parliamentary scrutiny, elections, and constitutional rules.","hu":"A törvényhozó hatalmi ág megalkotja, megvitatja és elfogadja a törvényeket; a végrehajtó hatalmi ág végrehajtja a törvényeket és irányítja a közigazgatást; a bírói hatalmi ág pedig értelmezi a törvényeket és rendezi a jogvitákat. A hatalmi ágak szétválasztásának elve a hatalom túlzott összpontosulását hivatott megakadályozni. Ez különösen jól látszik az Egyesült Államokban, ahol a Kongresszusnak, az elnöknek és a szövetségi bíróságoknak elkülönült alkotmányos hatáskörük van. A parlamentáris rendszerekben – például az Egyesült Királyságban vagy Németországban – szorosabb a kapcsolat a végrehajtó és a törvényhozó hatalom között, mert a kormány a parlamentből nő ki, de ott is vannak intézményi korlátok: bíróságok, parlamenti számonkérés, választások és alkotmányos szabályok."},{"k":"c","t":"Legislative branch: makes, debates, and approves laws. Executive branch: implements laws and directs public administration. Judicial branch: interprets laws and settles legal disputes.","hu":"Törvényhozó hatalmi ág: megalkotja, megvitatja és elfogadja a törvényeket. Végrehajtó hatalmi ág: végrehajtja a törvényeket és irányítja a közigazgatást. Bírói hatalmi ág: értelmezi a törvényeket és rendezi a jogvitákat.","lab":"AT A GLANCE"},{"k":"p","t":"Checks and balances are mechanisms through which institutions can limit or review one another. In the United States, for example, Congress passes legislation, the president can veto bills, and courts can review whether laws are constitutional. The Senate also confirms many senior appointments. Other countries use different mechanisms: constitutional courts in Germany, Italy, and Hungary may review legislation, while parliamentary committees can investigate government action in many democracies. The point is not to make institutions permanently fight each other, but to ensure that major political decisions are subject to more than one source of control.","hu":"A fékek és ellensúlyok olyan mechanizmusok, amelyekkel az intézmények korlátozhatják vagy felülvizsgálhatják egymást. Az Egyesült Államokban például a Kongresszus elfogadja a törvényeket, az elnök megvétózhatja a javaslatokat, a bíróságok pedig felülvizsgálhatják a törvények alkotmányosságát. A Szenátus emellett jóváhagyja a magas rangú kinevezéseket. Más országok eltérő eszközöket használnak: Németországban, Olaszországban és Magyarországon az alkotmánybíróság vizsgálhatja felül a jogszabályokat, sok demokráciában pedig parlamenti bizottságok vizsgálhatják a kormány működését. A cél nem az, hogy az intézmények folyamatosan harcoljanak egymással, hanem hogy a fontos politikai döntések egynél több kontrollpont alá essenek."},{"k":"c","t":"Checks and balances allow institutions to limit or review one another. The aim is to ensure that major political decisions are subject to more than one source of control.","hu":"A fékek és ellensúlyok lehetővé teszik, hogy az intézmények korlátozzák vagy felülvizsgálják egymást. A cél, hogy a fontos politikai döntések egynél több kontrollpont alá essenek.","lab":"QUICK RECAP"},{"k":"h","t":"3.2 The legislature","hu":"3.2 A törvényhozás"},{"k":"p","t":"The legislature is the institution responsible for making laws and representing the electorate. It is often called parliament, although terminology varies. Individual elected representatives may be called MPs, or Members of Parliament, as in the United Kingdom and Hungary. Some legislatures have one chamber, while others have an upper house and a lower house. Hungary and Sweden have unicameral parliaments, whereas the United States has the House of Representatives and Senate, the United Kingdom has the House of Commons and House of Lords, and Germany combines the Bundestag with the Bundesrat, which represents the federal states. A proposed law is generally called a bill before it is finally approved. Bills normally pass through several stages involving debate, committee examination, possible amendment, and voting. Once enacted, the result becomes legislation, a law, or an act depending on the legal terminology of the country. Committees are especially important because they allow smaller groups of legislators to examine proposals in detail, hear experts, question ministers, or investigate specific issues. In the United States, congressional committees play a major role in shaping legislation, while select committees in the British Parliament regularly scrutinise government departments and public policy.","hu":"A törvényhozás az az intézmény, amely a törvények megalkotásáért és a választók képviseletéért felel. Gyakran parlamentnek hívják, bár a szóhasználat eltérő. Az egyes megválasztott képviselőket nevezhetik MP-nek, vagyis parlamenti képviselőnek, ahogy az Egyesült Királyságban és Magyarországon. Egyes törvényhozások egykamarásak, másoknak felsőházuk és alsóházuk is van. Magyarországon és Svédországban egykamarás a parlament, míg az Egyesült Államokban a Képviselőház és a Szenátus, az Egyesült Királyságban az alsóház és a Lordok Háza működik, Németországban pedig a Bundestag mellett a tagállamokat képviselő Bundesrat is. A törvényjavaslatot a végső elfogadás előtt általában „bill”-nek nevezik. A javaslatok rendszerint több szakaszon mennek át: vita, bizottsági vizsgálat, esetleges módosítás és szavazás. Elfogadás után az eredmény az adott ország jogi szóhasználatától függően jogszabály, törvény vagy „act” lesz. A bizottságok különösen fontosak, mert lehetővé teszik, hogy kisebb képviselői csoportok részletesen vizsgálják a javaslatokat, szakértőket hallgassanak meg, minisztereket kérdezzenek vagy konkrét ügyeket vizsgáljanak ki. Az Egyesült Államokban a kongresszusi bizottságok nagy szerepet játszanak a jogalkotás alakításában, a brit parlament különbizottságai pedig rendszeresen ellenőrzik a minisztériumokat és a közpolitikát."},{"k":"c","t":"Bill → debate → committee examination → possible amendment → voting → legislation / law / act.","hu":"Törvényjavaslat → vita → bizottsági vizsgálat → esetleges módosítás → szavazás → jogszabály/törvény.","lab":"PROCESS"},{"k":"h","t":"3.3 The executive","hu":"3.3 A végrehajtó hatalom"},{"k":"p","t":"The executive is responsible for governing and for putting laws and policies into practice. In parliamentary systems, the prime minister usually leads the government together with the cabinet. Individual ministers are responsible for policy areas such as finance, foreign affairs, education, defence, or health, and each ministry contains officials who prepare and implement policy. The structure is similar across many European democracies even though job titles and constitutional powers differ. The term administration can refer broadly to the executive institutions operating under a political leadership, and in the United States it is commonly used for a president and the officials serving during that presidency, as in the Biden or Trump administration. The civil service consists mainly of professional public officials who remain in place when political leaders change. This continuity is important in countries such as the United Kingdom, Germany, France, and Hungary because governments may change after elections, but public administration must continue to collect taxes, run schools, manage records, and deliver services.","hu":"A végrehajtó hatalom felel a kormányzásért, valamint a törvények és intézkedések gyakorlatba ültetéséért. A parlamentáris rendszerekben a kormányt rendszerint a miniszterelnök vezeti a kabinettel együtt. Az egyes miniszterek olyan szakterületekért felelnek, mint a pénzügy, a külügy, az oktatás, a védelem vagy az egészségügy, és minden minisztériumban dolgoznak tisztviselők, akik előkészítik és végrehajtják a szakpolitikát. A felépítés sok európai demokráciában hasonló, még ha a titulusok és az alkotmányos jogkörök különböznek is. Az „administration” kifejezés tágabban utalhat egy politikai vezetés alatt működő végrehajtó intézményekre, az Egyesült Államokban pedig általában egy elnököt és az adott elnöksége idején szolgáló tisztviselőket jelenti, mint a Biden- vagy a Trump-adminisztráció. A közszolgálatot főként hivatásos köztisztviselők alkotják, akik a politikai vezetés cseréjekor is a helyükön maradnak. Ez a folytonosság fontos olyan országokban, mint az Egyesült Királyság, Németország, Franciaország és Magyarország, mert a kormányok választások után változhatnak, de a közigazgatásnak tovább kell szednie az adót, működtetnie az iskolákat, vezetnie a nyilvántartásokat és nyújtania a szolgáltatásokat."},{"k":"h","t":"3.4 The judiciary and the rule of law","hu":"3.4 Az igazságszolgáltatás és a jogállamiság"},{"k":"p","t":"The judiciary consists of courts and judges that interpret and apply the law. At the highest level, countries may have a Supreme Court, a Constitutional Court, or both. The United States Supreme Court is the highest federal court and has an important role in constitutional interpretation. Germany's Federal Constitutional Court and Hungary's Constitutional Court specialise in constitutional questions, while the United Kingdom Supreme Court is the final court of appeal for many legal matters but operates within a different constitutional tradition. The rule of law means that political leaders, public institutions, and ordinary citizens are all subject to law rather than arbitrary personal power. Judicial independence supports this principle by allowing judges to decide cases without improper political pressure. Courts can therefore protect civil liberties, settle disputes between institutions, and review government action. The precise powers of courts differ: some can strike down legislation directly, while others rely on different forms of constitutional review, but independent adjudication is a central feature of modern democratic systems.","hu":"Az igazságszolgáltatás bíróságokból és bírákból áll, akik értelmezik és alkalmazzák a jogot. A legfelső szinten az országoknak lehet legfelsőbb bíróságuk, alkotmánybíróságuk vagy mindkettő. Az Egyesült Államok Legfelsőbb Bírósága a legmagasabb szövetségi bíróság, és fontos szerepe van az alkotmányértelmezésben. A német Szövetségi Alkotmánybíróság és a magyar Alkotmánybíróság alkotmányos kérdésekre szakosodott, míg az Egyesült Királyság Legfelsőbb Bírósága sok jogi ügyben a végső fellebbviteli fórum, de más alkotmányos hagyományban működik. A jogállamiság azt jelenti, hogy a politikai vezetők, a közintézmények és a hétköznapi polgárok egyaránt a jognak vannak alávetve, nem önkényes személyes hatalomnak. A bírói függetlenség ezt az elvet támogatja azzal, hogy a bírák indokolatlan politikai nyomás nélkül dönthetnek. A bíróságok így védhetik a szabadságjogokat, rendezhetik az intézmények közötti vitákat, és felülvizsgálhatják a kormányzati lépéseket. A bíróságok pontos hatásköre eltérő: egyesek közvetlenül megsemmisíthetnek jogszabályt, mások más formájú alkotmányossági felülvizsgálatot végeznek, de a független ítélkezés a modern demokratikus rendszerek központi eleme."},{"k":"c","t":"Rule of law = political leaders, public institutions, and citizens are all subject to law rather than arbitrary personal power. Judicial independence allows judges to decide cases without improper political pressure.","hu":"Jogállamiság = a politikai vezetők, a közintézmények és a polgárok egyaránt a jognak vannak alávetve, nem önkényes személyes hatalomnak. A bírói függetlenség lehetővé teszi, hogy a bírák indokolatlan politikai nyomás nélkül döntsenek.","lab":"DEFINITION"},{"k":"h","t":"4. Elections and electoral systems","hu":"4. Választások és választási rendszerek"},{"k":"p","t":"Elections are the main mechanism through which representative democracies convert citizens' preferences into political offices. However, the way votes are translated into seats can differ substantially, which is why two countries with similar levels of voter support can produce very different parliamentary results. Understanding elections therefore requires both the vocabulary of voting and the basic logic of electoral systems.","hu":"A választások a fő mechanizmus, amellyel a képviseleti demokráciák az állampolgárok preferenciáit politikai tisztségekké alakítják. Az azonban, ahogyan a szavazatokból mandátum lesz, jelentősen eltérhet, ezért két hasonló támogatottságú ország nagyon különböző parlamenti eredményt hozhat. A választások megértéséhez tehát a szavazás szókincsére és a választási rendszerek alaplogikájára is szükség van."},{"k":"h","t":"4.1 Elections and voting","hu":"4.1 Választások és szavazás"},{"k":"p","t":"An election is a formal process in which voters choose political representatives or office-holders. A general election normally selects the national legislature, while a local election chooses representatives for municipalities or other subnational authorities. Candidates compete for support from the electorate, meaning the body of people entitled to vote. Suffrage refers to the legal right to vote; universal adult suffrage is now the democratic norm, although historically voting rights were often restricted by property, gender, race, or social status. The individual act of voting is recorded on a ballot, which may be paper-based or electronic depending on the country. Voters usually cast their ballots at a polling station, although postal and advance voting are also common in some systems. Voter turnout measures the percentage of eligible or registered voters who actually vote. Turnout varies considerably: it is often relatively high in countries with strong voting traditions, and some systems use compulsory voting. Even without compulsion, closely contested elections can mobilise large numbers of voters, as seen in many recent national elections in the United States, France, Poland, or the United Kingdom. A constituency is a geographical area represented by one or more elected politicians, and a seat is a position in the legislature. The United Kingdom elects one MP from each constituency to the House of Commons, while other countries use larger multi-member districts. Constituency design matters because boundaries determine which voters are grouped together and can therefore influen ce political competition.","hu":"A választás hivatalos eljárás, amelyben a szavazók politikai képviselőket vagy tisztségviselőket választanak. Az országgyűlési (általános) választás rendszerint a nemzeti törvényhozást választja meg, míg az önkormányzati választás a települések vagy más helyi hatóságok képviselőit. A jelöltek a választópolgárok, vagyis a szavazásra jogosultak támogatásáért versenyeznek. A választójog a szavazás jogi lehetőségét jelenti; az általános felnőtt választójog ma demokratikus norma, bár a történelemben a szavazati jogot gyakran korlátozta a vagyon, a nem, a bőrszín vagy a társadalmi állás. Az egyéni szavazás aktusát szavazólapon rögzítik, amely országtól függően papíralapú vagy elektronikus lehet. A szavazók rendszerint szavazóhelyiségben adják le a voksukat, bár egyes rendszerekben a levélszavazás és az előzetes szavazás is elterjedt. A választási részvétel azt méri, a jogosult vagy regisztrált szavazók hány százaléka szavaz ténylegesen. A részvétel erősen változik: gyakran magas ott, ahol erős a választási hagyomány, és egyes rendszerekben kötelező a szavazás. Kényszer nélkül is sok szavazót mozgósíthat egy kiélezett választás, ahogy az látszott számos friss választáson az Egyesült Államokban, Franciaországban, Lengyelországban vagy az Egyesült Királyságban. A választókerület olyan földrajzi terület, amelyet egy vagy több megválasztott politikus képvisel, a mandátum pedig egy hely a törvényhozásban. Az Egyesült Királyságban minden választókerület egy képviselőt küld az alsóházba, míg más országok nagyobb, több mandátumos körzeteket használnak. A választókerületek kialakítása azért számít, mert a határok döntik el, mely szavazók kerülnek egy csoportba, és így hatnak a politikai versenyre."},{"k":"c","t":"Electorate = the body of people entitled to vote. Suffrage = the legal right to vote. Ballot = the record of an individual vote. Voter turnout = the percentage of eligible or registered voters who actually vote. Constituency = a geographical area represented by one or more elected politicians.","hu":"Választópolgárok = a szavazásra jogosultak köre. Választójog = a szavazás jogi lehetősége. Szavazólap = az egyéni szavazat rögzítése. Választási részvétel = a jogosult vagy regisztrált szavazók hány százaléka szavaz ténylegesen. Választókerület = egy vagy több megválasztott politikus által képviselt földrajzi terület.","lab":"KEY TERMS"},{"k":"h","t":"4.2 Electoral systems","hu":"4.2 Választási rendszerek"},{"k":"p","t":"An electoral system is the set of rules used to translate votes into political representation. Under first-past-the-post, the candidate with the largest number of votes in a constituency wins the seat even without an absolute majority. The United Kingdom and Canada use this model for national lower-house elections, and India also elects members of the Lok Sabha through single-member constituencies. The system is simple and usually creates a direct link between a representative and a geographical constituency, but the national distribution of seats may differ substantially from the national vote share. Proportional representation aims to distribute seats more closely in line with each party's share of the vote. The Netherlands and Israel use highly proportional national systems, while many European states employ proportional rules at least for part of their legislature. A party list allows voters to choose among parties or, in some systems, individual candidates on party lists. An electoral threshold may require a party to receive a minimum percentage of votes before it can gain representation; Germany, for example, normally applies a five-percent threshold in federal elections, while other countries use different levels and exceptions. The words majority and plurality are also important. A majority means more than half of the votes, whereas a plurality simply means more votes than any competing candidate or party. In a three - candidate race, for example, a candidate could win with 42 percent of the vote if the other two receive 35 and 23 percent. Systems such as France's presidential elections use a second round if no candidate achieves the required majority in the first round, while first-past-the-post systems generally award the seat to the plurality winner immediately.","hu":"A választási rendszer azoknak a szabályoknak az összessége, amelyekkel a szavazatokat politikai képviseletté alakítják. A relatív többségi (first-past-the-post) rendszerben az a jelölt szerzi meg a mandátumot a választókerületben, aki a legtöbb szavazatot kapja, akkor is, ha nincs abszolút többsége. Az Egyesült Királyság és Kanada ezt a modellt használja az alsóházi választásokon, és India is egyéni választókerületekben választja a Lok Sabha tagjait. A rendszer egyszerű, és rendszerint közvetlen kapcsolatot teremt a képviselő és egy földrajzi körzet között, de az országos mandátumeloszlás jelentősen eltérhet az országos szavazataránytól. Az arányos képviselet célja, hogy a mandátumokat a pártok szavazatarányához közelebb ossza el. Hollandia és Izrael erősen arányos országos rendszert használ, sok európai állam pedig legalább a törvényhozás egy részében alkalmaz arányos szabályokat. A pártlista lehetővé teszi, hogy a választók pártok közül – egyes rendszerekben a listán szereplő jelöltek közül – válasszanak. A bejutási küszöb azt írhatja elő, hogy egy párt csak a szavazatok adott minimális arányával juthat képviselethez; Németországban például a szövetségi választásokon általában ötszázalékos küszöb érvényes, míg más országok eltérő szinteket és kivételeket alkalmaznak. A többség és a relatív többség szavak is fontosak. A többség a szavazatok több mint felét jelenti, míg a relatív többség egyszerűen több szavazatot, mint bármely versenytárs jelölt vagy párt. Egy háromjelöltes versenyben például egy jelölt 42 százalékkal is nyerhet, ha a másik kettő 35-öt és 23-at kap. Az olyan rendszerek, mint a francia elnökválasztás, második fordulót tartanak, ha az első fordulóban egyik jelölt sem éri el a szükséges többséget, míg a relatív többségi rendszerek általában azonnal a legtöbb szavazatot kapónak adják a mandátumot."},{"k":"c","t":"Majority = more than half of the votes. Plurality = more votes than any competing candidate or party, even without more than half.","hu":"Többség = a szavazatok több mint fele. Relatív többség = több szavazat, mint bármely versenytárs jelölté vagy párté, de nem feltétlenül több a felénél.","lab":"KEY DISTINCTION"},{"k":"p","t":"Electoral boundaries can themselves become politically controversial. Gerrymandering is the manipulation of constituency boundaries to create an electoral advantage for a party or group. The term is most strongly associated with the United States because state legislatures have often had important roles in redistricting congressional and state legislative districts after the census. Political disputes over district maps have repeatedly reached American courts, and partisan maps in states such as North Carolina have become nationally known examples. Other democracies try to reduce this risk by giving boundary design to more independent bodies; Canada and the United Kingdom use independent boundary commissions, while several U.S. states, including California and Arizona, have also transferred much of the redistricting process to independent or bipartisan commissions.","hu":"A választókerületi határok maguk is politikai vita tárgyává válhatnak. A gerrymandering a választókerületi határok manipulálása annak érdekében, hogy egy párt vagy csoport választási előnyhöz jusson. A kifejezést leginkább az Egyesült Államokhoz kötik, mert a tagállami törvényhozások gyakran fontos szerepet kaptak a kongresszusi és tagállami körzetek népszámlálás utáni újrarajzolásában. A körzethatárokról szóló politikai viták többször is amerikai bíróságok elé kerültek, és az olyan tagállamok pártos térképei, mint Észak-Karoliná, országosan ismert példákká váltak. Más demokráciák úgy csökkentik ezt a kockázatot, hogy függetlenebb testületekre bízzák a határok kialakítását: Kanada és az Egyesült Királyság független határmegállapító bizottságokat használ, és több amerikai tagállam – köztük Kalifornia és Arizona – is független vagy kétpárti bizottságokra ruházta a körzetrajzolás nagy részét."},{"k":"c","t":"Gerrymandering = manipulating constituency boundaries to create an electoral advantage for a party or group.","hu":"Gerrymandering = a választókerületi határok manipulálása annak érdekében, hogy egy párt vagy csoport választási előnyhöz jusson.","lab":"WATCH OUT"},{"k":"h","t":"4.3 Election results and forming a government","hu":"4.3 Választási eredmények és kormányalakítás"},{"k":"p","t":"To win an election can mean different things depending on the system. A party may receive the largest national vote share but still fail to win the most seats, while a candidate may win a constituency with only a plurality. Conversely, a party can lose an election even if it increases its vote share, because the distribution of votes across constituencies matters. This is one reason election-night reporting often focuses simultaneously on vote percentages, seats, and possib le governing combinations. If one party controls more than half of the seats, it can normally form a majority government. If no party has a majority, several outcomes are possible. Parties may negotiate a coalition and create a coalition government, as is common in Germany, the Netherlands, Belgium, and Austria. A minority government can also govern without holding more than half the seats, relying on support from other parties for key votes; this has occurred frequently in Denmark, Sweden, and Canada. A hung parliament is the British term for a situation in which no party has an overall majority in the House of Commons. After the 2010 UK general election, for example, the Conservatives and Liberal Democrats formed a coalition because neither major party could govern alone. A successful party or coalition is often said to receive a mandate to pursue the programme it presented to voters, although the strength and meaning of a mandate can be debated. Once a new government is formally appointed, it takes office and assumes responsibility for executive decision- making. In parliamentary systems this may happen after coalition negotiations lasting days, weeks, or occasionally months, as has occurred after fragmented election results in countries such as Belgium and the Netherlands.","hu":"A választás megnyerése rendszertől függően mást jelenthet. Egy párt kaphatja a legnagyobb országos szavazatarányt úgy, hogy közben nem szerzi meg a legtöbb mandátumot, egy jelölt pedig relatív többséggel is nyerhet egy választókerületet. Fordítva: egy párt úgy is veszíthet, hogy nőtt a szavazataránya, mert számít a szavazatok választókerületek közötti eloszlása. Részben ezért koncentrál a választási esten a tudósítás egyszerre a szavazatarányokra, a mandátumokra és a lehetséges kormányzati kombinációkra. Ha egy párt a mandátumok több mint felét birtokolja, rendszerint többségi kormányt alakíthat. Ha egyik pártnak sincs többsége, több kimenetel lehetséges. A pártok koalícióról tárgyalhatnak, és koalíciós kormányt hozhatnak létre, ahogy az Németországban, Hollandiában, Belgiumban és Ausztriában megszokott. Kisebbségi kormány is kormányozhat a helyek több mint fele nélkül, ha a fontos szavazásoknál más pártok támogatására épít; ez gyakran előfordult Dániában, Svédországban és Kanadában. A „hung parliament” a brit kifejezés arra a helyzetre, amikor egyetlen pártnak sincs abszolút többsége az alsóházban. A 2010-es brit választás után például a konzervatívok és a liberális demokraták koalíciót alakítottak, mert egyik nagy párt sem tudott egyedül kormányozni. A győztes pártról vagy koalícióról gyakran mondják, hogy felhatalmazást kapott a választóknak bemutatott program végrehajtására, bár a felhatalmazás ereje és jelentése vitatható. Miután az új kormányt hivatalosan kinevezik, hivatalba lép, és átveszi a végrehajtói döntéshozatal felelősségét. A parlamentáris rendszerekben ez napokig, hetekig, néha hónapokig tartó koalíciós tárgyalások után történhet meg, ahogy az töredezett választási eredmények után Belgiumban és Hollandiában előfordult."},{"k":"c","t":"Majority government: one party controls more than half of the seats. Coalition government: two or more parties negotiate to govern together. Minority government: governs without more than half the seats and relies on support from other parties. Hung parliament: no party has an overall majority in the House of Commons.","hu":"Többségi kormány: egy párt birtokolja a mandátumok több mint felét. Koalíciós kormány: két vagy több párt közös kormányzásról állapodik meg. Kisebbségi kormány: a helyek több mint fele nélkül kormányoz, és más pártok támogatására épít. Patthelyzetes parlament: egyetlen pártnak sincs abszolút többsége az alsóházban.","lab":"AT A GLANCE"},{"k":"h","t":"5. Political parties and political ideologies","hu":"5. Politikai pártok és politikai ideológiák"},{"k":"h","t":"5.1 Political parties","hu":"5.1 Politikai pártok"},{"k":"p","t":"A political party is an organised group that seeks political power by presenting candidates, competing in elections, and promoting a set of policy priorities. Parties help structure political competition because voters do not have to evaluate every candidate and issue from the beginning; party labels communicate broad expectations about political values and policy. The exact party system differs widely. The United States is dominated by two large parties, while countries such as Germany, the Netherlands, Sweden, and Hungary have multiparty systems in which several parties can win parliamentary seats. The party or parties controlling the government are referred to as the ruling party or governing party, while parties outside government form the opposition. In parliamentary democracies, the opposition does more than criticise the government: it questions ministers, proposes alternatives, participates in committees, and presents itself as a possible future government. The British system gives the largest opposition party a particularly visible role through the Official Opposition, while in multiparty systems several opposition parties may compete with both the government and one another.","hu":"A politikai párt olyan szervezett csoport, amely jelöltek állításával, választásokon való indulással és szakpolitikai prioritások képviseletével törekszik politikai hatalomra. A pártok segítenek rendezni a politikai versenyt, mert a választóknak nem kell minden jelöltet és kérdést a nulláról értékelniük: a pártcímke tág elvárásokat közvetít a politikai értékekről és a szakpolitikáról. A pártrendszer országonként nagyon eltérő. Az Egyesült Államokban két nagy párt dominál, míg olyan országokban, mint Németország, Hollandia, Svédország és Magyarország, többpártrendszer működik, ahol több párt is szerezhet parlamenti mandátumot. A kormányt adó pártot vagy pártokat kormánypártnak vagy kormányzó pártnak nevezik, a kormányon kívüli pártok pedig az ellenzéket alkotják. A parlamentáris demokráciákban az ellenzék többet tesz a kormány bírálatánál: minisztereket kérdez, alternatívákat javasol, bizottságokban dolgozik, és lehetséges jövőbeli kormányként mutatkozik be. A brit rendszer különösen látható szerepet ad a legnagyobb ellenzéki pártnak a hivatalos ellenzék intézményén keresztül, míg a többpárti rendszerekben több ellenzéki párt versenghet a kormánnyal és egymással is."},{"k":"p","t":"A party leader is the politician who heads the organisation and often becomes its principal public representative. Party members may vote in leadership elections, select candidates, campaign locally, or help shape policy, although parties organise internal decision-making in different ways. Before an election, parties normally publish a party platform or manifesto setting out their priorities and campaign commitments. Manifestos are especially prominent in British elections, where parties publish detailed programmes covering taxation, public services, immigration, defence, and other issues; coalition negotiations in countries such as Germany or the Netherlands can then require parties to reconcile different manifestos into a shared governing programme.","hu":"A pártelnök az a politikus, aki a szervezet élén áll, és gyakran a fő nyilvános képviselője lesz. A párttagok szavazhatnak a vezetőválasztáson, jelölteket választhatnak, helyben kampányolhatnak vagy részt vehetnek a programalkotásban, bár a pártok különbözőképpen szervezik a belső döntéshozatalt. A választás előtt a pártok rendszerint közzéteszik a programjukat (party platform vagy manifesto), amely tartalmazza a prioritásaikat és a kampányvállalásaikat. A manifesztók különösen hangsúlyosak a brit választásokon, ahol a pártok részletes programot adnak ki az adózásról, a közszolgáltatásokról, a bevándorlásról, a védelemről és más kérdésekről; a koalíciós tárgyalások az olyan országokban, mint Németország vagy Hollandia, később arra kényszeríthetik a pártokat, hogy a különböző programokat közös kormányprogramba olvasszák."},{"k":"c","t":"Political party = an organised group seeking political power through candidates, elections, and policy priorities. Ruling / governing party = the party or parties controlling the government. Opposition = parties outside government. Manifesto / party platform = a statement of priorities and campaign commitments.","hu":"Politikai párt = szervezett csoport, amely jelöltekkel, választásokkal és szakpolitikai prioritásokkal törekszik hatalomra. Kormánypárt = a kormányt adó párt vagy pártok. Ellenzék = a kormányon kívüli pártok. Pártprogram / manifesztum = a prioritások és a kampányvállalások összefoglalása.","lab":"KEY TERMS"},{"k":"h","t":"6. How public policy is made","hu":"6. Hogyan születik a közpolitika?"},{"k":"p","t":"Politics becomes concrete through public policy: the decisions and actions governments use to address social, economic, or international problems. Policy-making is rarely a single decision. It usually involves identifying a problem, proposing solutions, negotiating among institutions and interest groups, adopting rules, and then implementing and evaluating them. The exact procedure differs across political systems, but the basic sequence can be followed in almost every democracy.","hu":"A politika a közpolitikán keresztül válik kézzelfoghatóvá: ezek azok a döntések és intézkedések, amelyekkel a kormányok társadalmi, gazdasági vagy nemzetközi problémákat kezelnek. A szakpolitika-alkotás ritkán egyetlen döntés. Általában magában foglalja a probléma azonosítását, megoldások javaslatát, az intézmények és érdekcsoportok közötti egyeztetést, a szabályok elfogadását, majd a végrehajtást és az értékelést. A pontos eljárás politikai rendszerenként eltér, de az alapvető sorrend szinte minden demokráciában követhető."},{"k":"c","t":"Public policy = the decisions and actions governments use to address social, economic, or international problems. Policy-making normally involves identifying a problem, proposing solutions, negotiating, adopting rules, implementing them, and evaluating the results.","hu":"Közpolitika = azok a döntések és intézkedések, amelyekkel a kormányok társadalmi, gazdasági vagy nemzetközi problémákat kezelnek. A szakpolitika-alkotás rendszerint a probléma azonosítását, megoldások javaslatát, egyeztetést, a szabályok elfogadását, végrehajtását és az eredmények értékelését jelenti.","lab":"DEFINITION"},{"k":"h","t":"6.1 From political idea to law","hu":"6.1 A politikai ötlettől a törvényig"},{"k":"p","t":"A policy proposal may originate from a government ministry, a political party, a parliamentary committee, an expert body, or public pressure. If legislation is required, the proposal may be transformed into a bill and introduced into parliament. Legislators then hold a parliamentary debate, examine the proposal in committee, and may submit an amendment to change specific provisions. Eventually the legislature must vote. If enough representatives support the proposal, parliament passes the bill; if support is insufficient, it rejects the bill or sends it back for further revision. Once approved according to constitutional procedure, a bill becomes legislation. Some policy decisions instead take the form of a regulation made under authority granted by existing law. Governments must then implement the policy through ministries, agencies, local authorities, schools, hospitals, police forces, or other public bodies. A law banning smoking in enclosed public places, for example, only becomes effective when businesses understand the rules, authorities ca n enforce them, and citizens change their behaviour. Real policy-making is often less linear than the textbook sequence suggests. Governments may revise proposals after public criticism, courts can question legal provisions, and upper chambers or coalition partners can demand changes. The Affordable Care Act in the United States, for example, passed through extensive congressional negotiation and later faced repeated judicial and political challenges. In European parliamentary systems, coalition agreements often shape which bills reach parliament in the first place, because governing parties negotiate policy compromises before legislation is introduced.","hu":"A szakpolitikai javaslat származhat minisztériumtól, politikai párttól, parlamenti bizottságtól, szakértői testülettől vagy társadalmi nyomásból. Ha jogszabály kell hozzá, a javaslatból törvényjavaslat lehet, amelyet benyújtanak a parlamentnek. A képviselők ezután parlamenti vitát tartanak, bizottságban vizsgálják a javaslatot, és módosító indítványt nyújthatnak be egyes rendelkezések megváltoztatására. Végül a törvényhozásnak szavaznia kell. Ha elég képviselő támogatja, a parlament elfogadja a javaslatot; ha nincs elég támogatás, elutasítja, vagy további átdolgozásra visszaküldi. Az alkotmányos eljárás szerinti jóváhagyás után a javaslatból jogszabály lesz. Egyes szakpolitikai döntések ehelyett rendelet formáját öltik, amelyet a hatályos törvény által adott felhatalmazás alapján alkotnak meg. A kormányoknak ezután minisztériumokon, hivatalokon, önkormányzatokon, iskolákon, kórházakon, rendőrségen vagy más közintézményeken keresztül kell végrehajtaniuk a szakpolitikát. Egy zárt közterületeken a dohányzást tiltó törvény például csak akkor válik hatásossá, ha a vállalkozások megértik a szabályokat, a hatóságok ki tudják kényszeríteni őket, és a polgárok változtatnak a viselkedésükön. A valódi szakpolitika-alkotás gyakran kevésbé lineáris, mint a tankönyvi sorrend. A kormányok a közfelháborodás után módosíthatják a javaslatot, a bíróságok megkérdőjelezhetik a jogi rendelkezéseket, a felsőházak vagy a koalíciós partnerek pedig változtatásokat követelhetnek. Az amerikai Affordable Care Act például hosszas kongresszusi egyeztetésen ment át, majd ismétlődő bírósági és politikai kihívásokkal szembesült. Az európai parlamentáris rendszerekben a koalíciós megállapodások gyakran már azt is meghatározzák, mely javaslatok jutnak el egyáltalán a parlamentig, mert a kormánypártok a benyújtás előtt egyezségre jutnak."},{"k":"c","t":"Political idea or public pressure → policy proposal → bill (if legislation is required) → parliamentary debate and committee work → vote → implementation → evaluation and possible revision.","hu":"Politikai ötlet vagy társadalmi nyomás → szakpolitikai javaslat → törvényjavaslat (ha jogszabály kell) → parlamenti vita és bizottsági munka → szavazás → végrehajtás → értékelés és esetleges módosítás.","lab":"PROCESS"},{"k":"h","t":"6.2 Major areas of public policy","hu":"6.2 A közpolitika fő területei"},{"k":"p","t":"Economic policy concerns growth, employment, inflation, public spending, and the overall management of the economy, while tax policy determines how governments raise revenue and distribute tax burdens. Different governments may cut taxes to encourage investment or raise particular taxes to finance public services. Sweden, for example, combines relatively high taxation with extensive public services, whereas other countries rely more heavily on private provision. Policy choices are therefore closely connected to political priorities and public expectations. Education policy determines issues such as school funding, curricula, teacher employment, university access, and vocational training. Healthcare policy concerns the organisation and financing of medical services; the United Kingdom's National Health Service is mainly tax-funded, Germany uses a social insurance model, and the United States combines private insurance with major public programmes. Social policy covers areas such as pensions, unemployment support, family benefits, housing, and poverty reduction, and these systems vary widely even among economically similar countries. Environmental policy has become increasingly important as governments regulate emissions, energy use, waste, and climate-related investment. Sweden introduced a carbon tax in the early 1990s, while the European Union uses common rules and market mechanisms in several environmental areas. Immigration policy determines who may enter, live, work, or seek protection in a country; systems such as Canada's points-based economic immigration programmes differ from the rules used in the United States or European countries. Foreign policy, finally, concerns a state's relations with the rest of the world and connects domestic political choices to diplomacy, defence, trade, alliances, and international organisations.","hu":"A gazdaságpolitika a növekedéssel, a foglalkoztatással, az inflációval, az állami kiadásokkal és a gazdaság általános irányításával foglalkozik, míg az adópolitika azt határozza meg, hogyan szedi be a kormány a bevételt, és hogyan oszlik meg az adóteher. Egyes kormányok adót csökkentenek a beruházás ösztönzésére, mások egyes adókat emelnek a közszolgáltatások finanszírozására. Svédország például viszonylag magas adóztatást párosít kiterjedt közszolgáltatásokkal, míg más országok nagyobb mértékben támaszkodnak a magánszolgáltatásokra. A szakpolitikai döntések tehát szorosan kötődnek a politikai prioritásokhoz és a társadalmi elvárásokhoz. Az oktatáspolitika olyan kérdéseket határoz meg, mint az iskolák finanszírozása, a tantervek, a tanárok foglalkoztatása, az egyetemi bejutás és a szakképzés. Az egészségügyi politika az orvosi ellátás szervezéséről és finanszírozásáról szól: az Egyesült Királyság Nemzeti Egészségügyi Szolgálata főként adóból működik, Németország társadalombiztosítási modellt használ, az Egyesült Államok pedig magánbiztosítást kombinál nagy állami programokkal. A szociálpolitika olyan területeket fed le, mint a nyugdíj, a munkanélküli-ellátás, a családtámogatás, a lakhatás és a szegénység csökkentése, és ezek a rendszerek még gazdaságilag hasonló országok között is nagyon eltérnek. A környezetpolitika egyre fontosabbá vált, ahogy a kormányok szabályozzák a kibocsátást, az energiafelhasználást, a hulladékot és a klímacélú beruházásokat. Svédország már az 1990-es évek elején bevezette a szén-dioxid-adót, az Európai Unió pedig közös szabályokat és piaci eszközöket használ több környezeti területen. A bevándorlási politika határozza meg, ki léphet be, élhet, dolgozhat vagy kérhet védelmet egy országban; az olyan rendszerek, mint Kanada pontalapú gazdasági bevándorlási programjai, eltérnek az Egyesült Államokban vagy az európai országokban alkalmazott szabályoktól. Végül a külpolitika az állam és a világ többi része közötti kapcsolatokról szól, és összeköti a belpolitikai döntéseket a diplomáciával, a védelemmel, a kereskedelemmel, a szövetségekkel és a nemzetközi szervezetekkel."},{"k":"c","t":"Major policy areas include economic, tax, education, healthcare, social, environmental, immigration, and foreign policy.","hu":"A fő szakpolitikai területek: gazdaság-, adó-, oktatás-, egészségügyi, szociál-, környezet-, bevándorlás- és külpolitika.","lab":"AT A GLANCE"},{"k":"h","t":"7. Political communication, media and public opinion","hu":"7. Politikai kommunikáció, média és közvélemény"},{"k":"p","t":"Modern politics is also a competition over communication. Political leaders need to explain policies, persuade undecided citizens, respond to criticism, and create a public image. At the same time, voters rely on journalists, opinion research, social media, and direct campaign messages to understand political choices. The result is a communication environment in which information can spread rapidly but can also be simplified, distorted, or deliberately manipulated.","hu":"A mai politika kommunikációs verseny is. A politikai vezetőknek el kell magyarázniuk az intézkedéseket, meg kell győzniük a bizonytalan polgárokat, válaszolniuk kell a bírálatokra, és nyilvános képet kell építeniük. A választók ugyanakkor újságírókra, közvélemény-kutatásokra, közösségi médiára és közvetlen kampányüzenetekre támaszkodnak, hogy megértsék a politikai választásokat. Az eredmény olyan kommunikációs környezet, amelyben az információ gyorsan terjedhet, de le is egyszerűsödhet, torzulhat, vagy szándékosan manipulálhatják."},{"k":"h","t":"7.1 Election campaigns","hu":"7.1 Választási kampányok"},{"k":"p","t":"An election campaign is the organised effort by candidates and parties to win voter support. Campaigns combine speeches, interviews, advertising, social media, local events, and direct contact with voters. A campaign promise is a commitment about what a candidate or party says it will do if elected, while a manifesto collects many such commitments into a more systematic programme. In British general elections, manifestos are central campaign documents; in the United States, candidates rely more heavily on party platforms, speeches, and individual policy proposals. Political advertising can appear on television, online platforms, billboards, or printed material, while a campaign rally is a public event designed to mobilise supporters and attract media attention. Televised debate can be particularly influential because voters compare candidates directly. The 1960 Kennedy-Nixon debate in the United States is a classic historical example of television changing the style of political campaigning, while contemporary elections routinely include televised leaders' debates in countries such as France, the United Kingdom, Germany, and Canada. An endorsement occurs when a prominent person, organisation, newspaper, or political figure publicly supports a candidate. Campaigns also pay special attention to the swing voter, someone whose support is not firmly attached to one party. In U.S. presidential elections, campaigns concentrate heavily on competitive states such as Pennsylvania, Michigan, or Georgia because relatively small shifts among undecided voters can determine the national result through the Electoral College. Digital campaigning has added another dimension: Barack Obama's 2008 campaign became a widely discussed example of using online fundraising, email, and social networks on a very large scale.","hu":"A választási kampány a jelöltek és a pártok szervezett munkája a választói támogatás megszerzéséért. A kampányok beszédeket, interjúkat, hirdetéseket, közösségi médiát, helyi eseményeket és a választókkal való közvetlen kapcsolatot ötvözik. A kampányígéret arra vonatkozó vállalás, hogy mit tesz a jelölt vagy a párt megválasztása esetén, míg a manifesztum sok ilyen vállalást gyűjt rendszerezett programba. A brit országgyűlési választásokon a manifesztók központi kampánydokumentumok; az Egyesült Államokban a jelöltek inkább pártprogramokra, beszédekre és egyedi szakpolitikai javaslatokra támaszkodnak. A politikai hirdetés megjelenhet a televízióban, online platformokon, óriásplakáton vagy nyomtatott anyagban, a kampánygyűlés pedig olyan nyilvános esemény, amely a támogatók mozgósítására és a média figyelmének felkeltésére szolgál. A televíziós vita különösen nagy hatású lehet, mert a választók közvetlenül hasonlíthatják össze a jelölteket. Az 1960-as Kennedy–Nixon-vita az Egyesült Államokban klasszikus történelmi példája annak, hogyan változtatta meg a televízió a kampányolás stílusát, a mai választásokon pedig rendszeresek a vezetői tévéviták Franciaországban, az Egyesült Királyságban, Németországban és Kanadában. Támogató nyilatkozatról akkor beszélünk, ha egy ismert személy, szervezet, újság vagy politikai szereplő nyilvánosan kiáll egy jelölt mellett. A kampányok külön figyelmet fordítanak a bizonytalan szavazóra, akinek a támogatása nem kötődik szilárdan egyetlen párthoz. Az amerikai elnökválasztásokon a kampányok erősen az olyan versengő tagállamokra összpontosítanak, mint Pennsylvania, Michigan vagy Georgia, mert a bizonytalanok körében bekövetkező kis elmozdulás is eldöntheti az országos eredményt az elektori kollégiumon keresztül. A digitális kampányolás új dimenziót adott mindehhez: Barack Obama 2008-as kampánya széles körben tárgyalt példája lett az online adománygyűjtés, az e-mail és a közösségi hálózatok nagy léptékű használatának."},{"k":"h","t":"7.2 Public opinion","hu":"7.2 Közvélemény"},{"k":"p","t":"Public opinion refers to the attitudes and preferences held by the population on political issues, leaders, and institutions. Because governments and parties cannot ask every citizen about every question, they use an opinion poll based on a carefully selected sample. Polling can measure support for parties, opinions about policies, or an approval rating showing how positively the public evaluates a political leader. Voter intention surveys ask respondents how they expect to vote in an election. Polls are useful but never perfectly certain. Sampling error, question wording, turnout assumptions, and late changes in voter behaviour can affect results. The 2016 Brexit referendum demonstrated this uncertainty: many polls showed a very close race, and the final result was 51.9 percent for Leave and 48.1 percent for Remain. Similar polling errors or late shifts have occurred in elections in the United States, the United Kingdom, and other democracies. For this reason, responsible interpretation focuses on trends, margins of error, and differences between polling organisations rather than treating a single poll as a prediction.","hu":"A közvélemény a lakosság politikai kérdésekről, vezetőkről és intézményekről alkotott álláspontja és preferenciái. Mivel a kormányok és a pártok nem kérdezhetnek meg minden polgárt minden kérdésről, gondosan kiválasztott mintán alapuló közvélemény-kutatást használnak. A felmérés mérheti a pártok támogatottságát, az intézkedésekről alkotott véleményt vagy a támogatottsági mutatót, amely azt mutatja, mennyire pozitívan ítéli meg a közvélemény egy politikai vezető munkáját. A szavazói szándékot mérő felmérések azt kérdezik, hogyan szavaznának a válaszadók egy választáson. A felmérések hasznosak, de soha nem teljesen biztosak. A mintavételi hiba, a kérdés megfogalmazása, a részvételre vonatkozó feltételezések és a szavazói viselkedés késői változása mind hathatnak az eredményre. A 2016-os brexitnépszavazás jól mutatta ezt a bizonytalanságot: sok felmérés nagyon szoros versenyt jelzett, a végeredmény pedig 51,9 százalék lett a kilépésre és 48,1 százalék a maradásra. Hasonló felmérési hibák vagy késői elmozdulások történtek az Egyesült Államokban, az Egyesült Királyságban és más demokráciákban is. Ezért a felelős értelmezés a trendekre, a hibahatárra és a kutatóintézetek közötti eltérésekre figyel, nem pedig egyetlen felmérést tekint jóslatnak."},{"k":"c","t":"Opinion poll = a survey based on a selected sample. Approval rating = how positively the public evaluates a political leader. Voter intention survey = asks respondents how they expect to vote. Polls are estimates affected by sampling error, wording, turnout assumptions, and changes in voter behaviour.","hu":"Közvélemény-kutatás = kiválasztott mintán alapuló felmérés. Támogatottsági mutató = mennyire pozitívan ítéli meg a közvélemény egy politikai vezető munkáját. Szavazói szándékot mérő felmérés = azt kérdezi, hogyan szavaznának a válaszadók. A felmérések becslések, amelyeket befolyásol a mintavételi hiba, a kérdés megfogalmazása, a részvételi feltételezések és a szavazói viselkedés változása.","lab":"QUICK RECAP"},{"k":"h","t":"7.3 Politics and the media","hu":"7.3 Politika és média"},{"k":"p","t":"Freedom of the press allows journalists to investigate political institutions and publish information without improper government control. Independent media can reveal corruption, test official claims, and provide voters with competing interpretations of events. The Watergate investigation in the United States in the 1970s is a famous example of investigative journalism contributing to political accountability. Media coverage, however, is never completely neutral in selection: editors decide which events are important, how much attention they receive, and which sources are quoted. Bias can therefore appear through framing, emphasis, ownership, or ideological preference even when individual facts are correct. Propaganda is communication designed to influence attitudes in a strongly one-sided way, often by simplifying complex issues or appealing heavily to emotion. Digital platforms have made another distinction increasingly important. Misinformation is false or inaccurate information spread without necessarily intending to deceive, whereas disinformation is deliberately created or distributed to mislead. A person who unknowingly shares a false story may spread misinformation; an organised operation that invents a false story in order to manipulate voters produces disinformation. The popular expression fake news is widely used but is less precise because it can refer to fabricated stories, misleading content, satire, or simply news that someone dislikes.","hu":"A sajtószabadság lehetővé teszi, hogy az újságírók indokolatlan kormányzati ellenőrzés nélkül vizsgálják a politikai intézményeket, és közöljenek információkat. A független média feltárhatja a korrupciót, ellenőrizheti a hivatalos állításokat, és versengő értelmezéseket kínálhat a választóknak az eseményekről. Az 1970-es évekbeli amerikai Watergate-vizsgálat híres példája annak, hogyan járul hozzá az oknyomozó újságírás a politikai elszámoltathatósághoz. A médiatudósítás ugyanakkor a válogatásban soha nem teljesen semleges: a szerkesztők döntik el, mely események fontosak, mennyi figyelmet kapnak, és kiket idéznek. Az elfogultság tehát megjelenhet a keretezésben, a hangsúlyokban, a tulajdonosi háttérben vagy az ideológiai preferenciában akkor is, ha az egyes tények helytállóak. A propaganda olyan kommunikáció, amely erősen egyoldalúan próbálja befolyásolni a véleményeket, gyakran az összetett kérdések leegyszerűsítésével vagy erős érzelmi hatáskeltéssel. A digitális platformok egy másik különbségtételt tettek egyre fontosabbá. A téves információ (misinformation) hamis vagy pontatlan információ, amely nem feltétlenül megtévesztési szándékkal terjed, míg a dezinformáció szándékosan létrehozott vagy terjesztett félrevezető tartalom. Aki tudtán kívül oszt meg egy hamis hírt, téves információt terjeszt; egy szervezett művelet, amely hamis történetet talál ki a választók manipulálására, dezinformációt állít elő. A közkeletű „álhír” kifejezés széles körben használatos, de kevésbé pontos, mert jelenthet kitalált történetet, félrevezető tartalmat, szatírát, vagy egyszerűen olyan hírt, amely valakinek nem tetszik."},{"k":"c","t":"Misinformation = false or inaccurate information spread without necessarily intending to deceive. Disinformation = false information deliberately created or distributed to mislead. Fake news is less precise and can refer to several different kinds of content.","hu":"Téves információ = hamis vagy pontatlan információ, amely nem feltétlenül megtévesztési szándékkal terjed. Dezinformáció = szándékosan létrehozott vagy terjesztett hamis információ a megtévesztés céljából. Az „álhír” kevésbé pontos, és többféle tartalomra is vonatkozhat.","lab":"KEY DISTINCTION"},{"k":"p","t":"Fact-checking attempts to verify claims using available evidence, and professional news organisations as well as specialist fact-checking groups now assess statements made by political actors. A social media campaign can spread messages far more quickly than traditional campaigning and can reach narrowly defined audiences, but it also makes correction difficult once misleading material has gone viral. Political communication therefore requires both media literacy and careful attention to the source, evidence, and intention behind a message.","hu":"A tényellenőrzés az állítások igazolására törekszik a rendelkezésre álló bizonyítékok alapján, és ma már a hivatásos hírszervezetek és a szakosodott tényellenőrző csoportok is vizsgálják a politikai szereplők kijelentéseit. A közösségimédia-kampány sokkal gyorsabban terjeszti az üzeneteket, mint a hagyományos kampány, és szűken meghatározott célcsoportokat is elér, de meg is nehezíti a helyesbítést, ha egy félrevezető anyag már végigsöpört az interneten. A politikai kommunikáció megértése ezért médiaműveltséget és a forrás, a bizonyíték és a szándék gondos vizsgálatát igényli."},{"k":"c","t":"Fact-checking verifies claims using available evidence. Political communication requires media literacy and careful attention to source, evidence, and intention.","hu":"A tényellenőrzés a rendelkezésre álló bizonyítékok alapján ellenőrzi az állításokat. A politikai kommunikáció médiaműveltséget és a forrás, a bizonyíték és a szándék gondos vizsgálatát igényli.","lab":"QUICK RECAP"},{"k":"h","t":"8. International politics and diplomacy","hu":"8. Nemzetközi politika és diplomácia"},{"k":"p","t":"States do not make political decisions in isolation. Trade, security, migration, climate change, technology, and armed conflict all create problems that cross national borders. International politics examines how states pursue their interests, cooperate, compete, and negotiate, while diplomacy provides the main peaceful means through which governments manage these relationships.","hu":"Az államok nem elszigetelten hozzák a politikai döntéseiket. A kereskedelem, a biztonság, a migráció, a klímaváltozás, a technológia és a fegyveres konfliktus mind olyan problémákat teremt, amelyek átlépik az országhatárokat. A nemzetközi politika azt vizsgálja, hogyan érvényesítik az államok az érdekeiket, hogyan működnek együtt, versengenek és tárgyalnak, míg a diplomácia a fő békés eszköz, amellyel a kormányok ezeket a kapcsolatokat kezelik."},{"k":"h","t":"8.1 Foreign policy and diplomacy","hu":"8.1 Külpolitika és diplomácia"},{"k":"p","t":"Foreign policy is the set of goals and strategies a government follows in its relations with other countries. It may seek security, economic opportunities, regional influence, access to energy, protection of citizens abroad, or cooperation on global problems. Diplomacy is the practice of managing these relations through communication and negotiation. A professional diplomat represents a state abroad or works in the foreign ministry, while an ambassador is normally the highest-ranking diplomatic representative sent to another country or international organisation. An embassy is the official diplomatic mission located in the capital of another state. Relations between two countries are bilateral relations; examples include U.S.-Canadian cooperation, French-German relations within Europe, or long-standing Japanese-American security and economic ties. Multilateral relations involve several states at the same time and are central to organisations such as the United Nations, the European Union, NATO, and the World Trade Organization. Leaders often meet at a summit to discuss high-level issues: G7 and G20 summits bring together major economies, while EU summits allow national leaders to negotiate common European positions.","hu":"A külpolitika azoknak a céloknak és stratégiáknak az összessége, amelyeket a kormány a más országokkal való kapcsolataiban követ. Szólhat biztonságról, gazdasági lehetőségekről, regionális befolyásról, energiához való hozzáférésről, a külföldön élő állampolgárok védelméről vagy a globális problémákban való együttműködésről. A diplomácia e kapcsolatok kezelésének gyakorlata kommunikáció és tárgyalás útján. A hivatásos diplomata külföldön képviseli az államot, vagy a külügyminisztériumban dolgozik, míg a nagykövet rendszerint a legmagasabb rangú diplomáciai képviselő egy másik országban vagy nemzetközi szervezetnél. A nagykövetség a hivatalos diplomáciai képviselet egy másik állam fővárosában. A két ország közötti kapcsolatok kétoldalúak; ilyen például az amerikai–kanadai együttműködés, a francia–német viszony Európán belül vagy a régóta fennálló japán–amerikai biztonsági és gazdasági kapcsolat. A többoldalú kapcsolatok egyszerre több államot érintenek, és központi szerepük van olyan szervezetekben, mint az ENSZ, az Európai Unió, a NATO és a Kereskedelmi Világszervezet. A vezetők gyakran csúcstalálkozón egyeztetnek a legmagasabb szintű kérdésekről: a G7- és G20-csúcsok a nagy gazdaságokat hozzák össze, az EU-csúcsokon pedig a tagállami vezetők közös európai álláspontról tárgyalnak."},{"k":"c","t":"Bilateral relations involve two countries. Multilateral relations involve several states at the same time. A summit is a high-level meeting of political leaders.","hu":"A kétoldalú kapcsolatok két országot érintenek. A többoldalú kapcsolatok egyszerre több államot. A csúcstalálkozó politikai vezetők magas szintű találkozója.","lab":"KEY DISTINCTION"},{"k":"p","t":"Diplomacy is not limited to friendly relationships. States continue diplomatic contact during disagreements because communication can prevent escalation and identify areas of compromise. The United States and China, for example, maintain extensive diplomatic relatio ns despite serious disputes over trade, technology, security, and Taiwan. This illustrates why diplomacy is best understood as a tool for managing international relations rather than simply a sign of political friendship.","hu":"A diplomácia nem korlátozódik a baráti kapcsolatokra. Az államok nézeteltérés idején is fenntartják a diplomáciai kapcsolatot, mert a kommunikáció megelőzheti az eszkalációt, és felszínre hozhatja a kompromisszum lehetőségeit. Az Egyesült Államok és Kína például kiterjedt diplomáciai kapcsolatot tart fenn a kereskedelem, a technológia, a biztonság és Tajvan körüli komoly viták ellenére. Ez jól mutatja, miért érdemes a diplomáciát a nemzetközi kapcsolatok kezelésének eszközeként érteni, nem pedig a politikai barátság jeleként."},{"k":"h","t":"8.2 International cooperation and conflict","hu":"8.2 Nemzetközi együttműködés és konfliktus"},{"k":"p","t":"An international organisation is an institution created by states to manage cooperation in particular areas. The United Nations has a global membership and works on peace and security, development, humanitarian assistance, and international law. The European Union is much more integra ted and can adopt rules binding on member states in areas of EU competence. NATO is primarily a security alliance whose members commit themselves to collective defence. An alliance is therefore a formal or informal arrangement in which states cooperate for common strategic purposes. A treaty is a formal agreement between states governed by international law. Treaties can address borders, trade, arms control, environmental protection, or many other issues. The Paris Agreement on climate change is a multilateral international agreement involving almost every country, while bilateral treaties regulate specific relationships between two states. The more general word agreement can include both legally binding treaties and less formal political arrangements, depending on context.","hu":"A nemzetközi szervezet olyan intézmény, amelyet államok hoztak létre az adott területeken folyó együttműködés kezelésére. Az ENSZ globális tagsággal működik, és a béke és biztonság, a fejlesztés, a humanitárius segítségnyújtás és a nemzetközi jog területén tevékenykedik. Az Európai Unió sokkal integráltabb, és az uniós hatáskörbe tartozó területeken a tagállamokra kötelező szabályokat fogadhat el. A NATO elsősorban biztonsági szövetség, amelynek tagjai kollektív védelemre kötelezik magukat. A szövetség tehát olyan formális vagy informális megállapodás, amelyben az államok közös stratégiai célból működnek együtt. A nemzetközi szerződés államok közötti formális megállapodás, amelyre a nemzetközi jog vonatkozik. A szerződések szólhatnak határokról, kereskedelemről, fegyverzetkorlátozásról, környezetvédelemről és sok más kérdésről. A Párizsi Megállapodás a klímaváltozásról szinte minden országot érintő többoldalú nemzetközi megállapodás, míg a kétoldalú szerződések két állam konkrét kapcsolatát szabályozzák. Az általánosabb „megállapodás” szó a szövegkörnyezettől függően magában foglalhat jogilag kötelező szerződéseket és kevésbé formális politikai megállapodásokat is."},{"k":"c","t":"International organisation = an institution created by states to manage cooperation in particular areas. Alliance = an arrangement in which states cooperate for common strategic purposes. Treaty = a formal agreement between states governed by international law.","hu":"Nemzetközi szervezet = államok által létrehozott intézmény az adott területeken folyó együttműködés kezelésére. Szövetség = megállapodás, amelyben az államok közös stratégiai célból működnek együtt. Nemzetközi szerződés = államok közötti formális megállapodás, amelyre a nemzetközi jog vonatkozik.","lab":"KEY TERMS"},{"k":"p","t":"States and international organisations may use sanctions to influence another government without using military force. Sanctions can restrict finance, travel, technology, or access to particular markets, while trade sanctions specifically limit imports, exports, or commercial relationships. The United","hu":"Az államok és a nemzetközi szervezetek szankciókkal próbálhatnak hatni egy másik kormányra katonai erő alkalmazása nélkül. A szankciók korlátozhatják a pénzügyeket, az utazást, a technológiához vagy egyes piacokhoz való hozzáférést, míg a kereskedelmi szankciók kifejezetten az importot, az exportot vagy a kereskedelmi kapcsolatokat korlátozzák. Az Egyesült"},{"k":"p","t":"Nations has imposed sanctions on North Korea in response to its nuclear and missile programmes, and individual states or regional organisations also use sanctions in other international disputes. Such measures are intended to change behaviour, but their effectiveness and humanitarian effects are often debated. A conflict can range from a political confrontation to armed warfare. During fighting, a ceasefire is an agreement to stop hostilities temporarily or indefinitely, but it does not necessarily resolve the underlying dispute. The 1953 Korean Armistice is a well-known example: it ended large-scale fighting in the Korean War without producing a full peace treaty. A peace agreement goes further by attempting to settle the political issues behind a conflict and establish a framework for long-term stability. The 1998 Good Friday Agreement in Northern Ireland is a major example of a negotiated political settlement that created new institutions and helped end decades of violent conflict.","hu":"Nemzetek Szervezete szankciókat vezetett be Észak-Koreával szemben a nukleáris és rakétaprogramjai miatt, és egyes államok vagy regionális szervezetek is alkalmaznak szankciókat más nemzetközi vitákban. Ezek az intézkedések a viselkedés megváltoztatására irányulnak, de a hatékonyságuk és a humanitárius hatásuk gyakran vitatott. A konfliktus a politikai szembenállástól a fegyveres háborúig terjedhet. Harcok idején a tűzszünet olyan megállapodás, amely ideiglenesen vagy határozatlan időre leállítja a hadműveleteket, de nem feltétlenül oldja meg a mögöttes vitát. Az 1953-as koreai fegyverszünet jól ismert példa: véget vetett a koreai háború nagy léptékű harcainak anélkül, hogy teljes békeszerződés született volna. A békemegállapodás ennél tovább megy: megpróbálja rendezni a konfliktus mögötti politikai kérdéseket, és keretet ad a tartós stabilitásnak. Az 1998-as észak-írországi nagypénteki megállapodás jelentős példa olyan tárgyalásos politikai rendezésre, amely új intézményeket hozott létre, és segített véget vetni az évtizedes erőszakos konfliktusnak."},{"k":"c","t":"Sanctions seek to influence another government without military force. Ceasefire = an agreement to stop hostilities temporarily or indefinitely. Peace agreement = an attempt to settle the political issues behind a conflict and create a framework for long- term stability.","hu":"A szankciók katonai erő nélkül próbálnak hatni egy másik kormányra. Tűzszünet = megállapodás a hadműveletek ideiglenes vagy határozatlan idejű leállításáról. Békemegállapodás = kísérlet a konfliktus mögötti politikai kérdések rendezésére és a tartós stabilitás keretének megteremtésére.","lab":"KEY DISTINCTION"}],"5":[{"k":"h","t":"1. Introduction","hu":"1. Bevezetés"},{"k":"p","t":"Marketing is the process of creating, communicating, and delivering value to customers. It is much broader than simply selling a product or producing an ad
