lows, since there is less pressure on short-term financial performance. Another benefit is that having more shareholders often brings additional expertise, credibility, and business connections to the firm. For example, when Apple issues additional shares to raise money, it can secure capital without taking on debt, but the trade-off is that existing shareholders' ownership becomes diluted. In other words, control and voting rights are spread among a larger group of investors, which can sometimes limit the influe nce of the original owners or founders.","hu":"A tőkefinanszírozás azt jelenti, hogy a cég a részvényei eladásával szerez pénzt befektetőktől. Amikor magánszemélyek vagy intézmények megveszik ezeket a részvényeket, résztulajdonosokká, vagyis részvényesekké válnak. A tulajdonlással részesedés jár a cég nyereségéből – ezt gyakran osztalék formájában fizetik ki –, és lehetőség árfolyamnyereségre, ha a részvények értéke idővel emelkedik. A tőkefinanszírozás fő előnye, hogy a cég nem adósodik el, így nincs rendszeres kamatfizetési kötelezettsége. Ez vonzóvá teszi a bizonytalan vagy kiszámíthatatlan pénzáramlású cégek számára, mert kisebb a nyomás a rövid távú pénzügyi teljesítményen. További előny, hogy a több részvényes gyakran szakértelmet, hitelességet és üzleti kapcsolatokat is hoz a céghez. Amikor például az Apple további részvényeket bocsát ki, eladósodás nélkül szerez tőkét, cserébe viszont a meglévő részvényesek tulajdonrésze felhígul. Más szóval az irányítás és a szavazati jog nagyobb befektetői körben oszlik meg, ami néha korlátozhatja az eredeti tulajdonosok vagy alapítók befolyását."},{"k":"h","t":"5.2 Debt financing","hu":"5.2 Hitelfinanszírozás"},{"k":"p","t":"Debt financing, by contrast, involves borrowing money with the promise to repay it, typically through loans from banks or the issuance of bonds to investors. In this arrangement, lenders do not gain ownership of the company. Instead, they receive fixed interest payments and the repayment of the principal amount at an agreed-upon date. One key advantage of debt financing is that the company retains full ownership and control, since lenders are not shareholders. This means that once the debt is repaid, the financial obligation ends, and the company does not share its profits with creditors. Additionally, interest payments on debt are often tax-deductible, which can reduce the overall cost of borrowing. However, the downside is that debt creates financial risk. Companies must meet their repayment obligations regardless of how well or poorly they are performing. During economic downturns or periods of low revenue, these fixed payments can put a heavy strain on the business and, in extreme cases, lead to bankruptcy. A practical example is Amazon issuing corporate bonds to finance the construction of new warehouses. By using debt financing, Amazon can quickly raise large sums of money, expand its infrastructure, and still maintain ownership control. However, it must pay bondholders interest regularly and repay the principal over time, which adds to its financial commitments.","hu":"A hitelfinanszírozás ezzel szemben pénz kölcsönvételét jelenti visszafizetési ígérettel, jellemzően banki hitel vagy befektetőknek kibocsátott kötvény formájában. Ebben a felállásban a hitelezők nem szereznek tulajdonrészt a cégben. Ehelyett fix kamatot kapnak, és a tőkét egy megállapodott időpontban visszafizetik nekik. A hitelfinanszírozás egyik fő előnye, hogy a cég megtartja a teljes tulajdont és irányítást, hiszen a hitelezők nem részvényesek. Ez azt jelenti, hogy a tartozás visszafizetésével a pénzügyi kötelezettség véget ér, és a cég nem osztja meg a nyereségét a hitelezőkkel. Emellett a hitel kamata gyakran leírható az adóból, ami csökkentheti a hitelfelvétel összköltségét. A hátránya viszont, hogy az adósság pénzügyi kockázatot teremt. A cégeknek teljesíteniük kell a törlesztési kötelezettségeiket attól függetlenül, hogy jól vagy rosszul mennek. Gazdasági visszaesés vagy alacsony bevételű időszak idején ezek a fix fizetések nagy terhet róhatnak a vállalkozásra, szélsőséges esetben pedig csődhöz vezethetnek. Gyakorlati példa, amikor az Amazon vállalati kötvényeket bocsát ki új raktárak építésének finanszírozására. Hitelfinanszírozással az Amazon gyorsan nagy összeghez juthat, bővítheti az infrastruktúráját, és közben megtartja az irányítást. Ugyanakkor rendszeresen kamatot kell fizetnie a kötvényeseknek, és idővel vissza kell fizetnie a tőkét, ami növeli a pénzügyi kötelezettségeit."},{"k":"c","t":"Equity does not require regular interest payments, but ownership and voting power may be diluted. Debt preserves ownership, but fixed repayment obligations create financial risk.","hu":"A részvényfinanszírozás nem jár rendszeres kamatfizetéssel, de a tulajdonrész és a szavazati erő felhígulhat. A hitel megőrzi a tulajdont, de a fix törlesztési kötelezettség pénzügyi kockázatot teremt.","lab":"QUICK RECAP"},{"k":"h","t":"6. Types of shares","hu":"6. A részvények típusai"},{"k":"h","t":"6.1 Ordinary shares (common stock)","hu":"6.1 Törzsrészvények"},{"k":"p","t":"Ordinary shares, also called common stock, are the most common form of equity ownership in a company. When most people talk about \"owning shares,\" they are usually referring to ordinary shares. These shares represent direct ownership in a business and give investors both potential rewards and responsibilities. A major feature of ordinary shares is voting rights. Shareholders usually have the ability to vote on important company matters, such as electing members of the board of directors or approving mergers. This means that ordinary shareholders can influence how a company is run, although the extent of this influence depends on how many shares they own. Another important characteristic is that dividends on ordinary shares are not fixed. Instead, they depend on the company's profitability and on decisions made by the board. If a business performs well, shareholders may receive generous dividend payments, and the value of their shares may increase significantly. However, if profits are low or reinvested, dividends may be small or not paid at all. Ordinary shares are considered higher risk compared to other forms of investment because shareholders are the last to be compensated if a company goes bankrupt. Creditors, bondholders, and preference shareholders are paid first. On the other hand, they also provide the highest potential reward, since investors can benefit from both rising share prices and dividends when the company grows. For example, an investor who owns ordinary shares of Apple can attend annual general meetings, vote on decisions, and benefit from price increases as Apple continues to expand.","hu":"A törzsrészvény a vállalati tulajdonlás leggyakoribb formája. Amikor a legtöbb ember „részvénytulajdonról” beszél, rendszerint törzsrészvényre gondol. Ezek a részvények közvetlen tulajdonrészt testesítenek meg egy vállalkozásban, és a befektetőknek lehetőségeket és felelősséget is adnak. A törzsrészvény egyik fő jellemzője a szavazati jog. A részvényesek rendszerint szavazhatnak fontos vállalati kérdésekben, például az igazgatóság tagjainak megválasztásáról vagy a fúziók jóváhagyásáról. A törzsrészvényesek így befolyásolhatják a cég működését, bár a befolyás mértéke attól függ, hány részvényük van. Másik fontos jellemző, hogy a törzsrészvény osztaléka nem rögzített. A cég jövedelmezőségétől és az igazgatóság döntéseitől függ. Ha a vállalkozás jól teljesít, a részvényesek bőkezű osztalékot kaphatnak, és a részvényeik értéke is jelentősen nőhet. Ha azonban a nyereség alacsony, vagy visszaforgatják, az osztalék kicsi lehet, vagy el is maradhat. A törzsrészvényt a befektetési formákhoz képest kockázatosabbnak tartják, mert csőd esetén a részvényesek kapnak utolsóként pénzt. Előbb a hitelezőket, a kötvényeseket és az elsőbbségi részvényeseket fizetik ki. Cserébe viszont a legnagyobb lehetséges hozamot is adják, hiszen a befektetők egyszerre nyerhetnek az emelkedő árfolyamon és az osztalékon, amikor a cég növekszik. Aki például Apple-törzsrészvénnyel rendelkezik, részt vehet az éves közgyűlésen, szavazhat a döntésekről, és profitálhat az árfolyam emelkedéséből, ahogy az Apple tovább terjeszkedik."},{"k":"h","t":"6.2 Preference shares (preferred stock)","hu":"6.2 Elsőbbségi részvények"},{"k":"p","t":"Preference shares, also known as preferred stock, are a special type of equity that gives investors certain advantages over ordinary shareholders. They are often considered a middle ground between shares and bonds, offering more security than ordinary shares but usually less opportunity for large capital gains. One of the main benefits of preference shares is priority in receiving dividends. Preference shareholders are paid before ordinary shareholders, and in many cases, their dividends are fixed at a predetermined rate. This provides investors with a more stable and predictable income, which is why preference shares are popular among risk-averse investors. Another key feature is priority in liquidation. If a company goes bankrupt and its assets are sold to pay debts, preference shareholders receive their share of the remaining assets before ordinary shareholders, although they still rank below creditors and bondholders. However, preference shares usually do not carry voting rights. This means that preference shareholders cannot normally vote on company decisions unless special circumstances arise, such as the company failing to pay dividends for an extended period. In exchange for giving up voting power, investors enjoy greater financial security through fixed returns. For instance, a company might issue preference shares that promise a 5 percent fixed annual dividend. Investors buying these shares know they will receive steady returns regardless of whether the company makes large profits. While they might not benefit from soaring stock prices as much as ordinary shareholders, they gain stability and reduced risk.","hu":"Az elsőbbségi részvény különleges tulajdonosi forma, amely bizonyos előnyöket ad a befektetőknek a törzsrészvényesekkel szemben. Gyakran a részvények és a kötvények közötti átmenetnek tekintik: több biztonságot kínál a törzsrészvénynél, de általában kisebb esélyt nagy árfolyamnyereségre. Az elsőbbségi részvény egyik fő előnye az osztalékfizetési elsőbbség. Az elsőbbségi részvényeseket a törzsrészvényesek előtt fizetik ki, és sok esetben az osztalékuk előre meghatározott, rögzített mértékű. Ez stabilabb és kiszámíthatóbb jövedelmet ad, ezért népszerű a kockázatkerülő befektetők körében. Másik kulcsfontosságú jellemző a felszámoláskori elsőbbség. Ha egy cég csődbe megy, és az eszközeit eladják a tartozások kifizetésére, az elsőbbségi részvényesek a törzsrészvényesek előtt kapják meg a részüket a fennmaradó vagyonból, bár a hitelezők és a kötvényesek mögött állnak. Az elsőbbségi részvényhez azonban rendszerint nem jár szavazati jog. Ez azt jelenti, hogy az elsőbbségi részvényesek normál esetben nem szavazhatnak a vállalati döntésekről, kivéve különleges helyzetekben, például ha a cég hosszabb ideig nem fizet osztalékot. A szavazati jogról való lemondásért cserébe a befektetők a fix hozam révén nagyobb pénzügyi biztonságot élveznek. Egy cég például olyan elsőbbségi részvényt bocsáthat ki, amely évi 5% fix osztalékot ígér. Aki ilyet vásárol, tudja, hogy egyenletes hozamot kap, függetlenül attól, hogy a cég nagy nyereséget ér-e el. Bár a szárnyaló árfolyamokból kevésbé profitál, mint a törzsrészvényesek, stabilitást és kisebb kockázatot nyer."},{"k":"c","t":"Ordinary shares: usually carry voting rights; dividends are not fixed; risk and potential reward are higher. Preference shares: usually have priority for dividends and liquidation, often with fixed dividends, but normally no voting rights.","hu":"Törzsrészvény: rendszerint szavazati joggal jár, az osztalék nem rögzített, a kockázat és a lehetséges hozam is nagyobb. Elsőbbségi részvény: általában elsőbbséget élvez az osztaléknál és a felszámolásnál, gyakran fix osztalékkal, de rendszerint szavazati jog nélkül.","lab":"KEY DISTINCTION"},{"k":"h","t":"7. Stock market participants","hu":"7. A tőzsde szereplői"},{"k":"p","t":"The stock market is made up of many different types of participants, each with their own goals and strategies. One important group is the market makers. A market maker is usually a broker, dealer, or investment firm that is always ready to buy or sell securities. They quote both bid prices (what they are willing to pay for a stock) and ask prices (what they are willing to sell it for). By doing this, they ensure that there is constant liquidity in the market, meaning that investors can buy or sell without much delay. Market makers earn profits from the spread, which is the small difference between the bid and ask price. Another group is known as bulls. Bulls are investors, whether institutional or retail, who believe that the market or a particular stock will rise in value. They take long positions, which means they buy stocks at their current price with the hope of selling them later at a higher price. When bulls dominate the market and prices are climbing steadily, we describe the market as bullish. On the other side are the bears. Bears are investors who expect stock prices to fall, and they try to profit from this decline. They take short positions, which involves borrowing a stock from a broker at a certain price, selling it immediately, and then buying it back at a lower price later. T he difference becomes their profit. For example, if an investor borrows a stock and sells it for 10 dollars, and the price later falls to 9 dollars, the investor can buy it back for 9 dollars, return it to the broker, and keep 1 dollar as profit. When bears dominate the market and prices are falling, the market is described as bearish.","hu":"A tőzsdén sokféle szereplő van jelen, mindegyiknek saját céljaival és stratégiájával. Az egyik fontos csoport az árjegyzőké. Az árjegyző rendszerint bróker, kereskedő vagy befektetési cég, amely mindig készen áll értékpapírt venni vagy eladni. Vételi árat (amennyit hajlandó fizetni egy részvényért) és eladási árat (amennyiért hajlandó eladni) is jegyez. Ezzel biztosítja a piac folyamatos likviditását, vagyis hogy a befektetők különösebb késlekedés nélkül tudjanak venni és eladni. Az árjegyzők a vételi és az eladási ár közötti kis különbségen, az árrésen keresnek. Egy másik csoport a bikáké. A bikák olyan – intézményi vagy lakossági – befektetők, akik szerint a piac vagy egy adott részvény értéke emelkedni fog. Hosszú pozíciót vesznek fel, vagyis a jelenlegi áron vásárolnak részvényt abban a reményben, hogy később magasabb áron adhatják el. Amikor a bikák uralják a piacot, és az árak egyenletesen emelkednek, bikapiacról beszélünk. A másik oldalon állnak a medvék. A medvék olyan befektetők, akik árfolyamesésre számítanak, és ebből próbálnak nyerni. Rövid pozíciót vesznek fel: kölcsönkérnek egy részvényt a brókertől adott áron, azonnal eladják, majd később alacsonyabb áron visszavásárolják. A különbség lesz a nyereségük. Ha például egy befektető kölcsönkér egy részvényt, és 10 dollárért eladja, az ár pedig később 9 dollárra esik, akkor 9 dollárért visszavásárolhatja, visszaadhatja a brókernek, és megtarthat 1 dollár nyereséget. Amikor a medvék uralják a piacot, és az árak esnek, medvepiacról beszélünk."},{"k":"c","t":"Market maker: quotes bid and ask prices and supports market liquidity; profit comes from the spread. Bull / bullish: expects prices to rise and typically takes a long position. Bear / bearish: expects prices to fall and may take a short position.","hu":"Árjegyző: vételi és eladási árat jegyez, és támogatja a piaci likviditást; a nyeresége az árrésből származik. Bika / bikapiaci: áremelkedésre számít, és jellemzően hosszú pozíciót vesz fel. Medve / medvepiaci: árcsökkenésre számít, és rövid pozíciót vehet fel.","lab":"KEY TERMS"},{"k":"h","t":"8. Asset classes","hu":"8. Eszközosztályok"},{"k":"p","t":"Investors today have a wide variety of asset classes to choose from, depending on their goals, risk tolerance, and time horizon. The most common type of investment is in securities, which come in two main forms. The first is equities, or stocks, which represent ownership in a company. Investors who buy shares can benefit from dividends and from increases in the share price. The second is bonds, which are debt instruments issued by governments or corporations. Bondholders receive regular interest payments and the return of their principal at maturity, making bonds a popular choice for those seeking steady income with lower risk compared to stocks. Beyond securities, many investors cho ose commodities, such as gold, oil, or agricultural goods. These are physical assets whose value often moves differently from stocks and bonds, making them useful for diversifying a portfolio. Another option is funds, including mutual funds, hedge funds, and exchange-traded funds (ETFs). These investment vehicles pool money from many investors to buy a diversified portfolio of assets, usually a mix of stocks and bonds. Professional managers handle the investments, which can be a convenient option for those who prefer not to manage their own portfolios. The foreign exchange market (Forex) is another major asset class. Here, investors trade currencies, such as euros, U.S. dollars, or yen, often seeking to profit from exchange rate movements. Some investors turn to real estate, either by directly buying property or by investing in Real Estate Investment Trusts (REITs), which allow them to access property markets without having to manage buildings themselves. Finally, a growing asset class is cryptocurrencies, such as Bitcoin or Ethereum. These digital assets are highly volatile but attract investors who are looking for high-risk, high-reward opportunities and exposure to new financial technologies.","hu":"A befektetők ma sokféle eszközosztály közül választhatnak a céljaik, a kockázattűrésük és az időtávjuk szerint. A leggyakoribb befektetési forma az értékpapír, amely két fő alakban létezik. Az első a részvény, amely tulajdonrészt testesít meg egy vállalatban. Aki részvényt vesz, osztalékból és az árfolyam emelkedéséből is profitálhat. A második a kötvény, vagyis a kormányok vagy vállalatok által kibocsátott hitelpapír. A kötvényesek rendszeres kamatot kapnak, lejáratkor pedig visszakapják a tőkéjüket, ezért a kötvény népszerű azok körében, akik a részvénynél kisebb kockázat mellett egyenletes jövedelmet keresnek. Az értékpapírokon túl sok befektető választ nyersanyagokat, például aranyat, olajat vagy mezőgazdasági termékeket. Ezek fizikai eszközök, amelyek értéke gyakran másként mozog, mint a részvényeké és a kötvényeké, ezért hasznosak a portfólió szórásához. Másik lehetőség az alapok köre: befektetési alapok, fedezeti alapok és tőzsdén kereskedett alapok (ETF-ek). Ezek a befektetési formák sok befektető pénzét gyűjtik össze, hogy szórt eszközportfóliót – jellemzően részvény és kötvény keverékét – vásároljanak. A befektetéseket profik kezelik, ami kényelmes megoldás azoknak, akik nem szeretnének maguk portfóliót kezelni. A devizapiac (Forex) egy további jelentős eszközosztály. Itt a befektetők valutákkal – euróval, amerikai dollárral, jennel – kereskednek, gyakran az árfolyammozgásokon keresve nyereséget. Egyes befektetők az ingatlanhoz fordulnak: vagy közvetlenül vásárolnak, vagy ingatlanbefektetési alapokba (REIT) fektetnek, amelyekkel úgy juthatnak az ingatlanpiacra, hogy nem kell épületeket kezelniük. Végül egyre növekvő eszközosztály a kriptovaluta, például a Bitcoin vagy az Ethereum. Ezek a digitális eszközök nagyon ingadozóak, de vonzzák azokat a befektetőket, akik magas kockázatú, magas hozamú lehetőségeket és új pénzügyi technológiákhoz való hozzáférést keresnek."},{"k":"c","t":"Asset classes in this chapter include equities, bonds, commodities, funds, foreign exchange, real estate, and cryptocurrencies.","hu":"Az ebben a fejezetben tárgyalt eszközosztályok: részvények, kötvények, nyersanyagok, alapok, deviza, ingatlan és kriptovaluták.","lab":"AT A GLANCE"}],"3":[{"k":"h","t":"1. Introduction","hu":"1. Bevezetés"},{"k":"p","t":"Companies play a central role in modern economies, driving innovation, creating employment, and contributing to economic growth. From small local businesses to multinational corporations operating across continents, businesses influence nearly every aspect of daily life. Understanding how companies function requires examining three fundamental dimensions: the business sectors in which they operate, the legal forms that define their ownership and liability, and the organizational structures that determine how roles, responsibilities, and reporting relationships are arranged.","hu":"A vállalatok központi szerepet játszanak a modern gazdaságban: hajtják az innovációt, munkahelyeket teremtenek, és hozzájárulnak a gazdasági növekedéshez. A kis helyi vállalkozásoktól a kontinenseken átívelő multinacionális cégekig a vállalkozások a mindennapi élet szinte minden területére hatnak. A cégek működésének megértéséhez három alapvető dimenziót kell megvizsgálni: az ágazatot, amelyben működnek, a jogi formát, amely meghatározza a tulajdonlást és a felelősséget, valamint a szervezeti felépítést, amely megszabja a szerepek, a feladatok és a jelentési viszonyok rendjét."},{"k":"c","t":"Understanding companies in this chapter means looking at three dimensions: business sectors, legal forms and ownership, and organizational structures.","hu":"A vállalatok megértése ebben a fejezetben három dimenziót jelent: gazdasági ágazatok, jogi formák és tulajdonlás, valamint szervezeti felépítések.","lab":"AT A GLANCE"},{"k":"h","t":"2. Business sectors","hu":"2. Gazdasági ágazatok"},{"k":"p","t":"The term business sector refers to distinct segments of the economy, each comprising companies that provide similar products or services. These sectors shape global and national economies, influencing employment, technological advancement, and economic growth. Each sector has uniq ue characteristics, challenges, and contributions to the economy, particularly in Hungary, where certain industries have established strong footholds through innovation, investment, and government support.","hu":"A gazdasági ágazat kifejezés a gazdaság elkülönülő szegmenseire utal, amelyek mindegyikét hasonló terméket vagy szolgáltatást nyújtó cégek alkotják. Ezek az ágazatok alakítják a globális és a nemzeti gazdaságot, hatva a foglalkoztatásra, a technológiai fejlődésre és a gazdasági növekedésre. Minden ágazatnak megvannak a saját jellemzői, kihívásai és gazdasági hozzájárulásai, különösen Magyarországon, ahol egyes iparágak innovációval, beruházással és állami támogatással erős pozíciót építettek ki."},{"k":"c","t":"A business sector is a segment of the economy made up of companies that provide similar products or services.","hu":"A gazdasági ágazat a gazdaság egy szegmense, amelyet hasonló terméket vagy szolgáltatást nyújtó cégek alkotnak.","lab":"DEFINITION"},{"k":"h","t":"2.1 Technology and IT sector","hu":"2.1 Technológiai és IT-ágazat"},{"k":"p","t":"One of the most dynamic sectors is technology and IT, characterized by rapid innovation, scalability, and significant investment in research and development. Companies in this sector continuously develop new software, digital platforms, and technological solutions that cater to a global audience. The Hungarian IT sector has been growing rapidly, with Budapest becoming a hub for IT services and outsourcing due to its skilled workforce and competitive costs. The government's incentives and foreign investments have further fuelled this expansion, making Hungary a key player in Central Europe's technology landscape.","hu":"Az egyik legdinamikusabb ágazat a technológia és az informatika, amelyet gyors innováció, jó skálázhatóság és jelentős kutatás-fejlesztési beruházás jellemez. Az itt működő cégek folyamatosan fejlesztenek új szoftvereket, digitális platformokat és technológiai megoldásokat globális közönség számára. A magyar IT-szektor gyorsan nő: Budapest az informatikai szolgáltatások és a kiszervezés központjává vált a képzett munkaerőnek és a versenyképes költségeknek köszönhetően. A kormányzati ösztönzők és a külföldi befektetések tovább gyorsították ezt a bővülést, így Magyarország Közép-Európa technológiai térképének fontos szereplője lett."},{"k":"h","t":"2.2 Healthcare and pharmaceutical sector","hu":"2.2 Egészségügyi és gyógyszeripari ágazat"},{"k":"p","t":"The healthcare and pharmaceutical sector includes both healthcare services and the research, development, and production of pharmaceuticals and medical products. Pharmaceutical activities in particular operate under strict regulations and often require significant investment in research and development. Demand for many healthcare services and medicines tends to remain relatively resilient during economic downturns. Pharmaceuticals in Hungary have a strong legacy, with companies exporting globally and investing heavily in R&D. Hungary adheres to high EU and international regulatory standards, ensuring that its products remain competitive in foreign markets.","hu":"Az egészségügyi és gyógyszeripari ágazatba az egészségügyi szolgáltatások, valamint a gyógyszerek és orvosi termékek kutatása, fejlesztése és gyártása is beletartozik. Különösen a gyógyszeripari tevékenység működik szigorú szabályozás mellett, és gyakran jelentős kutatás-fejlesztési beruházást igényel. Sok egészségügyi szolgáltatás és gyógyszer iránti kereslet viszonylag ellenálló marad a gazdasági visszaesések idején is. A magyar gyógyszeriparnak erős hagyományai vannak: a cégek a világ minden részére exportálnak, és sokat költenek kutatás-fejlesztésre. Magyarország magas uniós és nemzetközi szabályozási előírásokat követ, így a termékei versenyképesek maradnak a külföldi piacokon."},{"k":"h","t":"2.3 Retail sector","hu":"2.3 Kiskereskedelmi ágazat"},{"k":"p","t":"Another essential sector is retail, where businesses focus on customer satisfaction and adaptability to changing consumer preferences. This sector includes both small, locally owned stores and multinational retail chains. In Hungary, retail is shaped by the presence of both domestic player s and international giants like Tesco and Lidl. E-commerce has been expanding significantly, especially during the COVID-19 pandemic, which accelerated digital transformation. However, there is a noticeable divide between urban and rural retail markets, with urban areas generally having a higher concentration of retail outlets and services.","hu":"Egy másik alapvető ágazat a kiskereskedelem, ahol a cégek a vevői elégedettségre és a változó fogyasztói igényekhez való alkalmazkodásra összpontosítanak. Ide tartoznak a kis, helyi tulajdonú boltok és a multinacionális üzletláncok is. Magyarországon a kiskereskedelmet a hazai szereplők és az olyan nemzetközi óriások jelenléte alakítja, mint a Tesco és a Lidl. Az e-kereskedelem jelentősen bővült, különösen a COVID-19-járvány idején, amely felgyorsította a digitális átállást. Ugyanakkor látható különbség van a városi és a vidéki kiskereskedelmi piacok között: a városokban általában nagyobb az üzletek és a szolgáltatások sűrűsége."},{"k":"h","t":"2.4 Banking and finance sector","hu":"2.4 Bank- és pénzügyi ágazat"},{"k":"p","t":"The banking and finance sector is heavily regulated and provides services such as lending, deposit- taking, payments, investment services, and the management of financial assets. Institutions in this field prioritize risk management and technological integration, particularly with the ri se of fintech solutions. Hungary's banking system is well-developed, with both domestic and international banks operating in the country. The sector has embraced digital banking and fintech, supporting small and medium-sized enterprises (SMEs) while facing challenges related to currency volatility and external economic dependencies.","hu":"A bank- és pénzügyi ágazat erősen szabályozott, és olyan szolgáltatásokat nyújt, mint a hitelezés, a betétgyűjtés, a fizetések, a befektetési szolgáltatások és a pénzügyi vagyon kezelése. Az itt működő intézmények kiemelten kezelik a kockázatkezelést és a technológiai integrációt, különösen a fintech megoldások térnyerésével. Magyarország bankrendszere fejlett, hazai és nemzetközi bankok egyaránt működnek az országban. Az ágazat felkarolta a digitális bankolást és a fintechet, támogatja a kis- és középvállalkozásokat (kkv-kat), miközben az árfolyam-ingadozásból és a külső gazdasági függőségekből eredő kihívásokkal néz szembe."},{"k":"c","t":"Banking and finance: lending, deposit-taking, payments, investment services, and financial-asset management. Fintech: technology-based financial solutions that support and transform financial services.","hu":"Bank és pénzügy: hitelezés, betétgyűjtés, fizetések, befektetési szolgáltatások és pénzügyi vagyonkezelés. Fintech: technológiaalapú pénzügyi megoldások, amelyek támogatják és átalakítják a pénzügyi szolgáltatásokat.","lab":"KEY TERMS"},{"k":"h","t":"2.5 Manufacturing sector","hu":"2.5 Feldolgozóipar"},{"k":"p","t":"A key pillar of the economy is manufacturing, a resource-intensive industry that produces tangible goods, including components for other sectors. In Hungary, manufacturing is particularly strong in the automotive industry. Global brands such as Audi, Mercedes-Benz, and Suzuki have established production plants in the country, making it a critical hub for vehicle exports. Investments in electric vehicles and autonomous driving technology are shaping the future of this industry, reinforcing Hungary's reputation as a centre for automotive innovation.","hu":"A gazdaság egyik kulcspillére a feldolgozóipar, ez az erőforrás-igényes ágazat, amely kézzelfogható termékeket állít elő, köztük más ágazatok alkatrészeit. Magyarországon a feldolgozóipar különösen erős az autóiparban. Az olyan globális márkák, mint az Audi, a Mercedes-Benz és a Suzuki, gyártóüzemet létesítettek az országban, amely így a járműexport fontos központja lett. Az elektromos autókba és az önvezető technológiába való beruházások alakítják az iparág jövőjét, tovább erősítve Magyarország hírnevét az autóipari innováció központjaként."},{"k":"h","t":"2.6 Tourism and hospitality sector","hu":"2.6 Turizmus és vendéglátás"},{"k":"p","t":"Another significant industry is tourism and hospitality, which includes travel, accommodation, food and beverage, and related services, with customer experience playing a central role. This sector is highly seasonal, with revenues fluctuating according to travel trends and economic conditions. Hungary's rich cultural heritage attracts millions of visitors annually, particularly to Budapest and historical regions. Medical tourism is also a key feature, with foreign visitors seeking dental treatments and thermal spa services. However, this sector is vulnerable to global crises, such as the COVID-19 pandemic, which heavily impacted international tourism.","hu":"Egy másik jelentős iparág a turizmus és a vendéglátás, amelybe az utazás, a szálláshely, az étel-ital szolgáltatás és a kapcsolódó szolgáltatások tartoznak, és ahol a vendégélmény központi szerepet játszik. Ez az ágazat erősen szezonális: a bevételek az utazási trendek és a gazdasági helyzet szerint ingadoznak. Magyarország gazdag kulturális öröksége évente látogatók millióit vonzza, különösen Budapestre és a történelmi régiókba. Az egészségturizmus szintén meghatározó: külföldi vendégek érkeznek fogászati kezelésekre és termálfürdőkbe. Az ágazat azonban sérülékeny a globális válságokkal szemben, mint amilyen a COVID-19-járvány volt, amely súlyosan érintette a nemzetközi turizmust."},{"k":"h","t":"2.7 Construction sector","hu":"2.7 Építőipar"},{"k":"p","t":"The construction sector operates on a project-based model, requiring both skilled and lower-skilled labour to design, build, and maintain structures. Its growth is closely tied to overall economic conditions and government infrastructure spending. In Hungary, construction has seen dynamic growth, bolstered by infrastructure projects and urban development initiatives. Housing subsidies and government programmes, such as CSOK (family housing allowances), have stimulated demand. However, labour shortages have become a challenge, with increasing reliance on foreign workers. Sustainability goals are also shaping the industry, promoting green building practices.","hu":"Az építőipar projektalapú modellben működik, és képzett, valamint alacsonyabb képzettségű munkaerőt is igényel az építmények tervezéséhez, kivitelezéséhez és karbantartásához. Növekedése szorosan összefügg az általános gazdasági helyzettel és az állami infrastruktúra-kiadásokkal. Magyarországon az építőipar dinamikusan bővült, amit infrastrukturális projektek és városfejlesztési programok támogattak. A lakástámogatások és az olyan kormányzati programok, mint a CSOK (családi otthonteremtési kedvezmény), élénkítették a keresletet. A munkaerőhiány azonban kihívássá vált, és egyre nagyobb a külföldi munkavállalókra való támaszkodás. A fenntarthatósági célok is alakítják az iparágat, és ösztönzik a zöld építési gyakorlatot."},{"k":"h","t":"2.8 Electronics sector","hu":"2.8 Elektronikai ágazat"},{"k":"p","t":"In addition, electronics remains a competitive sector due to rapid product development and global supply chain dependencies. The Hungarian electronics industry is export-oriented, contributing significantly to the country's trade, especially within the EU. Production facilities manufacture a diverse range of consumer electronics, industrial equipment, and household appliances. Cities such as Győr and Debrecen serve as industrial hubs for companies like Bosch Hungary and Flextronics, benefiting from a skilled engineering workforce.","hu":"Emellett az elektronika is versenyképes ágazat marad a gyors termékfejlesztés és a globális ellátási láncoktól való függés miatt. A magyar elektronikai ipar exportorientált, és jelentősen hozzájárul az ország kereskedelméhez, különösen az Európai Unión belül. A gyártóüzemek sokféle szórakoztató elektronikai terméket, ipari berendezést és háztartási gépet állítanak elő. Olyan városok, mint Győr és Debrecen, ipari központként szolgálnak az olyan cégeknek, mint a Bosch Hungary és a Flextronics, kihasználva a képzett mérnöki munkaerőt."},{"k":"h","t":"2.9 Transport and logistics sector","hu":"2.9 Szállítmányozás és logisztika"},{"k":"p","t":"The transport and logistics sector facilitates the movement and coordination of goods, materials, and people across regions. Transport focuses primarily on moving goods and passengers, while logistics also includes activities such as warehousing, distribution, and the coordination of supply flows. Efficiency, technological integration, and environmental sustainability are important priorities throughout the sector. Hungary's strategic location within Europe places it along key transport corridors, such as the Trans-European Transport Network (TEN-T). Major logistics hubs in Budapest, Győr, and Debrecen serve as storage and distribution centres. As green logistics become a priority, companies are increasingly adopting eco-friendly solutions, such as electric delivery vehicles and energy-efficient warehouses. However, labour shortages persist, particularly in roles such as truck drivers, warehouse staff, and logistics coordinators.","hu":"A szállítmányozási és logisztikai ágazat az áruk, anyagok és emberek régiók közötti mozgatását és összehangolását végzi. A szállítás elsősorban az áruk és az utasok mozgatására összpontosít, míg a logisztika olyan tevékenységeket is magában foglal, mint a raktározás, az elosztás és az ellátási folyamatok összehangolása. Az ágazat egészében fontos szempont a hatékonyság, a technológiai integráció és a környezeti fenntarthatóság. Magyarország stratégiai fekvése Európán belül fontos közlekedési folyosókra helyezi az országot, ilyen például a transzeurópai közlekedési hálózat (TEN-T). A nagy logisztikai központok Budapesten, Győrben és Debrecenben tárolási és elosztási feladatokat látnak el. Ahogy a zöld logisztika prioritássá válik, a cégek egyre inkább környezetbarát megoldásokat vezetnek be, például elektromos kiszállító járműveket és energiahatékony raktárakat. A munkaerőhiány azonban továbbra is fennáll, különösen a kamionsofőrök, a raktári dolgozók és a logisztikai koordinátorok körében."},{"k":"c","t":"Transport focuses primarily on moving goods and passengers. Logistics also includes warehousing, distribution, and the coordination of supply flows.","hu":"A szállítás elsősorban az áruk és az utasok mozgatására összpontosít. A logisztika ezen túl a raktározást, az elosztást és az ellátási folyamatok összehangolását is magában foglalja.","lab":"KEY DISTINCTION"},{"k":"h","t":"2.10 Telecommunications and media industries","hu":"2.10 Távközlés és média"},{"k":"p","t":"Finally, telecommunications and media are closely related but distinct industries concerned with connectivity and content distribution. Telecommunications spans internet and communication services and requires continuous technological innovation, with companies developing faster and more reliable networks, including 5G. In Hungary, broadband expansion and fibre-optic investments have improved infrastructure, while the 5G rollout in major cities supports smart city initiatives and IoT applications. The media landscape features a mix of public and private outlets, with television, radio, print, and online platforms coexisting. Despite technological progress, some rural areas still struggle with access to high-speed internet, posing a challenge to digital inclusion.","hu":"Végül a távközlés és a média szorosan összefüggő, de elkülönülő iparágak, amelyek a kapcsolódásról és a tartalom terjesztéséről szólnak. A távközlés az internet- és kommunikációs szolgáltatásokat öleli fel, és folyamatos technológiai innovációt igényel: a cégek gyorsabb és megbízhatóbb hálózatokat fejlesztenek, köztük 5G-t. Magyarországon a szélessávú bővítés és az optikai beruházások javították az infrastruktúrát, a nagyvárosi 5G-kiépítés pedig támogatja az okosváros-kezdeményezéseket és az IoT-alkalmazásokat. A médiapiacon közszolgálati és magánszereplők keveréke van jelen: televízió, rádió, nyomtatott sajtó és online felületek egyaránt. A technológiai haladás ellenére egyes vidéki területeken még mindig gond a nagy sebességű internet elérése, ami kihívást jelent a digitális felzárkózás szempontjából."},{"k":"c","t":"Telecommunications focuses on connectivity and communication services. Media focuses on content and its distribution through television, radio, print, and online platforms.","hu":"A távközlés a kapcsolódásra és a kommunikációs szolgáltatásokra összpontosít. A média a tartalomra és annak terjesztésére televízióban, rádióban, nyomtatásban és online.","lab":"KEY DISTINCTION"},{"k":"h","t":"3. Company forms, ownership types, and business","hu":"3. Vállalati formák, tulajdonlási típusok és üzleti"},{"k":"p","t":"arrangements Businesses around the world operate under various legal forms, ownership structures, and business arrangements. A company's legal form defines issues such as ownership, liability, and financial responsibilities, while other classifications may describe its geographical scope or relationships with other businesses. The choice of company form depends on multiple factors, including the level of liability owners are willing to accept, the need for external funding, and the scale of operations. Although legal systems differ from country to country, many comparable forms and arrangements exist internationally. In Hungary, company law offers several corporate forms tailored to different business needs.","hu":"együttműködések – A világ vállalkozásai különböző jogi formákban, tulajdonosi szerkezetekben és üzleti konstrukciókban működnek. A cég jogi formája olyan kérdéseket határoz meg, mint a tulajdonlás, a felelősség és a pénzügyi kötelezettségek, míg más besorolások a földrajzi hatókört vagy a más cégekkel való kapcsolatot írják le. A vállalati forma megválasztása több tényezőtől függ: mekkora felelősséget hajlandók vállalni a tulajdonosok, szükség van-e külső forrásra, és mekkora a működés mérete. Bár a jogrendszerek országonként eltérnek, sok hasonló forma és konstrukció létezik nemzetközileg. Magyarországon a társasági jog több vállalati formát kínál a különböző üzleti igényekhez."},{"k":"c","t":"Legal form defines issues such as ownership, liability, and financial responsibilities. Other classifications can describe ownership, geographical scope, or relationships with other businesses.","hu":"A jogi forma olyan kérdéseket határoz meg, mint a tulajdonlás, a felelősség és a pénzügyi kötelezettségek. Más besorolások a tulajdonlást, a földrajzi hatókört vagy a más cégekkel való kapcsolatot írják le.","lab":"QUICK RECAP"},{"k":"h","t":"3.1 Sole proprietorships","hu":"3.1 Egyéni vállalkozás"},{"k":"p","t":"One of the simplest and most common forms is the sole proprietorship, where a single individual owns and operates a business. This structure provides complete control over decision-making and profits, but it comes with unlimited liability, meaning that the owner's personal assets are at risk if the business incurs debts. In Hungary, this form of business is known as \"egyéni vállalkozás\", and it is particularly popular among small-scale traders, freelancers, and artisans. The registration process is straightforward and can be completed through the Hungarian Tax Authority (NAV). Common examples include individual consultants and small service providers.","hu":"Az egyik legegyszerűbb és leggyakoribb forma az egyéni vállalkozás, ahol egyetlen személy birtokolja és működteti az üzletet. Ez a forma teljes irányítást ad a döntések és a nyereség felett, de korlátlan felelősséggel jár, vagyis a tulajdonos magánvagyona is kockázatnak van kitéve, ha a vállalkozás eladósodik. Magyarországon ezt a formát „egyéni vállalkozásnak” hívják, és különösen népszerű a kiskereskedők, a szabadúszók és a kézművesek körében. A regisztráció egyszerű, és a Nemzeti Adó- és Vámhivatalnál (NAV) intézhető. Tipikus példák az egyéni tanácsadók és a kis szolgáltatók."},{"k":"h","t":"3.2 Partnerships","hu":"3.2 Társas vállalkozások"},{"k":"p","t":"Another widely used business structure is the partnership, which involves two or more individuals sharing ownership, profits, and responsibilities. Partnerships come in two main forms: 1. general partnerships (GP), where the partners share responsibility for managing the business and have unlimited liability, and 2. limited partnerships (LP), where at least one partner has unlimited liability, while at least one partner has limited liability and does not participate in management. In Hungary, general partnerships (közkereseti társaság, kkt.) are suitable for small businesses where owners wish to share responsibilities, while limited partnerships (betéti társaság, bt.) require at least one general partner with unlimited liability and one limited partner whose liability is restricted to their investment. Family businesses and small law firms often operate as partnerships.","hu":"Egy másik széles körben használt forma a társas vállalkozás, amelyben két vagy több személy osztozik a tulajdonon, a nyereségen és a feladatokon. Két fő típusa van: 1. a közkereseti társaság (GP), ahol a tagok közösen viszik az üzletet, és korlátlanul felelnek, valamint 2. a betéti társaság (LP), ahol legalább egy tag korlátlanul felel, legalább egy tag felelőssége pedig korlátozott, és nem vesz részt az irányításban. Magyarországon a közkereseti társaság (kkt.) olyan kisvállalkozásoknak való, ahol a tulajdonosok meg akarják osztani a felelősséget, míg a betéti társasághoz (bt.) legalább egy korlátlanul felelős beltag és egy kültag kell, akinek a felelőssége a befektetésére korlátozódik. Családi vállalkozások és kis ügyvédi irodák gyakran működnek társas formában."},{"k":"c","t":"General partnership (GP): partners have unlimited liability. Limited partnership (LP): at least one partner has unlimited liability, while at least one limited partner has liability restricted to their investment.","hu":"Közkereseti társaság (GP): a tagok felelőssége korlátlan. Betéti társaság (LP): legalább egy tag korlátlanul felel, legalább egy kültag felelőssége pedig a befektetésére korlátozódik.","lab":"KEY DISTINCTION"},{"k":"h","t":"3.3 Limited liability companies (LLCs)","hu":"3.3 Korlátolt felelősségű társaság (kft.)"},{"k":"p","t":"For entrepreneurs looking for personal liability protection, limited liability companies (LLCs) are a preferred option. LLCs exist as separate legal entities, protecting owners from personal financial risk while requiring more formal governance structures. In Hungary, this type of company is called \"korlátolt felelősségű társaság (kft.)\", and it requires a minimum initial capital of HUF 3 million. This form is particularly attractive for small and medium-sized enterprises (SMEs), offering a balance between legal protection and operational flexibility. Many IT start-ups and local manufacturing companies in Hungary adopt this model.","hu":"Azoknak a vállalkozóknak, akik védelmet keresnek a személyes felelősség ellen, a korlátolt felelősségű társaság a kedvelt megoldás. A kft. önálló jogi személy, amely megvédi a tulajdonosokat a személyes pénzügyi kockázattól, cserébe formálisabb irányítási szerkezetet kíván. Magyarországon ezt a formát „korlátolt felelősségű társaságnak (kft.)” hívják, és legalább 3 millió forint törzstőkét igényel. Különösen vonzó a kis- és középvállalkozásoknak, mert egyensúlyt kínál a jogi védelem és a működési rugalmasság között. Sok magyar IT-startup és helyi gyártócég ezt a modellt választja."},{"k":"c","t":"A limited liability company (LLC) is a separate legal entity that protects owners from personal financial risk. In Hungary, this form is the korlátolt felelősségű társaság (kft.).","hu":"A korlátolt felelősségű társaság (kft.) önálló jogi személy, amely megvédi a tulajdonosokat a személyes pénzügyi kockázattól. Magyarországon ez a korlátolt felelősségű társaság.","lab":"DEFINITION"},{"k":"h","t":"3.4 Companies with share-based ownership","hu":"3.4 Részvényalapú tulajdonú társaságok"},{"k":"p","t":"Companies limited by shares are business entities whose capital is divided into shares held by shareholders. This structure allows for the pooling of significant capital, while also limiting each shareholder's liability to the value of their shares. Share-based companies can take one of two forms, depending on whether their shares are traded publicly on stock exchanges or not. In Hungary and much of the world, there are two types of companies limited by shares: 1. public limited company/PLC (nyilvánosan működő részvénytársaság, nyrt.) , whose shares are listed on the stock exchange, with a minimum capital requirement of HUF 20 million. 2. private limited company/LTD (zártkörűen működő részvénytársaság, zrt.), which does not trade shares publicly and requires a minimum capital of HUF 5 million, and","hu":"A részvénytársaságok olyan gazdasági társaságok, amelyek tőkéje a részvényesek által birtokolt részvényekre oszlik. Ez a szerkezet lehetővé teszi jelentős tőke összegyűjtését, miközben minden részvényes felelősségét a részvényei értékére korlátozza. A részvénytársaságok két formát ölthetnek aszerint, hogy a részvényeikkel nyilvánosan kereskednek-e a tőzsdén. Magyarországon és a világ nagy részén két típus létezik: 1. a nyilvánosan működő részvénytársaság (nyrt.), amelynek részvényeit a tőzsdén jegyzik, és amelyhez legalább 20 millió forint alaptőke kell; 2. a zártkörűen működő részvénytársaság (zrt.), amelynek részvényeivel nem kereskednek nyilvánosan, és amelyhez legalább 5 millió forint alaptőke szükséges."},{"k":"p","t":"Notable Hungarian companies limited by shares include OTP Bank (Nyrt.) and Szerencsejáték Zrt., which play significant roles in the national economy.","hu":"Ismert magyar részvénytársaságok például az OTP Bank Nyrt. és a Szerencsejáték Zrt., amelyek jelentős szerepet játszanak a nemzetgazdaságban."},{"k":"c","t":"Public limited company / PLC (nyrt.): shares are listed on the stock exchange. Private limited company / LTD (zrt.): shares are not traded publicly.","hu":"Nyilvánosan működő részvénytársaság (nyrt.): a részvényeit a tőzsdén jegyzik. Zártkörűen működő részvénytársaság (zrt.): a részvényeivel nem kereskednek nyilvánosan.","lab":"KEY DISTINCTION"},{"k":"h","t":"3.5 Multinational corporations (MNCs)","hu":"3.5 Multinacionális vállalatok"},{"k":"p","t":"Companies can also be classified according to the geographical scope of their operations. Beyond national enterprises, multinational corporations (MNCs) operate across multiple countries, typically maintaining a centralized headquarters in one country while operating subsidiaries in different markets. These corporations benefit from economies of scale and a diversified global presence. In Hungary, MNCs establish operations through subsidiaries or branch offices. A branch office (fióktelep) is not a separate legal entity and remains fully dependent on the parent company, whereas a representative office (kereskedelmi képviselet) is primarily used for marketing, customer support, or administrative functions without engaging in direct commercial activities. Examples of multinational operations in Hungary include Audi Hungaria (subsidiary) and Siemens Hungary (branch office).","hu":"A cégeket a működésük földrajzi hatóköre szerint is osztályozhatjuk. A nemzeti vállalkozásokon túl a multinacionális vállalatok több országban működnek: jellemzően egy országban tartják a központjukat, és különböző piacokon működtetnek leányvállalatokat. Ezek a cégek méretgazdaságosságból és szórt globális jelenlétből profitálnak. Magyarországon a multik leányvállalatokon vagy fióktelepeken keresztül működnek. A fióktelep nem önálló jogi személy, és teljesen függ az anyavállalattól, míg a kereskedelmi képviselet elsősorban marketinggel, ügyfélszolgálattal vagy adminisztrációval foglalkozik, közvetlen kereskedelmi tevékenység nélkül. Magyarországi példák: az Audi Hungaria (leányvállalat) és a Siemens Hungary (fióktelep)."},{"k":"c","t":"Multinational corporation (MNC): operates across multiple countries, usually with a centralized headquarters and subsidiaries in different markets. Branch office: not a separate legal entity and remains dependent on the parent company. Representative office: used mainly for marketing, customer support, or administration without direct commercial activity.","hu":"Multinacionális vállalat: több országban működik, rendszerint központtal és különböző piacokon működő leányvállalatokkal. Fióktelep: nem önálló jogi személy, és az anyavállalattól függ. Képviseleti iroda: főként marketingre, ügyfélszolgálatra vagy adminisztrációra szolgál, közvetlen kereskedelmi tevékenység nélkül.","lab":"KEY TERMS"},{"k":"h","t":"3.6 Cooperatives","hu":"3.6 Szövetkezetek"},{"k":"p","t":"Another unique business structure is the cooperative, an organization owned and managed by its members, who share profits and decision-making responsibilities. Cooperatives are commonly found in agriculture, retail, and housing, where members seek mutual benefits rather than profit maximization. In Hungary, cooperatives are known as \"szövetkezet\", and they play a vital role in farming, small- scale production, and financial services such as credit unions. Governed by the Hungarian Civil Code, cooperatives enable collective ownership while ensuring equitable profit distribution.","hu":"Egy másik sajátos forma a szövetkezet, vagyis a tagjai tulajdonában és irányításában álló szervezet, ahol a tagok osztoznak a nyereségen és a döntéshozatal felelősségén. A szövetkezetek gyakoriak a mezőgazdaságban, a kiskereskedelemben és a lakhatásban, ahol a tagok kölcsönös előnyt, nem pedig a nyereség maximalizálását keresik. Magyarországon ezeket „szövetkezetnek” hívják, és létfontosságú szerepet játszanak a mezőgazdaságban, a kisüzemi termelésben és az olyan pénzügyi szolgáltatásokban, mint a hitelszövetkezetek. A Polgári Törvénykönyv szabályozza őket, így a közös tulajdonlás mellett méltányos nyereségelosztást is biztosítanak."},{"k":"h","t":"3.7 Non-profit companies","hu":"3.7 Nonprofit szervezetek"},{"k":"p","t":"Some organizations operate under non-profit company status, prioritizing societal impact over financial gain. These entities focus on education, social services, and charitable initiatives, often receiving tax exemptions and financial support through donations or grants. In Hungary, \"közhasznú társaság\" refers to non-profit organizations that must reinvest any surplus revenue into their mission rather than distributing it as profit. Many NGOs, cultural organizations, and community service providers fall under this category.","hu":"Egyes szervezetek nonprofit formában működnek, és a társadalmi hatást helyezik a pénzügyi nyereség elé. Ezek oktatással, szociális szolgáltatásokkal és jótékonysági kezdeményezésekkel foglalkoznak, és gyakran kapnak adókedvezményt, valamint adományokból vagy pályázatokból származó támogatást. Magyarországon a „közhasznú társaság” olyan nonprofit szervezeteket jelöl, amelyeknek a többletbevételüket a küldetésükbe kell visszaforgatniuk, nem pedig nyereségként felosztaniuk. Sok civil szervezet, kulturális szervezet és közösségi szolgáltató tartozik ebbe a körbe."},{"k":"h","t":"3.8 Joint ventures","hu":"3.8 Közös vállalatok"},{"k":"p","t":"In certain industries, businesses form joint ventures, temporary partnerships between two or more entities collaborating on a specific project or business activity. These partnerships are especially common in sectors such as construction, energy, and technology. In Hungary, joint ventures are governed by contract law and are often used for infrastructure projects or international collaborations between foreign investors and Hungarian businesses. Large-scale projects such as motorway construction and tech start-ups frequently rely on joint venture agreements to pool resources and expertise.","hu":"Egyes iparágakban a cégek közös vállalatot (joint venture-t) hoznak létre: ez két vagy több fél ideiglenes együttműködése egy adott projektre vagy üzleti tevékenységre. Ez a forma különösen gyakori az építőiparban, az energetikában és a technológiai szektorban. Magyarországon a közös vállalatokat a szerződési jog szabályozza, és gyakran használják infrastrukturális projektekhez vagy külföldi befektetők és magyar cégek nemzetközi együttműködéseihez. Az olyan nagy projektek, mint az autópálya-építés vagy a technológiai startupok, gyakran támaszkodnak közös vállalati megállapodásra, hogy egyesítsék az erőforrásokat és a szaktudást."},{"k":"c","t":"A joint venture is a temporary partnership between two or more entities collaborating on a specific project or business activity.","hu":"A közös vállalat két vagy több fél ideiglenes együttműködése egy adott projektre vagy üzleti tevékenységre.","lab":"DEFINITION"},{"k":"h","t":"3.9 State-owned enterprises (SOEs)","hu":"3.9 Állami tulajdonú vállalatok"},{"k":"p","t":"A crucial component of national economies is state-owned enterprises (SOEs), which are businesses wholly or partly owned and controlled by the state, usually in strategic industries such as energy, transportation, and defence. These entities can play a key role in providing essential public services and maintaining state involvement in strategically important sectors. SOE describes the ownership of an enterprise rather than a separate legal company form. In Hungary, prominent examples include Hungarian State Railways (MÁV) and Magyar Posta, the national postal service. State ownership can be used to maintain control over strategically important services and infrastructure, although state-owned companies may also cooperate with private-sector partners.","hu":"A nemzetgazdaság egyik kulcseleme az állami tulajdonú vállalat, amely egészben vagy részben az állam tulajdonában és irányítása alatt áll, rendszerint stratégiai iparágakban, például az energetikában, a közlekedésben vagy a védelemben. Ezek a cégek kulcsszerepet játszhatnak az alapvető közszolgáltatások biztosításában és az állami jelenlét fenntartásában a stratégiailag fontos ágazatokban. Az állami tulajdonú vállalat a tulajdonlást írja le, nem egy külön jogi társasági formát. Magyarországon ilyen például a Magyar Államvasutak (MÁV) és a Magyar Posta. Az állami tulajdon fenntarthatja az ellenőrzést a stratégiailag fontos szolgáltatások és infrastruktúra felett, bár az állami cégek magánszektorbeli partnerekkel is együttműködhetnek."},{"k":"c","t":"State-owned enterprise (SOE) describes ownership rather than a separate legal company form.","hu":"Az állami tulajdonú vállalat a tulajdonlást írja le, nem külön jogi társasági formát.","lab":"KEY DISTINCTION"},{"k":"h","t":"3.10 An overview of company forms","hu":"3.10 A vállalati formák áttekintése"},{"k":"p","t":"UK (US) Sole proprietorship Partnership Private limited company Public limited company (USA: Corporation) Abbreviation","hu":"Egyesült Királyság (USA): egyéni vállalkozás – társas vállalkozás – zártkörű részvénytársaság – nyilvános részvénytársaság (USA: corporation). Rövidítés:"},{"k":"c","t":"(USA: Inc, corp., co.) Number of owners 1 2+ 2+ 2+ (USA: 2+) Liability unlimited unlimited limited limited Sale of ownership sale by owner establishes new firm change in any partner's interest requires new partnership only of all the other shareholders agree no restraints Minimum required capital Ł1+ Ł50,000 (USA: regulations vary from state to state) Separate legal entity no no yes yes (USA: yes)","hu":"LTD, PLC (USA: Inc., corp., co.). Tulajdonosok száma: 1 – 2 vagy több – 2 vagy több – 2 vagy több (USA: 2 vagy több). Felelősség: korlátlan – korlátlan – korlátozott – korlátozott. A tulajdonrész eladása: a tulajdonos általi eladás új céget hoz létre; bármely tag részesedésének változása új társasági szerződést igényel; csak akkor, ha a többi részvényes egyetért; nincs korlátozás. Minimális tőke: 1 font+ – 50 000 font (USA: államonként eltérő szabályozás). Önálló jogi személy: nem – nem – igen – igen (USA: igen).","lab":"LTD PLC"},{"k":"h","t":"4. Company structures and organizational models","hu":"4. Vállalati struktúrák és szervezeti modellek"},{"k":"p","t":"The structure of a company defines its hierarchy, decision-making processes, and the way different roles interact to achieve business objectives. The choice of an organizational structure depends on the size of the company, the nature of its operations, and its strategic goals. Organizational structure is distinct from legal form: it describes how work, authority, responsibilities, and reporting relationships are arranged within a company. Some companies opt for simple, owner-driven models, while others implement complex, multi-layered systems to manage large-scale operations across different markets. Each structure has its advantages and challenges, influencing efficiency, flexibility, and overall management effectiveness.","hu":"A cég struktúrája határozza meg a hierarchiáját, a döntéshozatali folyamatait, és azt, hogyan működnek együtt a különböző szerepek az üzleti célok elérése érdekében. A szervezeti felépítés megválasztása a cég méretétől, a működés jellegétől és a stratégiai céloktól függ. A szervezeti felépítés különbözik a jogi formától: azt írja le, hogyan rendeződik el a munka, a hatáskör, a felelősség és a jelentési viszony a cégen belül. Egyes cégek egyszerű, tulajdonosvezérelt modellt választanak, mások összetett, többszintű rendszert vezetnek be, hogy nagy léptékű működést kezeljenek különböző piacokon. Minden szerkezetnek megvannak az előnyei és a kihívásai, amelyek hatnak a hatékonyságra, a rugalmasságra és a vezetés eredményességére."},{"k":"c","t":"Legal form describes ownership, liability, and financial responsibilities. Organizational structure describes how work, authority, responsibilities, and reporting relationships are arranged inside the company.","hu":"A jogi forma a tulajdonlást, a felelősséget és a pénzügyi kötelezettségeket írja le. A szervezeti felépítés azt, hogyan rendeződik el a munka, a hatáskör, a felelősség és a jelentési viszony a cégen belül.","lab":"KEY DISTINCTION"},{"k":"h","t":"4.1 The functional structure","hu":"4.1 A funkcionális felépítés"},{"k":"p","t":"As companies grow, they often adopt more structured forms, such as the functional structure, which organizes a company based on specialized departments like marketing, finance, operations, and human resources. This structure is common in medium and large organizations, offering clear roles and responsibilities within each function. The hierarchy typically consists of a CEO or Managing Director overseeing different department heads, who in turn manage team leaders and employees. While specialization improves efficiency and expertise, the downside is that departments may operate in silos, leading to limited cross-functional collaboration and slower response times to changing market conditions.","hu":"Ahogy a cégek nőnek, gyakran szervezettebb formákat vesznek fel, például a funkcionális felépítést, amely szakosodott osztályok – marketing, pénzügy, működés, HR – mentén szervezi a céget. Ez a szerkezet közepes és nagy szervezetekben gyakori, és világos szerepeket és felelősségeket ad minden funkción belül. A hierarchia jellemzően egy vezérigazgatóból (CEO vagy ügyvezető igazgató) áll, aki az osztályvezetőket felügyeli, ők pedig a csoportvezetőket és a dolgozókat irányítják. Bár a szakosodás javítja a hatékonyságot és a szaktudást, hátránya, hogy az osztályok elszigetelten működhetnek, ami korlátozza a funkciók közötti együttműködést, és lassítja a reagálást a változó piaci körülményekre."},{"k":"c","t":"Functional structure: employees are grouped into specialized departments such as marketing, finance, operations, and HR. Main strength: specialization and clear responsibility. Main risk: departmental silos.","hu":"Funkcionális felépítés: a dolgozókat szakosodott osztályokba – marketing, pénzügy, működés, HR – sorolják. Fő erőssége a szakosodás és a világos felelősség. Fő kockázata az osztályok elszigetelődése.","lab":"AT A GLANCE"},{"k":"h","t":"4.2 The divisional structure","hu":"4.2 A divizionális felépítés"},{"k":"p","t":"A more complex but market-focused model is the divisional structure, where a company is divided into semi-autonomous units based on product lines, geographical regions, or target markets. Multinational corporations frequently use this structure, as it allows divisions to focus on specific customer needs while remaining part of the larger corporate entity. Each division has its own management team responsible for performance, but duplication of resources across divisions can be inefficient. Coordination between divisions also poses challenges, requiring strong communication channels and corporate oversight.","hu":"Összetettebb, de piacközpontúbb modell a divizionális felépítés, amelyben a céget termékvonalak, földrajzi régiók vagy célpiacok szerint félig önálló egységekre osztják. A multinacionális vállalatok gyakran használják, mert így az egységek adott vevői igényekre összpontosíthatnak, miközben a nagyobb cég részei maradnak. Minden divíziónak saját vezetése van, amely felel a teljesítményért, de az erőforrások divíziók közötti megkettőzése pazarló lehet. A divíziók közötti koordináció is kihívás, erős kommunikációs csatornákat és vállalati felügyeletet igényel."},{"k":"c","t":"Divisional structure: the company is split into semi-autonomous units based on products, regions, or markets. It improves market focus but can duplicate resources across divisions.","hu":"Divizionális felépítés: a céget termékek, régiók vagy piacok szerint félig önálló egységekre osztják. Javítja a piaci fókuszt, de megkettőzheti az erőforrásokat a divíziók között.","lab":"AT A GLANCE"},{"k":"h","t":"4.3 The matrix structure","hu":"4.3 A mátrixszervezet"},{"k":"p","t":"For companies requiring both functional expertise and project-based flexibility, the matrix structure combines elements of both functional and divisional models. Employees report to multiple managers: one overseeing their functional area (such as marketing or finance) and another managing specific projects. This structure is widely used in industries like construction, engineering, and technology, where project-based work is essential. While it enhances collaboration and resource utilization, the dual-reporting system can create confusion and conflicts, requiring strong coordination and communication.","hu":"Azoknak a cégeknek, amelyeknek egyszerre kell szakmai tudás és projektalapú rugalmasság, a mátrixszervezet a funkcionális és a divizionális modell elemeit ötvözi. A dolgozók több vezetőnek jelentenek: az egyik a szakterületüket (például a marketinget vagy a pénzügyet) felügyeli, a másik konkrét projekteket irányít. Ezt a szerkezetet széles körben használják az építőiparban, a mérnöki területen és a technológiai szektorban, ahol a projektmunka alapvető. Bár javítja az együttműködést és az erőforrás-kihasználást, a kettős jelentési rend zavart és konfliktust okozhat, ezért erős koordinációt és kommunikációt igényel."},{"k":"c","t":"Matrix structure combines functional expertise with project-based work. Employees report to more than one manager, which increases flexibility but can create conflict or confusion.","hu":"A mátrixszervezet a szakterületi tudást projektmunkával ötvözi. A dolgozók több vezetőnek is jelentenek, ami növeli a rugalmasságot, de konfliktust vagy zavart okozhat.","lab":"KEY DISTINCTION"},{"k":"h","t":"4.4 The flat structure","hu":"4.4 A lapos felépítés"},{"k":"p","t":"Some businesses, particularly start-ups and creative industries, adopt a flat structure, which minimizes hierarchical levels and emphasizes collaboration. In this model, decision-making is more decentralized, and employees have greater autonomy. The CEO or owner provides strategic direction, but teams work independently with minimal supervision. The main advantage is that it encourages innovation and faster decision-making. However, as companies grow, the lack of clear role definitions can lead to management challenges and inefficiencies.","hu":"Egyes vállalkozások – különösen a startupok és a kreatív iparágak – lapos felépítést vezetnek be, amely minimálisra csökkenti a hierarchiaszinteket, és az együttműködést hangsúlyozza. Ebben a modellben a döntéshozatal decentralizáltabb, a dolgozók pedig nagyobb önállóságot kapnak. A vezérigazgató vagy a tulajdonos adja a stratégiai irányt, de a csapatok minimális felügyelettel, önállóan dolgoznak. Fő előnye, hogy ösztönzi az innovációt és a gyorsabb döntéseket. Ahogy azonban a cég nő, a világos szerepmeghatározás hiánya vezetési nehézségekhez és pazarláshoz vezethet."},{"k":"c","t":"Flat structures minimize hierarchy and give employees more autonomy. They support fast decisions and innovation, but role clarity can become difficult as the company grows.","hu":"A lapos szerkezet minimalizálja a hierarchiát, és nagyobb önállóságot ad a dolgozóknak. Támogatja a gyors döntéseket és az innovációt, de a szerepek tisztázása nehézzé válhat a cég növekedésével.","lab":"QUICK RECAP"},{"k":"h","t":"4.5 The hierarchical structure","hu":"4.5 A hierarchikus felépítés"},{"k":"p","t":"At the opposite end of the spectrum is the hierarchical structure, which follows a traditional pyramid- like model with well-defined levels of authority. This structure is commonly used in government agencies, large corporations, and industries requiring strict oversight. In a typical large corporation, the hierarchy may include a Board of Directors that provides strategic oversight, a CEO responsible for executive leadership, and multiple layers of senior, middle, and first-line management. This structure provides clear reporting lines, a well-defined chain of command, and accountability, but it can be slow to adapt to changes and may stifle innovation due to bureaucratic processes.","hu":"A skála másik végén a hierarchikus felépítés áll, amely hagyományos, piramisszerű modellt követ jól meghatározott hatásköri szintekkel. Ezt a szerkezetet gyakran használják állami szerveknél, nagyvállalatoknál és olyan ágazatokban, ahol szigorú felügyelet kell. Egy tipikus nagyvállalatban a hierarchiához tartozhat a stratégiai felügyeletet adó igazgatóság, a vezetésért felelős vezérigazgató, valamint a felső-, közép- és alsó szintű vezetők több rétege. Ez a szerkezet világos jelentési útvonalakat, meghatározott parancsnoki láncot és elszámoltathatóságot biztosít, de lassan alkalmazkodik a változásokhoz, és a bürokratikus folyamatok fojthatják az innovációt."},{"k":"c","t":"Hierarchical structures provide clear levels of authority, reporting lines, and accountability. Their main disadvantage is slower adaptation and greater bureaucracy.","hu":"A hierarchikus szerkezet világos hatásköri szinteket, jelentési útvonalakat és elszámoltathatóságot biztosít. Fő hátránya a lassabb alkalmazkodás és a nagyobb bürokrácia.","lab":"QUICK RECAP"},{"k":"h","t":"4.6 The network structure","hu":"4.6 A hálózati felépítés"},{"k":"p","t":"An increasingly popular model in global businesses is the network structure, where companies rely on external organizations, contractors, or outsourcing partners to handle key functions while maintaining a small core team. This model is often used in industries that outsource manufacturing, customer service, or IT functions to third-party providers. A central management team coordinates with partner organizations, enabling cost-effective and scalable operations. However, dependence on external partners introduces challenges in quality control and coordination.","hu":"A globális üzleti életben egyre népszerűbb modell a hálózati felépítés, amelyben a cégek külső szervezetekre, alvállalkozókra vagy kiszervezési partnerekre bízzák a kulcsfeladatokat, miközben kis mag-csapatot tartanak fenn. Ezt a modellt gyakran alkalmazzák olyan iparágakban, ahol a gyártást, az ügyfélszolgálatot vagy az informatikai feladatokat külső szolgáltatóknak adják ki. Egy központi vezetői csapat hangolja össze a partnerszervezeteket, így a működés költséghatékony és jól skálázható lehet. A külső partnerektől való függés azonban kihívást jelent a minőség-ellenőrzésben és a koordinációban."},{"k":"c","t":"Network structure: a small core company relies on external organizations, contractors, or outsourcing partners for important functions. It can be scalable and cost-effective, but creates dependence on external partners.","hu":"Hálózati felépítés: egy kis mag-cég külső szervezetekre, alvállalkozókra vagy kiszervezési partnerekre támaszkodik a fontos feladatoknál. Jól skálázható és költséghatékony lehet, de függőséget teremt a külső partnerektől.","lab":"DEFINITION"},{"k":"h","t":"4.7 Comparison of structures based on key factors and features","hu":"4.7 A szerkezetek összehasonlítása kulcsszempontok szerint"},{"k":"p","t":"Structure Best for Flexibility Clarity Cost Sole proprietorship small, owner-driven businesses high high low Functional medium-large organizations moderate high moderate Divisional multinationals moderate moderate high Matrix project-based operations high moderate high Flat start-ups, creative industries high low low Hierarchical government, large corporations low high high Network companies relying heavily on external partners moderate low moderate","hu":"Szerkezet – mire a legjobb – rugalmasság – áttekinthetőség – költség. Egyéni vállalkozás: kis, tulajdonosvezérelt vállalkozásoknak, magas, magas, alacsony. Funkcionális: közepes és nagy szervezeteknek, közepes, magas, közepes. Divizionális: multinacionális cégeknek, közepes, közepes, magas. Mátrix: projektalapú működésre, magas, közepes, magas. Lapos: startupoknak és kreatív iparágaknak, magas, alacsony, alacsony. Hierarchikus: államigazgatásnak és nagyvállalatoknak, alacsony, magas, magas. Hálózati: külső partnerekre erősen támaszkodó cégeknek, közepes, alacsony, közepes."}],"4":[{"k":"h","t":"1. Introduction to politics","hu":"1. Bevezetés a politikába"},{"k":"p","t":"Politics is the process through which societies make collective decisions about rules, resources, priorities, and common problems. It takes place whenever people disagree about what should be done and need a legitimate way to reach decisions that affect a larger group. A political system therefore does more than organise elections: it determines who may exercise power, how that power is limited, how decisions are made, and how citizens can influence public life. In a small community this may involve decisions about local services, while at national level it includes taxation, education, healthcare, security, and relations with other countries.","hu":"A politika az a folyamat, amelynek során a társadalmak közösen döntenek a szabályokról, az erőforrásokról, a prioritásokról és a közös problémákról. Mindig ott van, ahol az emberek nem értenek egyet abban, mit kellene tenni, és legitim módra van szükségük ahhoz, hogy egy nagyobb csoportot érintő döntéseket hozzanak. A politikai rendszer tehát többet tesz, mint hogy választásokat szervez: meghatározza, ki gyakorolhat hatalmat, hogyan korlátozzák ezt a hatalmat, hogyan születnek a döntések, és hogyan hathatnak az állampolgárok a közéletre. Egy kis közösségben ez helyi szolgáltatásokról szóló döntéseket jelenthet, országos szinten viszont az adózást, az oktatást, az egészségügyet, a biztonságot és a más országokkal való kapcsolatokat is magában foglalja."},{"k":"c","t":"Politics = the process through which societies make collective decisions about rules, resources, priorities, and common problems. A political system determines who may exercise power, how it is limited, how decisions are made, and how citizens can influence public life.","hu":"Politika = az a folyamat, amelynek során a társadalmak közösen döntenek a szabályokról, az erőforrásokról, a prioritásokról és a közös problémákról. A politikai rendszer meghatározza, ki gyakorolhat hatalmat, hogyan korlátozzák, hogyan születnek a döntések, és hogyan hathatnak az állampolgárok a közéletre.","lab":"DEFINITION"},{"k":"p","t":"The state is the permanent political organisation that exercises sovereignty over a territory and population. The government is different: it is the group of political leaders and institutions that temporarily direct the state and make day-to-day decisions. Governments change after elections or political crises, while the state itself normally continues. This distinction can be seen across democratic countries: the British, German, or Hungarian state remains in place even when a new government takes office. Sovereignty refers to the state's ultimate legal authority over its territory, although membership in international organisations can involve voluntarily sharing or limiting parts of that authority, as European Union member states do in areas governed by EU law.","hu":"Az állam az az állandó politikai szervezet, amely szuverenitást gyakorol egy terület és lakosság felett. A kormány ettől különbözik: azoknak a politikai vezetőknek és intézményeknek az együttese, amelyek ideiglenesen irányítják az államot, és meghozzák a napi döntéseket. A kormányok választások vagy politikai válságok után cserélődnek, maga az állam viszont rendszerint folytatódik. Ez a különbségtétel a demokratikus országokban jól látszik: a brit, a német vagy a magyar állam akkor is fennmarad, amikor új kormány lép hivatalba. A szuverenitás az állam végső jogi fennhatóságát jelenti a területe felett, bár a nemzetközi szervezeti tagság a hatáskör egy részének önkéntes megosztásával vagy korlátozásával járhat, ahogy az uniós tagállamoknál is történik az uniós jog által szabályozott területeken."},{"k":"c","t":"State: the permanent political organisation exercising sovereignty over a territory and population. Government: the political leaders and institutions that temporarily direct the state and make day-to-day decisions.","hu":"Állam: az állandó politikai szervezet, amely szuverenitást gyakorol egy terület és lakosság felett. Kormány: azok a politikai vezetők és intézmények, amelyek ideiglenesen irányítják az államot, és meghozzák a napi döntéseket.","lab":"KEY DISTINCTION"},{"k":"p","t":"Political power is the ability to influence decisions or behaviour, whereas authority is power regarded as legitimate. Legitimacy is therefore crucial: citizens are more likely to accept laws and political decisions when they believe the institutions making them have a valid right to do so. In democracies, elections, constitutional rules, and the rule of law are major sources of legitimacy. A citizen is not merely a person living in a country but a member of a political community with rights and duties, such as voting where eligible, obeying the law, paying taxes, or participating in public debate. The idea of the public interest expresses the expectation that political decisions should consider the needs of society as a whole rather than only the interests of individual office-holders or groups.","hu":"A politikai hatalom az a képesség, hogy valaki befolyásolja a döntéseket vagy a viselkedést, míg a tekintély (authority) legitimnek tekintett hatalom. A legitimitás ezért döntő: az állampolgárok nagyobb eséllyel fogadják el a törvényeket és a politikai döntéseket, ha úgy vélik, hogy az azokat meghozó intézményeknek erre érvényes joguk van. A demokráciákban a választások, az alkotmányos szabályok és a jogállamiság a legitimitás fő forrásai. Az állampolgár nem pusztán az országban élő személy, hanem a politikai közösség tagja jogokkal és kötelezettségekkel: szavaz, ha jogosult, betartja a törvényt, adót fizet, vagy részt vesz a közéleti vitában. A közérdek fogalma azt az elvárást fejezi ki, hogy a politikai döntéseknek a társadalom egészének szükségleteit kell figyelembe venniük, nem csak egyes tisztségviselők vagy csoportok érdekeit."},{"k":"c","t":"Political power = the ability to influence decisions or behaviour. Authority = power regarded as legitimate. Legitimacy = the belief that institutions have a valid right to make political decisions.","hu":"Politikai hatalom = az a képesség, hogy valaki befolyásolja a döntéseket vagy a viselkedést. Tekintély = legitimnek tekintett hatalom. Legitimitás = az a meggyőződés, hogy az intézményeknek érvényes joguk van politikai döntéseket hozni.","lab":"KEY TERMS"},{"k":"h","t":"2. Political systems and forms of government","hu":"2. Politikai rendszerek és kormányzati formák"},{"k":"p","t":"Political systems can be classified in several ways. One distinction concerns how leaders gain and keep power; another concerns whether the head of state is elected or hereditary; and a third concerns the relationship between the executive and the legislature. No classification explains every detail, but these categories make it easier to compare countries such as the United Kingdom, the United States, Germany, France, Hungary, Switzerland, or Japan.","hu":"A politikai rendszereket többféleképpen osztályozhatjuk. Az egyik szempont az, hogyan szerzik meg és tartják meg a vezetők a hatalmat; a másik, hogy az államfő választott vagy örökletes-e; a harmadik pedig a végrehajtó és a törvényhozó hatalom viszonya. Egyetlen osztályozás sem magyaráz meg minden részletet, de ezek a kategóriák megkönnyítik az összehasonlítást olyan országok között, mint az Egyesült Királyság, az Egyesült Államok, Németország, Franciaország, Magyarország, Svájc vagy Japán."},{"k":"h","t":"2.1 Democracy and authoritarian government","hu":"2.1 Demokrácia és tekintélyelvű kormányzás"},{"k":"p","t":"A democracy is a political system in which political authority ultimately derives from the people and leaders can be held accountable through meaningful political participation. Most modern democracies are representative democracies: citi
