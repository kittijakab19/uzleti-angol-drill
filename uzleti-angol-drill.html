a gazdaság szerkezetének mély változásait tükrözi, ez a típus különösen nagy kihívás a dolgozóknak és a döntéshozóknak egyaránt."},{"k":"h","t":"6.3.4 Seasonal unemployment","hu":"6.3.4 Szezonális munkanélküliség"},{"k":"p","t":"Seasonal unemployment happens when jobs are tied to particular times of the year. For instance, ski instructors may only work during the winter, farm workers may only be employed during harvest, and holiday resorts may only need extra staff during the summer. Seasonal unemployment is predictable and usually temporary, but it still affects the livelihoods of workers who rely on seasonal industries.","hu":"A szezonális munkanélküliség akkor lép fel, amikor az állás az év adott szakaszához kötődik. A síoktatók például csak télen dolgoznak, a mezőgazdasági munkásokat csak a betakarítás idején foglalkoztatják, az üdülőhelyeknek pedig csak nyáron kell plusz személyzet. A szezonális munkanélküliség kiszámítható és rendszerint átmeneti, de így is érinti azoknak a megélhetését, akik szezonális ágazatokra támaszkodnak."},{"k":"h","t":"7. Interest rates","hu":"7. Kamatlábak"},{"k":"p","t":"Interest rates are one of the most powerful tools in economics, because they represent the cost of borrowing money. Whenever someone takes out a loan (whether it is a family buying a house, a business investing in new equipment, or a government funding public projects) they must pay back the borrowed amount plus interest. The interest rate determines how expensive or cheap that borrowing is, and in this way, it strongly influences economic activity. The level of interest rates is not left to chance. They are heavily guided by central banks, such as the US Federal Reserve or the European Central Bank. These institutions adjust interest rates depending on the health of the economy. If inflation is rising too quickly, central banks may increase interest rates to make borrowing more expensive and slow down spending. On the other hand, if the economy is weak and needs a boost, they may lower rates to encourage borrowing, investment, and consumption.","hu":"A kamatlábak a közgazdaságtan egyik legerősebb eszközei, mert a pénz kölcsönvételének árát jelentik. Ha valaki hitelt vesz fel – legyen az egy házat vásárló család, egy új gépbe beruházó vállalkozás vagy egy közprojekteket finanszírozó kormány –, a kölcsönvett összeget kamattal együtt kell visszafizetnie. A kamatláb határozza meg, mennyire drága vagy olcsó a hitel, és így erősen befolyásolja a gazdasági aktivitást. A kamatszint nem a véletlenen múlik. Erősen irányítják a központi bankok, például az amerikai Federal Reserve vagy az Európai Központi Bank. Ezek az intézmények a gazdaság állapotától függően igazítják a kamatokat. Ha az infláció túl gyorsan emelkedik, a központi bankok kamatot emelhetnek, hogy drágítsák a hitelt, és lassítsák a költekezést. Ha viszont a gazdaság gyenge, és lökésre van szüksége, csökkenthetik a kamatot, hogy ösztönözzék a hitelfelvételt, a beruházást és a fogyasztást."},{"k":"c","t":"Higher interest rates → borrowing becomes more expensive → spending and investment tend to slow. Lower interest rates → borrowing becomes cheaper → spending and investment tend to rise.","hu":"Magasabb kamat → drágább a hitel → a költés és a beruházás jellemzően lassul. Alacsonyabb kamat → olcsóbb a hitel → a költés és a beruházás jellemzően nő.","lab":"CAUSE & EFFECT"},{"k":"p","t":"History offers striking examples of how powerful interest rates can be. In the 1980s, the United States faced very high inflation. To bring it under control, the Federal Reserve took the bold step of raising interest rates to over 20%. This policy successfully cooled inflation, but it came at a high cost: borrowing became extremely expensive, businesses reduced investment, and the country entered a sharp recession. By contrast, in times of economic crisis, low interest rates are often used to stimulate growth. After the 2008 Global Financial Crisis, central banks in Europe went so far as to introduce negative interest rates, effectively charging commercial banks to keep money idle. The idea was to push banks to lend more, businesses to invest, and households to spend helping the economy recover from deep recession. More recently, during the COVID-19 pandemic recovery, central banks kept interest rates very low so that households and businesses could access cheap loans. This helped many firms survive and encouraged consumers to spend, speeding up recovery. However, such policies can also create side effects. In some countries, the availability of cheap credit led to housing bubbles, as excessive borrowing pushed property prices far beyond sustainable levels.","hu":"A történelem szemléletes példákat kínál arra, milyen erős eszköz a kamatláb. Az 1980-as években az Egyesült Államok nagyon magas inflációval küzdött. Hogy megfékezze, a Federal Reserve merész lépésre szánta el magát: 20% fölé emelte a kamatokat. Ez a politika sikeresen lehűtötte az inflációt, de nagy árat kellett fizetni érte: a hitel rendkívül drága lett, a cégek visszafogták a beruházásokat, és az ország éles recesszióba került. Ezzel szemben gazdasági válság idején gyakran alacsony kamatokkal élénkítik a növekedést. A 2008-as globális pénzügyi válság után az európai központi bankok egészen a negatív kamatok bevezetéséig mentek el, vagyis gyakorlatilag fizettetni kezdték a kereskedelmi bankokat azért, hogy a pénzük parlagon hever. A cél az volt, hogy a bankok többet hitelezzenek, a cégek beruházzanak, a háztartások pedig költsenek, segítve a gazdaság kilábalását a mély recesszióból. Újabban, a COVID-19-járvány utáni fellendülés idején a központi bankok nagyon alacsonyan tartották a kamatokat, hogy a háztartások és a cégek olcsó hitelhez jussanak. Ez sok cég túlélését segítette, és költésre ösztönözte a fogyasztókat, felgyorsítva a kilábalást. Az ilyen politikának azonban mellékhatásai is lehetnek. Néhány országban az olcsó hitel elérhetősége ingatlanbuborékhoz vezetett, mert a túlzott hitelfelvétel a fenntartható szint fölé tolta az ingatlanárakat."},{"k":"h","t":"7.1 A Hungarian example: Hungary's 3% housing loan program","hu":"7.1 Magyar példa: a 3%-os lakáshitelprogram"},{"k":"p","t":"In July 2025, the Hungarian government launched a major new housing support initiative: a 3% mortgage loan program designed to help first-time buyers enter the housing market. The idea is simple: while market interest rates remain high (around 6.5%), the government is stepping in to subsidize borrowing costs for young families and individuals purchasing their first home. House prices in Hungary have more than tripled since 2010, leaving many young people unable to buy homes. Under the program, eligible borrowers can access long-term mortgages at just 3% interest, far below market rates. To qualify, they must make at least a 10% deposit (an initial payment made when buying something, before the rest is paid), and the maximum loan amount is capped at 50 million forints. The loans can run for up to 25 years, making monthly payments far more affordable than they would be at commercial bank interest rates.","hu":"2025 júliusában a magyar kormány jelentős új lakhatási támogatást indított: egy 3%-os jelzáloghitel-programot, amely az első lakásukat vásárlóknak segít belépni a lakáspiacra. Az elgondolás egyszerű: miközben a piaci kamatok magasak maradnak (6,5% körül), az állam beszáll a hitelköltség támogatásába a fiatal családok és az első otthonukat vásárlók számára. Magyarországon a lakásárak 2010 óta több mint háromszorosukra nőttek, így sok fiatal nem tud lakást venni. A program keretében a jogosult hitelfelvevők mindössze 3%-os kamattal juthatnak hosszú lejáratú jelzáloghitelhez, ami messze a piaci szint alatt van. A feltétel legalább 10% önerő (vásárláskor fizetett első részlet, a fennmaradó összeget később fizetik), a hitel összege pedig legfeljebb 50 millió forint lehet. A futamidő akár 25 év is lehet, így a havi törlesztő jóval megfizethetőbb, mint kereskedelmi banki kamat mellett."},{"k":"c","t":"Hungary's 3% housing loan program: 3% interest, at least a 10% deposit, a maximum loan of 50 million forints, and a term of up to 25 years.","hu":"A magyar 3%-os lakáshitelprogram: 3% kamat, legalább 10% önerő, legfeljebb 50 millió forint hitel és akár 25 éves futamidő.","lab":"REAL-WORLD EXAMPLE"},{"k":"h","t":"8. The business cycle","hu":"8. A gazdasági ciklus"},{"k":"p","t":"Economies do not grow in a straight line. Instead, they move in cycles of expansion and contraction, much like waves that rise and fall over time. This pattern is known as the business cycle. Economists study it because it helps explain why economies sometimes experience years of prosperity and at other times struggle with recessions and crises. The business cycle is typically divided into four main stages: expansion, peak, contraction (or recession), and trough. Each stage has its own characteristics, which can be seen in key indicators such as GDP, inflation, and unemployment.","hu":"A gazdaságok nem egyenes vonalban nőnek. Inkább fellendülés és visszaesés ciklusaiban mozognak, akár a hullámok, amelyek idővel emelkednek és süllyednek. Ezt a mintát nevezzük gazdasági (konjunktúra-) ciklusnak. A közgazdászok azért tanulmányozzák, mert segít megmagyarázni, miért él át egy gazdaság hol évekig tartó jólétet, hol pedig recessziókat és válságokat. A ciklust jellemzően négy fő szakaszra osztják: fellendülés, csúcs, visszaesés (vagy recesszió) és mélypont. Mindegyik szakasznak megvannak a saját jellemzői, amelyek látszanak az olyan kulcsmutatókon, mint a GDP, az infláció és a munkanélküliség."},{"k":"c","t":"Expansion → Peak → Contraction (or recession) → Trough → Recovery → new Expansion","hu":"Fellendülés → Csúcs → Visszaesés (vagy recesszió) → Mélypont → Kilábalás → új fellendülés","lab":"PROCESS"},{"k":"h","t":"8.1 The four main stages of the business cycle","hu":"8.1 A gazdasági ciklus négy fő szakasza"},{"k":"h","t":"8.1.1 Expansion: The good times","hu":"8.1.1 Fellendülés: a jó idők"},{"k":"p","t":"During an expansion, businesses grow, consumers feel confident, and spending increases. GDP rises steadily as companies produce more goods and services. Unemployment falls because firms need more workers to meet rising demand. Inflation is usually low or moderate, making conditions stable for growth. Expansions can last for several years and are often seen as times of prosperity. For example, after the Second World War, many Western economies experienced decades of expansion as industries grew, trade expanded, and living standards improved.","hu":"A fellendülés idején a cégek növekednek, a fogyasztók bizakodnak, és nő a költés. A GDP egyenletesen emelkedik, ahogy a cégek több terméket és szolgáltatást állítanak elő. A munkanélküliség csökken, mert a cégeknek több dolgozóra van szükségük a növekvő kereslet kiszolgálásához. Az infláció általában alacsony vagy mérsékelt, így a növekedés feltételei stabilak. A fellendülés több évig is tarthat, és gyakran a jólét időszakának tekintik. A második világháború után például sok nyugati gazdaság évtizedekig tartó fellendülést élt át, ahogy az iparágak nőttek, a kereskedelem bővült, és javult az életszínvonal."},{"k":"h","t":"8.1.2 Peak: The turning point","hu":"8.1.2 Csúcs: a fordulópont"},{"k":"p","t":"Eventually, every expansion reaches a peak, which is the highest point of economic activity. At this stage, businesses are operating at full capacity, unemployment is at its lowest, and consumer demand is very strong. However, peaks are also risky because rapid spending and borrowing can push inflation higher. When inflation begins to creep upward, the economy may become overheated, making it difficult to sustain growth.","hu":"Előbb-utóbb minden fellendülés eléri a csúcsot, vagyis a gazdasági aktivitás legmagasabb pontját. Ebben a szakaszban a cégek teljes kapacitáson működnek, a munkanélküliség a legalacsonyabb, a fogyasztói kereslet pedig nagyon erős. A csúcs azonban kockázatos is, mert a gyors költekezés és hitelfelvétel feljebb tolhatja az inflációt. Amikor az infláció kúszni kezd, a gazdaság túlfűtötté válhat, és nehézzé válik a növekedés fenntartása."},{"k":"h","t":"8.1.3 Contraction: The slowdown","hu":"8.1.3 Visszaesés: a lassulás"},{"k":"p","t":"After the peak, the economy enters a contraction, which is marked by slowing growth and falling GDP. Businesses cut production, unemployment rises, and consumer confidence weakens. A mild contraction is usually called a recession, often defined as two consecutive quarters of negative GDP growth. For instance, during the COVID-19 pandemic in 2020, economies around the world experienced sudden contractions as lockdowns shut down businesses and trade. A more severe and prolonged downturn is called a depression, such as the Great Depression (1929–1939), when unemployment in the United States reached about 25% and global trade collapsed. The severity of a contraction often depends on external shocks (such as wars, pandemics, or oil crises), financial instability, or policy mistakes that make recovery harder.","hu":"A csúcs után a gazdaság visszaesésbe fordul, amelyet a növekedés lassulása és a GDP csökkenése jellemez. A cégek visszafogják a termelést, nő a munkanélküliség, és gyengül a fogyasztói bizalom. Az enyhe visszaesést rendszerint recessziónak nevezik, amelyet gyakran két egymást követő negyedév negatív GDP-növekedéseként határoznak meg. A 2020-as COVID-19-járvány idején például a világ gazdaságai hirtelen visszaesést éltek át, mert a lezárások leállították a vállalkozásokat és a kereskedelmet. A súlyosabb és elhúzódó visszaesést depressziónak hívják, mint amilyen a nagy gazdasági világválság volt (1929–1939), amikor az Egyesült Államokban a munkanélküliség elérte a 25%-ot, és a világkereskedelem összeomlott. A visszaesés súlyossága gyakran külső sokkoktól (háború, járvány, olajválság), a pénzügyi instabilitástól vagy olyan szakpolitikai hibáktól függ, amelyek nehezítik a kilábalást."},{"k":"h","t":"8.1.4 Trough: The bottom","hu":"8.1.4 Mélypont: a ciklus alja"},{"k":"p","t":"Eventually, the economy hits the lowest point of the cycle, known as the trough. At this stage, GDP stops falling and reaches its bottom level, unemployment peaks, and inflation remains low or even negative due to weak demand. The trough is often the most painful part of the cycle, but it also marks the beginning of recovery.","hu":"Végül a gazdaság eléri a ciklus legalacsonyabb pontját, a mélypontot. Ebben a szakaszban a GDP abbahagyja az esést, és eléri a legalsó szintjét, a munkanélküliség tetőzik, az infláció pedig a gyenge kereslet miatt alacsony vagy akár negatív marad. A mélypont gyakran a ciklus legfájdalmasabb része, de egyben a kilábalás kezdetét is jelzi."},{"k":"h","t":"8.2 Recovery and a new cycle","hu":"8.2 Kilábalás és új ciklus"},{"k":"p","t":"From the trough, the economy begins to stabilize. Businesses start to reinvest, consumer confidence slowly returns, and unemployment begins to fall. This is known as a recovery, which sets the stage for a new expansion, starting the cycle all over again.","hu":"A mélypontról a gazdaság stabilizálódni kezd. A cégek újra beruháznak, lassan visszatér a fogyasztói bizalom, és csökkenni kezd a munkanélküliség. Ezt nevezzük kilábalásnak, amely megágyaz egy új fellendülésnek, és elindítja az egész ciklust elölről."},{"k":"c","t":"Expansion: GDP rises and unemployment falls. Peak: economic activity reaches its highest point. Contraction: GDP falls and unemployment rises. Trough: the economy reaches the bottom of the cycle. Recovery: activity begins to stabilize and grow again.","hu":"Fellendülés: nő a GDP, csökken a munkanélküliség. Csúcs: a gazdasági aktivitás eléri a legmagasabb pontját. Visszaesés: csökken a GDP, nő a munkanélküliség. Mélypont: a gazdaság eléri a ciklus alját. Kilábalás: az aktivitás stabilizálódni és újra nőni kezd.","lab":"QUICK RECAP"},{"k":"h","t":"8.3 Why the business cycle matters","hu":"8.3 Miért fontos a gazdasági ciklus?"},{"k":"p","t":"Understanding the business cycle helps governments, businesses, and households prepare for economic changes. Policymakers may raise interest rates during expansions to prevent overheating or lower them during recessions to encourage recovery. Businesses use the cycle to plan investment and hiring, while households may adjust spending and saving habits based on economic conditions.","hu":"A gazdasági ciklus megértése segít a kormányoknak, a vállalkozásoknak és a háztartásoknak felkészülni a gazdasági változásokra. A döntéshozók fellendülés idején kamatot emelhetnek a túlfűtöttség megelőzésére, recesszióban pedig csökkenthetik a kilábalás ösztönzésére. A cégek a ciklus alapján tervezik a beruházást és a felvételt, a háztartások pedig a gazdasági helyzethez igazíthatják a költési és megtakarítási szokásaikat."}],"2":[{"k":"h","t":"Banking","hu":"Bankrendszer"},{"k":"h","t":"1. Introduction","hu":"1. Bevezetés"},{"k":"p","t":"Every modern economy relies on a financial system to keep money flowing smoothly between individuals, businesses, and governments. Without it, people would struggle to save for the future, companies would find it difficult to invest and grow, and governments would lack the tools to manage the economy. The financial system acts as the \"circulatory system\" of the economy, ensuring that funds are collected, transferred, and invested where they are needed most.","hu":"Minden modern gazdaság pénzügyi rendszerre támaszkodik ahhoz, hogy a pénz zökkenőmentesen áramoljon a magánszemélyek, a vállalkozások és a kormányok között. Enélkül az emberek nehezen takarítanának meg a jövőre, a cégeknek nehéz lenne beruházni és növekedni, a kormányoknak pedig hiányoznának az eszközeik a gazdaság irányításához. A pénzügyi rendszer a gazdaság „keringési rendszereként” működik: gondoskodik arról, hogy a forrásokat összegyűjtsék, továbbítsák és oda fektessék, ahol a legnagyobb szükség van rájuk."},{"k":"c","t":"The financial system keeps money flowing between individuals, businesses, and governments. It ensures that funds are collected, transferred, and invested where they are needed most.","hu":"A pénzügyi rendszer tartja mozgásban a pénzt a magánszemélyek, a vállalkozások és a kormányok között. Gondoskodik arról, hogy a forrásokat összegyűjtsék, továbbítsák és oda fektessék, ahol a legnagyobb szükség van rájuk.","lab":"DEFINITION"},{"k":"h","t":"2. The two-tier banking system","hu":"2. A kétszintű bankrendszer"},{"k":"p","t":"Most countries, including the United States, the United Kingdom, and Hungary, operate under what is called a two-tier banking system. This means that there are two distinct levels of banks, each with its own responsibilities and functions. The first tier is made up of the central bank. This is the most important financial institution in a country, responsible for overseeing the nation's money supply, monetary policy, and overall financial stability. The central bank does not usually deal directly with ordinary people or businesses. Instead, it acts as a regulator and supervisor of the entire financial system. Examples include the Federal Reserve (Fed) in the United States, the Bank of England (BoE) in the UK, and the Magyar Nemzeti Bank (MNB) in Hungary. The second tier consists of commercial banks and other specialized banks. These are the institutions that interact directly with households, businesses, and organizations. They provide everyday financial services such as managing deposits, giving out loans, offering credit cards, and enabling payments. In other words, commercial banks connect savers and borrowers, keeping money flowing through the economy. The reason for separating the central bank from commercial banks is to create a clear division of roles with specialised responsibilities. The central bank focuses on the \"big picture\": managing inflation, stabilizing the currency, and ensuring financial stability. For instance, the Magyar Nemzeti Bank increased the interest rate from 16% to 18% in order to combat inflation. Commercial bank s, on the other hand, deal with the practical, day-to-day financial needs of individuals and companies.","hu":"A legtöbb ország – köztük az Egyesült Államok, az Egyesült Királyság és Magyarország – úgynevezett kétszintű bankrendszerben működik. Ez azt jelenti, hogy a bankoknak két elkülönülő szintje van, mindegyiknek saját feladatokkal és funkciókkal. Az első szintet a központi bank alkotja. Ez az ország legfontosabb pénzügyi intézménye, amely a pénzmennyiség, a monetáris politika és az általános pénzügyi stabilitás felügyeletéért felel. A központi bank rendszerint nem áll közvetlen kapcsolatban a hétköznapi emberekkel vagy a cégekkel. Ehelyett az egész pénzügyi rendszer szabályozójaként és felügyelőjeként működik. Ilyen például a Federal Reserve (Fed) az Egyesült Államokban, a Bank of England (BoE) az Egyesült Királyságban, és a Magyar Nemzeti Bank (MNB) Magyarországon. A második szintet a kereskedelmi bankok és más szakosított bankok alkotják. Ezek azok az intézmények, amelyek közvetlenül kapcsolatban állnak a háztartásokkal, a vállalkozásokkal és a szervezetekkel. Mindennapi pénzügyi szolgáltatásokat nyújtanak: betéteket kezelnek, hitelt adnak, hitelkártyát kínálnak és fizetéseket bonyolítanak. Más szóval a kereskedelmi bankok kötik össze a megtakarítókat és a hitelfelvevőket, így tartva mozgásban a pénzt a gazdaságban. A központi bank és a kereskedelmi bankok szétválasztásának oka a szerepek világos, szakosodott felosztása. A központi bank a „nagy képre” összpontosít: kezeli az inflációt, stabilizálja a valutát, és biztosítja a pénzügyi stabilitást. A Magyar Nemzeti Bank például 16%-ról 18%-ra emelte a kamatot az infláció letörése érdekében. A kereskedelmi bankok ezzel szemben a magánszemélyek és a cégek gyakorlati, napi pénzügyi igényeivel foglalkoznak."},{"k":"c","t":"Central bank: focuses on the big picture - monetary policy, inflation, currency stability, and financial stability. Commercial banks: deal with the day-to-day financial needs of individuals and companies.","hu":"Központi bank: a nagy képre összpontosít – monetáris politika, infláció, a valuta stabilitása és a pénzügyi stabilitás. Kereskedelmi bankok: a magánszemélyek és a cégek napi pénzügyi igényeivel foglalkoznak.","lab":"KEY DISTINCTION"},{"k":"h","t":"2.1 The first tier: Central banks","hu":"2.1 Az első szint: a központi bankok"},{"k":"p","t":"A central bank is the most important financial institution in a country's economy. Its role is to oversee and manage the nation's currency, monetary policy, and banking system. Unlike commercial banks, which provide services directly to households and businesses, the central bank acts as the authority that keeps the entire financial system stable and ensures the conditions for economic growth. Every country has its own central bank and as explained above in the United States, this is the Federal Reserve (often called \"the Fed\"). In the United Kingdom, the central bank is the Bank of England (BoE). In Hungary, it is the Magyar Nemzeti Bank (MNB). Although the names differ, their core functions are very similar.","hu":"A központi bank az ország gazdaságának legfontosabb pénzügyi intézménye. Feladata a nemzet valutájának, monetáris politikájának és bankrendszerének felügyelete és irányítása. A kereskedelmi bankokkal ellentétben, amelyek közvetlenül a háztartásoknak és a cégeknek nyújtanak szolgáltatást, a központi bank az a hatóság, amely az egész pénzügyi rendszert stabilan tartja, és megteremti a gazdasági növekedés feltételeit. Minden országnak megvan a saját központi bankja: ahogy fentebb szerepelt, az Egyesült Államokban ez a Federal Reserve (közismert nevén „a Fed”). Az Egyesült Királyságban a központi bank a Bank of England (BoE). Magyarországon a Magyar Nemzeti Bank (MNB). Bár a nevük különbözik, az alapfunkcióik nagyon hasonlóak."},{"k":"p","t":"One of the central bank's key responsibilities is the implementation of monetary policy. This means managing the money supply and adjusting interest rates to control inflation, stabilize the currency, and promote employment. For example, during the 2008 financial crisis, the Federal Reserve lowered its main interest rate to nearly zero in order to make borrowing cheaper and encourage spending, which helped stimulate the economy. Another important function is issuing currency. In the United States, the Fed is responsible for printing and distributing U.S. dollars, ensuring that enough money circulates in the economy to meet demand. The central bank also has the task of regulating and supervising commercial banks. It checks that banks operate safely, follow financial laws, and do not take on excessive risks that could harm the economy. After the 2008 crisis, new rules such as the Dodd-Frank Act gave the Fed greater powers to monitor large institutions considered \" too big to fail.\" In times of crisis, the central bank can act as a lender of last resort. This means it provides emergency funding to banks or financial institutions facing serious liquidity problems. For instance, in March 2020, as the COVID-19 pandemic caused turmoil in global markets, the Federal Reserve launched emergency lending programs to stabilize the financial system. The Fed also helps manage the country's foreign exchange reserves. Working with the U.S. Treasury, it can intervene in currency markets to support the stability of the dollar, which is a cornerstone of international trade and finance. Finally, the central bank ensures that the payment systems work efficiently. In the United States, this includes operating systems such as Fedwire, which handles large-value transfers between banks. These systems make sure that everyday financial transactions, such as businesses paying suppliers or individuals receiving salaries, can take place securely and on time.","hu":"A központi bank egyik kulcsfeladata a monetáris politika végrehajtása. Ez azt jelenti, hogy kezeli a pénzmennyiséget, és a kamatok igazításával fékezi az inflációt, stabilizálja a valutát és támogatja a foglalkoztatást. A 2008-as pénzügyi válság idején például a Federal Reserve gyakorlatilag nullára csökkentette az alapkamatát, hogy olcsóbbá tegye a hitelt, és költésre ösztönözzön, ezzel élénkítve a gazdaságot. Egy másik fontos funkció a pénzkibocsátás. Az Egyesült Államokban a Fed felel az amerikai dollár nyomtatásáért és forgalomba hozataláért, gondoskodva arról, hogy elegendő pénz legyen forgalomban a kereslet kielégítésére. A központi bank feladata a kereskedelmi bankok szabályozása és felügyelete is. Ellenőrzi, hogy a bankok biztonságosan működnek-e, betartják-e a pénzügyi jogszabályokat, és nem vállalnak-e olyan túlzott kockázatot, amely árthat a gazdaságnak. A 2008-as válság után az olyan új szabályok, mint a Dodd–Frank-törvény, nagyobb jogkört adtak a Fednek a „túl nagy ahhoz, hogy elbukjon” besorolású nagy intézmények felügyeletére. Válság idején a központi bank végső mentsvár hitelezőként is felléphet. Ez azt jelenti, hogy vészhelyzeti forrást nyújt a komoly likviditási gonddal küzdő bankoknak vagy pénzügyi intézményeknek. 2020 márciusában például, amikor a COVID-19-járvány felkavarta a globális piacokat, a Federal Reserve vészhelyzeti hitelprogramokat indított a pénzügyi rendszer stabilizálására. A Fed segít az ország devizatartalékának kezelésében is. Az amerikai pénzügyminisztériummal együttműködve beavatkozhat a devizapiacokon a dollár stabilitásának támogatására, amely a nemzetközi kereskedelem és pénzügyek sarokköve. Végül a központi bank gondoskodik a fizetési rendszerek hatékony működéséről. Az Egyesült Államokban ez olyan rendszerek üzemeltetését jelenti, mint a Fedwire, amely a bankok közötti nagy összegű átutalásokat bonyolítja. Ezek a rendszerek biztosítják, hogy a mindennapi pénzügyi tranzakciók – például a cégek beszállítói kifizetései vagy a bérek kifizetése – biztonságosan és időben megtörténhessenek."},{"k":"c","t":"Central-bank functions include monetary policy, issuing currency, supervising commercial banks, acting as lender of last resort, managing foreign exchange reserves, and supporting payment systems.","hu":"A központi bank feladatai közé tartozik a monetáris politika, a pénzkibocsátás, a kereskedelmi bankok felügyelete, a végső mentsvár hitelezői szerep, a devizatartalék kezelése és a fizetési rendszerek támogatása.","lab":"AT A GLANCE"},{"k":"h","t":"2.2 Second tier: specialized banks","hu":"2.2 A második szint: a szakosított bankok"},{"k":"p","t":"The second tier of the banking system consists of specialized banks, most importantly commercial banks. These are the institutions that people and businesses deal with in their daily financial lives. At the most basic level, banks manage the flow of money between depositors and borrowers. When people or companies place money into deposit accounts, the bank can use those funds to make loans to others. Borrowers then repay the loans with interest, which is the main source of income for banks. A portion of this interest is often returned to the original account holders, espec ially on savings accounts, as a reward for keeping their money in the bank. In addition to interest, banks also earn income from fees they charge for various services. Economists often measure the profitability of banks using a figure called the net interest margin. This is calculated by taking the interest a bank earns on its loans and subtracting the interest it pays to its depositors and other creditors. A higher margin means the bank is more profitable.","hu":"A bankrendszer második szintjét a szakosított bankok alkotják, ezek közül is legfőképpen a kereskedelmi bankok. Ezek azok az intézmények, amelyekkel az emberek és a cégek a napi pénzügyeikben kapcsolatba kerülnek. A legalapvetőbb szinten a bankok a betétesek és a hitelfelvevők közötti pénzáramlást kezelik. Amikor emberek vagy cégek betétszámlára helyezik a pénzüket, a bank ezekből a forrásokból hitelt tud nyújtani másoknak. A hitelfelvevők a kölcsönt kamattal együtt fizetik vissza, ami a bankok fő bevételi forrása. E kamat egy részét gyakran visszajuttatják az eredeti számlatulajdonosoknak – különösen takarékszámlák esetén – jutalmul azért, hogy a bankban tartják a pénzüket. A kamat mellett a bankok a különböző szolgáltatásokért felszámított díjakból is szereznek bevételt. A közgazdászok a bankok jövedelmezőségét gyakran a nettó kamatmarzs nevű mutatóval mérik. Ezt úgy számolják, hogy a bank hiteleken keresett kamatából levonják a betéteseknek és más hitelezőknek fizetett kamatot. A magasabb marzs jövedelmezőbb bankot jelent."},{"k":"c","t":"Net interest margin = interest earned on loans - interest paid to depositors and other creditors. A higher margin means the bank is more profitable.","hu":"Nettó kamatmarzs = a hiteleken keresett kamat − a betéteseknek és más hitelezőknek fizetett kamat. A magasabb marzs jövedelmezőbb bankot jelent.","lab":"FORMULA"},{"k":"h","t":"2.2.1 Commercial banks","hu":"2.2.1 Kereskedelmi bankok"},{"k":"p","t":"Commercial banks are the most common type of specialized bank, and they play a crucial role in supporting the economy. Their main function is to act as intermediaries between those who have extra money to save (depositors) and those who need money to borrow (borrowers). In this way, they keep funds circulating through the economy, which supports investment, business growth, and consumer spending. Commercial banks also provide a wide range of financial services to individuals, companies, and institutions. These services can be grouped into deposit and account services, lending services, payment services, foreign exchange, and investment services, many of which may be available via remote banking. Through these services, commercial banks make it possible for people to manage their money conveniently, for businesses to finance their operations, and for the wider economy to grow.","hu":"A kereskedelmi bankok a szakosított bankok leggyakoribb típusai, és kulcsszerepet játszanak a gazdaság támogatásában. Fő funkciójuk, hogy közvetítsenek azok között, akiknek felesleges megtakarításuk van (betétesek), és azok között, akiknek pénzre van szükségük (hitelfelvevők). Így tartják körforgásban a forrásokat a gazdaságban, ami támogatja a beruházást, a cégek növekedését és a fogyasztói költést. A kereskedelmi bankok széles körű pénzügyi szolgáltatásokat is nyújtanak magánszemélyeknek, cégeknek és intézményeknek. Ezek a szolgáltatások csoportosíthatók betéti és számlaszolgáltatásokra, hitelezési szolgáltatásokra, fizetési szolgáltatásokra, valutaváltásra és befektetési szolgáltatásokra, amelyek közül sok távoli bankoláson keresztül is elérhető. Ezekkel a szolgáltatásokkal a kereskedelmi bankok lehetővé teszik, hogy az emberek kényelmesen kezeljék a pénzüket, a vállalkozások finanszírozzák a működésüket, a tágabb gazdaság pedig növekedjen."},{"k":"c","t":"Commercial banks act as intermediaries between depositors and borrowers. Their services include deposit and account services, lending, payments, foreign exchange, investment services, and remote banking.","hu":"A kereskedelmi bankok közvetítőként működnek a betétesek és a hitelfelvevők között. Szolgáltatásaik közé tartozik a betét- és számlavezetés, a hitelezés, a fizetések, a valutaváltás, a befektetési szolgáltatások és a távoli bankolás.","lab":"QUICK RECAP"},{"k":"h","t":"2.2.1.1 Commercial banks: deposit and account services","hu":"2.2.1.1 Kereskedelmi bankok: betéti és számlaszolgáltatások"},{"k":"p","t":"Commercial banks provide a range of deposit and account services that allow customers to store, manage, and access their money safely. One of the most common products is the current account in the UK, or checking account in the US, which is designed for frequent transactions such as deposits, withdrawals, and payments. These accounts allow customers to access their money easily whenever they need it. A small business, for example, might rely on a current account to receive customer payments and pay suppliers on a daily basis. Banks also offer savings accounts in the UK, or time deposit accounts in the US, which encourage customers to save money while earning interest. These accounts are often less flexible than current accounts because they may limit how often money can be withdrawn. For example, a customer who deposits €10,000 into a savings account with an annual interest rate of 2 percent will earn extra income over time as long as the money remains in the account. In addition, commercial banks may provide an overdraft facility, which allows customers to withdraw more money than they currently have in their account, up to a pre-agreed limit. This can be especially useful for short-term needs, such as when a business must cover payroll expenses during a temporary cash flow shortage.","hu":"A kereskedelmi bankok többféle betéti és számlaszolgáltatást nyújtanak, amelyekkel az ügyfelek biztonságosan tárolhatják, kezelhetik és érhetik el a pénzüket. Az egyik legelterjedtebb termék a brit szóhasználatban current account, az amerikaiban checking account nevű folyószámla, amelyet gyakori tranzakciókra – befizetésre, készpénzfelvételre és fizetésre – terveztek. Ezekről a számlákról az ügyfelek bármikor könnyen hozzáférnek a pénzükhöz. Egy kisvállalkozás például folyószámlán fogadhatja a vevői befizetéseket, és onnan fizetheti naponta a beszállítóit. A bankok takarékszámlát is kínálnak (a briteknél savings account, az amerikaiaknál time deposit account), amely megtakarításra ösztönöz, miközben kamatot fizet. Ezek a számlák gyakran kevésbé rugalmasak a folyószámlánál, mert korlátozhatják, milyen gyakran lehet pénzt kivenni. Ha például egy ügyfél 10 000 eurót helyez el évi 2%-os kamatozású takarékszámlán, idővel többletjövedelmet szerez, amíg a pénz a számlán marad. Emellett a kereskedelmi bankok folyószámlahitel-keretet is adhatnak, amely lehetővé teszi, hogy az ügyfél egy előre megállapodott keretig többet vegyen ki, mint amennyi a számláján van. Ez különösen hasznos lehet rövid távú szükség esetén, például amikor egy cégnek egy átmeneti likviditáshiány idején is ki kell fizetnie a béreket."},{"k":"c","t":"Current account (UK) / checking account (US): designed for frequent transactions. Savings account (UK) / time deposit account (US): designed for saving while earning interest. Overdraft facility: allows customers to withdraw more than their current balance up to an agreed limit.","hu":"Folyószámla (UK: current account / US: checking account): gyakori tranzakciókra. Takarékszámla (UK: savings account / US: time deposit account): megtakarításra és kamatszerzésre. Folyószámlahitel-keret: egy megállapodott keretig többet lehet felvenni, mint amennyi az egyenleg.","lab":"KEY TERMS"},{"k":"h","t":"2.2.1.2 Commercial banks: credit and lending services","hu":"2.2.1.2 Kereskedelmi bankok: hitelezési szolgáltatások"},{"k":"p","t":"Another important function of commercial banks is providing credit and lending services to both individuals and businesses. Banks offer personal loans, which can be used to finance expenses such as education, medical bills, home improvements, or holidays. For example, a bank might approve a loan of €5,000 at a fixed interest rate to help a customer pay for their wedding. Another major type of lending is the mortgage, which is a long-term loan used to purchase property. The property itself serves as collateral, meaning that the bank may take ownership of it if the borrower fails to repay the loan. Mortgages are typically repaid in monthly instalments over many years. For example, a family might take out a 25-year mortgage to buy their first home. Another common form of borrowing is hire purchase, which allows customers to buy expensive goods, such as cars or household appliances, by paying an initial deposit and then repaying the remaining balance in monthly instalments. A customer who buys a car and pays for it over three years is using hire purchase. Commercial banks also provide business loans, which help companies expand their operations, purchase new equipment, or cover day-to-day expenses. For instance, a start-up might borrow money to buy machinery that increases its production capacity. In addition, banks issue credit cards, which allow customers to borrow money up to a pre-approved limit and repay it at a later date. A customer, for example, might use a credit card to book a flight and then repay the balance the following month.","hu":"A kereskedelmi bankok másik fontos funkciója a hitelezési szolgáltatások nyújtása magánszemélyeknek és cégeknek egyaránt. A bankok személyi kölcsönt kínálnak, amelyből olyan kiadásokat lehet finanszírozni, mint a tanulás, az orvosi számlák, a lakásfelújítás vagy a nyaralás. Egy bank például fix kamatú, 5000 eurós kölcsönt hagyhat jóvá, hogy az ügyfél ki tudja fizetni az esküvőjét. A hitelezés másik nagy típusa a jelzáloghitel, vagyis az ingatlanvásárlásra felvett hosszú lejáratú kölcsön. Maga az ingatlan szolgál fedezetként, vagyis a bank a tulajdonába veheti, ha a hitelfelvevő nem törleszt. A jelzáloghiteleket jellemzően sok éven át, havi részletekben fizetik vissza. Egy család például 25 éves jelzáloghitelt vehet fel az első otthona megvásárlásához. Egy másik gyakori hitelforma a részletvétel, amellyel az ügyfelek drága javakat – például autót vagy háztartási gépet – vásárolhatnak úgy, hogy előleget fizetnek, a fennmaradó összeget pedig havi részletekben törlesztik. Aki autót vesz, és három év alatt fizeti ki, az részletvételt használ. A kereskedelmi bankok vállalati hitelt is nyújtanak, amely segít a cégeknek bővíteni a működésüket, új eszközöket vásárolni vagy fedezni a napi kiadásokat. Egy startup például kölcsönt vehet fel, hogy gépeket vegyen, és növelje a termelési kapacitását. Emellett a bankok hitelkártyát is kibocsátanak, amellyel az ügyfelek egy előre jóváhagyott keretig kölcsönt vehetnek fel, és később fizethetik vissza. Egy ügyfél például hitelkártyával foglalhat repülőjegyet, és a következő hónapban egyenlítheti ki a tartozást."},{"k":"c","t":"Mortgage: a long-term loan used to purchase property; the property serves as collateral. Hire purchase: an initial deposit followed by instalments for expensive goods. Credit card: lets customers borrow up to a pre-approved limit and repay later.","hu":"Jelzáloghitel: ingatlanvásárlásra felvett hosszú lejáratú kölcsön; az ingatlan a fedezet. Részletvétel: előleg, majd részletfizetés drága javakra. Hitelkártya: egy előre jóváhagyott keretig lehet kölcsönt felvenni, és később visszafizetni.","lab":"KEY TERMS"},{"k":"h","t":"2.2.1.3 Commercial banks: payment services","hu":"2.2.1.3 Kereskedelmi bankok: fizetési szolgáltatások"},{"k":"p","t":"Commercial banks make everyday financial transactions simple through a variety of payment services. They issue debit cards, which are directly linked to a customer's bank account. In contrast to a credit card, when a debit card is used, money is withdrawn immediately from the available balance. A shopper paying for groceries with a debit card, for example, is spending money t hat already belongs to them. Banks also provide standing orders, which are instructions to transfer a fixed amount of money automatically from one account to another at regular intervals. A tenant, for instance, might use a standing order to ensure that rent is paid automatically every month. Another important service is money transfers, which allow customers to send money electronically within the same bank or to other banks, both domestically and internationally. This ensures that payments can be made quickly and securely. For example, a parent might transfer tuition fees directly to t heir child's university account. Commercial banks also operate cash dispensers, more commonly known as ATMs (Automated Teller Machines), which give customers convenient access to their money at any time. ATMs allow users to withdraw cash, check account balances, and often deposit money without visiting a bank branch. A traveller, for example, can withdraw cash while abroad using their bank card.","hu":"A kereskedelmi bankok többféle fizetési szolgáltatással egyszerűsítik a mindennapi pénzügyi tranzakciókat. Bankkártyát (debit card) bocsátanak ki, amely közvetlenül az ügyfél bankszámlájához kapcsolódik. A hitelkártyával ellentétben a bankkártya használatakor a pénz azonnal lelevonódik a rendelkezésre álló egyenlegből. Aki például bankkártyával fizeti ki az élelmiszert, a saját, már meglévő pénzét költi. A bankok állandó átutalási megbízást is biztosítanak: ez olyan utasítás, amely alapján rendszeres időközönként automatikusan átutalnak egy fix összeget az egyik számláról a másikra. Egy bérlő például állandó megbízással gondoskodhat arról, hogy a lakbér minden hónapban automatikusan átutalódjon. Egy másik fontos szolgáltatás a pénzátutalás, amellyel az ügyfelek elektronikusan küldhetnek pénzt ugyanazon a bankon belül vagy más bankokhoz, belföldön és külföldre egyaránt. Ez biztosítja a gyors és biztonságos fizetést. Egy szülő például közvetlenül a gyermeke egyetemi számlájára utalhatja a tandíjat. A kereskedelmi bankok készpénzkiadó automatákat is üzemeltetnek, amelyeket közismertebben ATM-nek (bankautomatának) hívunk, és amelyek bármikor kényelmes hozzáférést adnak a pénzhez. Az ATM-eknél készpénzt lehet felvenni, egyenleget lekérdezni, és gyakran pénzt befizetni is, bankfiók felkeresése nélkül. Egy utazó például külföldön is felvehet készpénzt a bankkártyájával."},{"k":"c","t":"Debit card: money is withdrawn immediately from the customer's available account balance. Credit card: the customer borrows money up to a pre-approved limit and repays it later.","hu":"Bankkártya: a pénz azonnal lelevonódik az ügyfél rendelkezésre álló egyenlegéből. Hitelkártya: az ügyfél egy előre jóváhagyott keretig kölcsönt vesz fel, és később fizeti vissza.","lab":"KEY DISTINCTION"},{"k":"h","t":"2.2.1.4 Commercial banks: foreign exchange services","hu":"2.2.1.4 Kereskedelmi bankok: valutaváltási szolgáltatások"},{"k":"p","t":"Commercial banks also handle foreign currency exchange, which is essential for international travel and global business. They allow customers to exchange one currency for another, making it possible to pay for goods and services abroad or conduct business with foreign partners. For example, a traveller from Europe might exchange euros for US dollars before flying to New York. Businesses that import or export goods also rely on foreign currency exchange when making international payments.","hu":"A kereskedelmi bankok valutaváltást is végeznek, ami elengedhetetlen a nemzetközi utazáshoz és a globális üzlethez. Lehetővé teszik, hogy az ügyfelek az egyik valutát a másikra váltsák, így külföldön is tudnak fizetni árukért és szolgáltatásokért, vagy külföldi partnerekkel üzletelni. Egy európai utazó például euróját dollárra válthatja, mielőtt New Yorkba repül. Az árut importáló vagy exportáló cégek szintén valutaváltásra támaszkodnak a nemzetközi fizetéseknél."},{"k":"h","t":"2.2.1.5 Commercial banks: investment and wealth management services","hu":"2.2.1.5 Kereskedelmi bankok: befektetési és vagyonkezelési szolgáltatások"},{"k":"p","t":"In addition to their everyday banking activities, commercial banks offer investment and wealth management services that help customers grow their savings over the long term. They trade in securities and sell government bonds, providing customers with a relatively safe way to invest their money while earning regular returns. Banks also manage mutual funds, which pool money from many investors and use it to purchase a diversified portfolio of shares, bonds, or other securities. This allows customers to benefit from professional investment management while reducing risk through diversification. For example, an investor interested in sustainability might choose a mutual fund that focuses on renewable energy companies. Another important service is the management of pension funds. Banks invest contributions made by employees and employers so that retirement savings can grow over time through investments in shares, bonds, and other financial assets. A bank, for instance, may administer a pension plan for the employees of a large company, ensuring that their savings continue to increase until retirement.","hu":"A mindennapi banki tevékenységük mellett a kereskedelmi bankok befektetési és vagyonkezelési szolgáltatásokat is kínálnak, amelyekkel az ügyfelek hosszú távon gyarapíthatják a megtakarításaikat. Értékpapírokkal kereskednek és államkötvényt árulnak, viszonylag biztonságos befektetési lehetőséget adva rendszeres hozammal. A bankok befektetési alapokat is kezelnek, amelyek sok befektető pénzét gyűjtik össze, és abból szórt részvény-, kötvény- vagy egyéb értékpapír-portfóliót vásárolnak. Így az ügyfelek profi befektetéskezelést kapnak, miközben a szórás csökkenti a kockázatot. Egy fenntarthatóság iránt érdeklődő befektető például olyan alapot választhat, amely megújulóenergia-cégekre összpontosít. Egy másik fontos szolgáltatás a nyugdíjalapok kezelése. A bankok befektetik a munkavállalók és a munkáltatók befizetéseit, hogy a nyugdíjcélú megtakarítás idővel gyarapodjon részvényekben, kötvényekben és más pénzügyi eszközökben. Egy bank például egy nagyvállalat dolgozóinak nyugdíjprogramját kezelheti, gondoskodva arról, hogy a megtakarításuk a nyugdíjig növekedjen."},{"k":"h","t":"2.2.1.6 Commercial banks: remote banking services","hu":"2.2.1.6 Kereskedelmi bankok: távoli banki szolgáltatások"},{"k":"p","t":"Finally, commercial banks have embraced technology by offering remote electronic banking services, making banking more accessible and convenient. Through internet banking, customers can manage their accounts online, transfer funds, pay bills, and monitor transactions without visiting a branch. For example, someone might pay their utility bill using their bank's website or mobile app. Banks also provide telebanking, which allows customers to access banking services over the telephone. A customer may call the bank to check loan options, inquire about account details, or receive assistance without meeting a bank employee in person. Together, these digital services enable customers to manage their finances quickly and conveniently from almost anywhere.","hu":"Végül a kereskedelmi bankok a technológiát is magukévá tették: távoli elektronikus banki szolgáltatásokat kínálnak, elérhetőbbé és kényelmesebbé téve a bankolást. Az internetbankon keresztül az ügyfelek online kezelhetik a számláikat, utalhatnak, számlát fizethetnek és követhetik a tranzakcióikat anélkül, hogy fiókba mennének. Valaki például a bank weboldalán vagy mobilalkalmazásában fizetheti ki a rezsiszámláját. A bankok telefonos bankolást is biztosítanak, amellyel telefonon érhetők el a banki szolgáltatások. Az ügyfél felhívhatja a bankot, hogy hitellehetőségekről érdeklődjön, számlaadatokat kérdezzen, vagy segítséget kapjon anélkül, hogy személyesen találkozna banki munkatárssal. Ezek a digitális szolgáltatások együtt lehetővé teszik, hogy az ügyfelek gyorsan és kényelmesen, szinte bárhonnan intézzék a pénzügyeiket."},{"k":"c","t":"Internet banking allows customers to manage accounts, transfer funds, pay bills, and monitor transactions online. Telebanking provides banking services over the telephone.","hu":"Az internetbankon az ügyfelek online kezelhetik a számláikat, utalhatnak, számlát fizethetnek és követhetik a tranzakcióikat. A telefonos bankolás telefonon keresztül biztosít banki szolgáltatásokat.","lab":"AT A GLANCE"},{"k":"h","t":"2.2.2 Investment banks in the USA","hu":"2.2.2 Befektetési bankok az Egyesült Államokban"},{"k":"p","t":"Investment banks in the United States perform a wide range of specialized functions that go beyond the services offered by commercial banks. Their role is particularly important in corporate finance and capital markets, where they help companies, governments, and investors manage complex financial activities. One of their most significant functions is capital raising. Investment banks assist businesses and governments in securing funds through the issuance of securities, such as stocks and bonds. This may involve organizing an initial public offering (IPO), which is when a private company becomes publicly listed and sells its shares to investors for the first time. For example, Goldman Sachs acted as the underwriter for Facebook's IPO in 2012, helping the company raise billions of dollars to fund its expansion. Investment banks also facilitate the issuance of corporate or government bonds, allowing organizations to access long-term financing. Another major area of activity is mergers and acquisitions (M&A). Investment banks provide expert advice when two companies combine or when one company buys another. They assist with valuations, negotiations, and structuring the deal. For instance, Disney's high-profile acquisition of 21st Century Fox was supported by the expertise of investment banks, which guided the process to completion. Investment banks are also heavily involved in trading and market-making. They buy and sell securities on behalf of their clients and, in many cases, for their own accounts. By acting as market makers, they ensure that securities can be bought and sold easily, maintaining liquidity in financial markets. A well-known example is Morgan Stanley, which facilitates large-scale trades of equities and derivatives for institutional investors. In addition, investment banks provide advisory services to their clients. This can include guidance on financial strategies, restructuring debt, optimizing capital structures, or evaluating investment opportunities. For example, during the bankruptcy restructuring of General Motors, Bank of America provided critical advisory services to help the company navigate its financial difficulties. Another key function is asset management. Many investment banks manage investments for institutional clients, pension funds, and wealthy individuals. By doing so, they help allocate capital efficiently and provide long-term financial growth opportunities. For instance, an investment bank may be entrusted with managing the pension fund of a large corporation or the portfolio of a government institution. Some investment banks also engage in proprietary trading, meaning they use their own funds to trade financial instruments such as stocks, bonds, and currencies in order to generate profits. While this activity can be highly lucrative, it also carries significant risks. Finally, investment banks are often connected with hedge funds and private equity services. They may manage their own funds or collaborate with specialized firms to pursue high-risk, high-return investments. These activities allow clients to access advanced investment opportunities and benefit from the expertise and global networks of the banks.","hu":"Az Egyesült Államokban a befektetési bankok sokféle speciális feladatot látnak el, amelyek túlmutatnak a kereskedelmi bankok szolgáltatásain. Szerepük különösen fontos a vállalati pénzügyekben és a tőkepiacokon, ahol cégeknek, kormányoknak és befektetőknek segítenek összetett pénzügyi műveletek kezelésében. Az egyik legjelentősebb feladatuk a tőkebevonás. A befektetési bankok segítenek a vállalkozásoknak és a kormányoknak értékpapír-kibocsátással – részvényekkel és kötvényekkel – forrást szerezni. Ez járhat tőzsdei bevezetés (IPO) megszervezésével, vagyis amikor egy magántulajdonú cég nyilvánossá válik, és először ad el részvényt a befektetőknek. A Goldman Sachs például a Facebook 2012-es tőzsdei bevezetésének jegyzési garantálója volt, és több milliárd dollár bevonásában segítette a cég terjeszkedését. A befektetési bankok vállalati vagy állampapírok kibocsátását is lebonyolítják, hosszú távú finanszírozáshoz juttatva a szervezeteket. Egy másik nagy terület a fúziók és felvásárlások (M&A). A befektetési bankok szakértői tanácsot adnak, amikor két cég egyesül, vagy az egyik megvásárolja a másikat. Segítenek az értékelésben, a tárgyalásban és az ügylet felépítésében. A Disney nagy port kavart 21st Century Fox-felvásárlását például befektetési bankok szakértelme támogatta végig. A befektetési bankok erősen jelen vannak a kereskedésben és az árjegyzésben is. Ügyfeleik megbízásából – és sok esetben saját számlára – vesznek és adnak el értékpapírokat. Árjegyzőként biztosítják, hogy az értékpapírokat könnyen lehessen adni-venni, fenntartva a pénzpiacok likviditását. Jól ismert példa a Morgan Stanley, amely nagy volumenű részvény- és derivatívaügyleteket bonyolít intézményi befektetőknek. Emellett a befektetési bankok tanácsadási szolgáltatást is nyújtanak ügyfeleiknek. Ez lehet pénzügyi stratégia, adósságátütemezés, tőkeszerkezet-optimalizálás vagy befektetési lehetőségek értékelése. A General Motors csődvédelmi átszervezése során például a Bank of America kulcsfontosságú tanácsadást nyújtott a cég pénzügyi nehézségeinek kezeléséhez. Egy további kulcsfunkció a vagyonkezelés. Sok befektetési bank intézményi ügyfelek, nyugdíjalapok és tehetős magánszemélyek befektetéseit kezeli. Ezzel segítik a tőke hatékony elosztását, és hosszú távú gyarapodási lehetőséget kínálnak. Egy befektetési bankot például megbízhatnak egy nagyvállalat nyugdíjalapjának vagy egy állami intézmény portfóliójának kezelésével. Egyes befektetési bankok sajátszámlás kereskedést is folytatnak, vagyis saját pénzükből kereskednek pénzügyi eszközökkel – részvénnyel, kötvénnyel, devizával – nyereségszerzés céljából. Ez a tevékenység nagyon jövedelmező lehet, de komoly kockázattal is jár. Végül a befektetési bankokat gyakran kötik fedezeti alapokhoz és magántőke-szolgáltatásokhoz. Kezelhetnek saját alapokat, vagy együttműködhetnek szakosodott cégekkel magas kockázatú, magas hozamú befektetésekben. Ezek a tevékenységek fejlett befektetési lehetőségekhez juttatják az ügyfeleket, akik így élvezhetik a bankok szakértelmét és globális kapcsolatrendszerét."},{"k":"c","t":"Investment-bank activities include capital raising, IPOs and bond issues, mergers and acquisitions, trading and market-making, advisory services, asset management, proprietary trading, and links with hedge funds and private equity.","hu":"A befektetési bankok tevékenységei közé tartozik a tőkebevonás, a tőzsdei bevezetés és a kötvénykibocsátás, a fúziók és felvásárlások, a kereskedés és árjegyzés, a tanácsadás, a vagyonkezelés, a sajátszámlás kereskedés, valamint a fedezeti alapokhoz és a magántőkéhez fűződő kapcsolatok.","lab":"AT A GLANCE"},{"k":"h","t":"2.2.3 Merchant banks in the UK","hu":"2.2.3 Kereskedelmi bankházak (merchant bankok) az Egyesült Királyságban"},{"k":"p","t":"In the United Kingdom, merchant banks perform functions that closely resemble those of investment banks in the United States. They specialize in corporate finance, offering services such as raising capital, managing mergers and acquisitions, and providing advisory support for complex financial transactions. Like their American counterparts, merchant banks play a central role in connecting businesses with the capital markets and guiding them through financial restructuring, international trade, and large-scale investments.","hu":"Az Egyesült Királyságban a merchant bankok az amerikai befektetési bankokéhoz nagyon hasonló feladatokat látnak el. Vállalati pénzügyekre szakosodnak: tőkebevonást, fúziók és felvásárlások lebonyolítását, valamint összetett pénzügyi ügyletekhez kapcsolódó tanácsadást kínálnak. Amerikai megfelelőikhez hasonlóan központi szerepet játszanak abban, hogy összekössék a cégeket a tőkepiacokkal, és végigvezessék őket a pénzügyi átszervezésen, a nemzetközi kereskedelmen és a nagy beruházásokon."},{"k":"h","t":"2.3 Non-bank financial intermediaries","hu":"2.3 Nem banki pénzügyi közvetítők"},{"k":"p","t":"In addition to central and commercial banks, there are several non-bank financial intermediaries that play a vital role in the financial system. These institutions do not operate as traditional banks, yet they provide important financial services and help channel funds between savers and borrowers. One example is building societies, which are best known for providing mortgage loans. Traditionally, they offered higher interest rates on deposits than banks, but over time their rates have become more closely aligned with those of commercial banks. Today, many building societies also of fer interest- bearing current accounts, similar to checking accounts in the United States. Credit unions operate differently, as they are cooperatives owned by their members. They provide many of the same services as banks, such as accepting deposits, issuing cheque books, and making loans, but membership is required to access these services. Often, credit unions also sell products like life insurance. Since they are owned and run for the benefit of their members, only members can borrow from them, and membership is usually limited to people who share a common bond, such as working for the same employer or living in the same community. Insurance companies are another key group of intermediaries. They take on financial risks in exchange for premiums paid by their customers. While their main function is to provide insurance coverage, they also act as investors by loaning out funds or investing in government securities and shares of companies. Pension funds manage the retirement savings of employees, collecting contributions from workers and employers and investing these funds to generate returns. The income from these investments, which often come from bonds and shares, is then used to provide retirement benefits. Pension funds may be ma naged by banks or insurance companies, but some are also self-administered. Finally, unit trusts and mutual funds pool money from many investors to purchase a wide range of financial instruments, such as stocks and bonds. The earnings of investors are based on the interest or dividends collected by the fund. This system allows individuals to benefit from diversified investments and professional fund management without needing to directly buy and manage individual securities themselves.","hu":"A központi és a kereskedelmi bankok mellett több nem banki pénzügyi közvetítő is létfontosságú szerepet játszik a pénzügyi rendszerben. Ezek az intézmények nem hagyományos bankként működnek, mégis fontos pénzügyi szolgáltatásokat nyújtanak, és segítenek a források átterelésében a megtakarítóktól a hitelfelvevőkhöz. Az egyik ilyen a lakás-takarékpénztár (building society), amely leginkább jelzáloghitelezésről ismert. Hagyományosan magasabb betéti kamatot kínáltak, mint a bankok, de idővel a kamataik közelebb kerültek a kereskedelmi bankokéhoz. Ma már sok lakás-takarékpénztár kamatozó folyószámlát is kínál, hasonlóan az amerikai checking accounthoz. A hitelszövetkezetek másként működnek: a tagjaik tulajdonában lévő szövetkezetek. Sok olyan szolgáltatást nyújtanak, mint a bankok – betétet fogadnak, csekkfüzetet adnak, hitelt nyújtanak –, de ezekhez tagság kell. A hitelszövetkezetek gyakran életbiztosítást is értékesítenek. Mivel a tagok tulajdonában vannak, és az ő javukra működnek, csak a tagok vehetnek fel tőlük kölcsönt, a tagság pedig általában olyanokra korlátozódik, akiket közös kötelék fűz össze: például ugyanannál a munkáltatónál dolgoznak, vagy ugyanabban a közösségben élnek. A biztosítótársaságok a közvetítők másik kulcsfontosságú csoportja. Pénzügyi kockázatokat vállalnak át az ügyfeleik által fizetett díjak fejében. Bár fő funkciójuk a biztosítási fedezet nyújtása, befektetőként is működnek: forrásokat hiteleznek ki, vagy állampapírba és vállalati részvénybe fektetnek. A nyugdíjalapok a munkavállalók nyugdíjcélú megtakarításait kezelik: begyűjtik a dolgozói és munkáltatói befizetéseket, és befektetik őket hozam elérése érdekében. Az ebből – jellemzően kötvényekből és részvényekből – származó jövedelmet nyugdíjjuttatásokra fordítják. A nyugdíjalapokat bankok vagy biztosítók is kezelhetik, de vannak önállóan működők is. Végül a befektetési jegyek és a befektetési alapok sok befektető pénzét gyűjtik össze, hogy sokféle pénzügyi eszközt – részvényt, kötvényt – vásároljanak. A befektetők hozama az alap által beszedett kamaton vagy osztalékon alapul. Ez a rendszer lehetővé teszi, hogy az egyének szórt befektetésekből és professzionális alapkezelésből profitáljanak anélkül, hogy maguknak kellene egyedi értékpapírokat venniük és kezelniük."},{"k":"c","t":"Non-bank financial intermediaries include building societies, credit unions, insurance companies, pension funds, unit trusts, and mutual funds.","hu":"A nem banki pénzügyi közvetítők közé tartoznak a lakás-takarékpénztárak, a hitelszövetkezetek, a biztosítótársaságok, a nyugdíjalapok, a befektetési jegyek és a befektetési alapok.","lab":"KEY TERMS"},{"k":"h","t":"The Stock Market","hu":"A tőzsde"},{"k":"h","t":"1. Introduction","hu":"A tőzsde egymással összekapcsolt piacok rendszere, ahol értékpapírokkal – vagyis forgalomképes pénzügyi eszközökkel, például részvényekkel és kötvényekkel – kereskednek. Fő célja, hogy a cégeknek felületet adjon a befektetőktől való tőkebevonásra, miközben a magánszemélyeknek és az intézményeknek lehetőséget ad a befektetésre és a hozamszerzésre. A tőzsde központi szerepet játszik a modern gazdaságban, mert biztosítja a pénzügyi források hatékony elosztását, ami támogatja a cégek növekedését és a gazdasági fejlődést."},{"k":"p","t":"The stock market is a system of interconnected markets where securities, that is, tradable financial instruments such as stocks and bonds are bought and sold. Its main purpose is to provide companies with a platform to raise capital from investors while giving individuals and institutions the chance to invest and earn returns. The stock market plays a central role in a modern economy because it ensures that financial resources are allocated efficiently, which in turn supports business growth and economic development.","hu":"A tőzsde egymással összekapcsolt piacok rendszere, ahol értékpapírokkal – vagyis forgalomképes pénzügyi eszközökkel, például részvényekkel és kötvényekkel – kereskednek. Fő célja, hogy a cégeknek felületet adjon a befektetőktől való tőkebevonásra, miközben a magánszemélyeknek és az intézményeknek lehetőséget ad a befektetésre és a hozamszerzésre. A tőzsde központi szerepet játszik a modern gazdaságban, mert biztosítja a pénzügyi források hatékony elosztását, ami támogatja a cégek növekedését és a gazdasági fejlődést."},{"k":"c","t":"The stock market is a system of interconnected markets where securities such as stocks and bonds are bought and sold. It helps companies raise capital and gives investors opportunities to earn returns.","hu":"A tőzsde egymással összekapcsolt piacok rendszere, ahol értékpapírokkal, például részvényekkel és kötvényekkel kereskednek. Segít a cégeknek tőkét bevonni, a befektetőknek pedig hozamszerzési lehetőséget ad.","lab":"DEFINITION"},{"k":"h","t":"1.1 Stock exchange vs. stock market","hu":"1.1 Értéktőzsde és részvénypiac"},{"k":"p","t":"Although people often use the terms stock exchange and stock market as if they mean the same thing, they are not identical. A stock exchange refers to a specific marketplace where securities are traded under strict regulations. Examples of well-known stock exchanges include the New York Stock Exchange (NYSE), the London Stock Exchange (LSE), and the Budapest Stock Exchange (BSE). These exchanges provide the formal structure needed for secure and transparent trading. The stock market, on the other hand, is a broader concept. It includes all trading of securities, whether that trading happens on stock exchanges or through other platforms such as the over-the-counter (OTC) market. In short, a stock exchange is one part of the larger stock market, while the stock market encompasses all the venues where securities are bought and sold.","hu":"Bár az emberek gyakran úgy használják a „stock exchange” (értéktőzsde) és a „stock market” (részvénypiac) kifejezést, mintha ugyanazt jelentenék, nem azonosak. Az értéktőzsde egy konkrét piactér, ahol szigorú szabályok szerint kereskednek értékpapírokkal. Jól ismert tőzsdék például a New York-i értéktőzsde (NYSE), a londoni tőzsde (LSE) és a Budapesti Értéktőzsde (BÉT). Ezek a tőzsdék adják azt a formális keretet, amely a biztonságos és átlátható kereskedéshez kell. A részvénypiac ezzel szemben tágabb fogalom. Minden értékpapír-kereskedést magában foglal, akár tőzsdén, akár más felületen, például a tőzsdén kívüli (OTC) piacon zajlik. Röviden: az értéktőzsde a nagyobb részvénypiac egy része, míg a részvénypiac minden olyan helyszínt magában foglal, ahol értékpapírt adnak-vesznek."},{"k":"c","t":"Stock exchange: a specific, regulated marketplace where securities are traded. Stock market: the broader system covering all venues where securities are bought and sold, including exchanges and OTC markets.","hu":"Értéktőzsde: konkrét, szabályozott piactér, ahol értékpapírokkal kereskednek. Részvénypiac: a tágabb rendszer, amely minden helyszínt magában foglal – a tőzsdéket és az OTC-piacokat is –, ahol értékpapírt adnak-vesznek.","lab":"KEY DISTINCTION"},{"k":"h","t":"2. Tradable assets","hu":"2. Forgalomképes eszközök"},{"k":"p","t":"The stock market offers investors a variety of financial instruments to trade, each with different purposes and levels of risk. One of the most common instruments is stocks, or shares, representing ownership in a company. Shareholders can earn returns through dividends and benefit from capital appreciation when the stock price rises. Purchasing shares of Tesla, for instance, gives investors both a stake in the company and the opportunity to profit from price fluctuations: buying low and selling high.","hu":"A tőzsde többféle pénzügyi eszközt kínál a befektetőknek, eltérő céllal és kockázati szinttel. Az egyik legelterjedtebb eszköz a részvény, amely tulajdonrészt testesít meg egy vállalatban. A részvényesek osztalékból szerezhetnek hozamot, és árfolyamnyereséget is elérhetnek, ha a részvény ára emelkedik. A Tesla részvényeinek megvásárlása például egyszerre ad tulajdonrészt a cégben és lehetőséget arra, hogy az árfolyammozgásokon nyerjenek: olcsón venni, drágán eladni."},{"k":"c","t":"Stocks / shares represent ownership in a company. Shareholders may earn returns through dividends or capital appreciation.","hu":"A részvény tulajdonrészt testesít meg egy vállalatban. A részvényesek osztalékból vagy árfolyamnyereségből szerezhetnek hozamot.","lab":"KEY TERMS"},{"k":"h","t":"2.1 Bonds","hu":"2.1 Kötvények"},{"k":"p","t":"Bonds are another key instrument, representing debt securities issued by companies or governments to raise capital. Investors who buy bonds are essentially lending money in exchange for regular interest payments and eventual repayment of the principal. A well-known example is U.S. Treasury Bonds, which are particularly popular among investors who prefer lower-risk options. In addition, exchange-traded funds (ETFs) provide a way for investors to purchase a basket of securities that are traded like stocks. These funds often track specific indexes, such as the SPDR S&P 50 0 ETF, which mirrors the performance of the S&P 500 index.","hu":"A kötvények egy másik kulcsfontosságú eszköz: hitelviszonyt megtestesítő értékpapírok, amelyeket cégek vagy kormányok bocsátanak ki tőkebevonás céljából. Aki kötvényt vásárol, lényegében pénzt kölcsönöz rendszeres kamatfizetés és a tőke későbbi visszafizetése fejében. Jól ismert példa az amerikai államkötvény, amely különösen népszerű az alacsonyabb kockázatot kereső befektetők körében. Emellett a tőzsdén kereskedett alapok (ETF-ek) lehetővé teszik, hogy a befektetők egy egész értékpapírkosarat vásároljanak, amellyel úgy kereskednek, mint egy részvénnyel. Ezek az alapok gyakran konkrét indexeket követnek, mint például a SPDR S&P 500 ETF, amely az S&P 500 index teljesítményét tükrözi."},{"k":"c","t":"Bonds are debt securities: investors lend money in exchange for interest payments and repayment of principal. ETFs allow investors to buy a basket of securities that trades like a stock.","hu":"A kötvények hitelviszonyt megtestesítő értékpapírok: a befektetők pénzt kölcsönöznek kamatfizetés és a tőke visszafizetése fejében. Az ETF-ekkel a befektetők olyan értékpapírkosarat vehetnek, amellyel részvényként lehet kereskedni.","lab":"KEY TERMS"},{"k":"h","t":"2.2 Derivatives","hu":"2.2 Származtatott ügyletek"},{"k":"p","t":"Finally, derivatives are financial contracts whose value is tied to an underlying asset, such as a stock, bond, or commodity. They can take forms like options or futures and are often used for speculation or hedging. For example, an option on Apple shares allows an investor to buy or sell the stock at a predetermined price in the future, regardless of the market price at that time.","hu":"Végül a származtatott ügyletek (derivatívák) olyan pénzügyi szerződések, amelyek értéke egy mögöttes eszközhöz – például részvényhez, kötvényhez vagy áruhoz – kötődik. Lehetnek opciók vagy határidős ügyletek, és gyakran használják őket spekulációra vagy fedezésre. Egy Apple-részvényre szóló opció például lehetővé teszi, hogy a befektető a jövőben előre meghatározott áron vegye vagy adja el a részvényt, függetlenül az akkori piaci ártól."},{"k":"c","t":"Derivatives are financial contracts whose value is tied to an underlying asset. Options and futures may be used for speculation or hedging.","hu":"A származtatott ügyletek olyan pénzügyi szerződések, amelyek értéke egy mögöttes eszközhöz kötődik. Az opciókat és a határidős ügyleteket spekulációra vagy fedezésre használhatják.","lab":"DEFINITION"},{"k":"h","t":"3. The over-the-counter (OTC) market","hu":"3. A tőzsdén kívüli (OTC) piac"},{"k":"p","t":"The over-the-counter (OTC) market is a decentralized trading platform where securities are exchanged directly between parties rather than through a formal stock exchange. These transactions are usually facilitated by dealers who operate through electronic networks or phone communication. The OTC market offers certain advantages. It provides access to securities that are not listed on major exchanges, such as stocks of smaller companies or specific types of bonds. It also allows greater flexibility in negotiation and pricing, which can benefit both buyers and sellers. At the same time, the OTC market has notable disadvantages. It is less regulated than formal stock exchanges, which can increase the risk of fraud. In addition, it often suffers from limited liquidity, meaning it may be more difficult for investors to buy or sell securities quickly. A common example of securities traded on the OTC market includes many corporate bonds and penny stocks, which are typically not listed on larger exchanges.","hu":"A tőzsdén kívüli (OTC) piac decentralizált kereskedési felület, ahol az értékpapírokat közvetlenül a felek között cserélik, nem pedig hivatalos tőzsdén keresztül. Ezeket az ügyleteket rendszerint olyan kereskedők bonyolítják, akik elektronikus hálózaton vagy telefonon dolgoznak. Az OTC-piacnak megvannak az előnyei. Hozzáférést ad olyan értékpapírokhoz, amelyeket a nagy tőzsdéken nem jegyeznek, például kisebb cégek részvényeihez vagy bizonyos kötvénytípusokhoz. Nagyobb rugalmasságot is enged a tárgyalásban és az árazásban, ami a vevőknek és az eladóknak egyaránt kedvezhet. Ugyanakkor az OTC-piacnak jelentős hátrányai is vannak. Kevésbé szabályozott, mint a hivatalos tőzsdék, ami növelheti a csalás kockázatát. Emellett gyakran korlátozott a likviditása, vagyis nehezebb lehet gyorsan venni vagy eladni. Az OTC-piacon kereskedett értékpapírok tipikus példái a vállalati kötvények és a fillérrészvények, amelyeket rendszerint nem jegyeznek a nagyobb tőzsdéken."},{"k":"c","t":"The OTC market offers access and pricing flexibility, but it is less regulated than formal exchanges and may have lower liquidity and greater fraud risk.","hu":"Az OTC-piac hozzáférést és rugalmas árazást kínál, de kevésbé szabályozott, mint a hivatalos tőzsdék, és alacsonyabb likviditással, valamint nagyobb csalási kockázattal járhat.","lab":"WATCH OUT"},{"k":"h","t":"4. The functions of the stock market","hu":"4. A tőzsde funkciói"},{"k":"p","t":"The stock market fulfils several important roles in modern economies. One of its key functions is raising capital for companies. When a private company decides to issue shares, it becomes a public company, also called a listed or quoted company. This process, known as an initial public offering (IPO) or flotation, allows businesses to obtain the financial resources necessary for activities such as expansion, research, and development. A well-known example is Facebook's IPO in 2012, which raised 16 billion dollars and provided funding for its growth initiatives. Another crucial function of the stock market is facilitating investment opportunities for individuals and institutions. By purchasing shares, investors are able to share in a company's profits, either through dividends or capital appreciation. For example, shareholders of Tesla have benefitted from the company's rising stock price as electric vehicles have gained popularity. The stock market also provides liquidity, which means that investors can buy and sell securities quickly and efficiently. This makes stocks more attractive compared to assets like real estate, which are generally harder to convert into cash at short notice. Finally, the stock market serves as an indicator of economic health. Its performance is often regarded as a reflection of the broader economy. Rising stock prices are usually associated with economic growth, while falling prices may signal economic difficulties. A widely followed measure is the S&P 500, which investors use to gauge the overall condition of the U.S. economy.","hu":"A tőzsde több fontos szerepet tölt be a modern gazdaságban. Az egyik kulcsfunkciója a tőkebevonás a cégek számára. Amikor egy magántulajdonú cég részvénykibocsátás mellett dönt, nyilvános (tőzsdén jegyzett) társasággá válik. Ez a folyamat, amelyet tőzsdei bevezetésnek (IPO) vagy nyilvános kibocsátásnak hívnak, lehetővé teszi, hogy a cégek forráshoz jussanak olyan célokra, mint a terjeszkedés, a kutatás és a fejlesztés. Jól ismert példa a Facebook 2012-es tőzsdei bevezetése, amely 16 milliárd dollárt hozott, és finanszírozta a növekedési terveket. A tőzsde másik kulcsfunkciója, hogy befektetési lehetőséget teremt magánszemélyeknek és intézményeknek. Részvényvásárlással a befektetők részesedhetnek a cég nyereségéből, akár osztalékon, akár árfolyamnyereségen keresztül. A Tesla részvényesei például jól jártak a cég emelkedő árfolyamával, ahogy az elektromos autók népszerűbbé váltak. A tőzsde likviditást is biztosít, vagyis a befektetők gyorsan és hatékonyan tudnak értékpapírt venni és eladni. Ez vonzóbbá teszi a részvényeket az olyan eszközökhöz képest, mint az ingatlan, amelyet általában nehezebb rövid idő alatt készpénzre váltani. Végül a tőzsde a gazdaság állapotának mutatójaként is szolgál. A teljesítményét gyakran a tágabb gazdaság tükreként tekintik. Az emelkedő árfolyamokat rendszerint gazdasági növekedéssel hozzák összefüggésbe, míg az eső árak gazdasági nehézséget jelezhetnek. Széles körben figyelt mutató az S&P 500, amellyel a befektetők az amerikai gazdaság általános állapotát mérik fel."},{"k":"c","t":"The stock market raises capital, creates investment opportunities, provides liquidity, and can act as an indicator of economic health. An IPO or flotation is the process through which a private company becomes publicly listed and issues shares.","hu":"A tőzsde tőkét von be, befektetési lehetőséget teremt, likviditást biztosít, és a gazdaság állapotának mutatójaként is szolgálhat. Az IPO (tőzsdei bevezetés) az a folyamat, amelynek során egy magántulajdonú cég nyilvánossá válik, és részvényt bocsát ki.","lab":"AT A GLANCE"},{"k":"h","t":"5. Equity financing vs. debt financing","hu":"5. Tőkefinanszírozás és hitelfinanszírozás"},{"k":"p","t":"When companies need funds to expand their operations, launch new products, or invest in large-scale projects, they usually turn to two main options: equity financing or debt financing. Both methods provide access to capital, but they differ in how they affect ownership, control, financial risk, and long- term strategy. Understanding the distinction between the two is essential, because the choice can have lasting consequences for a company's financial health and its relationship with investors.","hu":"Amikor a cégeknek forrásra van szükségük a működés bővítéséhez, új termékek bevezetéséhez vagy nagy projektekbe való beruházáshoz, rendszerint két fő lehetőséghez fordulnak: a tőkefinanszírozáshoz (részvénykibocsátáshoz) vagy a hitelfinanszírozáshoz. Mindkettő forrást biztosít, de eltérően hat a tulajdonlásra, az irányításra, a pénzügyi kockázatra és a hosszú távú stratégiára. A kettő közötti különbség megértése alapvető, mert a választásnak tartós következményei lehetnek a cég pénzügyi helyzetére és a befektetőkkel való kapcsolatára."},{"k":"c","t":"Equity financing raises capital by selling ownership shares. Debt financing raises capital by borrowing money that must be repaid.","hu":"A tőkefinanszírozás tulajdonrész (részvény) eladásával von be tőkét. A hitelfinanszírozás kölcsönnel, amelyet vissza kell fizetni.","lab":"KEY DISTINCTION"},{"k":"h","t":"5.1 Equity financing","hu":"5.1 Tőkefinanszírozás"},{"k":"p","t":"Equity financing means raising money by selling shares of the company to investors. When individuals or institutions buy these shares, they become part-owners of the company and are known as shareholders. With ownership comes a share in the company's profits, often paid th rough dividends, and the possibility of benefiting from capital gains if the value of the shares increases over time. The main advantage of equity financing is that the company does not take on debt and therefore does not face the obligation to make regular interest payments. This makes equity financing attractive for companies with uncertain or unpredictable cash f
