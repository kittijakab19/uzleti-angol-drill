<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<style>html{color-scheme:light dark}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Üzleti angol drill</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F5F9; --surface-3:#ECEEF5;
  --ink:#141A22; --ink-2:#4A5462; --ink-3:#858D9A;
  --line:#E6E8EF; --line-2:#D3D7E0;
  --accent:#2B46C8; --accent-soft:#E7EAFA; --accent-ink:#1E349B; --on-accent:#FFFFFF;
  --ok:#0F7A4C; --ok-soft:#E2F2E9;
  --bad:#BE3A2B; --bad-soft:#FAE8E5;
  --t1:#B0713A; --t2:#2E6E8E; --t3:#6A57A6; --t4:#A34A5E; --t5:#2A7D8C;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --ui:"Karla","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  --shadow:0 1px 2px rgba(20,26,34,.05), 0 10px 28px -20px rgba(20,26,34,.4);
  --shadow-sm:0 1px 2px rgba(20,26,34,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1319; --surface:#171C24; --surface-2:#1C222B; --surface-3:#232A35;
    --ink:#E9EAED; --ink-2:#AEB6C2; --ink-3:#7E8794;
    --line:#262D38; --line-2:#3A424F;
    --accent:#8DA2FF; --accent-soft:#232B45; --accent-ink:#B9C6FF; --on-accent:#0E1220;
    --ok:#5BC08C; --ok-soft:#182A22;
    --bad:#EF8272; --bad-soft:#2C1C1A;
    --t1:#D79A5F; --t2:#6BA8C6; --t3:#A08FDC; --t4:#D98195; --t5:#63B4C2;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1319; --surface:#171C24; --surface-2:#1C222B; --surface-3:#232A35;
  --ink:#E9EAED; --ink-2:#AEB6C2; --ink-3:#7E8794;
  --line:#262D38; --line-2:#3A424F;
  --accent:#8DA2FF; --accent-soft:#232B45; --accent-ink:#B9C6FF; --on-accent:#0E1220;
  --ok:#5BC08C; --ok-soft:#182A22;
  --bad:#EF8272; --bad-soft:#2C1C1A;
  --t1:#D79A5F; --t2:#6BA8C6; --t3:#A08FDC; --t4:#D98195; --t5:#63B4C2;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topband{position:fixed;inset:0 0 auto 0;height:3px;z-index:60;
  background:linear-gradient(90deg,var(--t1),var(--t2) 27%,var(--t3) 50%,var(--t4) 73%,var(--t5))}
.wrap{max-width:none;margin:0;padding:24px 26px 72px;display:grid;grid-template-columns:266px minmax(0,1fr);gap:28px;align-items:start}
@media (min-width:1600px){.wrap{grid-template-columns:300px minmax(0,1fr);gap:36px;padding:26px 36px 72px}}
@media (max-width:900px){
  .wrap{display:flex;flex-direction:column;gap:16px;padding:16px 14px 48px}
  .brand{order:1} .nav{order:2} main{order:3} #topicsPanel{order:4} #setup{order:5}
}

/* ---------- rail ---------- */
.rail{position:sticky;top:22px;display:flex;flex-direction:column;gap:20px}
@media (max-width:900px){.rail{position:static;display:contents}}
.brand{display:grid;grid-template-columns:auto 1fr;gap:0 11px;align-items:center}
.brand .mark{grid-row:span 2;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:19px;color:var(--on-accent);background:var(--accent);
  box-shadow:0 4px 12px -6px var(--accent)}
.brand h1{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.015em;line-height:1.15}
.brand p{margin:6px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);line-height:1.5}
.nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){.nav{flex-direction:row;gap:6px;overflow-x:auto}}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:8px 10px;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.nav button[aria-current="true"] .n{color:var(--accent-ink)}

.panel{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:14px}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;display:block}
.topics{display:flex;flex-direction:column;gap:1px}
.topics label{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.topics label:hover{background:var(--surface)}
.topics input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.topics .dot{width:8px;height:8px;border-radius:50%;flex:none}
.topics .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topics .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface-3)}
.seg button{flex:1;background:none;border:0;padding:6px 4px;font-size:12.5px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.field+.field{margin-top:12px}
.hint{font-size:12px;color:var(--ink-3);margin:7px 0 0}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);padding:9px 15px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);padding:9px 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- quiz ---------- */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.track{flex:1;height:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
.count{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tally{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tally .g{color:var(--ok)} .tally .r{color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--topic,var(--accent));border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px}
.card .meta{margin:-24px -26px 18px;padding:12px 26px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:0 var(--r) 0 0}
@media (max-width:640px){.card .meta{margin:-18px -16px 14px;padding:10px 16px}}
@media (max-width:640px){.card{padding:18px 16px}}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3)}
.tag.topic{color:var(--topic);border-color:color-mix(in srgb,var(--topic) 45%,transparent)}
.tag.kind{background:var(--surface-2)}
.qlead{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.stem{font-family:var(--display);font-size:22px;line-height:1.5;font-weight:400;max-width:70ch}
@media (max-width:640px){.stem{font-size:19px}}
.stem .blank{display:inline-block;min-width:90px;border-bottom:2.5px solid var(--accent);vertical-align:baseline;margin:0 3px}
.stem .fill{font-weight:700;color:var(--ok);border-bottom:2px solid var(--ok)}
.stem .fill.no{color:var(--bad);border-bottom-color:var(--bad)}
.stem .fill.skip{color:var(--accent-ink);border-bottom-color:var(--accent)}
.stem em{font-style:italic;color:var(--ink-2)}

.opts{display:grid;gap:8px;margin-top:22px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:12px 14px;cursor:pointer;font-size:15.5px;line-height:1.35;box-shadow:var(--shadow-sm);transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none;width:15px}
.opt .v{font-family:var(--display);font-weight:600}
.opt.skip{border-color:var(--accent);background:var(--accent-soft)}
.opt.skip .k,.opt.skip .v{color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k,.opt.right .v{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k,.opt.wrong .v{color:var(--bad)}

.answer{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.answer input{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:11px 13px;font-family:var(--display);font-size:17px;font-weight:600}
.answer input::placeholder{font-family:var(--ui);font-weight:400;font-size:15px;color:var(--ink-3)}
.answer input:disabled{opacity:.75}

.ibtn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);border-radius:99px;padding:3px 11px 3px 4px;cursor:pointer}
.ibtn i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px}
.ibtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.ibtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.gapinfo{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:12px}
.hintbox{margin-top:16px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);padding:13px 15px;display:grid;gap:5px}
.hintbox .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.hintbox .hu{font-weight:700;font-size:16.5px;color:var(--accent-ink)}
.hintbox .d{color:var(--ink-2);font-size:14.5px;max-width:68ch}
.entry .hdef{font-size:14.5px;max-width:68ch}
.entry .def{color:var(--ink-3);font-size:13.5px;max-width:68ch}
.vdefhu{font-size:14.5px;max-width:74ch}
.vdef{color:var(--ink-3);font-size:13.5px;max-width:74ch}
.fb{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.verdict.skip{color:var(--accent-ink)}
.verdict .mark{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:currentColor;flex:none}
.verdict .mark span{color:var(--surface);line-height:1}
.entry{display:grid;gap:7px;background:var(--surface-2);border-radius:var(--r);padding:14px 16px}
.entry .hw{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.entry .ipa{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.entry .pos{font-style:italic;color:var(--ink-3);font-size:13px}
.entry .hu{font-size:15.5px;font-weight:700;color:var(--accent-ink)}
.entry .sense{font-size:15px;color:var(--ink);max-width:70ch}
.entry .sense b{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-right:4px}
.entry .line{font-size:14px;color:var(--ink-2);max-width:74ch}
.entry .line .lab{font-family:var(--mono);font-size:11.5px;color:var(--topic);margin-right:5px}
.entry .line.ex{font-family:var(--display);font-style:italic;font-size:14.5px}
.entry .line.ex .lab{font-family:var(--mono);font-style:normal}
.entry .line.ex b{font-style:normal;color:var(--ink)}
.entry .hublock{border-top:1px solid var(--line);padding-top:9px;margin-top:2px;display:grid;gap:4px}
.entry .ex{font-family:var(--display);font-style:italic;color:var(--ink-2);font-size:15px;max-width:68ch}
.entry .ex b{font-style:normal;font-weight:700;color:var(--ink)}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.col{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

/* ---------- results ---------- */
.score{display:flex;align-items:baseline;gap:12px;font-family:var(--display)}
.score .big{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .of{font-size:18px;color:var(--ink-3)}
.misses{display:grid;gap:1px;margin-top:6px}
.miss{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.miss:last-child{border-bottom:0}
.miss b{font-family:var(--display);font-weight:700}
.miss span{color:var(--ink-2);text-align:right}

/* ---------- i-popover ---------- */
.ih{position:relative;display:inline-flex;vertical-align:middle}
.ih>button{width:19px;height:19px;padding:0;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center}
.ih>button:hover{border-color:var(--accent);background:var(--accent-soft)}
.ih .pop{font-style:normal;font-weight:400;color:var(--ink);position:absolute;left:-6px;top:calc(100% + 7px);z-index:30;width:min(360px,78vw);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:none;text-align:left;white-space:normal}
.ih:hover .pop,.ih:focus-within .pop,.ih.open .pop{display:block}
.ih .pop .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.ih .pop .hu{display:block;font-family:var(--ui);font-weight:700;color:var(--accent-ink);font-size:15.5px;line-height:1.35}
.ih .pop .d+.d{margin-top:2px}
.ih .pop .d{display:block;font-family:var(--ui);font-weight:400;color:var(--ink-2);font-size:13.5px;line-height:1.5;margin-top:5px}

/* line-anchored popovers stay inside the card */
.vline,.entry .line{position:relative}
.vline>.ih,.entry .line>.ih{position:static}
.vline>.ih .pop,.entry .line>.ih .pop{left:0;right:auto;top:calc(100% + 6px);width:min(430px,100%)}

/* ---------- vocab ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:10px 13px;font-size:15px}
.vcount{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.list{display:grid;gap:10px}
.vrow{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--topic);border-radius:var(--r);padding:14px 17px;display:grid;gap:6px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,border-color .15s ease}
.vrow:hover{box-shadow:var(--shadow)}
.vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px}
.vhead .hw{font-family:var(--display);font-size:18.5px;font-weight:700;letter-spacing:-.01em}
.vhead .ipa{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.vhead .pos{font-style:italic;font-size:12.5px;color:var(--ink-3)}
.vhead .ih{margin-left:2px}
.vsense{font-size:15px;color:var(--ink);max-width:74ch}
.vsense b{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-right:4px}
.vline{font-size:14px;color:var(--ink-2);max-width:78ch}
.vline .lab{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--topic);margin-right:5px}
.vline.ex{font-family:var(--display);font-style:italic;font-size:14.5px}
.vline.ex .lab{font-family:var(--mono);font-style:normal}
.vline.ex b{font-style:normal;color:var(--ink)}
.vhead .sc{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vhu{font-weight:700;color:var(--accent-ink);font-size:15.5px}
.vex{font-family:var(--display);font-style:italic;color:var(--ink-2);font-size:14.5px;max-width:74ch}
.vex b{font-style:normal;color:var(--ink)}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--ink-3);padding:30px 0;text-align:center;font-size:15px}

/* ---------- notes ---------- */
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ttab{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.ttab i{width:8px;height:8px;border-radius:50%;background:var(--topic);font-style:normal}
.ttab[aria-pressed="true"]{border-color:var(--topic);color:var(--ink);font-weight:700;background:var(--surface-2)}
.toc{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--topic);border-radius:var(--r);padding:14px 17px;margin-bottom:16px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:230px;overflow:auto}
.toc button{background:none;border:0;padding:3px 2px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:13.5px;width:100%}
.toc button:hover{color:var(--accent-ink);text-decoration:underline}
.toc .l2{padding-left:16px;font-size:13px;color:var(--ink-3)}
.toc .l3{padding-left:32px;font-size:12.5px;color:var(--ink-3)}
.notes{display:grid;gap:14px}
.nh{font-family:var(--display);letter-spacing:-.01em;scroll-margin-top:16px;margin-top:10px}
.nh.l1{font-size:24px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--topic)}
.nh.l2{font-size:18.5px;font-weight:600}
.nh.l3{font-size:16px;font-weight:600;color:var(--ink-2)}
.np{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow-sm)}
.np p{margin:0;font-size:15.5px;line-height:1.72;color:var(--ink);max-width:92ch}
.np.call{background:var(--surface-2);border-left:3px solid var(--topic)}
.np .clab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--topic);display:block;margin-bottom:7px}
.nfoot{display:flex;justify-content:flex-end;margin-top:9px}
.nbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;background:none;border:1px solid var(--line-2);color:var(--ink-3);border-radius:99px;padding:3px 11px 3px 4px;cursor:pointer}
.nbtn i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px}
.nbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.nhu{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:12px}
.nhu p{color:var(--ink-2);font-size:15px;line-height:1.7}
.nhu .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}

/* ---------- matching cards ---------- */
.cardsbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.board{display:grid;grid-template-columns:minmax(150px,0.8fr) minmax(0,1.4fr);gap:10px;align-items:start}
@media (max-width:620px){.board{grid-template-columns:1fr}}
.col-cards{display:grid;gap:8px}
.mcard{text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:11px 13px;cursor:pointer;font-size:14.5px;line-height:1.4;color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .12s ease, background .12s ease, transform .12s ease}
.mcard:hover:not(:disabled){transform:translateY(-1px)}
.mcard.term{font-family:var(--display);font-weight:700;font-size:16px}
.mcard:hover:not(:disabled){border-color:var(--accent)}
.mcard.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mcard.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default;opacity:.65}
.mcard.miss{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cardsdone{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}

/* ---------- progress ---------- */
.stats{display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow-sm)}
.tile:nth-child(1){border-top:3px solid var(--t1)} .tile:nth-child(2){border-top:3px solid var(--t2)}
.tile:nth-child(3){border-top:3px solid var(--t5)} .tile:nth-child(4){border-top:3px solid var(--t4)}
.tile .v{font-family:var(--display);font-size:29px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.brows{display:grid;gap:11px}
.brow{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center}
.brow .nm{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
.brow .nm i{width:8px;height:8px;border-radius:50%;background:var(--topic);flex:none}
.brow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .meter{grid-column:1/-1;height:7px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);overflow:hidden}
.brow .meter i{display:block;height:100%;background:var(--topic)}
.brow .pc{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hard{display:flex;flex-wrap:wrap;gap:7px}
.hard button{font-family:var(--display);font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-sm);border-radius:99px;padding:5px 12px;cursor:pointer}
.hard button:hover{border-color:var(--bad);color:var(--bad)}
.hard button i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--bad);margin-left:6px}
h2.sec{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:10px}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);line-height:1.6}

<script src="data.js" charset="utf-8"></script>
<script>
(function(){
"use strict";
var DATA = window.VOCAB, ENTRIES = DATA.entries, TOPICS = DATA.topics;
var HUE = {1:"var(--t1)",2:"var(--t2)",3:"var(--t3)",4:"var(--t4)",5:"var(--t5)"};
var TNAME = {}; TOPICS.forEach(function(t){ TNAME[t.id] = t.hu; });
var LS = "bizeng.v1";

/* ---------- persisted state ---------- */
var store = { stats:{}, settings:{ topics:[1,2,3,4,5], kind:"mix", src:"mix", len:20 } };
try{ var raw = localStorage.getItem(LS); if(raw){ var p = JSON.parse(raw);
  if(p.stats) store.stats = p.stats;
  if(p.settings) for(var k in p.settings) store.settings[k] = p.settings[k];
} }catch(e){}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }

var state = { mode:"quiz", queue:[], i:0, answered:false, correct:0, wrong:[], done:false, onlyHard:false, query:"", sort:"az", hints:0, notesTopic:0, notesAllHu:false, cardMode:"def", cardN:6, board:null, vt:null, vtDir:"hu2en", vtN:20 };

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function baseTerm(e){ return e.ans.length>1 ? e.ans[1] : e.ans[0]; }
function norm(s){
  return String(s).toLowerCase().replace(/[’ʼ]/g,"'")
    .replace(/[^a-z0-9&'\- ]/g," ").replace(/\b(a|an|the)\s+/g," ")
    .replace(/[-\s]+/g," ").trim();
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  var prev=[],cur=[],i,j;
  for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){ cur[0]=i;
    for(j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    prev=cur.slice();
  }
  return prev[b.length];
}
function checkTyped(txt, e){
  var g = norm(txt); if(!g) return "no";
  for(var i=0;i<e.ans.length;i++){ if(norm(e.ans[i])===g) return "yes"; }
  for(var k=0;k<e.ans.length;k++){
    var a = norm(e.ans[k]);
    if(a.length>=6 && lev(a,g)<=1) return "typo";
  }
  return "no";
}
function wordInfo(s){
  var words = String(s).trim().split(/[\s\-]+/).filter(Boolean).length;
  var letters = String(s).replace(/[^A-Za-z]/g, "").length;
  return words + (words > 1 ? " szó" : " szó") + " · " + letters + " betű";
}
function deacc(s){
  return String(s).normalize ? String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "") : String(s);
}
function normHu(s){
  return deacc(String(s).toLowerCase()).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
function huVariants(e){
  var out = [];
  String(e.hu).split(/[,;]/).forEach(function(part){
    part = part.trim(); if(!part) return;
    out.push(part);
    var noPar = part.replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
    if(noPar && noPar !== part) out.push(noPar);
    var m = /\(([^)]+)\)/.exec(part);
    if(m) out.push(m[1].trim());
  });
  return out;
}
function checkTypedHu(txt, e){
  var g = normHu(txt); if(!g) return "no";
  var vs = huVariants(e).map(normHu).filter(Boolean);
  for(var i = 0; i < vs.length; i++){ if(vs[i] === g) return "yes"; }
  for(var k = 0; k < vs.length; k++){ if(vs[k].length >= 6 && lev(vs[k], g) <= 1) return "typo"; }
  return "no";
}
function stat(id){ return store.stats[id] || {ok:0,bad:0}; }
function record(id, good){
  var s = store.stats[id] || {ok:0,bad:0};
  if(good) s.ok++; else s.bad++;
  s.t = Date.now(); store.stats[id] = s; save();
}
function pool(){
  var ts = store.settings.topics;
  var p = ENTRIES.filter(function(e){ return ts.indexOf(e.topic) >= 0; });
  if(state.onlyHard) p = p.filter(function(e){ var s=stat(e.id); return s.bad>0 && s.bad>=s.ok; });
  return p;
}
function hardList(){
  return ENTRIES.filter(function(e){ var s=stat(e.id); return s.bad>0 && s.bad>=s.ok; })
    .sort(function(a,b){ return (stat(b).bad-stat(b).ok)-(stat(a).bad-stat(a).ok); });
}

/* ---------- round building ---------- */
function makeQ(e, all){
  var st = store.settings;
  var src = st.src === "mix" ? (Math.random()<.55 ? "gap" : (Math.random()<.55 ? "def" : "hu")) : st.src;
  var kind = st.kind === "mix" ? (Math.random()<.5 ? "mc" : "open") : st.kind;
  var q = { e:e, src:src, kind:kind };
  if(kind === "mc"){
    var same = all.filter(function(o){ return o.id!==e.id && o.topic===e.topic && o.pos===e.pos && baseTerm(o).toLowerCase()!==baseTerm(e).toLowerCase(); });
    if(same.length < 3) same = all.filter(function(o){ return o.id!==e.id && o.topic===e.topic && baseTerm(o).toLowerCase()!==baseTerm(e).toLowerCase(); });
    if(same.length < 3) same = ENTRIES.filter(function(o){ return o.id!==e.id && baseTerm(o).toLowerCase()!==baseTerm(e).toLowerCase(); });
    var picked = [], used = {};
    var guard = 0;
    while(picked.length < 3 && guard++ < 400){
      var c = pick(same);
      if(!c || used[c.id] || baseTerm(c).toLowerCase()===baseTerm(e).toLowerCase()) continue;
      used[c.id] = 1; picked.push(c);
    }
    q.opts = shuffle(picked.map(function(o){ return {t:baseTerm(o), ok:false}; }).concat([{t:baseTerm(e), ok:true}]));
  }
  return q;
}
function newRound(keep){
  var p = pool();
  if(!p.length){ state.queue = []; state.done = false; state.i = 0; render(); return; }
  var n = store.settings.len === 0 ? p.length : Math.min(store.settings.len, p.length);
  var chosen = shuffle(p.slice()).slice(0, n);
  state.queue = chosen.map(function(e){ return makeQ(e, p); });
  state.i = 0; state.answered = false; state.correct = 0; state.wrong = []; state.done = false; state.hints = 0;
  if(!keep) state.mode = "quiz";
  render();
}

/* ---------- rendering: rail ---------- */
function renderRail(){
  var box = document.getElementById("topics"), st = store.settings, html = "";
  TOPICS.forEach(function(t){
    var n = ENTRIES.filter(function(e){ return e.topic===t.id; }).length;
    html += '<label style="--topic:'+HUE[t.id]+'"><input type="checkbox" data-t="'+t.id+'"'+(st.topics.indexOf(t.id)>=0?" checked":"")+
      '><i class="dot" style="background:'+HUE[t.id]+'"></i><span class="tx" title="'+esc(t.en)+'">'+esc(t.hu)+'</span><span class="n">'+n+'</span></label>';
  });
  box.innerHTML = html;
  box.querySelectorAll("input").forEach(function(inp){
    inp.addEventListener("change", function(){
      var id = +inp.dataset.t, ix = st.topics.indexOf(id);
      if(inp.checked && ix<0) st.topics.push(id);
      if(!inp.checked && ix>=0) st.topics.splice(ix,1);
      if(!st.topics.length){ st.topics.push(id); inp.checked = true; }
      save(); state.board = null; newRound(state.mode!=="quiz");
    });
  });
  [["segKind","kind"],["segSrc","src"],["segLen","len"]].forEach(function(pair){
    var el = document.getElementById(pair[0]);
    el.querySelectorAll("button").forEach(function(b){
      var v = pair[1]==="len" ? +b.dataset.v : b.dataset.v;
      b.setAttribute("aria-pressed", String(st[pair[1]]===v));
      b.onclick = function(){ st[pair[1]] = v; save(); renderRail(); newRound(false); };
    });
  });
  var p = pool().length;
  document.getElementById("poolHint").textContent = state.onlyHard
    ? p + " nehéz szó van a körben."
    : "A kiválasztott témákban " + p + " szó közül válogat.";
  document.getElementById("navq").textContent = state.queue.length ? (Math.min(state.i+1, state.queue.length) + "/" + state.queue.length) : "";
  document.getElementById("navv").textContent = ENTRIES.length;
  document.getElementById("navc").textContent = "";
  document.getElementById("navn").textContent = TOPICS.length + " téma";
  var practiced = Object.keys(store.stats).length;
  document.getElementById("navs").textContent = practiced ? practiced + " szó" : "";
  var navMode = state.mode === "vtest" ? "vocab" : state.mode;
  document.getElementById("nav").querySelectorAll("button").forEach(function(b){
    b.setAttribute("aria-current", String(b.dataset.mode === navMode));
  });
}

/* ---------- rendering: quiz ---------- */
function ih(label, body){
  return '<span class="ih"><button type="button" aria-label="Magyarul">i</button>'+
    '<span class="pop"><span class="k">'+label+'</span>'+body+'</span></span>';
}
function ihPop(e){
  return ih("magyarul", '<span class="hu">'+esc(e.hu)+'</span><span class="d">'+esc(e.hud)+'</span>');
}
function ihCol(e){
  return ih("kollokációk magyarul", e.colhu.map(function(c){ return '<span class="d">• '+esc(c)+'</span>'; }).join(""));
}
function ihEx(e){
  return ih("a mondat magyarul", '<span class="d">'+esc(e.exhu)+'</span>');
}
function entryCard(e){
  var ex = esc(e.gap).replace("____", "<b>"+esc(e.sf)+"</b>");
  return '<div class="entry" style="--topic:'+HUE[e.topic]+'">'+
    '<div><span class="hw">'+esc(e.term)+'</span> <span class="ipa">/'+esc(e.ipa)+'/</span> <span class="pos">'+esc(e.pos)+'</span></div>'+
    '<div class="sense"><b>1.</b>'+esc(e.def)+'</div>'+
    (e.col.length ? '<div class="line"><span class="lab">collocations:</span>'+esc(e.col.join("; "))+' '+ihCol(e)+'</div>' : "")+
    '<div class="line ex"><span class="lab">example:</span>'+ex+' '+ihEx(e)+'</div>'+
    '<div class="hublock"><div class="hu">'+esc(e.hu)+'</div><div class="hdef">'+esc(e.hud)+'</div></div>'+
  '</div>';
}
function stemHTML(q, revealed, typed){
  var e = q.e;
  if(q.src === "gap"){
    var slot;
    if(revealed){
      var cls = revealed === "ok" ? "" : (revealed === "skip" ? " skip" : " no");
      slot = '<span class="fill'+cls+'">'+esc(e.sf)+'</span>';
    } else {
      var w = Math.min(260, Math.max(90, e.sf.length * 10));
      slot = '<span class="blank" style="width:' + w + 'px">&nbsp;</span>';
    }
    return esc(e.gap).replace("____", slot);
  }
  if(q.src === "def") return esc(e.def.charAt(0).toUpperCase()+e.def.slice(1));
  return '<em>Magyarul:</em> ' + esc(e.hu);
}
function hintHTML(q){
  var e = q.e;
  if(q.src === "hu"){
    return '<div class="hintbox"><span class="k">Tipp</span>'+
      '<div class="d"><i>'+esc(e.pos)+'</i> — '+esc(e.def)+'</div>'+
      '<div class="d">Kezdőbetű: <b>'+esc(baseTerm(e).charAt(0).toUpperCase())+'</b> · '+wordInfo(e.sf || baseTerm(e))+'</div></div>';
  }
  return '<div class="hintbox"><span class="k">Tipp — mit jelent magyarul</span>'+
    '<div class="hu">'+esc(e.hu)+'</div>'+
    '<div class="d">'+esc(e.hud)+'</div></div>';
}
function lead(q){
  if(q.src === "gap") return q.kind==="mc" ? "Egészítsd ki a mondatot" : "Írd be a hiányzó szót";
  if(q.src === "def") return "Melyik kifejezés illik a meghatározásra?";
  return "Hogy mondjuk angolul?";
}
function wirePops(){
  var root = document.getElementById("main");
  root.onclick = function(ev){
    var t = ev.target, wrap = null;
    while(t && t !== this){
      if(t.className === "ih"){ wrap = t; break; }
      if(t.tagName === "BUTTON" && t.parentNode && t.parentNode.className === "ih"){ wrap = t.parentNode; break; }
      t = t.parentNode;
    }
    var open = wrap && wrap.classList.contains("open");
    document.querySelectorAll(".ih.open").forEach(function(x){ x.classList.remove("open"); });
    if(wrap && !open) wrap.classList.add("open");
  };
}
function renderQuiz(){
  var main = document.getElementById("main");
  if(!state.queue.length){
    main.innerHTML = '<div class="card" style="--topic:var(--line-2)"><div class="qlead">Üres kör</div>'+
      '<div class="stem">Nincs szó a jelenlegi szűréshez. Válassz több témakört, vagy kapcsold ki a „csak nehéz szavak” gyakorlást.</div>'+
      '<div class="fbrow" style="margin-top:20px"><button class="btn primary" id="resetPool">Összes szó vissza</button></div></div>';
    var rp = document.getElementById("resetPool");
    if(rp) rp.onclick = function(){ state.onlyHard = false; newRound(false); };
    return;
  }
  if(state.done) return renderResult();
  var q = state.queue[state.i], e = q.e;
  var pct = Math.round(state.i / state.queue.length * 100);
  var html = '<div class="bar"><span class="count">'+(state.i+1)+' / '+state.queue.length+'</span>'+
    '<span class="track"><i style="width:'+pct+'%"></i></span>'+
    '<span class="tally"><span class="g">'+state.correct+' ✓</span> &nbsp;<span class="r">'+state.wrong.length+' ✗</span></span></div>';
  html += '<div class="card" style="--topic:'+HUE[e.topic]+'">'+
    '<div class="meta"><span class="tag topic">'+esc(TNAME[e.topic])+'</span>'+
    '<span class="tag kind">'+(q.kind==="mc" ? "feleletválasztós" : "kiegészítős")+'</span>'+
    (state.onlyHard ? '<span class="tag">nehéz szavak</span>' : "")+
    (q.hinted ? '<span class="tag">tipp kérve</span>' : "")+
    '<button class="ibtn" id="hintBtn" aria-expanded="false" title="Mit jelent magyarul?"><i>i</i>magyarul</button></div>'+
    '<div class="qlead">'+lead(q)+'</div>'+
    '<div class="stem" id="stem">'+stemHTML(q, null)+'</div>'+
    (q.src === "gap" ? '<p class="gapinfo">A hiányzó rész: '+wordInfo(q.e.sf)+'</p>' : "")+
    '<div id="hint">'+(q.hinted ? hintHTML(q) : "")+'</div>';
  if(q.kind === "mc"){
    html += '<div class="fbrow" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" id="skipBtn">Ugrás — nem tudom</button></div>';
    html += '<div class="opts" id="opts">';
    q.opts.forEach(function(o,ix){
      html += '<button class="opt" data-ix="'+ix+'"><span class="k">'+"abcd".charAt(ix)+')</span><span class="v">'+esc(o.t)+'</span></button>';
    });
    html += '</div>';
  } else {
    html += '<div class="answer"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+
      (q.src==="hu" ? "az angol kifejezés…" : "a hiányzó szó…")+'"><button class="btn primary" id="checkBtn">Ellenőrzés</button>'+
      '<button class="btn ghost" id="skipBtn">Ugrás — nem tudom</button></div>'+
      '<p class="hint">Az írásjelek és a kis-nagybetű nem számít; egy-két betűs elírást még elfogad.</p>';
  }
  html += '<div id="fb"></div></div>';
  main.innerHTML = html;

  wirePops();
  var hb = document.getElementById("hintBtn"), hbox = document.getElementById("hint");
  if(hb) hb.onclick = function(){
    var open = hbox.innerHTML !== "";
    hbox.innerHTML = open ? "" : hintHTML(q);
    hb.setAttribute("aria-expanded", String(!open));
    if(!open && !q.hinted){ q.hinted = true; state.hints++; }
  };
  if(hb && q.hinted) hb.setAttribute("aria-expanded", "true");
  var sk = document.getElementById("skipBtn");
  if(sk) sk.onclick = skipQ;
  if(q.kind === "mc"){
    document.getElementById("opts").querySelectorAll(".opt").forEach(function(b){
      b.onclick = function(){ answerMC(+b.dataset.ix); };
    });
  } else {
    var inp = document.getElementById("typed");
    document.getElementById("checkBtn").onclick = function(){ answerOpen(); };
    inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); state.answered ? next() : answerOpen(); } });
    inp.focus();
  }
  renderRail();
}
function feedback(verdict, note){
  var q = state.queue[state.i], e = q.e;
  document.getElementById("stem").innerHTML = stemHTML(q, verdict === "no" ? "no" : (verdict === "skip" ? "skip" : "ok"));
  var last = state.i === state.queue.length - 1;
  var head = verdict === "skip"
    ? '<div class="verdict skip"><span class="mark"><span>→</span></span> Kihagyva — a helyes válasz:</div>'
    : (verdict === "no"
      ? '<div class="verdict no"><span class="mark"><span>✕</span></span> Nem talált</div>'
      : '<div class="verdict ok"><span class="mark"><span>✓</span></span> '+(verdict === "typo" ? "Majdnem — apró elírással" : "Helyes")+'</div>');
  document.getElementById("fb").innerHTML = '<div class="fb">'+head+
    (note ? '<div class="def" style="color:var(--ink-2);font-size:14px">'+note+'</div>' : "")+
    entryCard(e)+
    '<div class="fbrow"><button class="btn primary" id="nextBtn">'+(last ? "Eredmény" : "Következő")+'</button>'+
    '<span class="kbd">Enter</span></div></div>';
  document.getElementById("nextBtn").onclick = next;
  document.getElementById("nextBtn").focus();
}
function answerMC(ix){
  if(state.answered) return;
  var q = state.queue[state.i];
  state.answered = true;
  var btns = document.getElementById("opts").querySelectorAll(".opt");
  var good = q.opts[ix].ok;
  btns.forEach(function(b,i){
    b.disabled = true;
    if(q.opts[i].ok) b.classList.add("right");
    else if(i === ix) b.classList.add("wrong");
  });
  finish(good, good ? "ok" : "no", "");
}
function answerOpen(){
  if(state.answered) return;
  var q = state.queue[state.i], inp = document.getElementById("typed");
  var txt = inp.value.trim();
  if(!txt){ inp.focus(); return; }
  var v = checkTyped(txt, q.e);
  state.answered = true; inp.disabled = true;
  document.getElementById("checkBtn").disabled = true;
  var note = v === "typo" ? "A te válaszod: <b>"+esc(txt)+"</b> — helyesen: <b>"+esc(baseTerm(q.e))+"</b>."
    : (v === "no" ? "A te válaszod: <b>"+esc(txt)+"</b>" : "");
  finish(v !== "no", v, note);
}
function skipQ(){
  if(state.answered) return;
  var q = state.queue[state.i];
  state.answered = true;
  if(q.kind === "mc"){
    document.getElementById("opts").querySelectorAll(".opt").forEach(function(b, i){
      b.disabled = true;
      if(q.opts[i].ok) b.classList.add("skip");
    });
  } else {
    var inp = document.getElementById("typed");
    if(inp) inp.disabled = true;
    var cb = document.getElementById("checkBtn");
    if(cb) cb.disabled = true;
  }
  var sk = document.getElementById("skipBtn");
  if(sk) sk.disabled = true;
  finish(false, "skip", "A helyes válasz: <b>"+esc(q.src === "gap" ? q.e.sf : baseTerm(q.e))+"</b>.");
}
function finish(good, verdict, note){
  var q = state.queue[state.i];
  record(q.e.id, good);
  if(good) state.correct++; else state.wrong.push(q.e);
  var tal = document.querySelector(".tally");
  if(tal) tal.innerHTML = '<span class="g">'+state.correct+' ✓</span> &nbsp;<span class="r">'+state.wrong.length+' ✗</span>';
  feedback(verdict, note);
  renderRail();
}
function next(){
  if(state.i >= state.queue.length - 1){ state.done = true; render(); return; }
  state.i++; state.answered = false; render();
}
function renderResult(){
  var total = state.queue.length, pc = Math.round(state.correct/total*100);
  var verdictTxt = pc >= 90 ? "Ez már vizsgaszint." : pc >= 70 ? "Jó irány — a hibás szavakat érdemes átnézni." : "Ismételd át a kiesett szavakat, majd futtasd újra.";
  var html = '<div class="card" style="--topic:var(--accent)">'+
    '<div class="qlead">Kör vége</div>'+
    '<div class="score"><span class="big">'+state.correct+'</span><span class="of">/ '+total+' &nbsp;·&nbsp; '+pc+'%</span></div>'+
    '<p class="hint" style="font-size:14px;margin-top:8px">'+verdictTxt+
    (state.hints ? ' &nbsp;·&nbsp; Tippet '+state.hints+' kérdésnél kértél.' : "")+'</p>';
  if(state.wrong.length){
    html += '<h2 class="sec" style="margin-top:22px">Amik kiestek</h2><div class="misses">';
    state.wrong.forEach(function(e){
      html += '<div class="miss"><b>'+esc(e.term)+'</b><span>'+esc(e.hu)+'</span></div>';
    });
    html += '</div>';
  }
  html += '<div class="fbrow" style="margin-top:22px">'+
    '<button class="btn primary" id="again">Új kör</button>'+
    (state.wrong.length ? '<button class="btn" id="retry">Csak a kiesettekkel</button>' : "")+
    '<button class="btn ghost" id="toVocab">Szókincs megnyitása</button></div></div>';
  document.getElementById("main").innerHTML = html;
  document.getElementById("again").onclick = function(){ newRound(false); };
  var r = document.getElementById("retry");
  if(r) r.onclick = function(){
    var p = pool();
    state.queue = shuffle(state.wrong.slice()).map(function(e){ return makeQ(e, p.length?p:ENTRIES); });
    state.i = 0; state.answered = false; state.correct = 0; state.wrong = []; state.done = false; state.hints = 0; render();
  };
  document.getElementById("toVocab").onclick = function(){ state.mode = "vocab"; render(); };
  renderRail();
}

/* ---------- rendering: vocab ---------- */
function hi(text, q){
  var safe = esc(text);
  if(!q) return safe;
  var rx = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return safe.replace(rx, "<mark>$1</mark>");
}
function renderVocab(){
  var q = state.query.trim(), qn = q.toLowerCase();
  var list = ENTRIES.filter(function(e){ return store.settings.topics.indexOf(e.topic) >= 0; });
  if(qn) list = list.filter(function(e){
    return e.term.toLowerCase().indexOf(qn) >= 0 || e.hu.toLowerCase().indexOf(qn) >= 0 ||
           e.hud.toLowerCase().indexOf(qn) >= 0 ||
           e.def.toLowerCase().indexOf(qn) >= 0 || e.ex.toLowerCase().indexOf(qn) >= 0;
  });
  if(state.sort === "az") list = list.slice().sort(function(a,b){ return a.term.toLowerCase() < b.term.toLowerCase() ? -1 : 1; });
  else if(state.sort === "topic") list = list.slice().sort(function(a,b){ return a.topic - b.topic || (a.term.toLowerCase() < b.term.toLowerCase() ? -1 : 1); });
  else list = list.slice().sort(function(a,b){ return (stat(b).bad - stat(b).ok) - (stat(a).bad - stat(a).ok); });

  var html = '<div class="tools">'+
    '<input class="search" id="q" placeholder="Keresés angolul vagy magyarul…" value="'+esc(q)+'">'+
    '<div class="seg" id="segSort" style="flex:none;width:250px">'+
      '<button data-v="az"'+(state.sort==="az"?' aria-pressed="true"':"")+'>A–Z</button>'+
      '<button data-v="topic"'+(state.sort==="topic"?' aria-pressed="true"':"")+'>Téma</button>'+
      '<button data-v="hard"'+(state.sort==="hard"?' aria-pressed="true"':"")+'>Nehézség</button>'+
    '</div><button class="btn primary" id="startTest">Tesztelés</button>'+
    '<span class="vcount">'+list.length+' szócikk</span></div>';
  if(!list.length) html += '<p class="empty">Nincs találat erre: <b>'+esc(q)+'</b></p>';
  html += '<div class="list">';
  list.forEach(function(e){
    var s = stat(e.id), sc = (s.ok||s.bad) ? (s.ok+" ✓ / "+s.bad+" ✗") : "";
    var ex = esc(e.gap).replace("____", "<b>"+esc(e.sf)+"</b>");
    html += '<article class="vrow" style="--topic:'+HUE[e.topic]+'">'+
      '<div class="vhead"><span class="hw">'+hi(e.term,q)+'</span>'+
      '<span class="ipa">/'+esc(e.ipa)+'/</span><span class="pos">'+esc(e.pos)+'</span>'+
      ihPop(e)+
      (sc ? '<span class="sc">'+sc+'</span>' : "")+'</div>'+
      '<div class="vsense"><b>1.</b>'+hi(e.def,q)+'</div>'+
      (e.col.length ? '<div class="vline"><span class="lab">collocations:</span>'+hi(e.col.join("; "),q)+' '+ihCol(e)+'</div>' : "")+
      '<div class="vline ex"><span class="lab">example:</span>'+ex+' '+ihEx(e)+'</div>'+
    '</article>';
  });
  html += '</div><p class="foot">Forrás: Lecture notes — Topic 1–5 szószedete. A magyar megfelelők fordítások, nem szó szerinti szótári alakok.</p>';
  document.getElementById("main").innerHTML = html;
  var inp = document.getElementById("q");
  inp.addEventListener("input", function(){
    state.query = inp.value;
    var pos = inp.selectionStart;
    renderVocab();
    var n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos);
  });
  document.getElementById("segSort").querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ state.sort = b.dataset.v; renderVocab(); };
  });
  document.getElementById("startTest").onclick = function(){
    state.vtPool = list.slice();
    state.vt = null; state.mode = "vtest"; render();
  };
  wirePops();
  renderRail();
}

/* ---------- rendering: progress ---------- */
function renderStats(){
  var ids = Object.keys(store.stats), ok = 0, bad = 0;
  ids.forEach(function(id){ ok += store.stats[id].ok; bad += store.stats[id].bad; });
  var total = ok + bad, pc = total ? Math.round(ok/total*100) : 0;
  var mastered = ids.filter(function(id){ var s = store.stats[id]; return s.ok >= 2 && s.ok > s.bad; }).length;
  var hard = hardList();
  var html = '<div class="stats">';
  html += '<div class="tiles">'+
    '<div class="tile"><div class="v">'+ids.length+'</div><div class="k">Gyakorolt szó</div></div>'+
    '<div class="tile"><div class="v">'+pc+'%</div><div class="k">Találati arány</div></div>'+
    '<div class="tile"><div class="v">'+mastered+'</div><div class="k">Ül a fejben</div></div>'+
    '<div class="tile"><div class="v">'+hard.length+'</div><div class="k">Még nehéz</div></div>'+
  '</div>';
  html += '<div class="panel"><h2 class="sec">Témakörök szerint</h2><div class="brows">';
  TOPICS.forEach(function(t){
    var es = ENTRIES.filter(function(e){ return e.topic===t.id; });
    var seen = es.filter(function(e){ var s=stat(e.id); return s.ok+s.bad>0; }).length;
    var good = es.filter(function(e){ var s=stat(e.id); return s.ok>=2 && s.ok>s.bad; }).length;
    var w = Math.round(good/es.length*100);
    html += '<div class="brow" style="--topic:'+HUE[t.id]+'">'+
      '<div class="nm"><i></i><span>'+esc(t.hu)+'</span></div>'+
      '<div class="pc">'+w+'%</div>'+
      '<div class="meter"><i style="width:'+w+'%"></i></div>'+
      '<div class="pc" style="grid-column:1/-1;text-align:left;color:var(--ink-3)">'+seen+' / '+es.length+' szó látva</div>'+
    '</div>';
  });
  html += '</div></div>';
  if(hard.length){
    html += '<div class="panel"><h2 class="sec">Ezek csúsznak el</h2><div class="hard">';
    hard.slice(0,40).forEach(function(e){
      html += '<button data-id="'+e.id+'" title="'+esc(e.hu)+'">'+esc(e.term)+'<i>'+stat(e.id).bad+'✗</i></button>';
    });
    html += '</div><div class="fbrow" style="margin-top:16px">'+
      '<button class="btn primary" id="drillHard">Kör csak ezekből</button>'+
      '<button class="btn ghost" id="wipe">Statisztika törlése</button></div></div>';
  } else {
    html += '<div class="panel"><p class="hint" style="font-size:14px;margin:0">Még nincs hibás szavad. Futtass egy kört, és itt gyűlnek majd azok, amik nem ülnek.</p>'+
      (ids.length ? '<div class="fbrow" style="margin-top:14px"><button class="btn ghost" id="wipe">Statisztika törlése</button></div>' : "")+'</div>';
  }
  html += '</div>';
  document.getElementById("main").innerHTML = html;
  var d = document.getElementById("drillHard");
  if(d) d.onclick = function(){ state.onlyHard = true; state.mode = "quiz"; newRound(false); };
  var w = document.getElementById("wipe");
  if(w) w.onclick = function(){ if(confirm("Biztosan törlöd az eddigi eredményeket?")){ store.stats = {}; save(); render(); } };
  document.querySelectorAll(".hard button[data-id]").forEach(function(b){
    b.onclick = function(){
      var e = ENTRIES[+b.dataset.id];
      state.mode = "vocab"; state.query = e.term; render();
    };
  });
  renderRail();
}

/* ---------- rendering: szókincs teszt ---------- */
function vtStart(entries){
  var n = state.vtN === 0 ? entries.length : Math.min(state.vtN, entries.length);
  state.vt = { queue: shuffle(entries.slice()).slice(0, n), i:0, answered:false, correct:0, wrong:[], done:false };
}
function renderVTestSetup(){
  var p = state.vtPool || [];
  var html = '<div class="card" style="--topic:var(--accent)">'+
    '<div class="meta"><span class="tag">szókincs teszt</span>'+
    '<span class="tag kind">'+p.length+' szó a jelenlegi szűrésből</span></div>'+
    '<div class="qlead">Melyik nyelven mutassam a szavakat?</div>'+
    '<div class="stem" style="font-size:19px">Az egyik nyelven megkapod a szót, a másikon neked kell beírnod.</div>'+
    '<div class="field" style="margin-top:20px"><span class="lbl">Irány</span>'+
    '<div class="seg" id="vtDir" style="max-width:520px">'+
      '<button data-v="hu2en"'+(state.vtDir==="hu2en"?' aria-pressed="true"':"")+'>Magyarul mutatom → angolul írom</button>'+
      '<button data-v="en2hu"'+(state.vtDir==="en2hu"?' aria-pressed="true"':"")+'>Angolul mutatom → magyarul írom</button>'+
    '</div></div>'+
    '<div class="field"><span class="lbl">Hány szó</span><div class="seg" id="vtN" style="max-width:320px">'+
      [10,20,40,0].map(function(n){ return '<button data-v="'+n+'"'+(state.vtN===n?' aria-pressed="true"':"")+'>'+(n===0?"mind":n)+'</button>'; }).join("")+
    '</div></div>'+
    '<div class="fbrow" style="margin-top:22px"><button class="btn primary" id="vtGo">Teszt indítása</button>'+
    '<button class="btn ghost" id="vtBack">Vissza a szókincshez</button></div></div>';
  document.getElementById("main").innerHTML = html;
  document.getElementById("vtDir").querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ state.vtDir = b.dataset.v; renderVTestSetup(); };
  });
  document.getElementById("vtN").querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ state.vtN = +b.dataset.v; renderVTestSetup(); };
  });
  document.getElementById("vtGo").onclick = function(){ vtStart(state.vtPool || []); render(); };
  document.getElementById("vtBack").onclick = function(){ state.mode = "vocab"; state.vt = null; render(); };
  renderRail();
}
function renderVTest(){
  if(!state.vtPool || !state.vtPool.length){ state.mode = "vocab"; render(); return; }
  if(!state.vt) return renderVTestSetup();
  var v = state.vt;
  if(v.done) return renderVTestResult();
  var e = v.queue[v.i], hu2en = state.vtDir === "hu2en";
  var pct = Math.round(v.i / v.queue.length * 100);
  var html = '<div class="bar"><span class="count">'+(v.i+1)+' / '+v.queue.length+'</span>'+
    '<span class="track"><i style="width:'+pct+'%"></i></span>'+
    '<span class="tally"><span class="g">'+v.correct+' ✓</span> &nbsp;<span class="r">'+v.wrong.length+' ✗</span></span></div>';
  html += '<div class="card" style="--topic:'+HUE[e.topic]+'">'+
    '<div class="meta"><span class="tag topic">'+esc(TNAME[e.topic])+'</span>'+
    '<span class="tag kind">'+(hu2en ? "magyar → angol" : "angol → magyar")+'</span>'+
    '<button class="ibtn" id="vtHint" aria-expanded="false" title="Tipp"><i>i</i>tipp</button></div>'+
    '<div class="qlead">'+(hu2en ? "Írd be angolul" : "Írd be magyarul")+'</div>'+
    '<div class="stem" id="vtStem">'+(hu2en ? esc(e.hu) : esc(e.term)+' <span class="ipa" style="font-family:var(--mono);font-size:14px;color:var(--ink-3)">/'+esc(e.ipa)+'/</span>')+'</div>'+
    '<p class="gapinfo">'+(hu2en ? ("A keresett kifejezés: " + wordInfo(baseTerm(e))) : "A magyar megfelelőt írd be; több jó válasz is lehet.")+'</p>'+
    '<div id="vtHintBox"></div>'+
    '<div class="answer"><input id="vtIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+
      (hu2en ? "az angol kifejezés…" : "a magyar jelentés…")+'"><button class="btn primary" id="vtCheck">Ellenőrzés</button>'+
      '<button class="btn ghost" id="vtSkip">Ugrás — nem tudom</button></div>'+
    '<p class="hint">Az írásjelek, a kis-nagybetű'+(hu2en ? "" : " és az ékezetek")+' nem számítanak; egy-két betűs elírást még elfogad.</p>'+
    '<div id="vtFb"></div></div>';
  document.getElementById("main").innerHTML = html;
  var inp = document.getElementById("vtIn");
  document.getElementById("vtCheck").onclick = vtAnswer;
  document.getElementById("vtSkip").onclick = vtSkip;
  inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); v.answered ? vtNext() : vtAnswer(); } });
  inp.focus();
  var hb = document.getElementById("vtHint"), hbox = document.getElementById("vtHintBox");
  hb.onclick = function(){
    var open = hbox.innerHTML !== "";
    hbox.innerHTML = open ? "" : '<div class="hintbox"><span class="k">tipp</span>'+
      '<span class="d"><i>'+esc(e.pos)+'</i> — '+esc(e.def)+'</span>'+
      '<span class="d">Kezdőbetű: <b>'+esc((hu2en ? baseTerm(e) : e.hu).charAt(0).toUpperCase())+'</b> · '+wordInfo(hu2en ? baseTerm(e) : e.hu)+'</span></div>';
    hb.setAttribute("aria-expanded", String(!open));
  };
  renderRail();
}
function vtSkip(){ vtAnswer(true); }
function vtAnswer(skipped){
  var v = state.vt; if(v.answered) return;
  var e = v.queue[v.i], hu2en = state.vtDir === "hu2en";
  var inp = document.getElementById("vtIn"), txt = inp.value.trim();
  if(!skipped && !txt){ inp.focus(); return; }
  var res = skipped === true ? "skip" : (hu2en ? checkTyped(txt, e) : checkTypedHu(txt, e));
  v.answered = true; inp.disabled = true;
  document.getElementById("vtCheck").disabled = true;
  document.getElementById("vtSkip").disabled = true;
  var good = res === "yes" || res === "typo";
  record(e.id, good);
  if(good) v.correct++; else v.wrong.push(e);
  var head = res === "skip"
    ? '<div class="verdict skip"><span class="mark"><span>→</span></span> Kihagyva — a helyes válasz:</div>'
    : (!good
      ? '<div class="verdict no"><span class="mark"><span>✕</span></span> Nem talált</div>'
      : '<div class="verdict ok"><span class="mark"><span>✓</span></span> '+(res === "typo" ? "Majdnem — apró elírással" : "Helyes")+'</div>');
  var note = res === "skip"
    ? 'A helyes válasz: <b>'+esc(hu2en ? baseTerm(e) : e.hu)+'</b>.'
    : (good && res === "yes" ? "" :
      'A te válaszod: <b>'+esc(txt)+'</b> — helyesen: <b>'+esc(hu2en ? baseTerm(e) : e.hu)+'</b>.');
  var last = v.i === v.queue.length - 1;
  document.getElementById("vtFb").innerHTML = '<div class="fb">'+head+
    (note ? '<div class="def" style="color:var(--ink-2);font-size:14px">'+note+'</div>' : "")+
    entryCard(e)+
    '<div class="fbrow"><button class="btn primary" id="vtNext">'+(last ? "Eredmény" : "Következő")+'</button>'+
    '<span class="kbd">Enter</span></div></div>';
  var tal2 = document.querySelector(".tally");
  if(tal2) tal2.innerHTML = '<span class="g">'+v.correct+' ✓</span> &nbsp;<span class="r">'+v.wrong.length+' ✗</span>';
  document.getElementById("vtNext").onclick = vtNext;
  document.getElementById("vtNext").focus();
  wirePops();
}
function vtNext(){
  var v = state.vt;
  if(v.i >= v.queue.length - 1){ v.done = true; render(); return; }
  v.i++; v.answered = false; render();
}
function renderVTestResult(){
  var v = state.vt, total = v.queue.length, pc = Math.round(v.correct/total*100);
  var html = '<div class="card" style="--topic:var(--accent)">'+
    '<div class="meta"><span class="tag">szókincs teszt</span>'+
    '<span class="tag kind">'+(state.vtDir === "hu2en" ? "magyar → angol" : "angol → magyar")+'</span></div>'+
    '<div class="qlead">Teszt vége</div>'+
    '<div class="score"><span class="big">'+v.correct+'</span><span class="of">/ '+total+' &nbsp;·&nbsp; '+pc+'%</span></div>';
  if(v.wrong.length){
    html += '<h2 class="sec" style="margin-top:22px">Amik kiestek</h2><div class="misses">';
    v.wrong.forEach(function(e){ html += '<div class="miss"><b>'+esc(e.term)+'</b><span>'+esc(e.hu)+'</span></div>'; });
    html += '</div>';
  }
  html += '<div class="fbrow" style="margin-top:22px">'+
    '<button class="btn primary" id="vtAgain">Új teszt</button>'+
    (v.wrong.length ? '<button class="btn" id="vtRetry">Csak a kiesettekkel</button>' : "")+
    '<button class="btn ghost" id="vtBack2">Vissza a szókincshez</button></div></div>';
  document.getElementById("main").innerHTML = html;
  document.getElementById("vtAgain").onclick = function(){ state.vt = null; render(); };
  var r = document.getElementById("vtRetry");
  if(r) r.onclick = function(){ vtStart(v.wrong.slice()); render(); };
  document.getElementById("vtBack2").onclick = function(){ state.mode = "vocab"; state.vt = null; render(); };
  renderRail();
}

/* ---------- rendering: leírások ---------- */
function headLevel(t){
  var m = /^(\d+(?:\.\d+)*)/.exec(t);
  return m ? Math.min(3, m[1].split(".").length) : 1;
}
function renderNotes(){
  var NOTES = DATA.notes, sel = store.settings.topics.slice().sort();
  if(state.notesTopic && sel.indexOf(state.notesTopic) < 0) state.notesTopic = 0;
  var t = state.notesTopic || sel[0];
  var blocks = NOTES[String(t)] || [];
  var html = '<div class="ttabs">';
  sel.forEach(function(id){
    html += '<button class="ttab" data-t="'+id+'" style="--topic:'+HUE[id]+'"'+(id===t?' aria-pressed="true"':"")+'><i></i>'+esc(TNAME[id])+'</button>';
  });
  html += '</div>';

  var heads = [];
  blocks.forEach(function(b,i){ if(b.k === "h") heads.push({i:i, t:b.t, l:headLevel(b.t)}); });
  html += '<div class="toc" style="--topic:'+HUE[t]+'"><span class="lbl">Tartalom · '+esc(TNAME[t])+'</span><ol>';
  heads.forEach(function(h){
    html += '<li><button class="l'+h.l+'" data-go="nb'+h.i+'">'+esc(h.t)+'</button></li>';
  });
  html += '</ol></div>';

  html += '<div class="fbrow" style="margin-bottom:14px"><button class="btn" id="allHu">'+
    (state.notesAllHu ? "Magyar szöveg elrejtése" : "Mind magyarul")+'</button>'+
    '<span class="hint" style="margin:0">Az <b>i</b> gombbal bekezdésenként is előhívhatod a magyar fordítást.</span></div>';

  html += '<div class="notes" style="--topic:'+HUE[t]+'">';
  blocks.forEach(function(b,i){
    if(b.k === "h"){
      html += '<h2 class="nh l'+headLevel(b.t)+'" id="nb'+i+'">'+esc(b.t)+'</h2>';
      return;
    }
    var isCall = b.k === "c";
    html += '<article class="np'+(isCall?" call":"")+'">'+
      (isCall && b.lab ? '<span class="clab">'+esc(b.lab)+'</span>' : "")+
      '<p>'+esc(b.t)+'</p>'+
      '<div class="nfoot"><button class="nbtn" data-hu="'+i+'"><i>i</i>magyarul</button></div>'+
      '<div class="nhu" id="hu'+i+'"'+(state.notesAllHu?"":" hidden")+'><span class="k">magyarul</span><p>'+esc(b.hu)+'</p></div>'+
    '</article>';
  });
  html += '</div><p class="foot">Forrás: Lecture notes — '+esc(TNAME[t])+' ('+esc((TOPICS.filter(function(x){return x.id===t;})[0]||{}).en||"")+'). A magyar szöveg fordítás.</p>';
  document.getElementById("main").innerHTML = html;

  document.querySelectorAll(".ttab").forEach(function(b){
    b.onclick = function(){ state.notesTopic = +b.dataset.t; renderNotes(); window.scrollTo(0,0); };
  });
  document.querySelectorAll(".toc button[data-go]").forEach(function(b){
    b.onclick = function(){
      var el = document.getElementById(b.dataset.go);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    };
  });
  document.getElementById("allHu").onclick = function(){
    state.notesAllHu = !state.notesAllHu;
    document.querySelectorAll(".nhu").forEach(function(x){ x.hidden = !state.notesAllHu; });
    this.textContent = state.notesAllHu ? "Magyar szöveg elrejtése" : "Mind magyarul";
  };
  document.querySelectorAll(".nbtn[data-hu]").forEach(function(b){
    b.onclick = function(){
      var box = document.getElementById("hu" + b.dataset.hu);
      box.hidden = !box.hidden;
    };
  });
  renderRail();
}

/* ---------- rendering: szókincs kártyák ---------- */
var CARD_SIZES = [4,6,8,10,12,16,20,30];
function newBoard(){
  var p = pool();
  if(p.length < state.cardN){ state.board = null; return; }
  var picks = shuffle(p.slice()).slice(0, state.cardN);
  var right = picks.map(function(e, i){
    return { id:i, text: state.cardMode === "def" ? (e.def.charAt(0).toUpperCase()+e.def.slice(1)) : e.hu, done:false };
  });
  state.board = {
    left: picks.map(function(e,i){ return {id:i, e:e, text:baseTerm(e), done:false}; }),
    right: shuffle(right),
    sel:null, side:null, matched:0, wrong:0, lock:false
  };
}
function renderCards(){
  if(!state.board) newBoard();
  var b = state.board;
  var html = '<div class="cardsbar">'+
    '<div class="seg" id="segCardMode" style="flex:1;min-width:250px">'+
      '<button data-v="def"'+(state.cardMode==="def"?' aria-pressed="true"':"")+'>Angol szó ↔ angol leírás</button>'+
      '<button data-v="hu"'+(state.cardMode==="hu"?' aria-pressed="true"':"")+'>Angol szó ↔ magyar jelentés</button>'+
    '</div>'+
    '<span class="lbl" style="margin:0 2px 0 4px">pár</span>'+
    '<div class="seg" id="segCardN" style="flex:none">'+
      CARD_SIZES.map(function(n){ return '<button data-v="'+n+'" style="min-width:34px"'+(state.cardN===n?' aria-pressed="true"':"")+'>'+n+'</button>'; }).join("")+
    '</div>'+
    '<button class="btn" id="newBoard">Új lap</button></div>';

  if(!b){
    html += '<div class="card" style="--topic:var(--line-2)"><div class="qlead">Kevés szó</div>'+
      '<div class="stem">Ehhez a lapmérethez legalább '+state.cardN+' szó kell a kiválasztott témákból, most '+pool().length+' van. Válassz több témakört, vagy kisebb lapot.</div></div>';
    document.getElementById("main").innerHTML = html;
    wireCards();
    return;
  }
  html += '<div class="bar"><span class="count">'+b.matched+' / '+state.cardN+' pár</span>'+
    '<span class="track"><i style="width:'+Math.round(b.matched/state.cardN*100)+'%"></i></span>'+
    '<span class="tally"><span class="r">'+b.wrong+' hiba</span></span></div>';

  if(b.matched === state.cardN){
    html += '<div class="cardsdone"><div class="score"><span class="big">'+state.cardN+'</span><span class="of">pár megvan</span></div>'+
      '<p class="hint" style="font-size:14px">'+(b.wrong === 0 ? "Hibátlan lap." : b.wrong+" hibás próbálkozással.")+'</p>'+
      '<div class="fbrow" style="margin-top:14px"><button class="btn primary" id="newBoard2">Új lap</button></div></div>';
  }

  html += '<div class="board"><div class="col-cards">';
  b.left.forEach(function(c){
    html += '<button class="mcard term'+(c.done?" done":"")+(b.side==="l"&&b.sel===c.id?" sel":"")+'" data-side="l" data-id="'+c.id+'"'+(c.done?" disabled":"")+'>'+esc(c.text)+'</button>';
  });
  html += '</div><div class="col-cards">';
  b.right.forEach(function(c){
    html += '<button class="mcard'+(c.done?" done":"")+(b.side==="r"&&b.sel===c.id?" sel":"")+'" data-side="r" data-id="'+c.id+'"'+(c.done?" disabled":"")+'>'+esc(c.text)+'</button>';
  });
  html += '</div></div>';
  document.getElementById("main").innerHTML = html;
  wireCards();
  renderRail();
}
function wireCards(){
  var mode = document.getElementById("segCardMode");
  if(mode) mode.querySelectorAll("button").forEach(function(x){
    x.onclick = function(){ state.cardMode = x.dataset.v; newBoard(); renderCards(); };
  });
  var n = document.getElementById("segCardN");
  if(n) n.querySelectorAll("button").forEach(function(x){
    x.onclick = function(){ state.cardN = +x.dataset.v; newBoard(); renderCards(); };
  });
  ["newBoard","newBoard2"].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onclick = function(){ newBoard(); renderCards(); };
  });
  document.querySelectorAll(".mcard").forEach(function(el){
    el.onclick = function(){ pickCard(el.dataset.side, +el.dataset.id, el); };
  });
}
function pickCard(side, id, el){
  var b = state.board;
  if(!b || b.lock) return;
  if(b.sel === null || b.side === side){ b.sel = id; b.side = side; renderCards(); return; }
  var ok = (b.sel === id);
  var leftId = side === "l" ? id : b.sel;
  var entry = b.left.filter(function(c){ return c.id === leftId; })[0].e;
  record(entry.id, ok);
  if(ok){
    b.left.forEach(function(c){ if(c.id === id || c.id === b.sel) c.done = true; });
    b.right.forEach(function(c){ if(c.id === id || c.id === b.sel) c.done = true; });
    b.matched++; b.sel = null; b.side = null;
    renderCards();
  } else {
    b.wrong++;
    var other = document.querySelector('.mcard[data-side="'+b.side+'"][data-id="'+b.sel+'"]');
    el.classList.add("miss"); if(other) other.classList.add("miss");
    b.lock = true;
    setTimeout(function(){ b.lock = false; b.sel = null; b.side = null; if(state.mode === "cards" && state.board === b) renderCards(); }, 620);
  }
}

/* ---------- router ---------- */
function render(){
  if(state.mode === "quiz") renderQuiz();
  else if(state.mode === "cards") renderCards();
  else if(state.mode === "vocab") renderVocab();
  else if(state.mode === "vtest") renderVTest();
  else if(state.mode === "notes") renderNotes();
  else renderStats();
  document.getElementById("setup").style.display = state.mode === "quiz" ? "" : "none";
  renderRail();
}
document.getElementById("nav").querySelectorAll("button").forEach(function(b){
  b.onclick = function(){
    state.mode = b.dataset.mode;
    if(state.mode === "quiz" && !state.queue.length) newRound(false);
    else { if(state.mode === "cards") state.board = null; render(); }
  };
});
document.getElementById("restart").onclick = function(){ state.onlyHard = false; newRound(false); };

document.addEventListener("keydown", function(ev){
  if(state.mode === "vtest"){
    var v = state.vt;
    if(ev.key === "Enter" && v && !v.done){
      ev.preventDefault();
      if(v.answered) vtNext(); else vtAnswer();
    }
    return;
  }
  if(state.mode !== "quiz" || state.done) return;
  var tag = (ev.target.tagName || "").toLowerCase();
  var q = state.queue[state.i];
  if(ev.key === "Enter"){
    if(state.answered){ ev.preventDefault(); next(); return; }
    if(q && q.kind === "open"){ ev.preventDefault(); answerOpen(); return; }
  }
  if(tag === "input") return;
  if(!q || q.kind !== "mc" || state.answered) return;
  var k = ev.key.toLowerCase(), ix = -1;
  if("1234".indexOf(k) >= 0) ix = +k - 1;
  if("abcd".indexOf(k) >= 0 && k.length === 1 && isNaN(+k)) ix = "abcd".indexOf(k);
  if(ix >= 0 && ix < q.opts.length){ ev.preventDefault(); answerMC(ix); }
});

document.getElementById("brandsub").textContent = "Lecture notes · " + ENTRIES.length + " szócikk · 5 témakör";
newRound(false);
})();
</script>
